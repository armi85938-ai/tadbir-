<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e1b4b">
    <title>سامانه دانش‌آموزی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * { font-family: 'Vazirmatn', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px 20px;
            color: #fff;
            font-size: 15px;
            width: 100%;
            outline: none;
            transition: all 0.3s;
        }
        .glass-input:focus {
            border-color: rgba(139, 92, 246, 0.6);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }
        .glass-input::placeholder { color: rgba(255, 255, 255, 0.3); }
        .btn-primary {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .btn-icon:active { transform: scale(0.95); }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 12, 50, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-around;
            z-index: 50;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 20px;
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav-item.active {
            color: #a78bfa;
            background: rgba(139, 92, 246, 0.15);
        }
        .nav-item svg { width: 24px; height: 24px; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        .slide-up { animation: slideUp 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s;
        }
        .card:active { transform: scale(0.98); }
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .badge-approved { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(30, 27, 75, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
        }
        .content { padding: 20px; padding-bottom: 100px; max-width: 600px; margin: 0 auto; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        const supabaseClient = window.supabase.createClient(
            "https://rzcbwczpjytcfeewjumk.supabase.co",
            "sb_publishable_tuQ6vkwm9E3-E7BsFCaiIQ_2xA7Cm86"
        );

        const Icon = ({ path, size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d={path}/>
            </svg>
        );

        const Icons = {
            home: "M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10",
            users: "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M23 21v-2a4 4 0 0 0-3-3.87",
            exam: "M9 11l3 3L22 4 M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11",
            grade: "M22 12h-4l-3 9L9 3l-3 9H2",
            message: "M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",
            logout: "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9",
            plus: "M12 5v14 M5 12h14",
            check: "M20 6L9 17l-5-5",
            x: "M18 6L6 18 M6 6l12 12",
            book: "M4 19.5A2.5 2.5 0 0 1 6.5 17H20",
            alert: "M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86"
        };

        function App() {
            const [user, setUser] = useState(null);
            const [currentPage, setCurrentPage] = useState('login');
            const [activeTab, setActiveTab] = useState('home');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const savedUser = sessionStorage.getItem('schoolUser');
                if (savedUser) {
                    const userData = JSON.parse(savedUser);
                    setUser(userData);
                    setCurrentPage(userData.role);
                }
                setLoading(false);
            }, []);

            const handleLogin = async (username, password) => {
                try {
                    const { data, error } = await supabaseClient
                        .from('users')
                        .select('*')
                        .eq('username', username.toUpperCase())
                        .eq('password', password)
                        .single();
                    
                    if (error || !data) {
                        return { success: false, error: 'نام کاربری یا رمز عبور اشتباه است' };
                    }
                    
                    setUser(data);
                    sessionStorage.setItem('schoolUser', JSON.stringify(data));
                    setCurrentPage(data.role);
                    return { success: true };
                } catch (err) {
                    return { success: false, error: 'خطا در اتصال به سرور' };
                }
            };

            const handleLogout = () => {
                setUser(null);
                setCurrentPage('login');
                setActiveTab('home');
                sessionStorage.removeItem('schoolUser');
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="loading"></div>
                    </div>
                );
            }

            if (currentPage === 'login') {
                return <LoginPage onLogin={handleLogin} />;
            } else if (currentPage === 'admin') {
                return <AdminPanel user={user} activeTab={activeTab} setActiveTab={setActiveTab} onLogout={handleLogout} />;
            } else {
                return <StudentPanel user={user} activeTab={activeTab} setActiveTab={setActiveTab} onLogout={handleLogout} />;
            }
        }

        function LoginPage({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setIsLoading(true);
                
                const result = await onLogin(username, password);
                
                if (!result.success) {
                    setError(result.error);
                }
                setIsLoading(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-6 fade-in">
                    <div className="w-full max-w-sm">
                        <div className="text-center mb-8 slide-up">
                            <div className="w-20 h-20 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-violet-500 to-purple-700 flex items-center justify-center shadow-lg shadow-purple-500/30">
                                <Icon path={Icons.book} size={36} />
                            </div>
                            <h1 className="text-3xl font-black mb-2">سامانه دانش‌آموزی</h1>
                            <p className="text-white/40 text-sm">برای ورود اطلاعات خود را وارد کنید</p>
                        </div>

                        <div className="glass p-6 slide-up">
                            <form onSubmit={handleSubmit} className="space-y-4">
                                {error && (
                                    <div className="bg-red-500/20 border border-red-500/30 rounded-xl p-3 text-red-300 text-sm text-center">
                                        {error}
                                    </div>
                                )}
                                
                                <div>
                                    <input
                                        type="text"
                                        className="glass-input"
                                        placeholder="نام کاربری"
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        required
                                        autoComplete="username"
                                    />
                                </div>
                                
                                <div>
                                    <input
                                        type="password"
                                        className="glass-input"
                                        placeholder="رمز عبور"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        required
                                        autoComplete="current-password"
                                    />
                                </div>
                                
                                <button type="submit" className="btn-primary" disabled={isLoading}>
                                    {isLoading ? <span className="loading"></span> : 'ورود به سامانه'}
                                </button>
                            </form>

                            <div className="mt-6 p-4 bg-white/5 rounded-xl text-xs text-white/30 space-y-1">
                                <div className="font-bold mb-2 text-white/50">اطلاعات ورود:</div>
                                <div>مدیر: <span className="text-violet-300">ARMIN</span> / <span className="text-violet-300">1010</span></div>
                                <div>دانش‌آموز: <span className="text-violet-300">AVA</span> / <span className="text-violet-300">1111</span></div>
                                <div>دانش‌آموز: <span className="text-violet-300">ATRIN</span> / <span className="text-violet-300">0000</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminPanel({ user, activeTab, setActiveTab, onLogout }) {
            const [exams, setExams] = useState([]);
            const [students, setStudents] = useState([]);
            const [grades, setGrades] = useState([]);
            const [showModal, setShowModal] = useState(false);
            const [modalType, setModalType] = useState('');
            const [formData, setFormData] = useState({});

            useEffect(() => {
                loadData();
            }, []);

            const loadData = async () => {
                const { data: examsData } = await supabaseClient.from('exams').select('*').order('created_at', { ascending: false });
                const { data: studentsData } = await supabaseClient.from('users').select('*').eq('role', 'student');
                const { data: gradesData } = await supabaseClient.from('grades').select('*, users(username, full_name), exams(title)');
                
                if (examsData) setExams(examsData);
                if (studentsData) setStudents(studentsData);
                if (gradesData) setGrades(gradesData);
            };

            const createExam = async () => {
                if (!formData.title) return;
                await supabaseClient.from('exams').insert({
                    title: formData.title,
                    description: formData.description || ''
                });
                setShowModal(false);
                setFormData({});
                loadData();
            };

            const addGrade = async () => {
                if (!formData.student_id || !formData.exam_id || !formData.score) return;
                await supabaseClient.from('grades').insert({
                    student_id: formData.student_id,
                    exam_id: formData.exam_id,
                    score: parseFloat(formData.score),
                    status: 'pending'
                });
                setShowModal(false);
                setFormData({});
                loadData();
            };

            const updateGrade = async (id, newScore) => {
                await supabaseClient.from('grades').update({
                    score: parseFloat(newScore),
                    status: 'approved'
                }).eq('id', id);
                loadData();
            };

            return (
                <div className="min-h-screen pb-24">
                    <div className="header">
                        <div className="max-w-600 mx-auto flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-bold">پنل مدیریت</h1>
                                <p className="text-xs text-white/40 mt-1">{user?.full_name}</p>
                            </div>
                            <button onClick={onLogout} className="btn-icon">
                                <Icon path={Icons.logout} size={20} />
                            </button>
                        </div>
                    </div>

                    <div className="content">
                        {activeTab === 'home' && (
                            <>
                                <div className="mb-6">
                                    <button 
                                        onClick={() => { setModalType('exam'); setShowModal(true); }}
                                        className="btn-primary flex items-center justify-center gap-2"
                                    >
                                        <Icon path={Icons.plus} size={20} />
                                        ساخت آزمون جدید
                                    </button>
                                </div>

                                <h2 className="text-lg font-bold mb-4">آزمون‌ها</h2>
                                {exams.length === 0 ? (
                                    <div className="card text-center py-8 text-white/40">
                                        <Icon path={Icons.exam} size={48} className="mx-auto mb-3 opacity-30" />
                                        <p>هنوز آزمونی ثبت نشده</p>
                                    </div>
                                ) : (
                                    exams.map(exam => (
                                        <div key={exam.id} className="card">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h3 className="font-bold text-lg">{exam.title}</h3>
                                                    <p className="text-sm text-white/40 mt-1">{exam.description || 'بدون توضیحات'}</p>
                                                </div>
                                                <span className="text-xs text-white/30">
                                                    {new Date(exam.created_at).toLocaleDateString('fa-IR')}
                                                </span>
                                            </div>
                                        </div>
                                    ))
                                )}

                                <h2 className="text-lg font-bold mb-4 mt-6">ثبت نمره</h2>
                                <button 
                                    onClick={() => { setModalType('grade'); setShowModal(true); }}
                                    className="btn-primary flex items-center justify-center gap-2"
                                >
                                    <Icon path={Icons.grade} size={20} />
                                    ثبت نمره جدید
                                </button>
                            </>
                        )}

                        {activeTab === 'students' && (
                            <>
                                <h2 className="text-lg font-bold mb-4">دانش‌آموزان</h2>
                                {students.map(student => (
                                    <div key={student.id} className="card flex items-center gap-4">
                                        <div className="w-12 h-12 rounded-full bg-gradient-to-br from-violet-500 to-purple-700 flex items-center justify-center font-bold text-lg">
                                            {student.full_name.charAt(0)}
                                        </div>
                                        <div>
                                            <h3 className="font-bold">{student.full_name}</h3>
                                            <p className="text-sm text-white/40">{student.username}</p>
                                        </div>
                                    </div>
                                ))}
                            </>
                        )}

                        {activeTab === 'grades' && (
                            <>
                                <h2 className="text-lg font-bold mb-4">نمرات و اعتراض‌ها</h2>
                                {grades.length === 0 ? (
                                    <div className="card text-center py-8 text-white/40">
                                        <Icon path={Icons.grade} size={48} className="mx-auto mb-3 opacity-30" />
                                        <p>هنوز نمره‌ای ثبت نشده</p>
                                    </div>
                                ) : (
                                    grades.map(grade => (
                                        <div key={grade.id} className="card">
                                            <div className="flex justify-between items-start mb-3">
                                                <div>
                                                    <h3 className="font-bold">{grade.users?.full_name || 'دانش‌آموز'}</h3>
                                                    <p className="text-sm text-white/40 mt-1">{grade.exams?.title || 'آزمون'}</p>
                                                </div>
                                                <div className="text-left">
                                                    <span className={`badge ${grade.status === 'approved' ? 'badge-approved' : 'badge-pending'}`}>
                                                        {grade.status === 'approved' ? 'تایید شده' : 'در انتظار'}
                                                    </span>
                                                    <p className="text-2xl font-bold mt-2">{grade.score || '-'}</p>
                                                </div>
                                            </div>
                                            
                                            {grade.objection && (
                                                <div className="mt-3 p-3 bg-white/5 rounded-xl">
                                                    <p className="text-xs text-white/40 mb-1">اعتراض دانش‌آموز:</p>
                                                    <p className="text-sm">{grade.objection}</p>
                                                    {grade.status !== 'approved' && (
                                                        <button 
                                                            onClick={() => {
                                                                const newScore = prompt('نمره جدید:', grade.score);
                                                                if (newScore) updateGrade(grade.id, newScore);
                                                            }}
                                                            className="btn-primary btn-sm mt-3 w-full"
                                                        >
                                                            بروزرسانی نمره
                                                        </button>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    ))
                                )}
                            </>
                        )}

                        {activeTab === 'messages' && (
                            <div className="card text-center py-8 text-white/40">
                                <Icon path={Icons.message} size={48} className="mx-auto mb-3 opacity-30" />
                                <p>سیستم پیام‌رسانی</p>
                            </div>
                        )}
                    </div>

                    <div className="nav-bar">
                        <div className={`nav-item ${activeTab === 'home' ? 'active' : ''}`} onClick={() => setActiveTab('home')}>
                            <Icon path={Icons.home} />
                            <span>خانه</span>
                        </div>
                        <div className={`nav-item ${activeTab === 'students' ? 'active' : ''}`} onClick={() => setActiveTab('students')}>
                            <Icon path={Icons.users} />
                            <span>دانش‌آموزان</span>
                        </div>
                        <div className={`nav-item ${activeTab === 'grades' ? 'active' : ''}`} onClick={() => setActiveTab('grades')}>
                            <Icon path={Icons.grade} />
                            <span>نمرات</span>
                        </div>
                        <div className={`nav-item ${activeTab === 'messages' ? 'active' : ''}`} onClick={() => setActiveTab('messages')}>
                            <Icon path={Icons.message} />
                            <span>پیام‌ها</span>
                        </div>
                    </div>

                    {showModal && (
                        <div className="modal-overlay" onClick={() => setShowModal(false)}>
                            <div className="glass p-6 w-full max-w-md" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold">
                                        {modalType === 'exam' ? 'ساخت آزمون جدید' : 'ثبت نمره'}
                                    </h3>
                                    <button onClick={() => setShowModal(false)} className="btn-icon">
                                        <Icon path={Icons.x} size={18} />
                                    </button>
                                </div>
                                
                                {modalType === 'exam' ? (
                                    <div className="space-y-4">
                                        <input
                                            className="glass-input"
                                            placeholder="عنوان آزمون"
                                            value={formData.title || ''}
                                            onChange={e => setFormData({...formData, title: e.target.value})}
                                        />
                                        <textarea
                                            className="glass-input"
                                            placeholder="توضیحات (اختیاری)"
                                            rows="3"
                                            value={formData.description || ''}
                                            onChange={e => setFormData({...formData, description: e.target.value})}
                                        />
                                        <button onClick={createExam} className="btn-primary">ساخت آزمون</button>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <select
                                            className="glass-input"
                                            value={formData.student_id || ''}
                                            onChange={e => setFormData({...formData, student_id: e.target.value})}
                                        >
                                            <option value="">انتخاب دانش‌آموز</option>
                                            {students.map(s => (
                                                <option key={s.id} value={s.id}>{s.full_name}</option>
                                            ))}
                                        </select>
                                        <select
                                            className="glass-input"
                                            value={formData.exam_id || ''}
                                            onChange={e => setFormData({...formData, exam_id: e.target.value})}
                                        >
                                            <option value="">انتخاب آزمون</option>
                                            {exams.map(e => (
                                                <option key={e.id} value={e.id}>{e.title}</option>
                                            ))}
                                        </select>
                                        <input
                                            type="number"
                                            className="glass-input"
                                            placeholder="نمره"
                                            value={formData.score || ''}
                                            onChange={e => setFormData({...formData, score: e.target.value})}
                                        />
                                        <button onClick={addGrade} className="btn-primary">ثبت نمره</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StudentPanel({ user, activeTab, setActiveTab, onLogout }) {
            const [exams, setExams] = useState([]);
            const [grades, setGrades] = useState([]);
            const [showModal, setShowModal] = useState(false);
            const [selectedGrade, setSelectedGrade] = useState(null);
            const [objectionText, setObjectionText] = useState('');

            useEffect(() => {
                loadData();
            }, []);

            const loadData = async () => {
                const { data: examsData } = await supabaseClient.from('exams').select('*').order('created_at', { ascending: false });
                const { data: gradesData } = await supabaseClient.from('grades').select('*, exams(title)').eq('student_id', user.id);
                
                if (examsData) setExams(examsData);
                if (gradesData) setGrades(gradesData);
            };

            const submitObjection = async () => {
                if (!objectionText.trim() || !selectedGrade) return;
                await supabaseClient.from('grades').update({
                    objection: objectionText,
                    status: 'pending'
                }).eq('id', selectedGrade.id);
                setShowModal(false);
                setObjectionText('');
                setSelectedGrade(null);
                loadData();
            };

            return (
                <div className="min-h-screen pb-24">
                    <div className="header">
                        <div className="max-w-600 mx-auto flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-bold">پنل دانش‌آموز</h1>
                                <p className="text-xs text-white/40 mt-1">{user?.full_name}</p>
                            </div>
                            <button onClick={onLogout} className="btn-icon">
                                <Icon path={Icons.logout} size={20} />
                            </button>
                        </div>
                    </div>

                    <div className="content">
                        {activeTab === 'home' && (
                            <>
                                <div className="glass p-6 mb-6 slide-up">
                                    <h2 className="text-lg font-bold mb-2">خوش آمدی! 👋</h2>
                                    <p className="text-white/60 text-sm">می‌توانی آزمون‌ها را مشاهده کنی و نمرات خود را بررسی کنی.</p>
                                </div>

                                <h2 className="text-lg font-bold mb-4">آزمون‌های موجود</h2>
                                {exams.length === 0 ? (
                                    <div className="card text-center py-8 text-white/40">
                                        <Icon path={Icons.exam} size={48} className="mx-auto mb-3 opacity-30" />
                                        <p>هنوز آزمونی ثبت نشده</p>
                                    </div>
                                ) : (
                                    exams.map(exam => (
                                        <div key={exam.id} className="card">
                                            <h3 className="font-bold text-lg mb-1">{exam.title}</h3>
                                            <p className="text-sm text-white/40">{exam.description || 'بدون توضیحات'}</p>
                                            <button className="btn-primary mt-4">شرکت در آزمون</button>
                                        </div>
                                    ))
                                )}
                            </>
                        )}

                        {activeTab === 'grades' && (
                            <>
                                <h2 className="text-lg font-bold mb-4">نمرات من</h2>
                                {grades.length === 0 ? (
                                    <div className="card text-center py-8 text-white/40">
                                        <Icon path={Icons.grade} size={48} className="mx-auto mb-3 opacity-30" />
                                        <p>هنوز نمره‌ای ثبت نشده</p>
                                    </div>
                                ) : (
                                    grades.map(grade => (
                                        <div key={grade.id} className="card">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h3 className="font-bold">{grade.exams?.title || 'آزمون'}</h3>
                                                    <p className="text-sm text-white/40 mt-1">
                                                        وضعیت: {grade.status === 'approved' ? 'تایید شده' : 'در انتظار بررسی'}
                                                    </p>
                                                </div>
                                                <div className="text-left">
                                                    <span className="text-3xl font-black">{grade.score || '-'}</span>
                                                </div>
                                            </div>
                                            
                                            {grade.objection && grade.status !== 'approved' && (
                                                <div className="mt-3 p-3 bg-yellow-500/10 border border-yellow-500/20 rounded-xl">
                                                    <p className="text-yellow-300 text-sm">اعتراض شما در حال بررسی است</p>
                                                </div>
                                            )}
                                            
                                            {grade.status === 'approved' && !grade.objection && (
                                                <button 
                                                    onClick={() => { setSelectedGrade(grade); setShowModal(true); }}
                                                    className="btn-primary mt-3 w-full"
                                                >
                                                    درخواست بررسی مجدد
                                                </button>
                                            )}
                                        </div>
                                    ))
                                )}
                            </>
                        )}

                        {activeTab === 'messages' && (
                            <>
                                <h2 className="text-lg font-bold mb-4">پیام‌ها</h2>
                                <div className="card">
                                    <div className="flex items-start gap-3">
                                        <div className="w-10 h-10 rounded-full bg-gradient-to-br from-violet-500 to-purple-700 flex items-center justify-center font-bold">
                                            م
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-sm">مدیریت مدرسه</h3>
                                            <p className="text-sm text-white/60 mt-1">به سامانه خوش آمدید</p>
                                            <span className="text-xs text-white/30 mt-2 block">امروز</span>
                                        </div>
                                    </div>
                                </div>
                            </>
                        )}
                    </div>

                    <div className="nav-bar">
                        <div className={`nav-item ${activeTab === 'home' ? 'active' : ''}`} onClick={() => setActiveTab('home')}>
                            <Icon path={Icons.home} />
                            <span>خانه</span>
                        </div>
                        <div className={`nav-item ${activeTab === 'grades' ? 'active' : ''}`} onClick={() => setActiveTab('grades')}>
                            <Icon path={Icons.grade} />
                            <span>نمرات</span>
                        </div>
                        <div className={`nav-item ${activeTab === 'messages' ? 'active' : ''}`} onClick={() => setActiveTab('messages')}>
                            <Icon path={Icons.message} />
                            <span>پیام‌ها</span>
                        </div>
                    </div>

                    {showModal && (
                        <div className="modal-overlay" onClick={() => setShowModal(false)}>
                            <div className="glass p-6 w-full max-w-md" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold">درخواست بررسی مجدد</h3>
                                    <button onClick={() => setShowModal(false)} className="btn-icon">
                                        <Icon path={Icons.x} size={18} />
                                    </button>
                                </div>
                                <p className="text-sm text-white/60 mb-4">دلیل درخواست خود را برای بررسی مجدد نمره بنویسید:</p>
                                <textarea
                                    className="glass-input mb-4"
                                    placeholder="متن اعتراض..."
                                    rows="4"
                                    value={objectionText}
                                    onChange={e => setObjectionText(e.target.value)}
                                />
                                <button onClick={submitObjection} className="btn-primary">
                                    ارسال درخواست
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
