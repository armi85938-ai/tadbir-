                <div className="flex gap-2 mt-3">
                  <input type="number" className="glass-input flex-1 text-sm" placeholder="نمره" id={`s-${a.id}`}/>
                  <button onClick={()=>gradeAnswer(a.id,document.getElementById(`s-${a.id}`).value)} className="btn-glass btn-glass-success btn-sm">ثبت</button>
                </div>
              </div>
            ))}
          </>
        )}
      </div>
      <div className="nav-bar">
        <div className={`nav-item ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==='students'?'active':''}`} onClick={()=>{setTab('students');setSubTab('list');}}><Icon d={Icons.users}/><span>کاربران</span></div>
        <div className={`nav-item ${tab==='grading'?'active':''}`} onClick={()=>setTab('grading')}><Icon d={Icons.grade}/><span>تصحیح</span></div><div className={`nav-item ${tab==='tools'?'active':''}`} onClick={()=>{setTab('tools');setAdminTool('menu');setAdminGame(null);}}><Icon d={Icons.list}/><span>ابزار</span></div>
      </div>
      {modal==='exam'&&(
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="glass-strong w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-lg font-black gradient-text">ساخت آزمون</h3>
              <button onClick={()=>setModal(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button>
            </div>
            {step===1&&(
              <div className="space-y-4 fade-in">
                <div><label className="text-xs text-white/50 mb-2 block font-semibold">عنوان آزمون *</label><input className="glass-input" placeholder="مثال: آزمون ریاضی فصل ۱" value={formData.title||''} onChange={e=>setFormData({...formData,title:e.target.value})}/></div>
                <div><label className="text-xs text-white/50 mb-2 block font-semibold">توضیحات</label><textarea className="glass-input" placeholder="توضیحات..." value={formData.desc||''} onChange={e=>setFormData({...formData,desc:e.target.value})} rows="2"/></div>
                <div>
                  <label className="text-xs text-white/50 mb-2 block font-semibold">مدت زمان آزمون *</label>
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="text-[10px] text-white/40 mb-1 block">ساعت</label><input className="glass-input" type="number" min="0" max="10" placeholder="۰" value={formData.hours||''} onChange={e=>setFormData({...formData,hours:e.target.value})}/></div>
                    <div><label className="text-[10px] text-white/40 mb-1 block">دقیقه</label><input className="glass-input" type="number" min="0" max="59" placeholder="۰" value={formData.minutes||''} onChange={e=>setFormData({...formData,minutes:e.target.value})}/></div>
                  </div>
                </div>
                <div><label className="text-xs text-white/50 mb-2 block font-semibold">اختصاص به</label><select className="glass-input" value={formData.assigned||'all'} onChange={e=>setFormData({...formData,assigned:e.target.value})}><option value="all">همه دانش‌آموزان</option>{students.map(s=><option key={s.id} value={s.id}>{s.full_name}</option>)}</select></div>
                <button onClick={()=>{const h=parseInt(formData.hours)||0;const m=parseInt(formData.minutes)||0;if(h===0&&m===0){toast('مدت زمان را مشخص کنید','error');return;}setFormData({...formData,duration:h*60+m});setStep(2);}} className="btn-glass">مرحله بعد: سوالات</button>
              </div>
            )}
            {step===2&&(
              <div className="fade-in">
                <div className="flex justify-between items-center mb-3">
                  <h4 className="font-bold text-sm">سوالات ({questions.length})</h4>
                  <button onClick={addQuestion} className="btn-sm bg-indigo-600"><Icon d={Icons.plus} size={14}/>افزودن</button>
                </div>
                {questions.length===0&&<div className="text-center py-8 text-white/30"><p>هنوز سوالی اضافه نشده</p><button onClick={addQuestion} className="btn-glass mt-3 text-sm">افزودن اولین سوال</button></div>}
                {questions.map((q,i)=>(
                  <div key={i} className="glass p-4 mb-3 relative">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-bold text-indigo-300">سوال {i+1}</span>
                      <button onClick={()=>removeQuestion(i)} className="p-1.5 bg-red-500/15 text-red-400 rounded-lg"><Icon d={Icons.x} size={14}/></button>
                    </div>
                    <textarea className="glass-input mb-2 text-sm" placeholder="متن سوال" value={q.q_text} onChange={e=>updateQuestion(i,'q_text',e.target.value)} rows="2"/>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <input className="glass-input text-sm" type="number" step="0.25" placeholder="نمره سوال" value={q.score||1} onChange={e=>updateQuestion(i,'score',e.target.value)}/>
                      <input type="file" accept="image/*" className="glass-input text-xs py-2" onChange={e=>handleImageUpload(e.target.files[0],i)}/>
                    </div>
                    {q.image_url&&<p className="text-[11px] text-emerald-400 mb-2">✓ عکس آپلود شد</p>}
                    <div className="flex gap-2 mb-2">
                      <button className={`flex-1 py-2 rounded-lg text-xs font-bold ${q.q_type==='test'?'bg-indigo-600':'bg-white/5'}`} onClick={()=>updateQuestion(i,'q_type','test')}>تستی</button>
                      <button className={`flex-1 py-2 rounded-lg text-xs font-bold ${q.q_type==='descriptive'?'bg-indigo-600':'bg-white/5'}`} onClick={()=>updateQuestion(i,'q_type','descriptive')}>تشریحی</button>
                    </div>
                    {q.q_type==='test'&&(<div className="space-y-3">{['a','b','c','d'].map(o=>(<div key={o} className="option-image-box"><input className="glass-input text-sm mb-2" placeholder={`متن گزینه ${o.toUpperCase()} (اختیاری)`} value={q[`opt_${o}`]||''} onChange={e=>updateQuestion(i,`opt_${o}`,e.target.value)}/><label className="text-[10px] text-white/45 block mb-1">عکس گزینه {o.toUpperCase()}</label><input type="file" accept="image/*" className="glass-input text-xs py-2" onChange={e=>handleOptionImageUpload(e.target.files[0],i,o)}/>{q[`opt_${o}_image`]&&<img src={q[`opt_${o}_image`]} alt=""/>}</div>))}<select className="glass-input text-sm" value={q.correct_opt||''} onChange={e=>updateQuestion(i,'correct_opt',e.target.value)}><option value="">پاسخ صحیح (اختیاری)</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select><button onClick={addQuestion} className="btn-glass btn-sm">＋ افزودن سوال بعدی</button></div>)}
                  </div>
                ))}
                <div className="flex gap-2 mt-3"><button onClick={()=>setStep(1)} className="btn-glass bg-white/5 flex-1">قبلی</button><button onClick={()=>setStep(3)} className="btn-glass flex-1">بررسی</button></div>
              </div>
            )}
            {step===3&&(
              <div className="fade-in text-center">
                <div className="glass p-4 mb-4 text-right space-y-2 text-sm">
                  <p>عنوان: <b>{formData.title}</b></p>
                  <p>مدت: <b>{formData.duration} دقیقه</b></p>
                  <p>سوالات: <b>{questions.length}</b></p>
                  <p>اختصاص به: <b>{formData.assigned==='all'?'همه':students.find(s=>s.id===formData.assigned)?.full_name}</b></p>
                </div>
                <div className="flex gap-2"><button onClick={()=>setStep(2)} className="btn-glass bg-white/5 flex-1">ویرایش</button><button onClick={createExam} className="btn-glass btn-glass-success flex-1" disabled={loading}>{loading?'ذخیره...':'ذخیره آزمون'}</button></div>
              </div>
            )}
          </div>
        </div>
      )}
      {showExamResults&&(
        <div className="modal-overlay" onClick={()=>setShowExamResults(null)}>
          <div className="glass-strong w-full max-w-2xl p-6 max-h-[85vh] overflow-y-auto slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="font-bold gradient-text text-lg"> نتایج آزمون: {showExamResults.exam.title}</h3>
              <button onClick={()=>setShowExamResults(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button>
            </div>
            {showExamResults.answers.length===0?<p className="text-center text-white/30 py-8">هنوز کسی در این آزمون شرکت نکرده</p>:
            showExamResults.answers.map(a=>{
              const maxScore=parseFloat(a.questions?.score||1);
              const percentage=maxScore>0?(parseFloat(a.score||0)/maxScore)*20:0;
              return(
                <div key={a.id} className="student-result-row">
                  <div className="flex items-center gap-3 flex-1">
                    <div className="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center font-bold">{a.users?.full_name?.[0]||'?'}</div>
                    <div>
                      <p className="font-bold text-sm">{a.users?.full_name||'نامشخص'}</p>
                      <p className="text-[11px] text-white/40">@{a.users?.username||''}</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <div className="text-center">
                      <StarRating score={percentage}/>
                      <p className="text-xs text-white/40 mt-1">{parseFloat(a.score||0)}/{maxScore}</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <input type="number" step="0.25" className="glass-input text-sm w-20" defaultValue={a.score||0} id={`edit-${a.id}`}/>
                      <button onClick={()=>{const v=document.getElementById(`edit-${a.id}`).value;updateStudentScore(a.id,v);}} className="btn-glass btn-glass-success btn-sm">✓</button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
      {showPasswordModal&&<PasswordModal user={user} onClose={()=>setShowPasswordModal(false)}/>}
    </div>
  );
}

function SnakeGame({user,students=[],isAdmin=false}){
  const COLORS=[
    {main:'#7c3aed',light:'#c4b5fd',dark:'#2e1065'},
    {main:'#16a34a',light:'#86efac',dark:'#14532d'},
    {main:'#dc2626',light:'#fca5a5',dark:'#7f1d1d'}
  ];
  const SNAKES={
    21:10,
    33:6,
    48:26,
    62:18,
    75:54,
    91:73
  };
  const LADDERS={
    3:22,
    12:31,
    19:40,
    28:46,
    44:67,
    55:82,
    69:90
  };

  const [people,setPeople]=useState([]);
  const [selected,setSelected]=useState([]);
  const [room,setRoom]=useState(null);
  const [requests,setRequests]=useState([]);
  const [notice,setNotice]=useState('');
  const [busy,setBusy]=useState(false);
  const [rolling,setRolling]=useState(false);
  const [dice,setDice]=useState(1);
  const [now,setNow]=useState(Date.now());
  const [viewMode,setViewMode]=useState('lobby');
  const [visualPos,setVisualPos]=useState({});
  const [strikingSnake,setStrikingSnake]=useState(null);
  const [leftGame,setLeftGame]=useState(false);
  const [shake,setShake]=useState(false);
  const [winnerOpen,setWinnerOpen]=useState(false);
  const [settled,setSettled]=useState(false);
  const [hiddenRoomId,setHiddenRoomId]=useState(null);
  const previousPositionsRef=useRef({});
  const animationLockRef=useRef(false);

  const safeUserId=String(user?.id||'');
  const isMine=(id)=>String(id||'')===safeUserId;

  const load=async()=>{
    try{
      const {data:target,error:pe}=await SB.from('users').select('*').neq('id',user.id);
      if(pe)throw pe;
      setPeople((target||[]).filter(Boolean));

      const {data:r,error:re}=await SB.from('snake_requests')
        .select('*')
        .or(`from_user.eq.${user.id},to_user.eq.${user.id}`)
        .order('created_at',{ascending:false});
      if(re)throw re;
      setRequests(r||[]);

      const ids=(r||[])
        .filter(x=>x.status==='accepted'||(x.status==='pending'&&new Date(x.expires_at).getTime()>Date.now()))
        .map(x=>x.room_id).filter(Boolean);

      if(ids.length){
        const {data:rooms,error:rr}=await SB.from('snake_rooms')
          .select('*').in('id',ids).order('created_at',{ascending:false}).limit(1);
        if(rr)throw rr;
        if(rooms?.[0]){
          const rm=rooms[0];
          const expired=rm.created_at && (Date.now()-new Date(rm.created_at).getTime()>=60*60*1000);
          if(expired){
            await SB.from('snake_requests').delete().eq('room_id',rm.id);
            await SB.from('snake_rooms').delete().eq('id',rm.id);
            if(String(hiddenRoomId)===String(rm.id)){setHiddenRoomId(null);}
            setRoom(null);setViewMode('lobby');setWinnerOpen(false);
            return;
          }
          if(String(hiddenRoomId)!==String(rm.id)){
            setRoom(rm);
            if(rm.status==='playing'||rm.status==='finished'){
              setViewMode('game');
              if(rm.status==='finished')setWinnerOpen(true);
            }
          }
        }
      }
    }catch(e){
      setNotice('خطا در ارتباط با بازی: '+(e?.message||'خطای نامشخص'));
    }
  };

  useEffect(()=>{
    load();
    const a=setInterval(load,1600);
    const b=setInterval(()=>setNow(Date.now()),1000);
    return()=>{clearInterval(a);clearInterval(b)};
  },[user.id,hiddenRoomId]);

  useEffect(()=>{
    if(!room?.created_at)return;
    const check=()=>{
      if(Date.now()-new Date(room.created_at).getTime()>=60*60*1000){
        setHiddenRoomId(room.id);
        SB.from('snake_requests').delete().eq('room_id',room.id);
        SB.from('snake_rooms').delete().eq('id',room.id);
        setRoom(null);setViewMode('lobby');setWinnerOpen(false);
        setNotice('⏱️ این بازی پس از یک ساعت به‌صورت خودکار بسته و حذف شد.');
      }
    };
    const t=setInterval(check,10000);check();
    return()=>clearInterval(t);
  },[room?.id,room?.created_at]);

  const pendingIncoming=requests.filter(r=>
    isMine(r.to_user)&&r.status==='pending'&&new Date(r.expires_at).getTime()>now
  );
  const pendingOutgoing=requests.filter(r=>
    isMine(r.from_user)&&r.status==='pending'&&new Date(r.expires_at).getTime()>now
  );

  const makeRoom=async()=>{
    if(!selected.length)return;
    setBusy(true);setNotice('');
    try{
      const token=String(Math.floor(Math.random()*899999)+100000);
      const {data:r,error:re}=await SB.from('snake_rooms').insert({
        player1_id:user.id,
        player1_name:user.full_name,
        player1_token:token,
        status:'waiting',
        player1_pos:1,
        player2_pos:1,
        player3_pos:1
      }).select().single();
      if(re)throw re;

      const expires=new Date(Date.now()+120000).toISOString();
      for(const id of selected){
        const {error:e}=await SB.from('snake_requests').insert({
          from_user:user.id,
          to_user:id,
          room_id:r.id,
          status:'pending',
          expires_at:expires
        });
        if(e)throw e;
      }
      setRoom(r);
      setNotice('درخواست‌ها ارسال شد؛ تا ۲ دقیقه فرصت پیوستن دارند.');
    }catch(e){
      setNotice('خطا در ساخت اتاق: '+(e?.message||'خطای نامشخص'));
    }finally{setBusy(false)}
  };

  const accept=async(req)=>{
    try{
      const {data:r,error:re}=await SB.from('snake_rooms').select('*').eq('id',req.room_id).single();
      if(re)throw re;
      const slot=!r.player2_id?2:!r.player3_id?3:null;
      if(!slot){setNotice('ظرفیت این اتاق تکمیل شده است.');return;}
      const patch={
        [`player${slot}_id`]:user.id,
        [`player${slot}_name`]:user.full_name,
        [`player${slot}_token`]:String(Math.floor(Math.random()*899999)+100000),
        [`player${slot}_pos`]:1
      };
      const {data:nr,error:e}=await SB.from('snake_rooms').update(patch).eq('id',r.id).select().single();
      if(e)throw e;
      await SB.from('snake_requests').update({status:'accepted'}).eq('id',req.id);
      setRoom(nr);setViewMode('lobby');setNotice('به اتاق پیوستی؛ منتظر شروع بازی بمان.');load();
    }catch(e){
      setNotice('خطا در پیوستن: '+(e?.message||'خطای نامشخص'));
    }
  };

  const decline=async(req)=>{
    try{
      await SB.from('snake_requests').update({status:'declined'}).eq('id',req.id);
      load();
    }catch(e){setNotice('خطا در رد درخواست');}
  };

  const start=async()=>{
    if(!room||!isMine(room.player1_id))return;
    const ids=[room.player1_id,room.player2_id,room.player3_id].filter(Boolean);
    if(ids.length<2){setNotice('حداقل یک حریف باید بپیوندد.');return;}
    const first=ids[Math.floor(Math.random()*ids.length)];
    try{
      const {data,error}=await SB.from('snake_rooms').update({
        status:'playing',
        turn_id:first,
        winner_id:null,
        player1_pos:1,player2_pos:1,player3_pos:1
      }).eq('id',room.id).select().single();
      if(error)throw error;
      setRoom(data);setViewMode('game');setWinnerOpen(false);
      setNotice('بازی شروع شد؛ نفر اول به‌صورت تصادفی انتخاب شد.');
    }catch(e){setNotice('خطا در شروع بازی: '+(e?.message||'خطای نامشخص'));}
  };

  const leaveGame=async()=>{
    if(!room||leftGame||room.status==='finished')return;
    const slot=isMine(room.player1_id)?1:isMine(room.player2_id)?2:isMine(room.player3_id)?3:null;
    if(!slot)return;
    try{
      await SB.from('snake_rooms').update({[`player${slot}_token`]:'__LEFT__'}).eq('id',room.id);
      setLeftGame(true);
      setHiddenRoomId(room.id);
      setRoom(null);
      setWinnerOpen(false);
      setViewMode('lobby');
      setRequests(requests.filter(r=>String(r.room_id)!==String(room.id)));
      setNotice('🚪 از بازی خارج شدی و به صفحه شروع بازی برگشتی.');
    }catch(e){setNotice('خطا در خروج از بازی: '+(e?.message||''));}
  };

  const deleteFinishedGame=async()=>{
    if(!room)return;
    try{
      await SB.from('snake_requests').delete().eq('room_id',room.id);
      await SB.from('snake_rooms').delete().eq('id',room.id);
      setRoom(null);setWinnerOpen(false);setViewMode('lobby');setRequests([]);
      setNotice('بازی و نتیجه آن پایان یافت و حذف شد.');
    }catch(e){
      setNotice('حذف بازی انجام نشد: '+(e?.message||'مجوز حذف در Supabase بررسی شود.'));
    }
  };

  const roll=async()=>{
    if(!room||room.status!=='playing'||!isMine(room.turn_id)||rolling||leftGame)return;
    const ids=[room.player1_id,room.player2_id,room.player3_id].filter(Boolean);
    const slot=isMine(room.player1_id)?1:isMine(room.player2_id)?2:3;
    const old=Math.max(1,Number(room[`player${slot}_pos`]||1));
    const d=1+Math.floor(Math.random()*6);

    setRolling(true);animationLockRef.current=true;setShake(true);setDice(d);
    setTimeout(()=>setShake(false),1150);

    try{
      let cursor=old;
      const target=Math.min(100,old+d);
      for(let n=old+1;n<=target;n++){
        await new Promise(res=>setTimeout(res,250));
        cursor=n;
        setVisualPos(v=>({...v,[user.id]:n}));
      }

      if(target<100&&Object.prototype.hasOwnProperty.call(SNAKES,target)){
        setStrikingSnake(target);
        await new Promise(res=>setTimeout(res,720));
        const tail=SNAKES[target];
        setVisualPos(v=>({...v,[user.id]:tail}));
        await new Promise(res=>setTimeout(res,500));
        cursor=tail;
        setStrikingSnake(null);
      }else if(target<100&&Object.prototype.hasOwnProperty.call(LADDERS,target)){
        const top=LADDERS[target];
        await new Promise(res=>setTimeout(res,420));
        setVisualPos(v=>({...v,[user.id]:top}));
        await new Promise(res=>setTimeout(res,420));
        cursor=top;
      }

      const nextTurn=ids[(ids.findIndex(x=>isMine(x))+1)%ids.length];
      const patch={
        [`player${slot}_pos`]:cursor,
        turn_id:cursor===100?null:nextTurn,
        winner_id:cursor===100?user.id:null,
        status:cursor===100?'finished':'playing'
      };
      const {data,error}=await SB.from('snake_rooms').update(patch).eq('id',room.id).select().single();
      if(error)throw error;
      setRoom(data);
      if(cursor===100)setWinnerOpen(true);
      setVisualPos(v=>{const q={...v};delete q[user.id];return q});
    }catch(e){
      setNotice('خطا در حرکت: '+(e?.message||'خطای نامشخص'));
    }finally{
      setStrikingSnake(null);setRolling(false);animationLockRef.current=false;
    }
  };

  // Visual board: START is bottom-left and 100 is top-right.
  // Every row is intentionally left-to-right so the path is easy to read on mobile.
  const board=[];
  for(let visualRow=9;visualRow>=0;visualRow--){
    for(let col=0;col<10;col++) board.push(visualRow*10+col+1);
  }

  const point=(pos)=>{
    const n=Math.max(1,Math.min(100,Number(pos)||1));
    const row=Math.floor((n-1)/10);
    const col=(n-1)%10;
    return {x:col*10+5,y:(9-row)*10+5};
  };

  const players=room
    ?[1,2,3].map(n=>room[`player${n}_id`]?{
      n,id:room[`player${n}_id`],name:room[`player${n}_name`],
      token:room[`player${n}_token`],
      pos:Number(visualPos[room[`player${n}_id`]]??room[`player${n}_pos`]??1)
    }:null).filter(Boolean)
    :[];

  const DiceFace=()=>{
    const settleClass=settled?'settled':'';
    return <div className="snake10-dice-stage snake13-dice-stage">
      <div className="snake10-dice-glow"></div>
      <div className={'snake10-dice-flight snake13-dice-flight '+(rolling?'flight':'')}>
        <div className={'snake10-dice-cube snake13-dice-cube '+(rolling?'rolling ':'')+settleClass} data-value={dice}>
          {[1,2,3,4,5,6].map(v=><div key={v} className={'snake10-dice-face snake13-dice-face face-'+v}><span>{v}</span></div>)}
        </div>
      </div>
    </div>
  };

  const SnakeArt=()=>{
    const defs=[
      ['green','#56c596','#0b6b48'],
      ['red','#ff633f','#9d160d'],
      ['purple','#a47bdb','#3c1d68'],
      ['gold','#f2b233','#8b4c05'],
      ['blue','#3fa6d8','#064a73'],
      ['lime','#8adf45','#286b1e']
    ];
    return <svg className="snake10-art" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        {defs.map((c,i)=><React.Fragment key={i}>
          <linearGradient id={'snake10g'+i} x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stopColor={c[1]}/>
            <stop offset=".42" stopColor={c[1]}/>
            <stop offset="1" stopColor={c[2]}/>
          </linearGradient>
          <filter id={'snake10shadow'+i} x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="1.4" stdDeviation="1.2" floodColor="#000" floodOpacity=".7"/>
          </filter>
        </React.Fragment>)}
      </defs>

      {Object.entries(SNAKES).map(([from,to],i)=>{
        const a=point(Number(from)),b=point(Number(to));
        const mx=(a.x+b.x)/2;
        const bend=((i%2)?-1:1)*(10+(i%3)*5);
        const d=`M ${a.x} ${a.y} C ${mx+bend} ${a.y-7}, ${mx-bend} ${b.y+9}, ${b.x} ${b.y}`;
        const color=defs[i%defs.length];
        return <g key={from} className={strikingSnake===Number(from)?'snake10-strike':''} filter={`url(#snake10shadow${i%defs.length})`}>
          <path d={d} className="snake10-body" stroke={'url(#snake10g'+(i%defs.length)+')'}/>
          <path d={d} className="snake10-scale-line"/>
          <path d={d} className="snake10-shine"/>
          <g transform={`translate(${a.x} ${a.y})`}>
            <ellipse cx="0" cy="0" rx="4.2" ry="3.25" fill={color[1]} stroke="#24120d" strokeWidth=".75"/>
            <path d="M-3.5-1.5 Q0-5 3.7-1.3 Q1.7 2.7 0 3.2 Q-2 2.5-3.5-1.5Z" fill={color[1]} opacity=".9"/>
            <circle cx="-1.35" cy="-1.05" r=".95" fill="#fff"/><circle cx="1.35" cy="-1.05" r=".95" fill="#fff"/>
            <circle cx="-1.35" cy="-1.05" r=".36" fill="#111"/><circle cx="1.35" cy="-1.05" r=".36" fill="#111"/>
            <path d="M2.8 .45 C4.4 .4 5.8 .7 7.1 .2 M7.1 .2 l1.8 -1.1 M7.1 .2 l1.8 1.1" className="snake10-tongue"/>
          </g>
        </g>
      })}

      {Object.entries(LADDERS).map(([from,to],i)=>{
        const a=point(Number(from)),b=point(Number(to));
        const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
        const nx=-dy/len*1.7,ny=dx/len*1.7;
        const count=Math.max(4,Math.floor(len/6));
        return <g key={'lad'+from} className="snake10-ladder">
          <line x1={a.x+nx} y1={a.y+ny} x2={b.x+nx} y2={b.y+ny} className="ladder-shadow"/>
          <line x1={a.x-nx} y1={a.y-ny} x2={b.x-nx} y2={b.y-ny} className="ladder-shadow"/>
          <line x1={a.x+nx} y1={a.y+ny} x2={b.x+nx} y2={b.y+ny} className="ladder-rail"/>
          <line x1={a.x-nx} y1={a.y-ny} x2={b.x-nx} y2={b.y-ny} className="ladder-rail"/>
          {Array.from({length:count}).map((_,k)=>{
            const t=(k+1)/(count+1);
            return <line key={k} x1={a.x+dx*t+nx} y1={a.y+dy*t+ny} x2={a.x+dx*t-nx} y2={a.y+dy*t-ny} className="ladder-rung"/>
          })}
        </g>
      })}
    </svg>
  };

  useEffect(()=>{
    if(!room || room.status!=='playing')return;
    const current={};
    [1,2,3].forEach(n=>{const id=room[`player${n}_id`];if(id)current[id]=Number(room[`player${n}_pos`]||1);});
    const previous=previousPositionsRef.current;
    Object.entries(current).forEach(([id,target])=>{
      const start=Number(previous[id]||target);
      if(start===target){setVisualPos(v=>({...v,[id]:target}));return;}
      if(String(id)===safeUserId)return;
      let step=start;
      const dir=target>start?1:-1;
      const walk=()=>{
        step+=dir;
        setVisualPos(v=>({...v,[id]:step}));
        if(step!==target)setTimeout(walk,230);
      };
      walk();
    });
    previousPositionsRef.current=current;
  },[room?.player1_pos,room?.player2_pos,room?.player3_pos,room?.status]);

  if(viewMode==='game'&&room)return <div className={'snake10-shell '+(shake?'snake10-shake':'')}>
    <div className="snake10-ambient"></div>

    <div className="snake10-scorebar">
      <div className="snake10-player-card">
        <div className="snake10-avatar purple">{players[0]?.name?.[0]||'م'}</div>
        <div><b>{players[0]?.name||'بازیکن'}</b><span>📍 {players[0]?.pos||1}</span></div>
      </div>
      <div className="snake10-trophy-big">🏆</div>
      {players.slice(1).map(p=><div key={p.id} className="snake10-player-card">
        <div className="snake10-avatar" style={{background:`linear-gradient(145deg,${COLORS[p.n-1].main},${COLORS[p.n-1].dark})`}}>{p.name?.[0]||'؟'}</div>
        <div><b>{p.name}</b><span>📍 {p.pos}</span></div>
      </div>)}
    </div>

    <div className="snake10-board-frame snake13-board">
      <div className="snake10-board-inner">
        <div className="snake10-grid">
          {board.map(pos=><div key={pos} className={'snake10-cell snake13-cell '+(pos===1?'start':'')+(pos===100?'finish':'')}>
            {pos===100?<span className="snake10-trophy-cell">🏆</span>:<span>{pos}</span>}
            {pos===1&&<small>START</small>}
          </div>)}
        </div>
        <SnakeArt/>
        {players.map(p=>{
          const pt=point(p.pos);
          const idx=p.n-1;
          const out=p.token==='__LEFT__';
          return <div key={p.id} className={'snake13-piece '+(out?'left':'')+(isMine(p.id)&&leftGame?' left':'')} style={{left:pt.x+'%',top:pt.y+'%', '--pc':COLORS[idx].main,'--pl':COLORS[idx].light,'--pd':COLORS[idx].dark}}>
            <div className="p-shadow"></div><div className="p-base"></div><div className="p-body"></div><div className="p-head">{p.name?.[0]||'?'}</div><em>{p.name}</em>
          </div>
        })}
      </div>
    </div>

    <div className="snake10-dice-panel snake10-dice-panel-clean">
      <DiceFace/>
    </div>

    <div className="snake10-turn-line">
      {room.status==='finished'
        ?'🏆 بازی به پایان رسید'
        :leftGame
          ?'🚪 از بازی خارج شدی'
          :isMine(room.turn_id)
            ?'✨ نوبت شماست'
            :'🎯 نوبت '+(players.find(p=>isMine(p.id===room.turn_id?user.id:p.id))?.name||players.find(p=>String(p.id)===String(room.turn_id))?.name||'حریف')}
    </div>

    <button className="snake10-roll-button" onClick={roll} disabled={rolling||leftGame||!isMine(room.turn_id)||room.status!=='playing'}>
      <span className="roll-dice-icon">🎲</span>
      <span><b>{rolling?'تاس در حال غلتیدن...':'تاس بریز!'}</b><small>{isMine(room.turn_id)?'نوبت شماست':'منتظر نوبت بازیکن'}</small></span>
    </button>

    <button className="snake10-leave-button" onClick={leaveGame} disabled={leftGame||room.status==='finished'}>
      🚪 پایان بازی برای من
    </button>

    <div className="snake10-players-strip">
      {players.map(p=><div key={p.id} className={'snake10-mini-player '+(String(room.turn_id)===String(p.id)?'active':'')+(p.token==='__LEFT__'?' out':'')}>
        <span style={{background:COLORS[p.n-1].main}}></span><b>{p.name}</b><small>{p.token==='__LEFT__'?'خارج شد':'خانه '+p.pos}</small>
      </div>)}
    </div>

    {room.status==='finished'&&winnerOpen&&<div className="snake10-winner-overlay">
      <div className="snake10-winner-modal">
        <div className="winner-rays"></div>
        <div className="winner-cup">🏆</div>
        <div className="winner-label">برنده بازی</div>
        <h2>{players.find(p=>String(p.id)===String(room.winner_id))?.name||'بازیکن'}</h2>
        <button onClick={deleteFinishedGame}>پایان بازی</button>
      </div>
    </div>}
  </div>;

  return <div className="snake10-shell snake10-lobby">
    <div className="snake10-lobby-head">
      <div><div className="snake10-kicker">BOARD GAME • ONLINE</div><h2>🐍 مار و پله</h2><p>حریف های خود را دعوت کن!</p></div>
      <div className="snake10-time-badge">۲ دقیقه</div>
    </div>
    {notice&&<div className="snake10-notice">{notice}</div>}

    {pendingIncoming.length>0&&<div className="snake10-lobby-card">
      <h3>🔔 درخواست‌های بازی</h3>
      {pendingIncoming.map(r=><div className="snake10-request" key={r.id}>
        <div><b>دعوت مار و پله</b><small>{Math.max(0,Math.ceil((new Date(r.expires_at).getTime()-now)/1000))} ثانیه باقی مانده</small></div>
        <button className="accept" onClick={()=>accept(r)}>قبول</button>
        <button className="decline" onClick={()=>decline(r)}>رد</button>
      </div>)}
    </div>}

    {pendingOutgoing.length>0&&<div className="snake10-wait">
      <span>⏳</span><div><b>در انتظار حریف‌ها</b><small>{pendingOutgoing.length} درخواست • فرصت پاسخ تا ۲ دقیقه</small></div>
    </div>}

    {room&&room.status==='waiting'&&<div className="snake10-lobby-card">
      <h3>🎮 اتاق بازی</h3>
      <div className="snake10-joined">{[room.player1_name,room.player2_name,room.player3_name].filter(Boolean).map((n,i)=><span key={i}>{i===0?'👑':'🎮'} {n}</span>)}</div>
      {isMine(room.player1_id)&&[room.player2_id,room.player3_id].filter(Boolean).length>0&&
        <button onClick={start} className="snake10-start">🚀 شروع بازی <small>({[room.player2_id,room.player3_id].filter(Boolean).length+1} نفر)</small></button>}
    </div>}

    <div className="snake10-lobby-card">
      <div className="snake10-select-head"><h3>👥 حریف های خود را انتخاب کن</h3><b>{selected.length}/۲</b></div>
      {people.filter(p=>String(p.id)!==safeUserId).map(p=><label key={p.id} className={'snake10-person '+(selected.includes(p.id)?'selected':'')}>
        <input type="checkbox" checked={selected.includes(p.id)} onChange={()=>setSelected(x=>x.includes(p.id)?x.filter(i=>i!==p.id):x.length<2?[...x,p.id]:x)}/>
        <div className="snake10-person-avatar">{p.full_name?.[0]||'؟'}</div>
        <div><b>{p.full_name}</b><small>{p.role==='admin'?'مدیر':'دانش‌آموز'}</small></div>
        <span>✓</span>
      </label>)}
      <button onClick={makeRoom} disabled={busy||selected.length===0} className="snake10-invite">📩 ارسال درخواست بازی</button>
    </div>
  </div>;
}

function Student({user,tab,setTab,onLogout}){
  const [exams,setExams]=useState([]);
  const [answers,setAnswers]=useState([]);
  const [activeExam,setActiveExam]=useState(null);
  const [currentQ,setCurrentQ]=useState(0);
  const [studentAnswers,setStudentAnswers]=useState({});
  const [timeLeft,setTimeLeft]=useState(0);
  const [totalTime,setTotalTime]=useState(0);
  const [calcDisplay,setCalcDisplay]=useState('');
  const [showObjection,setShowObjection]=useState(null);
  const [objectionTick,setObjectionTick]=useState(Date.now());
  const [openObjection,setOpenObjection]=useState(null);
  const [objectionText,setObjectionText]=useState('');
  const [selectedExamForObjection,setSelectedExamForObjection]=useState(null);
  const [checklist,setChecklist]=useState([]);
  const [newTask,setNewTask]=useState('');
  const [studyPlans,setStudyPlans]=useState([]);
  const [newPlan,setNewPlan]=useState({day:'شنبه',subject:'',time:''});
  const [toolsTab,setToolsTab]=useState('calc');
  const [chartReady,setChartReady]=useState(false);
  const [showExamResults,setShowExamResults]=useState(null);
  const [showChat,setShowChat]=useState(false);
  const [showPasswordModal,setShowPasswordModal]=useState(false);
  const [activeGame,setActiveGame]=useState(null);
  const [hasSubmitted,setHasSubmitted]=useState(false);
  const toast=useToast();

  useEffect(()=>{loadAll();},[]);

  const loadAll=async()=>{
    const {data:e}=await SB.from('exams').select('*,questions(*)').order('created_at',{ascending:false});
    const {data:a}=await SB.from('answers').select('*,exams(title),questions(q_text,q_type,correct_opt,score,opt_a,opt_b,opt_c,opt_d)');
    const {data:c}=await SB.from('checklists').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    const {data:p}=await SB.from('study_plans').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    if(e)setExams(e.filter(ex=>ex.assigned_to==='all'||ex.assigned_to===String(user.id)));
    if(a)setAnswers(a.filter(ans=>ans.student_id===user.id));
    if(c)setChecklist(c);if(p)setStudyPlans(p);
  };

  const hasTakenExam=(examId)=>answers.some(a=>String(a.exam_id)===String(examId));

  const startExam=(exam)=>{
    if(hasTakenExam(exam.id)){toast('⚠️ قبلاً در این آزمون شرکت کرده‌اید','warning');return;}
    setActiveExam(exam);
    setCurrentQ(0);
    setStudentAnswers({});
    setTimeLeft(exam.duration_minutes*60);
    setTotalTime(exam.duration_minutes*60);
    setHasSubmitted(false);
  };

  useEffect(()=>{
    if(activeExam&&timeLeft>0){
      const t=setInterval(()=>setTimeLeft(tl=>tl-1),1000);
      return()=>clearInterval(t);
    }else if(activeExam&&timeLeft===0)submitExam();
  },[activeExam,timeLeft]);

  const submitExam=async()=>{
    if(!activeExam||hasSubmitted)return;
    setHasSubmitted(true);
    for(const q of activeExam.questions){
      const ans=studentAnswers[q.id]||'';
      let score=0;
      let status='pending';
      if(q.q_type==='test'){
        if(q.correct_opt){
          if(ans===q.correct_opt)score=parseFloat(q.score)||1;
          status='graded';
        }
      }
      await SB.from('answers').insert({exam_id:activeExam.id,student_id:user.id,question_id:q.id,student_answer:ans,score,max_score:parseFloat(q.score)||1,status,graded_at:status==='graded'?new Date().toISOString():null});
    }
    toast('✅ پاسخ‌ها ثبت شد!','success');
    setActiveExam(null);
    loadAll();
  };

  const calcPress=(v)=>{
    if(v==='C')setCalcDisplay('');
    else if(v==='='){
      try{
        const expr=calcDisplay.replace(/÷/g,'/').replace(/×/g,'*');
        setCalcDisplay(String(new Function('return '+expr)()));
      }catch{setCalcDisplay('خطا');}
    }
    else setCalcDisplay(calcDisplay+v);
  };

  const submitObjection=async()=>{
    if(!objectionText.trim()||!selectedExamForObjection)return;
    const examAnswers=answers.filter(a=>a.exam_id===selectedExamForObjection);
    for(const a of examAnswers){
      await SB.from('answers').update({objection:objectionText.trim()}).eq('id',a.id);
    }
    toast('✅ اعتراض ثبت شد!','success');
    setShowObjection(null);
    setSelectedExamForObjection(null);
    setObjectionText('');
    loadAll();
  };

  const addTask=async()=>{
    if(!newTask.trim())return;
    const {data,error}=await SB.from('checklists').insert({user_id:user.id,title:newTask.trim()}).select().single();
    if(error){toast('خطا: '+error.message,'error');return;}
    if(data)setChecklist([data,...checklist]);
    setNewTask('');
    toast('✅ کار اضافه شد','success');
  };

  const toggleTask=async(id,done)=>{
    await SB.from('checklists').update({is_done:!done}).eq('id',id);
    setChecklist(checklist.map(t=>t.id===id?{...t,is_done:!done}:t));
  };

  const deleteTask=async(id)=>{
    await SB.from('checklists').delete().eq('id',id);
    setChecklist(checklist.filter(t=>t.id!==id));
  };

  const addPlan=async()=>{
    if(!newPlan.subject.trim()||!newPlan.time.trim()){toast('همه فیلدها را پر کنید','error');return;}
    const {data,error}=await SB.from('study_plans').insert({user_id:user.id,day_of_week:newPlan.day,subject:newPlan.subject.trim(),time_range:newPlan.time.trim()}).select().single();
    if(error){toast('خطا: '+error.message,'error');return;}
    if(data)setStudyPlans([data,...studyPlans]);
    setNewPlan({day:'شنبه',subject:'',time:''});
    toast('✅ برنامه اضافه شد','success');
  };

  const deletePlan=async(id)=>{
    await SB.from('study_plans').delete().eq('id',id);
    setStudyPlans(studyPlans.filter(p=>p.id!==id));
  };

  const getExamScore=(examId,studentId=user.id)=>{
    const examAnswers=answers.filter(a=>String(a.exam_id)===String(examId)&&String(a.student_id)===String(studentId));
    if(examAnswers.length===0)return null;
    const totalScore=examAnswers.reduce((s,a)=>s+parseFloat(a.score||0),0);
    const maxScore=examAnswers.reduce((s,a)=>s+parseFloat(a.max_score||0),0);
    const percentage=(totalScore/maxScore)*20;
    return {totalScore,maxScore,percentage:percentage.toFixed(2)};
  };

  const getAverage=()=>{
    const examScores=exams.map(ex=>getExamScore(ex.id)).filter(s=>s!==null);
    if(examScores.length===0)return 0;
    const avg=examScores.reduce((s,e)=>s+parseFloat(e.percentage),0)/examScores.length;
    return avg.toFixed(2);
  };

  const getObjectionStart=(examId)=>{
    const rows=answers.filter(a=>String(a.exam_id)===String(examId)&&a.status==='graded');
    if(!rows.length)return null;
    const dates=rows.map(a=>a.graded_at||a.updated_at||a.created_at).filter(Boolean).map(x=>new Date(x).getTime()).filter(Number.isFinite);
    return dates.length?Math.max(...dates):null;
  };
  const getObjectionState=(examId)=>{
    const start=getObjectionStart(examId);
    if(!start)return {state:'waiting',remaining:0};
    const remaining=Math.max(0,48*60*60*1000-(Date.now()-start));
    return {state:remaining>0?'active':'expired',remaining};
  };
  const canObject=(examId)=>getObjectionState(examId).state==='active';


  useEffect(()=>{
    if(tab!=='chart')return;
    const ctx=document.getElementById('gradeChart');
    if(!ctx||typeof Chart==='undefined')return;
    if(window.myChart)window.myChart.destroy();
    const examData=exams.filter(ex=>getExamScore(ex.id)).map(ex=>{const sc=getExamScore(ex.id);return {title:ex.title,score:Math.max(0,Math.min(20,parseFloat(sc.percentage)||0)),date:ex.created_at};}).sort((a,b)=>new Date(a.date)-new Date(b.date));
    if(!examData.length)return;
    const c=ctx.getContext('2d');
    const grad=c.createLinearGradient(0,0,ctx.width||400,0);grad.addColorStop(0,'#60a5fa');grad.addColorStop(.45,'#a78bfa');grad.addColorStop(1,'#f472b6');
    const fill=c.createLinearGradient(0,0,0,260);fill.addColorStop(0,'rgba(129,140,248,.30)');fill.addColorStop(1,'rgba(129,140,248,0)');
    window.myChart=new Chart(ctx,{type:'line',data:{labels:examData.map((_,i)=>String(i+1)),datasets:[{data:examData.map(d=>d.score),borderColor:grad,backgroundColor:fill,borderWidth:5,tension:.52,fill:true,pointBackgroundColor:'#fff',pointBorderColor:'#f472b6',pointBorderWidth:4,pointRadius:9,pointHoverRadius:13,pointHitRadius:18,clip:false}]},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:96,right:42,left:30,bottom:22}},animation:{duration:2200,easing:'easeOutQuart'},interaction:{mode:'nearest',intersect:true},plugins:{legend:{display:false},tooltip:{displayColors:false,backgroundColor:'rgba(12,14,32,.97)',padding:14,cornerRadius:16,caretPadding:10,callbacks:{title:(items)=>examData[items[0].dataIndex]?.title||'',label:(item)=>`نمره: ${Number(item.raw).toFixed(2)}/20`}}},scales:{y:{min:0,max:20.8,beginAtZero:true,offset:false,suggestedMax:20,ticks:{stepSize:2,color:'rgba(255,255,255,.65)',padding:10,callback:(value)=>value<=20?value:''},grid:{color:'rgba(255,255,255,.075)',drawBorder:false}},x:{display:false,grid:{display:false}}}}});
  },[tab,answers,exams]);

  if(activeExam){
    const q=activeExam.questions[currentQ];
    const progress=((currentQ+1)/activeExam.questions.length)*100;
    return(
      <div className="min-h-screen">
        <div className="header">
          <div className="flex justify-between items-center mb-3">

              <p className="text-[11px] text-white/40 mt-1">سوال {currentQ+1} از {activeExam.questions.length}</p>
            </div>
            <CircularTimerGlow timeLeft={timeLeft} totalTime={totalTime}/>
          </div>
          <div className="w-full bg-white/5 rounded-full h-2 overflow-hidden">
            <div className="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 h-2 rounded-full transition-all duration-500" style={{width:`${progress}%`}}></div>
          </div>
        </div>
        {timeLeft<300&&timeLeft>0&&<div className="bg-red-500/15 text-red-300 p-3 text-center text-sm font-bold animate-pulse border-b border-red-500/20">⚠️ کمتر از ۵ دقیقه!</div>}
        <div className="content">
          <div className="glass p-5 fade-in">
            <div className="flex justify-between items-center mb-3">
              <span className={`badge ${q?.q_type==='test'?'badge-new':'badge-approved'}`}>{q?.q_type==='test'?'📝 تستی':'✍️ تشریحی'}</span>
              <span className="badge badge-new">⭐ {q?.score||1} نمره</span>
            </div>
            {q?.image_url&&<img src={q.image_url} alt="" className="w-full rounded-xl mb-4 max-h-48 object-contain bg-black/20 border border-white/5"/>}
            <p className="mb-5 font-bold leading-relaxed text-lg">{q?.q_text}</p>
            {q?.q_type==='test'?(
              <div className="space-y-2">
                {['A','B','C','D'].map(opt=>(
                  <div key={opt} className={`glass p-3 cursor-pointer transition-all ${studentAnswers[q.id]===opt?'border-indigo-500 bg-indigo-500/15 scale-[1.02]':'hover:bg-white/5'}`} onClick={()=>setStudentAnswers({...studentAnswers,[q.id]:opt})}>
                    <div className="flex items-center gap-3">
                      <div className={`w-10 h-10 rounded-full border-2 flex items-center justify-center font-bold text-sm transition-all ${studentAnswers[q.id]===opt?'bg-gradient-to-br from-indigo-500 to-purple-500 border-transparent text-white scale-110':'border-white/20'}`}>{opt}</div>
                      <span className="flex-1 text-sm">{q[`opt_${opt.toLowerCase()}`]}</span>
                      {studentAnswers[q.id]===opt&&<Icon d={Icons.check} size={20} className="text-indigo-400"/>}
                    </div>
                  </div>
                ))}
              </div>
            ):(<textarea className="glass-input" placeholder="پاسخ خود را بنویسید..." value={studentAnswers[q.id]||''} onChange={e=>setStudentAnswers({...studentAnswers,[q.id]:e.target.value})} rows="5"/>)}
          </div>
          <div className="flex gap-2 mt-4">
            {currentQ>0&&<button onClick={()=>setCurrentQ(currentQ-1)} className="btn-glass bg-white/5 flex-1">← قبلی</button>}
            {currentQ<activeExam.questions.length-1?<button onClick={()=>setCurrentQ(currentQ+1)} className="btn-glass flex-1">بعدی →</button>:<button onClick={()=>{if(confirm('ثبت نهایی آزمون؟'))submitExam();}} className="btn-glass btn-glass-success flex-1">✓ ثبت نهایی</button>}
          </div>
        </div>
      </div>
    );
  }

  return(
    <div className="min-h-screen pb-24">
      <div className="header flex justify-between items-center">
        <div>
          <h1 className="text-lg font-black gradient-text">پنل دانش‌آموز</h1>

        <div className="flex gap-2">

        {tab==='grades'&&(<div className="slide-up">

            <div className="flex items-center gap-3"><div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-pink-500 flex items-center justify-center font-black">{ex.title?.[0]||'آ'}</div><div className="flex-1 min-w-0"><p className="font-bold text-sm truncate">{ex.title}</p><p className="text-[11px] text-white/35">{ex.questions?.length||0} سوال</p></div><div className="grade-score-pill">{score.percentage}<small className="text-[9px] text-white/45"> / ۲۰</small></div><button className={`objection-arrow ${open?'open':''}`} onClick={()=>setOpenObjection(open?null:ex.id)}>⌄</button></div>
            {open&&<div className="objection-box mt-3">{hasObj?<p className="text-xs text-amber-300">⏳ اعتراض شما ثبت شده و در حال بررسی است.</p>:st.state==='waiting'?<p className="text-xs text-white/55">⏰ زمان اعتراض به پایان رسیده است.</p>:st.state==='active'?<><div className="flex items-center justify-between gap-3"><div><p className="text-xs text-white/45">مهلت باقی‌مانده اعتراض</p><p className="text-2xl font-black text-amber-300 font-mono">{String(hh).padStart(2,'0')}:{String(mm).padStart(2,'0')}:{String(ss).padStart(2,'0')}</p></div><button onClick={()=>{setSelectedExamForObjection(ex.id);setShowObjection(true);}} className="btn-glass btn-glass-danger btn-sm"><Icon d={Icons.alert} size={15}/> ثبت اعتراض</button></div></>:<p className="text-xs text-white/45">⏰ زمان ثبت اعتراض به اتمام رسیده است.</p>}</div>}
          </div>})}
        </div>)}
        {tab==='chart'&&(
          <>
            <div className="glass p-6 text-center mb-6 slide-up">
              <Icon d={Icons.chart} size={32} className="mx-auto mb-2 text-indigo-400"/>
              <p className="text-4xl font-black gradient-text">{getAverage()}</p>
              <p className="text-xs text-white/40">معدل کل از 20</p>
            </div>
            <div className="chart-container-enhanced chart-heartbeat"><div className="chart-orbit chart-orbit-a"></div><div className="chart-orbit chart-orbit-b"></div><h3 className="font-bold mb-2 text-center text-sm gradient-text">📈 رشد نمرات</h3><p className="text-[10px] text-white/30 text-center mb-2">برای دیدن جزئیات، روی نقطه نمره بزن</p><div className="grade-chart-shell">{exams.filter(ex=>getExamScore(ex.id)).length===0?<p className="text-center text-white/30 py-8">نمره‌ای نیست</p>:<canvas id="gradeChart"></canvas>}</div></div>
            <div className="glass p-4 mt-4">
              <h4 className="font-bold text-sm mb-3 gradient-text"> لیست آزمون‌ها</h4>
              {exams.filter(ex=>getExamScore(ex.id)).length===0?<p className="text-center text-white/30 py-4">آزمونی ندارید</p>:
              exams.filter(ex=>getExamScore(ex.id)).map(ex=>{
                const score=getExamScore(ex.id);
                return(
                  <div key={ex.id} className="exam-list-item">
                    <div className="flex-1 min-w-0">
                      <p className="font-bold text-sm truncate">{ex.title}</p>
                      <p className="text-[11px] text-white/40">{ex.questions?.length||0} سوال</p>
                    </div>
                    <div className="exam-list-score">{parseFloat(score.percentage)}</div>
                  </div>
                );
              })}
            </div>
          </>
        )}
        {tab==='tools'&&(
          <>
            {!activeGame?(
              <>
                <div className="grid grid-cols-2 gap-3 mb-4">
                  <div className={`tool-btn calc ${toolsTab==='calc'?'active':''}`} onClick={()=>setToolsTab('calc')}>
                    <div className="tool-icon"><Icon d={Icons.calc} size={28}/></div>
                    <div className="tool-label">ماشین‌حساب</div>
                  </div>
                  <div className={`tool-btn check ${toolsTab==='checklist'?'active':''}`} onClick={()=>setToolsTab('checklist')}>
                    <div className="tool-icon"><Icon d={Icons.check} size={28}/></div>
                    <div className="tool-label">چک‌لیست</div>
                  </div>
                  <div className={`tool-btn plan ${toolsTab==='planner'?'active':''}`} onClick={()=>setToolsTab('planner')}>
                    <div className="tool-icon"><Icon d={Icons.calendar} size={28}/></div>
                    <div className="tool-label">برنامه‌ریزی</div>
                  </div>
                  <div className={`tool-btn game ${toolsTab==='games'?'active':''}`} onClick={()=>setToolsTab('games')}>
                    <div className="tool-icon"><Icon d={Icons.game} size={28}/></div>
                    <div className="tool-label">بازی‌ها</div>
                  </div>
                </div>
                {toolsTab==='calc'&&(
                  <div className="glass-strong p-5 max-w-xs mx-auto slide-up">
                    <div className="bg-gradient-to-br from-indigo-900/40 to-purple-900/40 p-4 rounded-2xl text-3xl text-left mb-4 font-mono h-20 flex items-center justify-end border border-white/10 overflow-x-auto shadow-inner">{calcDisplay||'0'}</div>
                    <div className="grid grid-cols-4 gap-2">
                      {['7','8','9','÷','4','5','6','×','1','2','3','-','C','0','=','+'].map(b=>(

                      ))}
                    </div>
                  </div>

                {toolsTab==='checklist'&&(
                  <div className="space-y-3 slide-up">
                    <div className="flex gap-2">
                      <input className="glass-input flex-1" placeholder="کار جدید..." value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTask()}/>

                    {checklist.length===0&&<p className="text-center text-white/30 py-8">لیست خالی است</p>}

                      <div key={t.id} className="glass p-3 flex items-center gap-3">

                {activeGame==='snake'&&<SnakeGame user={user} students={[]} isAdmin={false}/>}
                {activeGame==='breakout'&&<BreakoutGame user={user}/>}
              </div>
            )}
          </>
        )}
      </div>
      <div className="nav-bar">
        <div className={`nav-item ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==='grades'?'active':''}`} onClick={()=>setTab('grades')}><Icon d={Icons.grade}/><span>نمرات</span></div>
        <div className={`nav-item ${tab==='chart'?'active':''}`} onClick={()=>setTab('chart')}><Icon d={Icons.chart}/><span>کارنامه</span></div>
        <div className={`nav-item ${tab==='tools'?'active':''}`} onClick={()=>{setTab('tools');setToolsTab('calc');setActiveGame(null);}}><Icon d={Icons.list}/><span>ابزارها</span></div>

      {showObjection&&(
        <div className="modal-overlay" onClick={()=>setShowObjection(null)}>
          <div className="glass-strong w-full max-w-md p-6 slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4"><h3 className="font-bold gradient-text">اعتراض به آزمون</h3><button onClick={()=>setShowObjection(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button></div>
            <div className="bg-amber-500/10 border border-amber-500/20 rounded-xl p-3 mb-4 text-xs text-amber-300">
              ⚠️ دانش‌آموز گرامی، فقط یکبار می‌توانید به نمره خود اعتراض بزنید و نتیجه شما ممکن است بدون تغییر یا افزایش و یا کاهش باشد.
            </div>
            <textarea className="glass-input mb-4" placeholder="دلیل اعتراض..." value={objectionText} onChange={e=>setObjectionText(e.target.value)} rows="4"/>
            <button onClick={submitObjection} className="btn-glass btn-glass-danger flex items-center justify-center gap-2"><Icon d={Icons.send} size={16}/>ارسال به مدیر</button>
          </div>
        </div>
      )}
      {showExamResults&&(
        <div className="modal-overlay" onClick={()=>setShowExamResults(null)}>
          <div className="glass-strong w-full max-w-lg p-6 max-h-[85vh] overflow-y-auto slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="font-bold gradient-text"> نتایج آزمون</h3>
              <button onClick={()=>setShowExamResults(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button>
            </div>
            {(()=>{
              const exam=exams.find(e=>e.id===showExamResults);
              if(!exam)return null;
              const score=getExamScore(exam.id);
              const examAnswers=answers.filter(a=>a.exam_id===exam.id);
              return(
                <>
                  <div className="glass p-4 mb-4 text-center bg-gradient-to-br from-indigo-500/10 to-pink-500/10">
                    <h4 className="font-bold mb-2">{exam.title}</h4>
                    <StarRating score={parseFloat(score.percentage)}/>
                    <p className="text-4xl font-black gradient-text mt-2">{score.percentage}/20</p>
                    <p className="text-xs text-white/40 mt-1">{score.totalScore} از {score.maxScore}</p>
                  </div>
                  <h4 className="font-bold text-sm mb-3 text-white/70">جزئیات سوالات:</h4>
                  {examAnswers.map((a,idx)=>{
                    const q=exam.questions.find(qq=>qq.id===a.question_id);
                    if(!q)return null;
                    const isCorrect=q.q_type==='test'&&q.correct_opt&&a.student_answer===q.correct_opt;
                    const isWrong=q.q_type==='test'&&q.correct_opt&&a.student_answer&&a.student_answer!==q.correct_opt;
                    return(
                      <div key={a.id} className={`glass p-3 mb-2 ${isWrong?'border-red-500/30':isCorrect?'border-emerald-500/30':''}`}>
                        <div className="flex justify-between items-start mb-2">
                          <span className="text-xs text-white/40">سوال {idx+1}</span>
                          <span className={`badge ${a.status==='graded'?'badge-approved':'badge-pending'}`}>{a.status==='graded'?'✓ تصحیح شده':'⏳ در انتظار تصحیح مدیر'}</span>
                        </div>
                        <p className="text-sm mb-2">{q.q_text}</p>
                        {q.q_type==='test'&&q.correct_opt?(
                          <div className="space-y-1 text-xs">
                            {isWrong&&(
                              <>
                                <div className="bg-red-500/10 border border-red-500/20 rounded-lg p-2"><span className="text-red-300">❌ پاسخ شما: {a.student_answer}</span></div>
                                <div className="bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-2"><span className="text-emerald-300">✓ پاسخ صحیح: {q.correct_opt}</span></div>
                              </>
                            )}
                            {isCorrect&&<div className="bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-2"><span className="text-emerald-300">✓ پاسخ صحیح: {a.student_answer}</span></div>}
                          </div>
                        ):(
                          <div className="text-xs">
                            <p className="text-white/40 mb-1">پاسخ شما:</p>
                            <p className="bg-white/5 p-2 rounded">{a.student_answer||'بدون پاسخ'}</p>
                          </div>
                        )}
                        <div className="flex justify-between items-center mt-2 pt-2 border-t border-white/5">
                          <span className="text-xs text-white/40">نمره سوال: {q.score||1}</span>
                          <span className="text-sm font-bold gradient-text">کسب شده: {a.score||0}</span>
                        </div>
                      </div>
                    );
                  })}
                </>
              );
            })()}
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [user,setUser]=useState(null);
  const [view,setView]=useState('login');
  const [tab,setTab]=useState('home');
  useEffect(()=>{
    const s=sessionStorage.getItem('edu_user');
    if(s){const u=JSON.parse(s);setUser(u);setView(u.role);SB.from('users').update({last_seen_at:new Date().toISOString()}).eq('id',u.id).then(()=>{}).catch(()=>{});}
  },[]);
  useEffect(()=>{
    if(!user?.id)return;
    const touch=()=>SB.from('users').update({last_seen_at:new Date().toISOString()}).eq('id',user.id).then(()=>{}).catch(()=>{});
    touch();
    const timer=setInterval(touch,60000);
    return()=>clearInterval(timer);
  },[user?.id]);
  const login=async(un,pw)=>{
    const {data,error}=await SB.from('users').select('*').eq('username',un.toUpperCase()).eq('password',pw).limit(1);const account=Array.isArray(data)?data[0]:data;if(error){console.error(error);return false;}
    if(account){const seen=new Date().toISOString();SB.from('users').update({last_seen_at:seen}).eq('id',account.id).then(()=>{}).catch(()=>{});account.last_seen_at=seen;setUser(account);sessionStorage.setItem('edu_user',JSON.stringify(account));setView(account.role);return true;}
    return false;
  };
  const logout=()=>{setUser(null);setView('login');setTab('home');sessionStorage.removeItem('edu_user');};
  if(view==='login') return <Login onLogin={login}/>;
  if(view==='admin') return <Admin user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
  return <Student user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
}

function AppWrapper(){
  return(<ToastProvider><App/></ToastProvider>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppWrapper/>);
</script>
<svg className="xo-gradients" style={{position:'absolute',width:0,height:0,overflow:hidden}}>
  <defs>
    <linearGradient id="xGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#818cf8"/>
      <stop offset="100%" stopColor="#c084fc"/>
    </linearGradient>
    <linearGradient id="oGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f472b6"/>
      <stop offset="100%" stopColor="#fb923c"/>
    </linearGradient>
    <linearGradient id="countdownGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#10b981"/>
      <stop offset="100%" stopColor="#ef4444"/>
    </linearGradient>
    <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#818cf8"/>
      <stop offset="100%" stopColor="#c084fc"/>
    </linearGradient>
  </defs>
</svg>
</body>
</html>
