  const follow=async()=>{if(viewerId===person.id)return; if(followingMe){await SB.from('follows').delete().eq('follower_id',viewerId).eq('following_id',person.id);setFollowingMe(false);setFollowers(x=>Math.max(0,x-1));toast('دنبال کردن لغو شد','warning');}else{const {error}=await SB.from('follows').insert({follower_id:viewerId,following_id:person.id});if(error){toast('امکان دنبال کردن نیست','error');return;}setFollowingMe(true);setFollowers(x=>x+1);toast('دنبال شد','success');}};
  const block=async()=>{if(blocked){await SB.from('blocks').delete().eq('blocker_id',viewerId).eq('blocked_id',person.id);setBlocked(false);toast('مسدودسازی لغو شد','success');}else{await SB.from('blocks').insert({blocker_id:viewerId,blocked_id:person.id});setBlocked(true);toast('کاربر مسدود شد','warning');}};
  if(!person)return null; const av=profile?.avatar_url||'🐱';
  return <div className="modal-overlay" onClick={onClose}><div className="glass-strong profile-float slide-up" onClick={e=>e.stopPropagation()}><div className="profile-float-cover"></div><div className="profile-float-body"><div className="profile-float-avatar">{av.startsWith('data:image')?<img src={av} alt=""/>:av}</div><div className="flex justify-between items-start mt-3"><div><div className="profile-name-line"><h2 className="font-black text-xl">{profile?.display_name||person.full_name}</h2>{person.role==='admin'&&<VerifiedBadge/>}</div><p className="text-[10px] text-white/35 mt-1">@{person.username}</p></div><button onClick={onClose} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={17}/></button></div><p className="text-sm text-white/55 mt-4 leading-7 min-h-[28px]">{profile?.bio||'این کاربر هنوز بیوگرافی ننوشته است.'}</p><div className="flex gap-2 mt-4"><div className="profile-stat flex-1"><strong>{followers}</strong><span>فالوور</span></div><div className="profile-stat flex-1"><strong>{following}</strong><span>فالوینگ</span></div></div>{viewerId!==person.id&&<div className="grid grid-cols-[1fr_auto] gap-2 mt-5"><button className="profile-action text-white" onClick={follow}>{followingMe?'✓ در حال دنبال کردن':'دنبال کن'}</button><button onClick={block} className={`px-4 rounded-2xl border ${blocked?'bg-red-500/15 border-red-400/30 text-red-300':'bg-white/5 border-white/10 text-white/60'}`}>{blocked?'رفع مسدودی':'مسدود'}</button></div>}</div></div></div>;
}

function SocialChatModal({user,onClose,fullScreen=false}){
  const [contacts,setContacts]=useState([]); const [selected,setSelected]=useState(null); const [messages,setMessages]=useState([]); const [textMsg,setTextMsg]=useState(''); const [profiles,setProfiles]=useState({}); const [unread,setUnread]=useState(0); const [profilePerson,setProfilePerson]=useState(null); const [busy,setBusy]=useState(false); const endRef=useRef(null); const toast=useToast();
  useEffect(()=>{loadContacts();const ch=SB.channel('social-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'messages'},()=>{loadContacts();if(selected)loadConversation(selected);}).subscribe();return()=>SB.removeChannel(ch);},[user.id,selected?.id]);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages]);
  const ensureProfiles=async(list)=>{if(!list.length){setProfiles({});return;}const ids=list.map(x=>x.id);const {data}=await SB.from('profiles').select('user_id,display_name,bio,avatar_url').in('user_id',ids);const map={};(data||[]).forEach(p=>map[p.user_id]=p);for(const u of list){if(!map[u.id])map[u.id]={user_id:u.id,display_name:u.full_name||u.username,bio:'',avatar_url:'🐱'};}setProfiles(map);};
  const loadContacts=async()=>{const [{data:users},{data:blocked},{data:un}]=await Promise.all([SB.from('users').select('id,full_name,username,role,last_seen_at').neq('id',user.id).order('full_name'),SB.from('blocks').select('blocked_id').eq('blocker_id',user.id),SB.from('messages').select('id').eq('receiver_id',user.id).is('read_at',null)]);const list=users||[];const hidden=new Set((blocked||[]).map(x=>x.blocked_id));const visible=list.filter(x=>!hidden.has(x.id));setContacts(visible);setUnread((un||[]).length);await ensureProfiles(visible);};
  const loadConversation=async(person)=>{const {data}=await SB.from('messages').select('*').or(`and(sender_id.eq.${user.id},receiver_id.eq.${person.id}),and(sender_id.eq.${person.id},receiver_id.eq.${user.id})`).order('created_at',{ascending:true});setMessages(data||[]);const ids=(data||[]).filter(m=>m.receiver_id===user.id&&m.sender_id===person.id&&m.read_at===null).map(m=>m.id);if(ids.length)await SB.from('messages').update({read_at:new Date().toISOString()}).in('id',ids);setUnread(x=>Math.max(0,x-ids.length));};
  const send=async()=>{if(!textMsg.trim()||!selected||busy)return;setBusy(true);const [{data:b1},{data:b2}]=await Promise.all([SB.from('blocks').select('id').eq('blocker_id',user.id).eq('blocked_id',selected.id).maybeSingle(),SB.from('blocks').select('id').eq('blocker_id',selected.id).eq('blocked_id',user.id).maybeSingle()]);if(b1||b2){setBusy(false);toast('این گفتگو به دلیل مسدودسازی در دسترس نیست','warning');return;}const {error}=await SB.from('messages').insert({sender_id:user.id,receiver_id:selected.id,content:textMsg.trim(),reactions:{}});setBusy(false);if(error){toast('خطا در ارسال پیام: '+error.message,'error');return;}setTextMsg('');await loadConversation(selected);};
  const prof=(id)=>profiles[id]?.avatar_url||'🐱';
  return <div className={`modal-overlay ${fullScreen?'social-fullscreen-overlay':''}`} onClick={onClose}><div className={`glass-strong social-chat w-full max-w-md h-[82vh] flex flex-col p-3 slide-up ${fullScreen?'social-chat-fullscreen':''}`} onClick={e=>e.stopPropagation()}>
    {!selected?<><div className="social-chat-header flex items-center justify-between"><div><h3 className="font-black text-base">پیام‌ها</h3><p className="text-[9px] text-white/35 mt-1">گفتگو با دانش‌آموزان و مدیر</p></div><div className="flex items-center gap-2"><span className="badge badge-new">{contacts.length} مخاطب</span><button onClick={onClose} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={17}/></button></div></div><div className="flex-1 overflow-y-auto space-y-2 pt-3">{contacts.length===0?<p className="text-center text-white/30 mt-12">مخاطبی پیدا نشد</p>:contacts.map(c=><div className="social-contact" key={c.id} onClick={()=>{setSelected(c);loadConversation(c);}}><div className="relative"><div className="social-mini-avatar">{prof(c.id)?.startsWith('data:image')?<img src={prof(c.id)} alt=""/>:prof(c.id)}</div>{Date.now()-new Date(c.last_seen_at||0).getTime()<180000?<span className="online-dot"/>:null}</div><div className="min-w-0 flex-1"><div className="social-contact-name"><b className="text-sm block truncate">{profiles[c.id]?.display_name||c.full_name}</b>{c.role==='admin'&&<VerifiedBadge/>}</div><span className="text-[9px] text-white/35">{c.role==='admin'?'مدیر':'دانش‌آموز'} · @{c.username}</span></div><Icon d={Icons.arrowLeft} size={16} className="text-white/25"/></div>)}</div></>:<><div className="social-chat-header flex items-center gap-2"><button onClick={()=>setSelected(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.arrowLeft} size={17}/></button><button className="flex items-center gap-2 min-w-0 flex-1 text-right" onClick={()=>setProfilePerson(selected)}><div className="social-mini-avatar !w-10 !h-10 !rounded-xl">{prof(selected.id)?.startsWith('data:image')?<img src={prof(selected.id)} alt=""/>:prof(selected.id)}</div><div className="min-w-0"><b className="text-sm block truncate">{profiles[selected.id]?.display_name||selected.full_name}</b><span className="text-[9px] text-white/35">برای مشاهده پروفایل لمس کنید</span></div></button><button onClick={onClose} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={17}/></button></div><div className="flex-1 overflow-y-auto py-3 space-y-2">{messages.map(m=><div key={m.id} className={`flex ${m.sender_id===user.id?'justify-start':'justify-end'}`}><div className={`social-bubble ${m.sender_id===user.id?'me':'other'}`}>{m.content}<span className="social-bubble-meta">{new Date(m.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}{m.sender_id===user.id?' ✓':''}</span></div></div>)}<div ref={endRef}/></div><div className="flex gap-2 pt-2 border-t border-white/5"><input className="glass-input flex-1" placeholder="پیام خود را بنویسید..." value={textMsg} onChange={e=>setTextMsg(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}/><button className="btn-glass btn-glass-success btn-sm" onClick={send} disabled={busy}><Icon d={Icons.send} size={17}/></button></div></>}
  </div>{profilePerson&&<ProfileView person={profilePerson} viewerId={user.id} onClose={()=>setProfilePerson(null)}/>}</div>;
}

function Student({user,tab,setTab,onLogout}){
  const [exams,setExams]=useState([]);
  const [answers,setAnswers]=useState([]);
  const [activeExam,setActiveExam]=useState(null);
  const [currentQ,setCurrentQ]=useState(0);
  const [studentAnswers,setStudentAnswers]=useState({});
  const [timeLeft,setTimeLeft]=useState(0);
  const [totalTime,setTotalTime]=useState(0);
  const [calcDisplay,setCalcDisplay]=useState('');
  const [showObjection,setShowObjection]=useState(null);
  const [objectionTick,setObjectionTick]=useState(Date.now());
  const [showAdminProfile,setShowAdminProfile]=useState(false);
  const [openObjection,setOpenObjection]=useState(null);
  const [objectionText,setObjectionText]=useState('');
  const [selectedExamForObjection,setSelectedExamForObjection]=useState(null);
  const [checklist,setChecklist]=useState([]);
  const [newTask,setNewTask]=useState('');
  const [studyPlans,setStudyPlans]=useState([]);
  const [newPlan,setNewPlan]=useState({day:'شنبه',subject:'',time:''});
  const [toolsTab,setToolsTab]=useState('calc');
  const [chartReady,setChartReady]=useState(false);
  const [showExamResults,setShowExamResults]=useState(null);
  const [showChat,setShowChat]=useState(false);
  const [showProfile,setShowProfile]=useState(false);
  const [unreadCount,setUnreadCount]=useState(0);
  const [showPasswordModal,setShowPasswordModal]=useState(false);
  const [activeGame,setActiveGame]=useState(null);
  const [penaltyRoomId,setPenaltyRoomId]=useState(null);
  const [hasSubmitted,setHasSubmitted]=useState(false);
  const toast=useToast();

  useEffect(()=>{loadAll();},[]);

  const loadAll=async()=>{
    const {data:e}=await SB.from('exams').select('*,questions(*)').order('created_at',{ascending:false});
    const {data:a}=await SB.from('answers').select('*,exams(title),questions(q_text,q_type,correct_opt,score,opt_a,opt_b,opt_c,opt_d)');
    const {data:p}=await SB.from('study_plans').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    if(e)setExams(e.filter(ex=>ex.assigned_to==='all'||ex.assigned_to===String(user.id)));
    if(a)setAnswers(a.filter(ans=>ans.student_id===user.id));
    if(p)setStudyPlans(p);
  };

  const hasTakenExam=(examId)=>answers.some(a=>String(a.exam_id)===String(examId));

  const startExam=(exam)=>{
    if(hasTakenExam(exam.id)){toast('⚠️ قبلاً در این آزمون شرکت کرده‌اید','warning');return;}
    setActiveExam(exam);
    setCurrentQ(0);
    setStudentAnswers({});
    setTimeLeft(exam.duration_minutes*60);
    setTotalTime(exam.duration_minutes*60);
    setHasSubmitted(false);
  };

  useEffect(()=>{
    if(activeExam&&timeLeft>0){
      const t=setInterval(()=>setTimeLeft(tl=>tl-1),1000);
      return()=>clearInterval(t);
    }else if(activeExam&&timeLeft===0)submitExam();
  },[activeExam,timeLeft]);

  const submitExam=async()=>{
    if(!activeExam||hasSubmitted)return;
    setHasSubmitted(true);
    for(const q of activeExam.questions){
      const ans=studentAnswers[q.id]||'';
      let score=0;
      let status='pending';
      if(q.q_type==='test'){
        if(q.correct_opt){
          if(ans===q.correct_opt)score=parseFloat(q.score)||1;
          status='graded';
        }
      }
      await SB.from('answers').insert({exam_id:activeExam.id,student_id:user.id,question_id:q.id,student_answer:ans,score,max_score:parseFloat(q.score)||1,status,graded_at:status==='graded'?new Date().toISOString():null});
    }
    toast('✅ پاسخ‌ها ثبت شد!','success');
    setActiveExam(null);
    loadAll();
  };

  const calcPress=(v)=>{
    if(v==='C')setCalcDisplay('');
    else if(v==='='){
      try{
        const expr=calcDisplay.replace(/÷/g,'/').replace(/×/g,'*');
        setCalcDisplay(String(new Function('return '+expr)()));
      }catch{setCalcDisplay('خطا');}
    }
    else setCalcDisplay(calcDisplay+v);
  };

  const submitObjection=async()=>{
    if(!objectionText.trim()||!selectedExamForObjection)return;
    const examAnswers=answers.filter(a=>a.exam_id===selectedExamForObjection);
    for(const a of examAnswers){
      await SB.from('answers').update({objection:objectionText.trim()}).eq('id',a.id);
    }
    toast('✅ اعتراض ثبت شد!','success');
    setShowObjection(null);
    setSelectedExamForObjection(null);
    setObjectionText('');
    loadAll();
  };

  const addTask=async()=>{
    if(!newTask.trim())return;
    const {data,error}=await SB.from('checklists').insert({user_id:user.id,title:newTask.trim()}).select().single();
    if(error){toast('خطا: '+error.message,'error');return;}
    if(data)setChecklist([data,...checklist]);
    setNewTask('');
    toast('✅ کار اضافه شد','success');
  };

  const toggleTask=async(id,done)=>{
    await SB.from('checklists').update({is_done:!done}).eq('id',id);
    setChecklist(checklist.map(t=>t.id===id?{...t,is_done:!done}:t));
  };

  const deleteTask=async(id)=>{
    await SB.from('checklists').delete().eq('id',id);
    setChecklist(checklist.filter(t=>t.id!==id));
  };

  const addPlan=async()=>{
    if(!newPlan.subject.trim()||!newPlan.time.trim()){toast('همه فیلدها را پر کنید','error');return;}
    const {data,error}=await SB.from('study_plans').insert({user_id:user.id,day_of_week:newPlan.day,subject:newPlan.subject.trim(),time_range:newPlan.time.trim()}).select().single();
    if(error){toast('خطا: '+error.message,'error');return;}
    if(data)setStudyPlans([data,...studyPlans]);
    setNewPlan({day:'شنبه',subject:'',time:''});
    toast('✅ برنامه اضافه شد','success');
  };

  const deletePlan=async(id)=>{
    await SB.from('study_plans').delete().eq('id',id);
    setStudyPlans(studyPlans.filter(p=>p.id!==id));
  };

  const getExamScore=(examId,studentId=user.id)=>{
    const examAnswers=answers.filter(a=>String(a.exam_id)===String(examId)&&String(a.student_id)===String(studentId));
    if(examAnswers.length===0)return null;
    const totalScore=examAnswers.reduce((s,a)=>s+parseFloat(a.score||0),0);
    const maxScore=examAnswers.reduce((s,a)=>s+parseFloat(a.max_score||0),0);
    const percentage=(totalScore/maxScore)*20;
    return {totalScore,maxScore,percentage:percentage.toFixed(2)};
  };

  const getAverage=()=>{
    const examScores=exams.map(ex=>getExamScore(ex.id)).filter(s=>s!==null);
    if(examScores.length===0)return 0;
    const avg=examScores.reduce((s,e)=>s+parseFloat(e.percentage),0)/examScores.length;
    return avg.toFixed(2);
  };

  const getObjectionStart=(examId)=>{
    const rows=answers.filter(a=>String(a.exam_id)===String(examId)&&a.status==='graded');
    if(!rows.length)return null;
    const dates=rows.map(a=>a.graded_at||a.updated_at||a.created_at).filter(Boolean).map(x=>new Date(x).getTime()).filter(Number.isFinite);
    return dates.length?Math.max(...dates):null;
  };
  const getObjectionState=(examId)=>{
    const start=getObjectionStart(examId);
    if(!start)return {state:'waiting',remaining:0};
    const remaining=Math.max(0,48*60*60*1000-(Date.now()-start));
    return {state:remaining>0?'active':'expired',remaining};
  };
  const canObject=(examId)=>getObjectionState(examId).state==='active';




  if(activeExam){
    const q=activeExam.questions[currentQ];
    const progress=((currentQ+1)/activeExam.questions.length)*100;
    return(
      <div className="min-h-screen">
        <div className="header">
          <div className="flex justify-between items-center mb-3">
            <div>
              <h2 className="font-black text-lg gradient-text">{activeExam.title}</h2>
              <p className="text-[11px] text-white/40 mt-1">سوال {currentQ+1} از {activeExam.questions.length}</p>
            </div>
            <CircularTimerGlow timeLeft={timeLeft} totalTime={totalTime}/>
          </div>
          <div className="w-full bg-white/5 rounded-full h-2 overflow-hidden">
            <div className="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 h-2 rounded-full transition-all duration-500" style={{width:`${progress}%`}}></div>
          </div>
        </div>
        {timeLeft<300&&timeLeft>0&&<div className="bg-red-500/15 text-red-300 p-3 text-center text-sm font-bold animate-pulse border-b border-red-500/20">⚠️ کمتر از ۵ دقیقه!</div>}
        <div className="content">
          <div className="glass p-5 fade-in">
            <div className="flex justify-between items-center mb-3">
              <span className={`badge ${q?.q_type==='test'?'badge-new':'badge-approved'}`}>{q?.q_type==='test'?'📝 تستی':'✍️ تشریحی'}</span>
              <span className="badge badge-new">⭐ {q?.score||1} نمره</span>
            </div>
            {q?.image_url&&<img src={q.image_url} alt="" className="w-full rounded-xl mb-4 max-h-48 object-contain bg-black/20 border border-white/5"/>}
            <p className="mb-5 font-bold leading-relaxed text-lg">{q?.q_text}</p>
            {q?.q_type==='test'?(
              <div className="space-y-2">
                {['A','B','C','D'].map(opt=>(
                  <div key={opt} className={`glass p-3 cursor-pointer transition-all ${studentAnswers[q.id]===opt?'border-indigo-500 bg-indigo-500/15 scale-[1.02]':'hover:bg-white/5'}`} onClick={()=>setStudentAnswers({...studentAnswers,[q.id]:opt})}>
                    <div className="flex items-center gap-3">
                      <div className={`w-10 h-10 rounded-full border-2 flex items-center justify-center font-bold text-sm transition-all ${studentAnswers[q.id]===opt?'bg-gradient-to-br from-indigo-500 to-purple-500 border-transparent text-white scale-110':'border-white/20'}`}>{opt}</div>
                      <span className="flex-1 text-sm">{q[`opt_${opt.toLowerCase()}`]}</span>
                      {studentAnswers[q.id]===opt&&<Icon d={Icons.check} size={20} className="text-indigo-400"/>}
                    </div>
                  </div>
                ))}
              </div>
            ):(<textarea className="glass-input" placeholder="پاسخ خود را بنویسید..." value={studentAnswers[q.id]||''} onChange={e=>setStudentAnswers({...studentAnswers,[q.id]:e.target.value})} rows="5"/>)}
          </div>
          <div className="flex gap-2 mt-4">
            {currentQ>0&&<button onClick={()=>setCurrentQ(currentQ-1)} className="btn-glass bg-white/5 flex-1">← قبلی</button>}
            {currentQ<activeExam.questions.length-1?<button onClick={()=>setCurrentQ(currentQ+1)} className="btn-glass flex-1">بعدی →</button>:<button onClick={()=>{if(confirm('ثبت نهایی آزمون؟'))submitExam();}} className="btn-glass btn-glass-success flex-1">✓ ثبت نهایی</button>}
          </div>
        </div>
      </div>
    );
  }

  return(
    <>
      <PenaltyRequestBridge user={user} onOpen={(id)=>{setPenaltyRoomId(id);setActiveGame('penalty');setTab('tools');setToolsTab('games');}}/>
      <div className="min-h-screen pb-24">
      <div className="header flex justify-between items-center">
        <div>
          <h1 className="text-lg font-black gradient-text">پنل دانش‌آموز</h1>
          <p className="text-xs text-white/40 mt-1">سلام {user.full_name} 👋</p>
        </div>
        <div className="flex gap-2">
          <button onClick={()=>setShowPasswordModal(true)} className="p-2.5 bg-white/5 rounded-xl hover:bg-white/10 transition" title="تغییر رمز"><Icon d={Icons.key} size={18}/></button>
          <button onClick={onLogout} className="p-2.5 bg-white/5 rounded-xl hover:bg-white/10 transition"><Icon d={Icons.logout} size={18}/></button>
        </div>
      </div>
      <div className="content">
        {tab==='home'&&(
          <>
            <div className="grid grid-cols-2 gap-3 mb-4">
              <div className="glass p-5 text-center slide-up">
                <Icon d={Icons.award} size={28} className="mx-auto mb-2 text-amber-400"/>
                <p className="text-3xl font-black gradient-text">{getAverage()}</p>
                <p className="text-[11px] text-white/40">معدل از 20</p>
              </div>
              <div className="glass p-5 text-center slide-up" style={{animationDelay:'0.1s'}}>
                <Icon d={Icons.exam} size={28} className="mx-auto mb-2 text-indigo-400"/>
                <p className="text-3xl font-black">{exams.filter(e=>hasTakenExam(e.id)).length}/{exams.length}</p>
                <p className="text-[11px] text-white/40">آزمون‌ها</p>
              </div>
            </div>
            <PersianCalendar/>
            <h3 className="font-bold mt-6 mb-3 text-white/70 text-sm">آزمون‌های موجود</h3>
            {exams.length===0&&<div className="card text-center py-10 text-white/30">آزمونی نیست</div>}
            {exams.map(ex=>{
              const taken=hasTakenExam(ex.id);
              const score=getExamScore(ex.id);
              return(
                <div key={ex.id} className={`exam-card-enhanced slide-up ${taken?'opacity-60':''}`}>
                  <h4 className="font-bold">{ex.title}</h4>
                  <p className="text-xs text-white/40 mt-1 mb-2">{ex.description||'بدون توضیحات'}</p>
                  <div className="flex gap-2 mb-3 flex-wrap">
                    <span className="badge badge-new">⏱️ {ex.duration_minutes} دقیقه</span>
                    <span className="badge badge-approved">📝 {ex.questions?.length||0} سوال</span>
                    {score&&<span className="badge badge-approved">⭐ {score.percentage}/20</span>}
                    {taken&&<span className="badge badge-taken">✓ شرکت شده</span>}
                  </div>
                  {taken?(
                    <div className="space-y-2">
                      <StarRating score={parseFloat(score.percentage)}/>
                      <button onClick={()=>setShowExamResults(ex.id)} className="btn-glass text-sm">📊 مشاهده نتایج</button>
                    </div>
                  ):(
                    <button onClick={()=>startExam(ex)} className="btn-glass text-sm">شروع آزمون 🚀</button>
                  )}
                </div>
              );
            })}
          </>
        )}
        {tab==='messages'&&<SocialChatModal user={user} onClose={()=>setTab('home')} fullScreen/>}
        {tab==='grades'&&(<div className="slide-up">
          <div className="glass p-5 mb-4"><div className="flex items-center justify-between"><div><p className="text-xs text-white/40">معدل کل</p><p className="text-4xl font-black gradient-text">{getAverage()}</p><p className="text-[10px] text-white/35 mt-1">از ۲۰</p></div><div className="w-14 h-14 rounded-2xl bg-indigo-500/15 flex items-center justify-center"><Icon d={Icons.grade} size={28} className="text-indigo-300"/></div></div></div>
          <PremiumGradeChart data={exams.filter(ex=>getExamScore(ex.id)).map(ex=>{const sc=getExamScore(ex.id);return {title:ex.title,score:Math.max(0,Math.min(20,parseFloat(sc.percentage)||0)),date:ex.created_at};}).sort((a,b)=>new Date(a.date)-new Date(b.date))}/>
          <h3 className="font-bold mt-5 mb-3 text-white/70 text-sm">ریز نمرات</h3>
          {exams.filter(ex=>getExamScore(ex.id)).length===0?<div className="card text-center py-10 text-white/30">نمره‌ای ثبت نشده</div>:exams.filter(ex=>getExamScore(ex.id)).map(ex=>{const score=getExamScore(ex.id);const st=getObjectionState(ex.id);const hasObj=answers.some(a=>String(a.exam_id)===String(ex.id)&&a.objection);const open=openObjection===ex.id;const total=Math.floor(st.remaining/1000);const hh=Math.floor(total/3600);const mm=Math.floor((total%3600)/60);const ss=total%60;return <div key={ex.id} className={`grade-list-card ${st.state==='expired'?'objection-expired':''}`}>
            <div className="flex items-center gap-3"><div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-pink-500 flex items-center justify-center font-black">{ex.title?.[0]||'آ'}</div><div className="flex-1 min-w-0"><p className="font-bold text-sm truncate">{ex.title}</p><p className="text-[11px] text-white/35">{ex.questions?.length||0} سوال</p></div><div className="grade-score-pill">{score.percentage}<small className="text-[9px] text-white/45"> / ۲۰</small></div><button className={`objection-arrow ${open?'open':''}`} onClick={()=>setOpenObjection(open?null:ex.id)}>⌄</button></div>
            {open&&<div className="objection-box mt-3">{hasObj?<p className="text-xs text-amber-300">⏳ اعتراض شما ثبت شده و در حال بررسی است.</p>:st.state==='waiting'?<p className="text-xs text-white/55">⏰ زمان اعتراض به پایان رسیده است.</p>:st.state==='active'?<><div className="flex items-center justify-between gap-3"><div><p className="text-xs text-white/45">مهلت باقی‌مانده اعتراض</p><p className="text-2xl font-black text-amber-300 font-mono">{String(hh).padStart(2,'0')}:{String(mm).padStart(2,'0')}:{String(ss).padStart(2,'0')}</p></div><button onClick={()=>{setSelectedExamForObjection(ex.id);setShowObjection(true);}} className="btn-glass btn-glass-danger btn-sm"><Icon d={Icons.alert} size={15}/> ثبت اعتراض</button></div></>:<p className="text-xs text-white/45">⏰ زمان ثبت اعتراض به اتمام رسیده است.</p>}</div>}
          </div>})}
        </div>)}
        {tab==='chart'&&(
          <>
            <div className="glass p-6 text-center mb-6 slide-up">
              <Icon d={Icons.chart} size={32} className="mx-auto mb-2 text-indigo-400"/>
              <p className="text-4xl font-black gradient-text">{getAverage()}</p>
              <p className="text-xs text-white/40">معدل کل از 20</p>
            </div>
            <PremiumGradeChart data={exams.filter(ex=>getExamScore(ex.id)).map(ex=>{const sc=getExamScore(ex.id);return {title:ex.title,score:Math.max(0,Math.min(20,parseFloat(sc.percentage)||0)),date:ex.created_at};}).sort((a,b)=>new Date(a.date)-new Date(b.date))}/>
            <div className="glass p-4 mt-4">
              <h4 className="font-bold text-sm mb-3 gradient-text"> لیست آزمون‌ها</h4>
              {exams.filter(ex=>getExamScore(ex.id)).length===0?<p className="text-center text-white/30 py-4">آزمونی ندارید</p>:
              exams.filter(ex=>getExamScore(ex.id)).map(ex=>{
                const score=getExamScore(ex.id);
                return(
                  <div key={ex.id} className="exam-list-item">
                    <div className="flex-1 min-w-0">
                      <p className="font-bold text-sm truncate">{ex.title}</p>
                      <p className="text-[11px] text-white/40">{ex.questions?.length||0} سوال</p>
                    </div>
                    <div className="exam-list-score">{parseFloat(score.percentage)}</div>
                  </div>
                );
              })}
            </div>
          </>
        )}
        {tab==='tools'&&(
          <>
            {!activeGame?(
              <>
                <div className="grid grid-cols-2 gap-3 mb-4">
                  <div className={`tool-btn calc ${toolsTab==='calc'?'active':''}`} onClick={()=>setToolsTab('calc')}>
                    <div className="tool-icon"><Icon d={Icons.calc} size={28}/></div>
                    <div className="tool-label">ماشین‌حساب</div>
                  </div>
                  <div className={`tool-btn check profile-tool-btn ${toolsTab==='profile'?'active':''}`} onClick={()=>setToolsTab('profile')}>
                    <div className="tool-icon"><Icon d={Icons.profile} size={28}/></div>
                    <div className="tool-label">پروفایل</div>
                  </div>
                  <div className={`tool-btn plan ${toolsTab==='planner'?'active':''}`} onClick={()=>setToolsTab('planner')}>
                    <div className="tool-icon"><Icon d={Icons.calendar} size={28}/></div>
                    <div className="tool-label">برنامه‌ریزی</div>
                  </div>
                  <div className={`tool-btn game ${toolsTab==='games'?'active':''}`} onClick={()=>setToolsTab('games')}>
                    <div className="tool-icon"><Icon d={Icons.game} size={28}/></div>
                    <div className="tool-label">بازی‌ها</div>
                  </div>
                </div>
                {toolsTab==='calc'&&(
                  <div className="glass-strong p-5 max-w-xs mx-auto slide-up">
                    <div className="bg-gradient-to-br from-indigo-900/40 to-purple-900/40 p-4 rounded-2xl text-3xl text-left mb-4 font-mono h-20 flex items-center justify-end border border-white/10 overflow-x-auto shadow-inner">{calcDisplay||'0'}</div>
                    <div className="grid grid-cols-4 gap-2">
                      {['7','8','9','÷','4','5','6','×','1','2','3','-','C','0','=','+'].map(b=>(
                        <button key={b} onClick={()=>calcPress(b)} className={`btn-glass h-14 text-lg font-bold ${['÷','×','-','+'].includes(b)?'bg-indigo-600/30 border-indigo-500/30 text-indigo-300':''} ${b==='='?'btn-glass-success':''} ${b==='C'?'btn-glass-danger':''}`}>{b}</button>
                      ))}
                    </div>
                  </div>
                )}
                {toolsTab==='profile'&&(<div className="slide-up"><ProfileEditor user={user} onSaved={()=>{}}/></div>)}
                {toolsTab==='planner'&&(
                  <div className="space-y-3 slide-up">
                    <div className="glass p-4 space-y-3">
                      <select className="glass-input" value={newPlan.day} onChange={e=>setNewPlan({...newPlan,day:e.target.value})}>{['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'].map(d=><option key={d}>{d}</option>)}</select>
                      <input className="glass-input" placeholder="درس (مثال: ریاضی)" value={newPlan.subject} onChange={e=>setNewPlan({...newPlan,subject:e.target.value})}/>
                      <input className="glass-input" placeholder="ساعت (مثال: 16-18)" value={newPlan.time} onChange={e=>setNewPlan({...newPlan,time:e.target.value})}/>
                      <button onClick={addPlan} className="btn-glass btn-glass-success text-sm">افزودن به برنامه</button>
                    </div>
                    {studyPlans.length===0&&<p className="text-center text-white/30 py-4">برنامه‌ای نیست</p>}
                    {studyPlans.map(p=>(
                      <div key={p.id} className="glass p-3 flex items-center justify-between">
                        <div><span className="badge badge-new mb-1">{p.day_of_week}</span><p className="font-bold text-sm">{p.subject}</p><p className="text-[11px] text-white/40">{p.time_range}</p></div>
                        <button onClick={()=>deletePlan(p.id)} className="text-red-400/60"><Icon d={Icons.trash} size={16}/></button>
                      </div>
                    ))}
                  </div>
                )}
                {toolsTab==='games'&&(
                  <div className="slide-up">
                    <h3 className="font-bold mb-3 text-white/70 text-sm">بازی‌های موجود</h3>
                    <div className="grid grid-cols-1 gap-3">
                      <div className="game-card" onClick={()=>setActiveGame('xo')}>
                        <div className="game-card-icon bg-gradient-to-br from-indigo-500 to-purple-500">⭕</div>
                        <h4 className="font-bold text-sm">دوز</h4>
                        <p className="text-[10px] text-white/40 mt-1">آنلاین</p>
                      </div>
                      <div className="game-card" onClick={()=>setActiveGame('snake')}><div className="game-card-icon bg-gradient-to-br from-emerald-500 to-cyan-500">🐍</div><h4 className="font-bold text-sm">مار و پله</h4><p className="text-[10px] text-white/40 mt-1">آنلاین</p></div><div className="game-card" onClick={()=>setActiveGame('breakout')}>
                        <div className="game-card-icon bg-gradient-to-br from-emerald-500 to-teal-500">🎯</div>
                        <h4 className="font-bold text-sm">توپ و راکت</h4>
                        <p className="text-[10px] text-white/40 mt-1">آفلاین</p>
                      </div>
                      <div className="game-card" onClick={()=>setActiveGame('penalty')}><div className="game-card-icon bg-gradient-to-br from-red-500 to-amber-500">⚽</div><h4 className="font-bold text-sm">پنالتی</h4><p className="text-[10px] text-white/40 mt-1">آنلاین</p></div>

                    </div>
                  </div>
                )}
              </>
            ):(
              <div className="slide-up">
                <div className="flex justify-between items-center mb-4">
                  <button onClick={()=>setActiveGame(null)} className="btn-glass btn-sm flex items-center gap-2"><Icon d={Icons.arrowLeft} size={16}/>بازگشت</button>
                  <h3 className="font-bold gradient-text text-lg">{activeGame==='xo'&&'دوز'}{activeGame==='snake'&&'مار و پله'}{activeGame==='breakout'&&'توپ و راکت'}{activeGame==='penalty'&&'پنالتی'}</h3>
                  <div className="w-20"></div>
                </div>
                {activeGame==='xo'&&<XOGameHub user={user}/>}
                {activeGame==='snake'&&<SnakeGame user={user} students={[]} isAdmin={false}/>}
                {activeGame==='breakout'&&<BreakoutGame user={user}/>}
                {activeGame==='penalty'&&<PenaltyGame user={user} roomId={penaltyRoomId}/>}
              </div>
            )}
          </>
        )}
      </div>
      <div className="nav-bar">
        <div className={`nav-item ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==='messages'?'active':''}`} onClick={()=>{setTab('messages');setShowChat(false);}}><span className="relative"><Icon d={Icons.message}/>{unreadCount>0&&<span className="message-home-badge">{unreadCount>99?'99+':unreadCount}</span>}</span><span>پیام‌رسان</span></div>
        <div className={`nav-item ${tab==='grades'?'active':''}`} onClick={()=>setTab('grades')}><Icon d={Icons.grade}/><span>کارنامه</span></div>
        <div className={`nav-item ${tab==='tools'?'active':''}`} onClick={()=>{setTab('tools');setToolsTab('calc');setActiveGame(null);}}><Icon d={Icons.list}/><span>ابزارها</span></div>
      </div>
      {showChat&&<SocialChatModal user={user} onClose={()=>setShowChat(false)} fullScreen/>}
      {showPasswordModal&&<PasswordModal user={user} onClose={()=>setShowPasswordModal(false)}/>}
      {showObjection&&(
        <div className="modal-overlay" onClick={()=>setShowObjection(null)}>
          <div className="glass-strong w-full max-w-md p-6 slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4"><h3 className="font-bold gradient-text">اعتراض به آزمون</h3><button onClick={()=>setShowObjection(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button></div>
            <div className="bg-amber-500/10 border border-amber-500/20 rounded-xl p-3 mb-4 text-xs text-amber-300">
              ⚠️ دانش‌آموز گرامی، فقط یکبار می‌توانید به نمره خود اعتراض بزنید و نتیجه شما ممکن است بدون تغییر یا افزایش و یا کاهش باشد.
            </div>
            <textarea className="glass-input mb-4" placeholder="دلیل اعتراض..." value={objectionText} onChange={e=>setObjectionText(e.target.value)} rows="4"/>
            <button onClick={submitObjection} className="btn-glass btn-glass-danger flex items-center justify-center gap-2"><Icon d={Icons.send} size={16}/>ارسال به مدیر</button>
          </div>
        </div>
      )}
      {showExamResults&&(
        <div className="modal-overlay" onClick={()=>setShowExamResults(null)}>
          <div className="glass-strong w-full max-w-lg p-6 max-h-[85vh] overflow-y-auto slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="font-bold gradient-text"> نتایج آزمون</h3>
              <button onClick={()=>setShowExamResults(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button>
            </div>
            {(()=>{
              const exam=exams.find(e=>e.id===showExamResults);
              if(!exam)return null;
              const score=getExamScore(exam.id);
              const examAnswers=answers.filter(a=>a.exam_id===exam.id);
              return(
                <>
                  <div className="glass p-4 mb-4 text-center bg-gradient-to-br from-indigo-500/10 to-pink-500/10">
                    <h4 className="font-bold mb-2">{exam.title}</h4>
                    <StarRating score={parseFloat(score.percentage)}/>
                    <p className="text-4xl font-black gradient-text mt-2">{score.percentage}/20</p>
                    <p className="text-xs text-white/40 mt-1">{score.totalScore} از {score.maxScore}</p>
                  </div>
                  <h4 className="font-bold text-sm mb-3 text-white/70">جزئیات سوالات:</h4>
                  {examAnswers.map((a,idx)=>{
                    const q=exam.questions.find(qq=>qq.id===a.question_id);
                    if(!q)return null;
                    const isCorrect=q.q_type==='test'&&q.correct_opt&&a.student_answer===q.correct_opt;
                    const isWrong=q.q_type==='test'&&q.correct_opt&&a.student_answer&&a.student_answer!==q.correct_opt;
                    return(
                      <div key={a.id} className={`glass p-3 mb-2 ${isWrong?'border-red-500/30':isCorrect?'border-emerald-500/30':''}`}>
                        <div className="flex justify-between items-start mb-2">
                          <span className="text-xs text-white/40">سوال {idx+1}</span>
                          <span className={`badge ${a.status==='graded'?'badge-approved':'badge-pending'}`}>{a.status==='graded'?'✓ تصحیح شده':'⏳ در انتظار تصحیح مدیر'}</span>
                        </div>
                        <p className="text-sm mb-2">{q.q_text}</p>
                        {q.q_type==='test'&&q.correct_opt?(
                          <div className="space-y-1 text-xs">
                            {isWrong&&(
                              <>
                                <div className="bg-red-500/10 border border-red-500/20 rounded-lg p-2"><span className="text-red-300">❌ پاسخ شما: {a.student_answer}</span></div>
                                <div className="bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-2"><span className="text-emerald-300">✓ پاسخ صحیح: {q.correct_opt}</span></div>
                              </>
                            )}
                            {isCorrect&&<div className="bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-2"><span className="text-emerald-300">✓ پاسخ صحیح: {a.student_answer}</span></div>}
                          </div>
                        ):(
                          <div className="text-xs">
                            <p className="text-white/40 mb-1">پاسخ شما:</p>
                            <p className="bg-white/5 p-2 rounded">{a.student_answer||'بدون پاسخ'}</p>
                          </div>
                        )}
                        <div className="flex justify-between items-center mt-2 pt-2 border-t border-white/5">
                          <span className="text-xs text-white/40">نمره سوال: {q.score||1}</span>
                          <span className="text-sm font-bold gradient-text">کسب شده: {a.score||0}</span>
                        </div>
                      </div>
                    );
                  })}
                </>
              );
            })()}
          </div>
        </div>
      )}
    </div>
    </>
  );
}

function App(){
  const [user,setUser]=useState(null);
  const [view,setView]=useState('login');
  const [tab,setTab]=useState('home');
  useEffect(()=>{
    const s=sessionStorage.getItem('edu_user');
    if(s){const u=JSON.parse(s);setUser(u);setView(u.role);SB.from('users').update({last_seen_at:new Date().toISOString()}).eq('id',u.id).then(()=>{}).catch(()=>{});}
  },[]);
  useEffect(()=>{
    if(!user?.id)return;
    const touch=()=>SB.from('users').update({last_seen_at:new Date().toISOString()}).eq('id',user.id).then(()=>{}).catch(()=>{});
    touch();
    const timer=setInterval(touch,60000);
    return()=>clearInterval(timer);
  },[user?.id]);
  const login=async(un,pw)=>{
    const {data,error}=await SB.from('users').select('*').eq('username',un.toUpperCase()).eq('password',pw).limit(1);const account=Array.isArray(data)?data[0]:data;if(error){console.error(error);return false;}
    if(account){const seen=new Date().toISOString();SB.from('users').update({last_seen_at:seen}).eq('id',account.id).then(()=>{}).catch(()=>{});account.last_seen_at=seen;setUser(account);sessionStorage.setItem('edu_user',JSON.stringify(account));setView(account.role);return true;}
    return false;
  };
  const logout=()=>{setUser(null);setView('login');setTab('home');sessionStorage.removeItem('edu_user');};
  if(view==='login') return <Login onLogin={login}/>;
  if(view==='admin') return <Admin user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
  return <Student user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
}

function AppWrapper(){
  return(<ToastProvider><App/></ToastProvider>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppWrapper/>);
</script>
<svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden;pointer-events:none"><defs>
<linearGradient id="xGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient>
<linearGradient id="oGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#fb923c"/></linearGradient>
<linearGradient id="countdownGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
<linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient>
</defs></svg>
</body>
</html>
