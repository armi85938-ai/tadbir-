const SNAKES={99:54,70:55,52:42,25:2,95:75,87:36,62:19,17:7};
const LADDERS={3:22,8:30,21:42,28:76,36:44,51:67,71:91,80:100};

function SnakesLaddersHub({user,onBack}){
  const [playersList,setPlayersList]=useState([]);
  const [pendingRequests,setPendingRequests]=useState([]);
  const [myRequests,setMyRequests]=useState([]);
  const [showNotification,setShowNotification]=useState(null);
  const [requestTimers,setRequestTimers]=useState({});
  const [activeGame,setActiveGame]=useState(null);
  const [playerCount,setPlayerCount]=useState(2);
  const toast=useToast();

  useEffect(()=>{
    loadPlayers();
    loadPendingRequests();
    loadMyRequests();
    const sub=SB.channel('sl-requests-'+user.id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'snakes_ladders_requests',filter:`to_user=eq.${user.id}`},(payload)=>{
        loadPendingRequests();
        const newReq=payload.new;
        startRequestCountdown(newReq.id,120);
        setShowNotification({id:newReq.id,fromUserId:newReq.from_user,roomId:newReq.room_id});
        toast('🎲 درخواست بازی مار و پله!','success');
      })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'snakes_ladders_requests',filter:`from_user=eq.${user.id}`},(payload)=>{
        if(payload.new.status==='accepted'){
          setActiveGame(payload.new.room_id);
          toast(' بازی شروع شد!','success');
        }else{
          toast(payload.new.status==='expired'?'⏰ زمان درخواست تمام شد':'❌ درخواست رد شد','warning');
        }
        loadMyRequests();
      })
      .subscribe();
    return()=>{SB.removeChannel(sub);};
  },[]);

  const startRequestCountdown=(requestId,duration)=>{
    const interval=setInterval(async()=>{
      const {data:req}=await SB.from('snakes_ladders_requests').select('*').eq('id',requestId).single();
      if(!req||req.status!=='pending'){clearInterval(interval);return;}
      const elapsed=Math.floor((Date.now()-new Date(req.created_at).getTime())/1000);
      const remaining=duration-elapsed;
      if(remaining<=0){
        await SB.from('snakes_ladders_requests').update({status:'expired'}).eq('id',requestId);
        clearInterval(interval);
        setRequestTimers(t=>{const n={...t};delete n[requestId];return n;});
        toast(' زمان درخواست تمام شد','warning');
      }else{
        setRequestTimers(t=>({...t,[requestId]:remaining}));
      }
    },1000);
  };

  const loadPlayers=async()=>{
    const {data:students}=await SB.from('users').select('id,full_name,username').eq('role','student').neq('id',user.id);
    const {data:admins}=await SB.from('users').select('id,full_name,username').eq('role','admin');
    setPlayersList([...(students||[]),...(admins||[])]);
  };

  const loadPendingRequests=async()=>{
    const {data}=await SB.from('snakes_ladders_requests').select('*,from_user_data:users!snakes_ladders_requests_from_user_fkey(full_name,username)').eq('to_user',user.id).eq('status','pending');
    if(data){
      setPendingRequests(data);
      data.forEach(req=>{
        const elapsed=Math.floor((Date.now()-new Date(req.created_at).getTime())/1000);
        const remaining=Math.max(0,120-elapsed);
        if(remaining>0)setRequestTimers(t=>({...t,[req.id]:remaining}));
      });
    }
  };

  const loadMyRequests=async()=>{
    const {data}=await SB.from('snakes_ladders_requests').select('*,to_user_data:users!snakes_ladders_requests_to_user_fkey(full_name,username)').eq('from_user',user.id).eq('status','pending');
    if(data)setMyRequests(data);
  };

  const sendRequest=async(toUserId)=>{
    const {data:existingReq}=await SB.from('snakes_ladders_requests').select('id').eq('from_user',user.id).eq('to_user',toUserId).eq('status','pending').maybeSingle();
    if(existingReq){toast('⚠️ قبلاً درخواست فرستادی','warning');return;}
    const {data:room,error:rErr}=await SB.from('snakes_ladders_rooms').insert({player1:user.id,status:'waiting'}).select().single();
    if(rErr){toast('خطا: '+rErr.message,'error');return;}
    const {error:reqErr}=await SB.from('snakes_ladders_requests').insert({from_user:user.id,to_user:toUserId,room_id:room.id,status:'pending'});
    if(reqErr){await SB.from('snakes_ladders_rooms').delete().eq('id',room.id);toast('خطا: '+reqErr.message,'error');return;}
    toast('✅ درخواست بازی ارسال شد','success');
    loadMyRequests();
  };

  const acceptRequest=async(request)=>{
    await SB.from('snakes_ladders_rooms').update({player2:user.id,status:'playing',current_turn:request.from_user}).eq('id',request.room_id);
    await SB.from('snakes_ladders_requests').update({status:'accepted'}).eq('id',request.id);
    setActiveGame(request.room_id);
    setShowNotification(null);
    setRequestTimers(t=>{const n={...t};delete n[request.id];return n;});
    toast('🎮 بازی شروع شد!','success');
  };

  const rejectRequest=async(request)=>{
    await SB.from('snakes_ladders_requests').update({status:'rejected'}).eq('id',request.id);
    await SB.from('snakes_ladders_rooms').delete().eq('id',request.room_id);
    loadPendingRequests();
    setShowNotification(null);
    setRequestTimers(t=>{const n={...t};delete n[request.id];return n;});
    toast('درخواست رد شد','warning');
  };

  const cancelRequest=async(request)=>{
    await SB.from('snakes_ladders_requests').update({status:'rejected'}).eq('id',request.id);
    await SB.from('snakes_ladders_rooms').delete().eq('id',request.room_id);
    loadMyRequests();
    toast('درخواست لغو شد','warning');
  };

  if(activeGame){
    return <SnakesLaddersBoard user={user} roomId={activeGame} onExit={()=>setActiveGame(null)}/>;
  }

  return(
    <div className="slide-up">
      <div className="xo-mode-selection mb-4">
        <div className="flex justify-between items-center mb-4">
          <button onClick={onBack} className="btn-glass btn-sm flex items-center gap-2"><Icon d={Icons.arrowLeft} size={16}/>بازگشت</button>
          <h3 className="font-bold gradient-text text-lg">🐍 مار و پله</h3>
          <div className="w-20"></div>
        </div>

        <div className="glass p-4 mb-4">
          <h4 className="font-bold text-sm mb-3 text-indigo-400">👥 تعداد بازیکنان</h4>
          <div className="flex gap-2">
            <button onClick={()=>setPlayerCount(2)} className={`btn-glass btn-sm flex-1 ${playerCount===2?'btn-glass-success':''}`}> نفره</button>
            <button onClick={()=>setPlayerCount(3)} className={`btn-glass btn-sm flex-1 ${playerCount===3?'btn-glass-success':''}`}>۳ نفره</button>
          </div>
        </div>

        {pendingRequests.length>0&&(
          <div className="glass p-4 mb-4">
            <h4 className="font-bold text-sm mb-3 text-pink-400">🔔 درخواست‌های دریافتی</h4>
            {pendingRequests.map(r=>(
              <div key={r.id} className="bg-white/5 rounded-xl p-3 mb-2">
                <div className="flex items-center gap-3 mb-2">
                  <div className="w-10 h-10 rounded-full bg-gradient-to-br from-pink-500 to-rose-500 flex items-center justify-center font-bold">{r.from_user_data?.full_name?.[0]}</div>
                  <div><p className="font-bold text-sm">{r.from_user_data?.full_name}</p><p className="text-[11px] text-white/40">دعوت به بازی مار و پله 🎲</p></div>
                </div>
                <div className="flex gap-2">
                  <button onClick={()=>acceptRequest(r)} className="btn-glass btn-glass-success btn-sm flex-1">✓ قبول</button>
                  <button onClick={()=>rejectRequest(r)} className="btn-glass btn-glass-danger btn-sm flex-1">✗ رد</button>
                </div>
              </div>
            ))}
          </div>
        )}

        {myRequests.length>0&&(
          <div className="glass p-4 mb-4">
            <h4 className="font-bold text-sm mb-3 text-amber-400">⏳ در انتظار پاسخ</h4>
            {myRequests.map(r=>(
              <div key={r.id} className="bg-white/5 rounded-xl p-3 mb-2 flex items-center justify-between">
                <div><p className="font-bold text-sm">{r.to_user_data?.full_name}</p><p className="text-[11px] text-white/40">در انتظار پاسخ...</p></div>
                <button onClick={()=>cancelRequest(r)} className="btn-glass btn-glass-danger btn-sm">لغو</button>
              </div>
            ))}
          </div>
        )}

        <div className="glass p-4">
          <h4 className="font-bold text-sm mb-3 text-indigo-400">👥 ارسال درخواست</h4>
          {playersList.length===0?<p className="text-center text-white/30 py-4">کاربر دیگری نیست</p>:
          playersList.map(p=>(
            <div key={p.id} className="bg-white/5 rounded-xl p-3 mb-2 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center font-bold">{p.full_name[0]}</div>
                <div><p className="font-bold text-sm">{p.full_name}</p><p className="text-[11px] text-white/40">@{p.username}</p></div>
              </div>
              <button onClick={()=>sendRequest(p.id)} className="btn-glass btn-sm">🎲 دعوت</button>
            </div>
          ))}
        </div>
      </div>

      {showNotification&&(
        <div className="game-request-notification">
          <div className="flex items-center gap-3 mb-3">
            <div className="w-12 h-12 rounded-full bg-gradient-to-br from-pink-500 to-rose-500 flex items-center justify-center text-2xl">🎲</div>
            <div className="flex-1"><p className="font-bold text-sm">درخواست بازی مار و پله!</p><p className="text-[11px] text-white/50">یه دوست می‌خواد باهات بازی کنه</p></div>
          </div>
          <div className="countdown-ring">
            <svg width="80" height="80">
              <defs><linearGradient id="slCountdownGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stopColor="#10b981"/><stop offset="100%" stopColor="#ef4444"/></linearGradient></defs>
              <circle className="bg" cx="40" cy="40" r="36"/>
              <circle className="progress" cx="40" cy="40" r="36" stroke="url(#slCountdownGradient)" strokeDasharray={226} strokeDashoffset={226-(requestTimers[showNotification.id]||0)/120*226}/>
            </svg>
            <div className="countdown-text">{requestTimers[showNotification.id]||0}</div>
          </div>
          <p className="text-center text-xs text-white/40 mb-3">ثانیه فرصت داری</p>
          <div className="flex gap-2">
            <button onClick={()=>{const req=pendingRequests.find(r=>r.id===showNotification.id);if(req)acceptRequest(req);}} className="btn-glass btn-glass-success btn-sm flex-1">✓ قبول</button>
            <button onClick={()=>{const req=pendingRequests.find(r=>r.id===showNotification.id);if(req)rejectRequest(req);}} className="btn-glass btn-glass-danger btn-sm flex-1"> رد</button>
          </div>
        </div>
      )}
    </div>
  );
}

function SnakesLaddersBoard({user,roomId,onExit}){
  const [room,setRoom]=useState(null);
  const [diceValue,setDiceValue]=useState(1);
  const [isRolling,setIsRolling]=useState(false);
  const [message,setMessage]=useState('');
  const toast=useToast();

  useEffect(()=>{
    loadRoom();
    const channel=SB.channel('sl-room-'+roomId)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'snakes_ladders_rooms',filter:`id=eq.${roomId}`},(payload)=>{
        setRoom(payload.new);
        if(payload.new.winner){
          const isWinner=payload.new.winner===user.id;
          toast(isWinner?'🏆 تبریک! شما برنده شدید!':'😔 شما باختید!',isWinner?'success':'warning');
        }
      })
      .subscribe();
    return()=>{SB.removeChannel(channel);};
  },[roomId]);

  const loadRoom=async()=>{
    const {data}=await SB.from('snakes_ladders_rooms').select('*,player1_data:users!snakes_ladders_rooms_player1_fkey(full_name),player2_data:users!snakes_ladders_rooms_player2_fkey(full_name),player3_data:users!snakes_ladders_rooms_player3_fkey(full_name)').eq('id',roomId).single();
    if(data){
      setRoom(data);
      if(!data.current_turn){
        await SB.from('snakes_ladders_rooms').update({current_turn:data.player1}).eq('id',roomId);
      }
    }
  };

  const rollDice=async()=>{
    if(!room||isRolling)return;
    if(room.current_turn!==user.id){setMessage('⏳ نوبت حریف است');return;}
    if(room.winner){setMessage('🏁 بازی تمام شده');return;}
    
    setIsRolling(true);
    setMessage('🎲 در حال پرتاب تاس...');
    
    let rolls=0;
    const rollInterval=setInterval(()=>{
      setDiceValue(Math.floor(Math.random()*6)+1);
      rolls++;
      if(rolls>=10){
        clearInterval(rollInterval);
        const finalValue=Math.floor(Math.random()*6)+1;
        setDiceValue(finalValue);
        setIsRolling(false);
        movePlayer(finalValue);
      }
    },100);
  };

  const movePlayer=async(dice)=>{
    const isPlayer1=room.player1===user.id;
    const isPlayer2=room.player2===user.id;
    const isPlayer3=room.player3===user.id;
    
    let currentPos=0;
    let posField='';
    if(isPlayer1){currentPos=room.player1_position||0;posField='player1_position';}
    else if(isPlayer2){currentPos=room.player2_position||0;posField='player2_position';}
    else if(isPlayer3){currentPos=room.player3_position||0;posField='player3_position';}
    
    let newPos=currentPos+dice;
    
    if(newPos>100){
      setMessage(`🎲 تاس ${dice} آمد - باید دقیقاً به ۰۰ برسی! نوبت بعدی`);
      await switchTurn();
      return;
    }
    
    let moveMessage=`🎲 تاس ${dice} آمد - از ${currentPos} به ${newPos}`;
    
    if(SNAKES[newPos]){
      const snakeEnd=SNAKES[newPos];
      moveMessage+=` 🐍 مار! از ${newPos} به ${snakeEnd}`;
      newPos=snakeEnd;
    }else if(LADDERS[newPos]){
      const ladderEnd=LADDERS[newPos];
      moveMessage+=` 🪜 نردبان! از ${newPos} به ${ladderEnd}`;
      newPos=ladderEnd;
    }
    
    if(newPos===100){
      moveMessage+=' 🏆 برنده شدی!';
      await SB.from('snakes_ladders_rooms').update({[posField]:newPos,winner:user.id,status:'finished'}).eq('id',roomId);
      setMessage(moveMessage);
      return;
    }
    
    setMessage(moveMessage);
    await SB.from('snakes_ladders_rooms').update({[posField]:newPos}).eq('id',roomId);
    await switchTurn();
  };

  const switchTurn=async()=>{
    const players=[room.player1,room.player2,room.player3].filter(p=>p);
    const currentIndex=players.indexOf(room.current_turn);
    const nextIndex=(currentIndex+1)%players.length;
    await SB.from('snakes_ladders_rooms').update({current_turn:players[nextIndex]}).eq('id',roomId);
  };

  const exitGame=async()=>{
    await SB.from('snakes_ladders_rooms').delete().eq('id',roomId);
    onExit();
  };

  if(!room)return <div className="text-center py-10 text-white/40">در حال بارگذاری...</div>;

  const players=[
    {id:room.player1,name:room.player1_data?.full_name||'بازیکن ۱',pos:room.player1_position||0,color:'p1'},
    {id:room.player2,name:room.player2_data?.full_name||'بازیکن ۲',pos:room.player2_position||0,color:'p2'},
  ];
  if(room.player3)players.push({id:room.player3,name:room.player3_data?.full_name||'بازیکن ۳',pos:room.player3_position||0,color:'p3'});
  
  const isMyTurn=room.current_turn===user.id;

  const getCellNumber=(row,col)=>{
    const rowFromBottom=9-row;
    if(rowFromBottom%2===0)return rowFromBottom*10+col+1;
    else return rowFromBottom*10+(9-col)+1;
  };

  const renderDiceFace=(value)=>{
    const patterns={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
    return(
      <div className="sl-dice-face">
        {[0,1,2,3,4,5,6,7,8].map(i=>(
          <div key={i} className={`w-3 h-3 rounded-full ${patterns[value].includes(i)?'bg-gray-800':'bg-transparent'}`}></div>
        ))}
      </div>
    );
  };

  return(
    <div className="slide-up">
      <div className="xo-mode-selection">
        <div className="flex justify-between items-center mb-4">
          <button onClick={exitGame} className="btn-glass btn-glass-danger btn-sm"> خروج</button>
          <h3 className="font-bold gradient-text text-lg"> مار و پله</h3>
          <div className="w-20"></div>
        </div>

        <div className={`grid ${players.length===3?'grid-cols-3':'grid-cols-2'} gap-2 mb-4`}>
          {players.map(p=>(
            <div key={p.id} className={`score-card-pro ${isMyTurn&&p.id===user.id?'active':''}`}>
              <p className="text-[11px] text-white/40 mb-1">{p.name}</p>
              <p className="score-value">{p.pos||'استارت'}</p>
            </div>
          ))}
        </div>

        {message&&<div className="glass p-3 mb-4 text-center text-sm font-bold gradient-text">{message}</div>}

        <div className="relative bg-black/30 rounded-2xl p-2 mb-4">
          <div className="sl-board">
            {Array.from({length:10},(_,row)=>
              Array.from({length:10},(_,col)=>{
                const cellNum=getCellNumber(row,col);
                const isStart=cellNum===1;
                const isEnd=cellNum===100;
                const isSnakeHead=SNAKES[cellNum];
                const isLadderBottom=LADDERS[cellNum];
                let cellClass='sl-cell';
                if(isStart)cellClass+=' start';
                else if(isEnd)cellClass+=' end';
                else if(isSnakeHead)cellClass+=' snake-head';
                else if(isLadderBottom)cellClass+=' ladder-bottom';
                return(
                  <div key={`${row}-${col}`} className={cellClass}>
                    <span className="text-[8px] opacity-60">{cellNum}</span>
                    {players.map(p=>p.pos===cellNum&&<div key={p.id} className={`sl-piece ${p.color}`}></div>)}
                  </div>
                );
              })
            )}
          </div>
        </div>

        <div className="flex items-center justify-center gap-4 mb-4">
          <div className={`sl-dice ${isRolling?'rolling':''}`} onClick={isMyTurn&&!room.winner?rollDice:undefined}>
            {renderDiceFace(diceValue)}
          </div>
        </div>

        {!isMyTurn&&!room.winner&&<div className="text-center text-amber-400 text-sm font-bold mb-4">⏳ نوبت {players.find(p=>p.id===room.current_turn)?.name} است</div>}

        {room.winner&&<div className="text-center">
          <div className="text-4xl mb-2">🏆</div>
          <p className="font-bold gradient-text text-lg mb-4">{room.winner===user.id?'تبریک! شما برنده شدید!':`${players.find(p=>p.id===room.winner)?.name} برنده شد!`}</p>
          <button onClick={exitGame} className="btn-glass btn-sm">خروج از بازی</button>
        </div>}

        <div className="glass p-3 mt-4 text-xs">
          <p className="font-bold mb-2">🐍 مارها: {Object.entries(SNAKES).map(([k,v])=>`${k}→${v}`).join(' | ')}</p>
          <p className="font-bold"> نردبان‌ها: {Object.entries(LADDERS).map(([k,v])=>`${k}→${v}`).join(' | ')}</p>
        </div>
      </div>
    </div>
  );
}

// ===== Chat Modal =====
function ChatModal({user,onClose}){
  const [messages,setMessages]=useState([]);
  const [chatText,setChatText]=useState('');
  const toast=useToast();
  const messagesEndRef=useRef(null);

  useEffect(()=>{
    loadMessages();
    const sub=SB.channel('chat-'+user.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'messages'},()=>{loadMessages();})
      .subscribe();
    return()=>{SB.removeChannel(sub);};
  },[]);

  useEffect(()=>{messagesEndRef.current?.scrollIntoView({behavior:'smooth'});},[messages]);

  const loadMessages=async()=>{
    const {data:admins}=await SB.from('users').select('id').eq('role','admin').limit(1);
    if(!admins||!admins.length)return;
    const aid=admins[0].id;
    const {data}=await SB.from('messages').select('*').or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`).order('created_at',{ascending:true});
    if(data)setMessages(data.filter(m=>m.sender_id===aid||m.receiver_id===aid));
  };

  const sendMessage=async()=>{
    if(!chatText.trim())return;
    const {data:admins}=await SB.from('users').select('id').eq('role','admin').limit(1);
    if(!admins||!admins.length)return;
    await SB.from('messages').insert({sender_id:user.id,receiver_id:admins[0].id,content:chatText.trim(),reactions:{}});
    setChatText('');
  };

  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="glass-strong w-full max-w-md h-[75vh] flex flex-col p-4 slide-up" onClick={e=>e.stopPropagation()}>
        <div className="flex justify-between items-center mb-3 pb-2 border-b border-white/5">
          <h3 className="font-bold gradient-text">💬 گفتگو با مدیر</h3>
          <button onClick={onClose} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button>
        </div>
        <div className="flex-1 overflow-y-auto mb-3 space-y-2">
          {messages.length===0&&<p className="text-center text-white/30 mt-10">هنوز پیامی نداده‌اید 💬</p>}
          {messages.map(m=>{
            const isMe=m.sender_id===user.id;
            return(
              <div key={m.id} className={`relative ${isMe?'flex flex-col items-end':'flex flex-col items-start'}`}>
                <div className={`chat-bubble ${isMe?'me':'other'}`}><div>{m.content}</div></div>
              </div>
            );
          })}
          <div ref={messagesEndRef}></div>
        </div>
        <div className="flex gap-2">
          <input className="glass-input flex-1 text-sm" placeholder="پیام خود را بنویسید..." value={chatText} onChange={e=>setChatText(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')sendMessage();}}/>
          <button onClick={sendMessage} className="btn-glass btn-glass-success btn-sm"><Icon d={Icons.send} size={16}/></button>
        </div>
      </div>
    </div>
  );
}

function PasswordModal({onClose,user}){
  const [newPw,setNewPw]=useState('');
  const [confirmPw,setConfirmPw]=useState('');
  const [loading,setLoading]=useState(false);
  const toast=useToast();

  const handleSubmit=async()=>{
    if(newPw.length<4){toast('رمز باید حداقل ۴ کاراکتر باشد','error');return;}
    if(newPw!==confirmPw){toast('رمز و تکرارش یکسان نیستند','error');return;}
    setLoading(true);
    const {error}=await SB.from('users').update({password:newPw}).eq('id',user.id);
    setLoading(false);
    if(error){toast('خطا: '+error.message,'error');return;}
    const u={...user,password:newPw};
    sessionStorage.setItem('edu_user',JSON.stringify(u));
    toast('✅ رمز عبور تغییر کرد','success');
    onClose();
  };

  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="glass-strong w-full max-w-md p-6 slide-up" onClick={e=>e.stopPropagation()}>
        <div className="flex justify-between items-center mb-4">
          <h3 className="font-bold gradient-text">🔐 تغییر رمز عبور</h3>
          <button onClick={onClose} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button>
        </div>
        <div className="space-y-3">
          <div><label className="text-xs text-white/60 mb-2 block font-semibold">رمز جدید</label><input className="glass-input" type="password" placeholder="حداقل ۴ کاراکتر" value={newPw} onChange={e=>setNewPw(e.target.value)}/></div>
          <div><label className="text-xs text-white/60 mb-2 block font-semibold">تکرار رمز</label><input className="glass-input" type="password" placeholder="تکرار رمز جدید" value={confirmPw} onChange={e=>setConfirmPw(e.target.value)}/></div>
          <button onClick={handleSubmit} className="btn-glass btn-glass-success" disabled={loading}>{loading?'در حال تغییر...':'✓ تغییر رمز'}</button>
        </div>
      </div>
    </div>
  );
}

function Admin({user,tab,setTab,onLogout}){
  const [exams,setExams]=useState([]);
  const [students,setStudents]=useState([]);
  const [answers,setAnswers]=useState([]);
  const [modal,setModal]=useState(null);
  const [step,setStep]=useState(1);
  const [formData,setFormData]=useState({hours:'',minutes:''});
  const [questions,setQuestions]=useState([]);
  const [loading,setLoading]=useState(false);
  const [subTab,setSubTab]=useState('list');
  const [messages,setMessages]=useState([]);
  const [replyText,setReplyText]=useState('');
  const [selectedChat,setSelectedChat]=useState(null);
  const [showExamResults,setShowExamResults]=useState(null);
  const [showPasswordModal,setShowPasswordModal]=useState(false);
  const toast=useToast();

  useEffect(()=>{loadAll();},[]);

  const loadAll=async()=>{
    const {data:e}=await SB.from('exams').select('*,questions(*)').order('created_at',{ascending:false});
    const {data:s}=await SB.from('users').select('*').eq('role','student');
    const {data:a}=await SB.from('answers').select('*,users(full_name,username),exams(title),questions(q_text,q_type,correct_opt,score)');
    if(e)setExams(e);if(s)setStudents(s);if(a)setAnswers(a);
    const {data:m}=await SB.from('messages').select('*,sender:sender_id(full_name,username),receiver:receiver_id(full_name,username)').order('created_at',{ascending:false});
    if(m)setMessages(m);
  };

  const createExam=async()=>{
    if(!formData.title){toast('عنوان آزمون را وارد کنید','error');return;}
    if(questions.length===0){toast('حداقل یک سوال اضافه کنید','error');return;}
    const hours=parseInt(formData.hours)||0;const minutes=parseInt(formData.minutes)||0;
    if(hours===0&&minutes===0){toast('مدت زمان را مشخص کنید','error');return;}
    setLoading(true);
    const duration=hours*60+minutes;
    const {data:exam,error}=await SB.from('exams').insert({title:formData.title,description:formData.desc||'',duration_minutes:duration,assigned_to:formData.assigned||'all',created_by:user.id}).select().single();
    if(error){toast('خطا: '+error.message,'error');setLoading(false);return;}
    for(const q of questions){await SB.from('questions').insert({exam_id:exam.id,q_text:q.q_text,opt_a:q.opt_a||null,opt_b:q.opt_b||null,opt_c:q.opt_c||null,opt_d:q.opt_d||null,correct_opt:q.correct_opt||null,q_type:q.q_type||'test',image_url:q.image_url||null,score:parseFloat(q.score)||1,order_num:questions.indexOf(q)});}
    setLoading(false);setModal(null);setFormData({hours:'',minutes:''});setQuestions([]);setStep(1);loadAll();
    toast('✅ آزمون ساخته شد!','success');
  };

  const addQuestion=()=>setQuestions([...questions,{q_text:'',opt_a:'',opt_b:'',opt_c:'',opt_d:'',correct_opt:'',q_type:'test',image_url:'',score:1}]);
  const updateQuestion=(i,f,v)=>{const n=[...questions];n[i][f]=v;setQuestions(n);};
  const removeQuestion=(i)=>setQuestions(questions.filter((_,x)=>x!==i));
  const deleteExam=async(id)=>{if(confirm('حذف آزمون؟')){await SB.from('exams').delete().eq('id',id);loadAll();toast('آزمون حذف شد','success');}};
  const changePassword=async(sid)=>{const p=prompt("رمز جدید:");if(p){await SB.from('users').update({password:p}).eq('id',sid);loadAll();toast('رمز تغییر کرد','success');}};
  const gradeAnswer=async(id,score)=>{
    await SB.from('answers').update({score:parseFloat(score),status:'graded',graded_at:new Date().toISOString()}).eq('id',id);
    loadAll();
    toast('✅ نمره ثبت شد','success');
  };
  const sendMessage=async()=>{if(!replyText.trim()||!selectedChat)return;await SB.from('messages').insert({sender_id:user.id,receiver_id:selectedChat.sender_id,content:replyText,reactions:{}});setReplyText('');loadAll();};
  const clearChat=async(studentId)=>{
    if(!confirm('تمام پیام‌های این دانش‌آموز حذف شود؟'))return;
    await SB.from('messages').delete().eq('sender_id',user.id).eq('receiver_id',studentId);
    await SB.from('messages').delete().eq('sender_id',studentId).eq('receiver_id',user.id);
    setSelectedChat(null);
    loadAll();
    toast('✅ تاریخچه چت پاک شد','success');
  };

  const objections=answers.filter(a=>a.objection&&a.objection.trim()!==''&&a.status!=='graded');

  const viewStudentResults=(examId)=>{
    const exam=exams.find(e=>e.id===examId);
    if(!exam)return;
    setShowExamResults({exam,answers:answers.filter(a=>a.exam_id===examId)});
  };

  const updateStudentScore=async(answerId,newScore)=>{
    await SB.from('answers').update({score:parseFloat(newScore),status:'graded',graded_at:new Date().toISOString()}).eq('id',answerId);
    loadAll();
    toast('✅ نمره ویرایش شد','success');
  };

  return(
    <div className="min-h-screen pb-24">
      <div className="header flex justify-between items-center">
        <div><h1 className="text-lg font-black gradient-text">پنل مدیریت</h1><p className="text-xs text-white/30 mt-1">{user.full_name}</p></div>
        <div className="flex gap-2">
          <button onClick={()=>setShowPasswordModal(true)} className="p-2.5 bg-white/5 rounded-xl hover:bg-white/10 transition"><Icon d={Icons.key} size={18}/></button>
          <button onClick={onLogout} className="p-2.5 bg-white/5 rounded-xl hover:bg-white/10 transition"><Icon d={Icons.logout} size={18}/></button>
        </div>
      </div>
      <div className="content">
        {tab==='home'&&(
          <>
            <div className="grid grid-cols-2 gap-3 mb-6">
              {[{icon:Icons.exam,color:'text-indigo-400',n:exams.length,l:'آزمون'},{icon:Icons.users,color:'text-sky-400',n:students.length,l:'دانش‌آموز'},{icon:Icons.grade,color:'text-emerald-400',n:answers.filter(a=>a.status==='pending').length,l:'در انتظار'},{icon:Icons.alert,color:'text-amber-400',n:objections.length,l:'اعتراض'}].map((s,i)=>(
                <div key={i} className="glass p-4 text-center slide-up" style={{animationDelay:i*0.08+'s'}}>
                  <Icon d={s.icon} size={24} className={`mx-auto mb-2 ${s.color}`}/>
                  <p className="text-2xl font-black">{s.n}</p><p className="text-[11px] text-white/40">{s.l}</p>
                </div>
              ))}
            </div>
            <button onClick={()=>{setModal('exam');setFormData({hours:'',minutes:''});setQuestions([]);setStep(1);}} className="btn-glass flex items-center justify-center gap-2 mb-6"><Icon d={Icons.plus} size={18}/>ساخت آزمون جدید</button>
            <h3 className="font-bold mb-3 text-white/70 text-sm">آزمون‌ها</h3>
            {exams.length===0&&<div className="card text-center py-10 text-white/30">آزمونی نیست</div>}
            {exams.map(ex=>(
              <div key={ex.id} className="exam-card-enhanced slide-up">
                <div className="flex justify-between items-start">
                  <div className="flex-1">
                    <h4 className="font-bold">{ex.title}</h4>
                    <p className="text-xs text-white/40 mt-1 mb-2">{ex.description||'بدون توضیحات'}</p>
                    <div className="flex gap-2 flex-wrap mb-2">
                      <span className="badge badge-new">{ex.duration_minutes} دقیقه</span>
                      <span className="badge badge-approved">{ex.questions?.length||0} سوال</span>
                      <span className="badge badge-new">{ex.assigned_to==='all'?'همه':'تخصصی'}</span>
                    </div>
                    <button onClick={()=>viewStudentResults(ex.id)} className="btn-glass btn-sm flex items-center gap-2"><Icon d={Icons.eye} size={14}/>مشاهده نتایج</button>
                  </div>
                  <button onClick={()=>deleteExam(ex.id)} className="p-2 bg-red-500/15 text-red-400 rounded-xl"><Icon d={Icons.trash} size={16}/></button>
                </div>
              </div>
            ))}
          </>
        )}
        {tab==='students'&&(
          <>
            <div className="flex gap-2 mb-4 overflow-x-auto pb-2">
              {[['list','دانش‌آموزان'],['objections',`اعتراض‌ها (${objections.length})`],['messages','پیام‌ها']].map(([k,l])=>(
                <button key={k} onClick={()=>setSubTab(k)} className={`btn-sm whitespace-nowrap ${subTab===k?'btn-glass':'bg-white/5'}`}>{l}</button>
              ))}
            </div>
            {subTab==='list'&&students.map(s=>(
              <div key={s.id} className="card flex items-center gap-3">
                <div className="w-11 h-11 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-lg shrink-0">{s.full_name[0]}</div>
                <div className="flex-1 min-w-0">
                  <h4 className="font-bold text-sm">{s.full_name}</h4>
                  <p className="text-[11px] text-white/30">@{s.username}</p>
                  <p className="text-[11px] text-emerald-400 mt-0.5">رمز: <span className="font-mono bg-white/5 px-1.5 py-0.5 rounded">{s.password}</span></p>
                </div>
                <button onClick={()=>changePassword(s.id)} className="btn-sm bg-white/5 shrink-0"><Icon d={Icons.key} size={14}/></button>
              </div>
            ))}
            {subTab==='objections'&&(
              objections.length===0?<div className="card text-center py-10 text-white/30">اعتراضی نیست</div>:
              objections.map(a=>(
                <div key={a.id} className="card border-amber-500/20">
                  <div className="flex justify-between items-start mb-2">
                    <div><h4 className="font-bold text-amber-300 text-sm">{a.users?.full_name}</h4><p className="text-[11px] text-white/30">{a.exams?.title}</p></div>
                    <span className="badge badge-pending">اعتراض</span>
                  </div>
                  <div className="bg-white/5 rounded-xl p-3 text-sm my-2">
                    <p className="text-white/50 text-xs mb-1">پاسخ:</p>
                    <p className="text-indigo-300 mb-2">{a.student_answer||'بدون پاسخ'}</p>
                    <p className="text-amber-300 text-xs font-bold mb-1">اعتراض:</p>
                    <p className="text-white text-sm">{a.objection}</p>
                  </div>
                  <div className="flex gap-2">
                    <input type="number" className="glass-input flex-1 text-sm" placeholder="نمره" id={`g-${a.id}`} defaultValue={a.score||0}/>
                    <button onClick={()=>gradeAnswer(a.id,document.getElementById(`g-${a.id}`).value)} className="btn-glass btn-glass-success btn-sm">ثبت</button>
                  </div>
                </div>
              ))
            )}
            {subTab==='messages'&&(
              <div className="glass-strong p-4 h-[60vh] flex flex-col">
                {!selectedChat?(
                  <div className="flex-1 overflow-y-auto space-y-2">
                    {messages.filter(m=>m.sender_id!==user.id).length===0&&<p className="text-center text-white/30 mt-8">پیامی نیست</p>}
                    {Object.values(messages.filter(m=>m.sender_id!==user.id).reduce((acc,m)=>{acc[m.sender_id]=m;return acc;},{})).map(m=>(
                      <div key={m.id} onClick={()=>setSelectedChat(m)} className="card cursor-pointer flex justify-between items-center">
                        <div className="min-w-0 flex-1"><p className="font-bold text-sm">{m.sender?.full_name}</p><p className="text-xs text-white/40 truncate">{m.content}</p></div>
                        <span className="text-[10px] text-white/20 shrink-0 mr-2">{new Date(m.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}</span>
                      </div>
                    ))}
                  </div>
                ):(
                  <>
                    <div className="flex items-center justify-between mb-3 pb-2 border-b border-white/5">
                      <div className="flex items-center gap-2">
                        <button onClick={()=>setSelectedChat(null)} className="p-1.5 bg-white/5 rounded-lg"><Icon d={Icons.arrowLeft} size={16}/></button>
                        <span className="font-bold text-sm">{selectedChat.sender?.full_name}</span>
                      </div>
                      <button onClick={()=>clearChat(selectedChat.sender_id)} className="p-1.5 bg-red-500/15 text-red-400 rounded-lg"><Icon d={Icons.trash} size={16}/></button>
                    </div>
                    <div className="flex-1 overflow-y-auto mb-3 space-y-1">
                      {messages.filter(m=>(m.sender_id===selectedChat.sender_id&&m.receiver_id===user.id)||(m.sender_id===user.id&&m.receiver_id===selectedChat.sender_id)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(m=>(
                        <div key={m.id} className={`chat-bubble ${m.sender_id===user.id?'me':'other'}`}>{m.content}</div>
                      ))}
                    </div>
                    <div className="flex gap-2">
                      <input className="glass-input flex-1 text-sm" placeholder="پاسخ..." value={replyText} onChange={e=>setReplyText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendMessage()}/>
                      <button onClick={sendMessage} className="btn-glass btn-glass-success btn-sm"><Icon d={Icons.send} size={16}/></button>
                    </div>
                  </>
                )}
              </div>
            )}
          </>
        )}
        {tab==='grading'&&(
          <>
            <h3 className="font-bold mb-3 text-white/70 text-sm">در انتظار تصحیح</h3>
            {answers.filter(a=>a.status==='pending'&&!a.objection).length===0&&<div className="card text-center py-10 text-white/30">همه تصحیح شده</div>}
            {answers.filter(a=>a.status==='pending'&&!a.objection).map(a=>(
              <div key={a.id} className="card">
                <h4 className="font-bold text-sm">{a.users?.full_name} - {a.exams?.title}</h4>
                <p className="text-xs text-white/40 mt-1">{a.questions?.q_text}</p>
                <p className="text-sm text-indigo-300 mt-2 bg-white/5 p-2 rounded">پاسخ: {a.student_answer||'بدون پاسخ'}</p>
                <div className="flex gap-2 mt-3">
                  <input type="number" className="glass-input flex-1 text-sm" placeholder="نمره" id={`s-${a.id}`}/>
                  <button onClick={()=>gradeAnswer(a.id,document.getElementById(`s-${a.id}`).value)} className="btn-glass btn-glass-success btn-sm">ثبت</button>
                </div>
              </div>
            ))}
          </>
        )}
      </div>
      <div className="nav-bar">
        <div className={`nav-item ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==='students'?'active':''}`} onClick={()=>{setTab('students');setSubTab('list');}}><Icon d={Icons.users}/><span>کاربران</span></div>
        <div className={`nav-item ${tab==='grading'?'active':''}`} onClick={()=>setTab('grading')}><Icon d={Icons.grade}/><span>تصحیح</span></div>
      </div>
      {modal==='exam'&&(
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="glass-strong w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-lg font-black gradient-text">ساخت آزمون</h3>
              <button onClick={()=>setModal(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button>
            </div>
            {step===1&&(
              <div className="space-y-4 fade-in">
                <div><label className="text-xs text-white/50 mb-2 block font-semibold">عنوان آزمون *</label><input className="glass-input" placeholder="مثال: آزمون ریاضی فصل ۱" value={formData.title||''} onChange={e=>setFormData({...formData,title:e.target.value})}/></div>
                <div><label className="text-xs text-white/50 mb-2 block font-semibold">توضیحات</label><textarea className="glass-input" placeholder="توضیحات..." value={formData.desc||''} onChange={e=>setFormData({...formData,desc:e.target.value})} rows="2"/></div>
                <div>
                  <label className="text-xs text-white/50 mb-2 block font-semibold">مدت زمان آزمون *</label>
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="text-[10px] text-white/40 mb-1 block">ساعت</label><input className="glass-input" type="number" min="0" max="10" placeholder="۰" value={formData.hours||''} onChange={e=>setFormData({...formData,hours:e.target.value})}/></div>
                    <div><label className="text-[10px] text-white/40 mb-1 block">دقیقه</label><input className="glass-input" type="number" min="0" max="59" placeholder="۰" value={formData.minutes||''} onChange={e=>setFormData({...formData,minutes:e.target.value})}/></div>
                  </div>
                </div>
                <div><label className="text-xs text-white/50 mb-2 block font-semibold">اختصاص به</label><select className="glass-input" value={formData.assigned||'all'} onChange={e=>setFormData({...formData,assigned:e.target.value})}><option value="all">همه دانش‌آموزان</option>{students.map(s=><option key={s.id} value={s.id}>{s.full_name}</option>)}</select></div>
                <button onClick={()=>{const h=parseInt(formData.hours)||0;const m=parseInt(formData.minutes)||0;if(h===0&&m===0){toast('مدت زمان را مشخص کنید','error');return;}setFormData({...formData,duration:h*60+m});setStep(2);}} className="btn-glass">مرحله بعد: سوالات</button>
              </div>
            )}
            {step===2&&(
              <div className="fade-in">
                <div className="flex justify-between items-center mb-3">
                  <h4 className="font-bold text-sm">سوالات ({questions.length})</h4>
                  <button onClick={addQuestion} className="btn-sm bg-indigo-600"><Icon d={Icons.plus} size={14}/>افزودن</button>
                </div>
                {questions.length===0&&<div className="text-center py-8 text-white/30"><p>هنوز سوالی اضافه نشده</p><button onClick={addQuestion} className="btn-glass mt-3 text-sm">افزودن اولین سوال</button></div>}
                {questions.map((q,i)=>(
                  <div key={i} className="glass p-4 mb-3 relative">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-bold text-indigo-300">سوال {i+1}</span>
                      <button onClick={()=>removeQuestion(i)} className="p-1.5 bg-red-500/15 text-red-400 rounded-lg"><Icon d={Icons.x} size={14}/></button>
                    </div>
                    <textarea className="glass-input mb-2 text-sm" placeholder="متن سوال" value={q.q_text} onChange={e=>updateQuestion(i,'q_text',e.target.value)} rows="2"/>
                    <div className="flex gap-2 mb-2">
                      <button className={`flex-1 py-2 rounded-lg text-xs font-bold ${q.q_type==='test'?'bg-indigo-600':'bg-white/5'}`} onClick={()=>updateQuestion(i,'q_type','test')}>تستی</button>
                      <button className={`flex-1 py-2 rounded-lg text-xs font-bold ${q.q_type==='descriptive'?'bg-indigo-600':'bg-white/5'}`} onClick={()=>updateQuestion(i,'q_type','descriptive')}>تشریحی</button>
                    </div>
                    {q.q_type==='test'&&(<div className="space-y-2">{['a','b','c','d'].map(o=>(<input key={o} className="glass-input text-sm" placeholder={`گزینه ${o.toUpperCase()}`} value={q[`opt_${o}`]} onChange={e=>updateQuestion(i,`opt_${o}`,e.target.value)}/>))}<select className="glass-input text-sm" value={q.correct_opt} onChange={e=>updateQuestion(i,'correct_opt',e.target.value)}><option value="">پاسخ صحیح (اختیاری)</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select></div>)}
                  </div>
                ))}
                <div className="flex gap-2 mt-3"><button onClick={()=>setStep(1)} className="btn-glass bg-white/5 flex-1">قبلی</button><button onClick={()=>setStep(3)} className="btn-glass flex-1">بررسی</button></div>
              </div>
            )}
            {step===3&&(
              <div className="fade-in text-center">
                <div className="glass p-4 mb-4 text-right space-y-2 text-sm">
                  <p>عنوان: <b>{formData.title}</b></p>
                  <p>مدت: <b>{formData.duration} دقیقه</b></p>
                  <p>سوالات: <b>{questions.length}</b></p>
                  <p>اختصاص به: <b>{formData.assigned==='all'?'همه':students.find(s=>s.id===formData.assigned)?.full_name}</b></p>
                </div>
                <div className="flex gap-2"><button onClick={()=>setStep(2)} className="btn-glass bg-white/5 flex-1">ویرایش</button><button onClick={createExam} className="btn-glass btn-glass-success flex-1" disabled={loading}>{loading?'ذخیره...':'ذخیره آزمون'}</button></div>
              </div>
            )}
          </div>
        </div>
      )}
      {showExamResults&&(
        <div className="modal-overlay" onClick={()=>setShowExamResults(null)}>
          <div className="glass-strong w-full max-w-2xl p-6 max-h-[85vh] overflow-y-auto slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="font-bold gradient-text text-lg">📊 نتایج آزمون: {showExamResults.exam.title}</h3>
              <button onClick={()=>setShowExamResults(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button>
            </div>
            {showExamResults.answers.length===0?<p className="text-center text-white/30 py-8">هنوز کسی شرکت نکرده</p>:
            showExamResults.answers.map(a=>{
              const maxScore=parseFloat(a.questions?.score||1);
              const percentage=maxScore>0?(parseFloat(a.score||0)/maxScore)*20:0;
              return(
                <div key={a.id} className="student-result-row">
                  <div className="flex items-center gap-3 flex-1">
                    <div className="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center font-bold">{a.users?.full_name?.[0]||'?'}</div>
                    <div><p className="font-bold text-sm">{a.users?.full_name||'نامشخص'}</p><p className="text-[11px] text-white/40">@{a.users?.username||''}</p></div>
                  </div>
                  <div className="flex items-center gap-3">
                    <div className="text-center"><StarRating score={percentage}/><p className="text-xs text-white/40 mt-1">{parseFloat(a.score||0)}/{maxScore}</p></div>
                    <div className="flex items-center gap-2">
                      <input type="number" step="0.25" className="glass-input text-sm w-20" defaultValue={a.score||0} id={`edit-${a.id}`}/>
                      <button onClick={()=>{const v=document.getElementById(`edit-${a.id}`).value;updateStudentScore(a.id,v);}} className="btn-glass btn-glass-success btn-sm">✓</button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
      {showPasswordModal&&<PasswordModal user={user} onClose={()=>setShowPasswordModal(false)}/>}
    </div>
  );
}

function Student({user,tab,setTab,onLogout}){
  const [exams,setExams]=useState([]);
  const [answers,setAnswers]=useState([]);
  const [activeExam,setActiveExam]=useState(null);
  const [currentQ,setCurrentQ]=useState(0);
  const [studentAnswers,setStudentAnswers]=useState({});
  const [timeLeft,setTimeLeft]=useState(0);
  const [totalTime,setTotalTime]=useState(0);
  const [calcDisplay,setCalcDisplay]=useState('');
  const [showObjection,setShowObjection]=useState(null);
  const [objectionText,setObjectionText]=useState('');
  const [objectionType,setObjectionType]=useState('score');
  const [selectedExamForObjection,setSelectedExamForObjection]=useState(null);
  const [checklist,setChecklist]=useState([]);
  const [newTask,setNewTask]=useState('');
  const [studyPlans,setStudyPlans]=useState([]);
  const [newPlan,setNewPlan]=useState({day:'شنبه',subject:'',time:''});
  const [toolsTab,setToolsTab]=useState('calc');
  const [showExamResults,setShowExamResults]=useState(null);
  const [showChat,setShowChat]=useState(false);
  const [showPasswordModal,setShowPasswordModal]=useState(false);
  const [activeGame,setActiveGame]=useState(null);
  const [hasSubmitted,setHasSubmitted]=useState(false);
  const [objectionTimers,setObjectionTimers]=useState({});
  const toast=useToast();

  useEffect(()=>{loadAll();},[]);

  const loadAll=async()=>{
    const {data:e}=await SB.from('exams').select('*,questions(*)').order('created_at',{ascending:false});
    const {data:a}=await SB.from('answers').select('*,exams(title),questions(q_text,q_type,correct_opt,score,opt_a,opt_b,opt_c,opt_d)');
    const {data:c}=await SB.from('checklists').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    const {data:p}=await SB.from('study_plans').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    if(e)setExams(e.filter(ex=>ex.assigned_to==='all'||ex.assigned_to===String(user.id)));
    if(a)setAnswers(a.filter(ans=>ans.student_id===user.id));
    if(c)setChecklist(c);if(p)setStudyPlans(p);
    const timers={};
    a?.filter(ans=>ans.student_id===user.id).forEach(ans=>{
      if(ans.graded_at&&!ans.objection){
        const graded=new Date(ans.graded_at);
        const hoursPassed=(Date.now()-graded)/(1000*60*60);
        const hoursLeft=48-hoursPassed;
        if(hoursLeft>0)timers[ans.exam_id]=hoursLeft*60*60;
      }
    });
    setObjectionTimers(timers);
  };

  useEffect(()=>{
    const interval=setInterval(()=>{
      setObjectionTimers(prev=>{
        const newTimers={};
        Object.keys(prev).forEach(key=>{const newTime=prev[key]-60;if(newTime>0)newTimers[key]=newTime;});
        return newTimers;
      });
    },60000);
    return()=>clearInterval(interval);
  },[]);

  const hasTakenExam=(examId)=>answers.some(a=>String(a.exam_id)===String(examId));

  const startExam=(exam)=>{
    if(hasTakenExam(exam.id)){toast('⚠️ قبلاً شرکت کرده‌اید','warning');return;}
    setActiveExam(exam);setCurrentQ(0);setStudentAnswers({});setTimeLeft(exam.duration_minutes*60);setTotalTime(exam.duration_minutes*60);setHasSubmitted(false);
  };

  useEffect(()=>{
    if(activeExam&&timeLeft>0){const t=setInterval(()=>setTimeLeft(tl=>tl-1),1000);return()=>clearInterval(t);}
    else if(activeExam&&timeLeft===0)submitExam();
  },[activeExam,timeLeft]);

  const submitExam=async()=>{
    if(!activeExam||hasSubmitted)return;
    setHasSubmitted(true);
    for(const q of activeExam.questions){
      const ans=studentAnswers[q.id]||'';
      let score=0;let status='pending';
      if(q.q_type==='test'){if(q.correct_opt){if(ans===q.correct_opt)score=parseFloat(q.score)||1;status='graded';}}
      await SB.from('answers').insert({exam_id:activeExam.id,student_id:user.id,question_id:q.id,student_answer:ans,score,max_score:parseFloat(q.score)||1,status});
    }
    toast('✅ پاسخ‌ها ثبت شد!','success');
    setActiveExam(null);loadAll();
  };

  const calcPress=(v)=>{
    if(v==='C')setCalcDisplay('');
    else if(v==='='){try{const expr=calcDisplay.replace(/÷/g,'/').replace(/×/g,'*');setCalcDisplay(String(new Function('return '+expr)()));}catch{setCalcDisplay('خطا');}}
    else setCalcDisplay(calcDisplay+v);
  };

  const submitObjection=async()=>{
    if(!objectionText.trim()||!selectedExamForObjection)return;
    const examAnswers=answers.filter(a=>a.exam_id===selectedExamForObjection);
    const objectionContent=`[${objectionType==='score'?'اعتراض به نمره':'اعتراض به سوالات'}] ${objectionText.trim()}`;
    for(const a of examAnswers){await SB.from('answers').update({objection:objectionContent}).eq('id',a.id);}
    toast('✅ اعتراض ثبت شد!','success');
    setShowObjection(null);setSelectedExamForObjection(null);setObjectionText('');loadAll();
  };

  const addTask=async()=>{
    if(!newTask.trim())return;
    const {data,error}=await SB.from('checklists').insert({user_id:user.id,title:newTask.trim()}).select().single();
    if(error){toast('خطا: '+error.message,'error');return;}
    if(data)setChecklist([data,...checklist]);
    setNewTask('');toast('✅ کار اضافه شد','success');
  };

  const toggleTask=async(id,done)=>{await SB.from('checklists').update({is_done:!done}).eq('id',id);setChecklist(checklist.map(t=>t.id===id?{...t,is_done:!done}:t));};
  const deleteTask=async(id)=>{await SB.from('checklists').delete().eq('id',id);setChecklist(checklist.filter(t=>t.id!==id));};

  const addPlan=async()=>{
    if(!newPlan.subject.trim()||!newPlan.time.trim()){toast('همه فیلدها را پر کنید','error');return;}
    const {data,error}=await SB.from('study_plans').insert({user_id:user.id,day_of_week:newPlan.day,subject:newPlan.subject.trim(),time_range:newPlan.time.trim()}).select().single();
    if(error){toast('خطا: '+error.message,'error');return;}
    if(data)setStudyPlans([data,...studyPlans]);
    setNewPlan({day:'شنبه',subject:'',time:''});toast('✅ برنامه اضافه شد','success');
  };

  const deletePlan=async(id)=>{await SB.from('study_plans').delete().eq('id',id);setStudyPlans(studyPlans.filter(p=>p.id!==id));};

  const getExamScore=(examId,studentId=user.id)=>{
    const examAnswers=answers.filter(a=>String(a.exam_id)===String(examId)&&String(a.student_id)===String(studentId));
    if(examAnswers.length===0)return null;
    const totalScore=examAnswers.reduce((s,a)=>s+parseFloat(a.score||0),0);
    const maxScore=examAnswers.reduce((s,a)=>s+parseFloat(a.max_score||0),0);
    return {totalScore,maxScore,percentage:((totalScore/maxScore)*20).toFixed(2)};
  };

  const getAverage=()=>{
    const examScores=exams.map(ex=>getExamScore(ex.id)).filter(s=>s!==null);
    if(examScores.length===0)return 0;
    return (examScores.reduce((s,e)=>s+parseFloat(e.percentage),0)/examScores.length).toFixed(2);
  };

  const formatTime=(seconds)=>{
    const hours=Math.floor(seconds/3600);
    const minutes=Math.floor((seconds%3600)/60);
    if(hours>0)return `${hours} ساعت و ${minutes} دقیقه`;
    return `${minutes} دقیقه`;
  };

  useEffect(()=>{
    if(tab==='chart'){
      const ctx=document.getElementById('gradeChart');
      if(!ctx)return;
      if(window.myChart)window.myChart.destroy();
      const examData=exams.filter(ex=>getExamScore(ex.id)).map(ex=>{const s=getExamScore(ex.id);return {title:ex.title,score:parseFloat(s.percentage),date:ex.created_at};}).sort((a,b)=>new Date(a.date)-new Date(b.date));
      if(examData.length===0)return;
      const gradient=ctx.getContext('2d').createLinearGradient(0,0,400,0);
      gradient.addColorStop(0,'rgba(129,140,248,0.8)');
      gradient.addColorStop(0.5,'rgba(192,132,252,0.8)');
      gradient.addColorStop(1,'rgba(244,114,182,0.8)');
      const fillGradient=ctx.getContext('2d').createLinearGradient(0,0,0,300);
      fillGradient.addColorStop(0,'rgba(129,140,248,0.3)');
      fillGradient.addColorStop(1,'rgba(129,140,248,0)');
      window.myChart=new Chart(ctx,{
        type:'line',
        data:{labels:examData.map((_,i)=>i+1),datasets:[{label:'نمره',data:examData.map(d=>d.score),borderColor:gradient,backgroundColor:fillGradient,borderWidth:4,tension:0.4,fill:true,pointBackgroundColor:'#f472b6',pointBorderColor:'#fff',pointBorderWidth:3,pointRadius:8,pointHoverRadius:12}]},
        options:{responsive:true,animation:{duration:2000,easing:'easeInOutQuart'},plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(15,15,35,0.95)',titleColor:'#fff',bodyColor:'#fff',borderColor:'rgba(129,140,248,0.3)',borderWidth:1,padding:12,cornerRadius:12,callbacks:{label:(context)=>{const idx=context.dataIndex;return `${examData[idx].title}: ${examData[idx].score}/20`;}}}},scales:{y:{ticks:{color:'rgba(255,255,255,0.7)',font:{size:12}},grid:{color:'rgba(255,255,255,0.05)'},beginAtZero:true,max:20},x:{ticks:{color:'rgba(255,255,255,0.7)'},grid:{color:'rgba(255,255,255,0.03)'},display:false}}}
      });
    }
  },[tab,answers,exams]);

  if(activeExam){
    const q=activeExam.questions[currentQ];
    const progress=((currentQ+1)/activeExam.questions.length)*100;
    return(
      <div className="min-h-screen">
        <div className="header">
          <div className="flex justify-between items-center mb-3">
            <div><h2 className="font-black text-lg gradient-text">{activeExam.title}</h2><p className="text-[11px] text-white/40 mt-1">سوال {currentQ+1} از {activeExam.questions.length}</p></div>
            <CircularTimerGlow timeLeft={timeLeft} totalTime={totalTime}/>
          </div>
          <div className="w-full bg-white/5 rounded-full h-2 overflow-hidden"><div className="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 h-2 rounded-full transition-all duration-500" style={{width:`${progress}%`}}></div></div>
        </div>
        {timeLeft<300&&timeLeft>0&&<div className="bg-red-500/15 text-red-300 p-3 text-center text-sm font-bold animate-pulse border-b border-red-500/20">⚠️ کمتر از ۵ دقیقه!</div>}
        <div className="content">
          <div className="glass p-5 fade-in">
            <div className="flex justify-between items-center mb-3">
              <span className={`badge ${q?.q_type==='test'?'badge-new':'badge-approved'}`}>{q?.q_type==='test'?' تستی':'✍️ تشریحی'}</span>
              <span className="badge badge-new">⭐ {q?.score||1} نمره</span>
            </div>
            <p className="mb-5 font-bold leading-relaxed text-lg">{q?.q_text}</p>
            {q?.q_type==='test'?(
              <div className="space-y-2">
                {['A','B','C','D'].map(opt=>(
                  <div key={opt} className={`glass p-3 cursor-pointer transition-all ${studentAnswers[q.id]===opt?'border-indigo-500 bg-indigo-500/15 scale-[1.02]':'hover:bg-white/5'}`} onClick={()=>setStudentAnswers({...studentAnswers,[q.id]:opt})}>
                    <div className="flex items-center gap-3">
                      <div className={`w-10 h-10 rounded-full border-2 flex items-center justify-center font-bold text-sm transition-all ${studentAnswers[q.id]===opt?'bg-gradient-to-br from-indigo-500 to-purple-500 border-transparent text-white scale-110':'border-white/20'}`}>{opt}</div>
                      <span className="flex-1 text-sm">{q[`opt_${opt.toLowerCase()}`]}</span>
                      {studentAnswers[q.id]===opt&&<Icon d={Icons.check} size={20} className="text-indigo-400"/>}
                    </div>
                  </div>
                ))}
              </div>
            ):(<textarea className="glass-input" placeholder="پاسخ خود را بنویسید..." value={studentAnswers[q.id]||''} onChange={e=>setStudentAnswers({...studentAnswers,[q.id]:e.target.value})} rows="5"/>)}
          </div>
          <div className="flex gap-2 mt-4">
            {currentQ>0&&<button onClick={()=>setCurrentQ(currentQ-1)} className="btn-glass bg-white/5 flex-1">← قبلی</button>}
            {currentQ<activeExam.questions.length-1?<button onClick={()=>setCurrentQ(currentQ+1)} className="btn-glass flex-1">بعدی →</button>:<button onClick={()=>{if(confirm('ثبت نهایی آزمون؟'))submitExam();}} className="btn-glass btn-glass-success flex-1">✓ ثبت نهایی</button>}
          </div>
        </div>
      </div>
    );
  }

  return(
    <div className="min-h-screen pb-24">
      <div className="header flex justify-between items-center">
        <div><h1 className="text-lg font-black gradient-text">پنل دانش‌آموز</h1><p className="text-xs text-white/40 mt-1">سلام {user.full_name} 👋</p></div>
        <div className="flex gap-2">
          <button onClick={()=>setShowPasswordModal(true)} className="p-2.5 bg-white/5 rounded-xl hover:bg-white/10 transition"><Icon d={Icons.key} size={18}/></button>
          <button onClick={onLogout} className="p-2.5 bg-white/5 rounded-xl hover:bg-white/10 transition"><Icon d={Icons.logout} size={18}/></button>
        </div>
      </div>
      <div className="content">
        {tab==='home'&&(
          <>
            <div className="grid grid-cols-2 gap-3 mb-4">
              <div className="glass p-5 text-center slide-up"><Icon d={Icons.award} size={28} className="mx-auto mb-2 text-amber-400"/><p className="text-3xl font-black gradient-text">{getAverage()}</p><p className="text-[11px] text-white/40">معدل از 20</p></div>
              <div className="glass p-5 text-center slide-up" style={{animationDelay:'0.1s'}}><Icon d={Icons.exam} size={28} className="mx-auto mb-2 text-indigo-400"/><p className="text-3xl font-black">{exams.filter(e=>hasTakenExam(e.id)).length}/{exams.length}</p><p className="text-[11px] text-white/40">آزمون‌ها</p></div>
            </div>
            <PersianCalendar/>
            <h3 className="font-bold mt-6 mb-3 text-white/70 text-sm">آزمون‌های موجود</h3>
            {exams.length===0&&<div className="card text-center py-10 text-white/30">آزمونی نیست</div>}
            {exams.map(ex=>{
              const taken=hasTakenExam(ex.id);
              const score=getExamScore(ex.id);
              return(
                <div key={ex.id} className={`exam-card-enhanced slide-up ${taken?'opacity-60':''}`}>
                  <h4 className="font-bold">{ex.title}</h4>
                  <p className="text-xs text-white/40 mt-1 mb-2">{ex.description||'بدون توضیحات'}</p>
                  <div className="flex gap-2 mb-3 flex-wrap">
                    <span className="badge badge-new">⏱️ {ex.duration_minutes} دقیقه</span>
                    <span className="badge badge-approved">📝 {ex.questions?.length||0} سوال</span>
                    {score&&<span className="badge badge-approved">⭐ {score.percentage}/20</span>}
                    {taken&&<span className="badge badge-taken">✓ شرکت شده</span>}
                  </div>
                  {taken?(<div className="space-y-2"><StarRating score={parseFloat(score.percentage)}/><button onClick={()=>setShowExamResults(ex.id)} className="btn-glass text-sm">📊 مشاهده نتایج</button></div>):(<button onClick={()=>startExam(ex)} className="btn-glass text-sm">شروع آزمون 🚀</button>)}
                </div>
              );
            })}
          </>
        )}
        {tab==='grades'&&(
          <>
            <h3 className="font-bold mb-3 text-white/70 text-sm">نمرات من</h3>
            {exams.filter(ex=>getExamScore(ex.id)).length===0&&<div className="card text-center py-10 text-white/30">نمره‌ای نیست</div>}
            {exams.map(ex=>{
              const score=getExamScore(ex.id);
              if(!score)return null;
              const hasObjection=answers.some(a=>a.exam_id===ex.id&&a.objection);
              const timeLeft=objectionTimers[ex.id];
              const isExpired=timeLeft===undefined||timeLeft<=0;
              return(
                <div key={ex.id} className="exam-card-enhanced">
                  <div className="flex justify-between items-start mb-2">
                    <div className="flex-1 min-w-0"><h4 className="font-bold text-sm">{ex.title}</h4><p className="text-[11px] text-white/30 mt-1">{ex.questions?.length||0} سوال</p></div>
                    <div className="text-left shrink-0 mr-3"><StarRating score={parseFloat(score.percentage)}/><p className="text-xs text-white/40 mt-1">{score.percentage}/20</p></div>
                  </div>
                  {hasObjection&&<div className="bg-amber-500/10 border border-amber-500/20 rounded-xl p-2.5 text-xs text-amber-300 mt-2"> اعتراض در حال بررسی</div>}
                  {!hasObjection&&(
                    <>
                      {timeLeft!==undefined&&timeLeft>0&&(
                        <div className="glass p-3 mt-2 border border-amber-500/30">
                          <div className="flex items-center justify-between mb-1"><span className="text-xs font-bold text-amber-300">⏰ زمان باقی‌مانده برای اعتراض</span><span className="text-xs font-bold text-white">{formatTime(timeLeft)}</span></div>
                          <div className="w-full bg-white/10 rounded-full h-1.5"><div className="bg-gradient-to-r from-amber-500 to-red-500 h-1.5 rounded-full transition-all" style={{width:`${(timeLeft/(48*3600))*100}%`}}></div></div>
                        </div>
                      )}
                      {isExpired?(<div className="mt-3 text-center text-xs text-gray-400 bg-gray-500/10 rounded-xl p-2 border border-gray-500/20">⏰ زمان ثبت اعتراض به اتمام رسیده است</div>):(<button onClick={()=>{setSelectedExamForObjection(ex.id);setShowObjection(true);}} className="btn-glass btn-glass-warning mt-3 text-sm flex items-center justify-center gap-2"><Icon d={Icons.alert} size={16}/>ثبت اعتراض</button>)}
                    </>
                  )}
                </div>
              );
            })}
          </>
        )}
        {tab==='chart'&&(
          <>
            <div className="glass p-6 text-center mb-6 slide-up"><Icon d={Icons.chart} size={32} className="mx-auto mb-2 text-indigo-400"/><p className="text-4xl font-black gradient-text">{getAverage()}</p><p className="text-xs text-white/40">معدل کل از 20</p></div>
            <div className="chart-container-enhanced">
              <h3 className="font-bold mb-3 text-center text-sm gradient-text">📈 نمودار پیشرفت تحصیلی</h3>
              {exams.filter(ex=>getExamScore(ex.id)).length===0?<p className="text-center text-white/30 py-8">نمره‌ای نیست</p>:<canvas id="gradeChart"></canvas>}
            </div>
            <div className="glass p-4 mt-4">
              <h4 className="font-bold text-sm mb-3 gradient-text">📋 لیست آزمون‌ها</h4>
              {exams.filter(ex=>getExamScore(ex.id)).length===0?<p className="text-center text-white/30 py-4">آزمونی ندارید</p>:
              exams.filter(ex=>getExamScore(ex.id)).map(ex=>{const score=getExamScore(ex.id);return(<div key={ex.id} className="exam-list-item"><div className="flex-1 min-w-0"><p className="font-bold text-sm truncate">{ex.title}</p><p className="text-[11px] text-white/40">{ex.questions?.length||0} سوال</p></div><div className="exam-list-score">{parseFloat(score.percentage)}</div></div>);})}
            </div>
          </>
        )}
        {tab==='tools'&&(
          <>
            {!activeGame?(
              <>
                <div className="grid grid-cols-2 gap-3 mb-4">
                  <div className={`tool-btn calc ${toolsTab==='calc'?'active':''}`} onClick={()=>setToolsTab('calc')}><div className="tool-icon"><Icon d={Icons.calc} size={28}/></div><div className="tool-label">ماشین‌حساب</div></div>
                  <div className={`tool-btn check ${toolsTab==='checklist'?'active':''}`} onClick={()=>setToolsTab('checklist')}><div className="tool-icon"><Icon d={Icons.check} size={28}/></div><div className="tool-label">چک‌لیست</div></div>
                  <div className={`tool-btn plan ${toolsTab==='planner'?'active':''}`} onClick={()=>setToolsTab('planner')}><div className="tool-icon"><Icon d={Icons.calendar} size={28}/></div><div className="tool-label">برنامه‌ریزی</div></div>
                  <div className={`tool-btn game ${toolsTab==='games'?'active':''}`} onClick={()=>setToolsTab('games')}><div className="tool-icon"><Icon d={Icons.game} size={28}/></div><div className="tool-label">بازی‌ها</div></div>
                </div>
                {toolsTab==='calc'&&(
                  <div className="glass-strong p-5 max-w-xs mx-auto slide-up">
                    <div className="bg-gradient-to-br from-indigo-900/40 to-purple-900/40 p-4 rounded-2xl text-3xl text-left mb-4 font-mono h-20 flex items-center justify-end border border-white/10 overflow-x-auto shadow-inner">{calcDisplay||'0'}</div>
                    <div className="grid grid-cols-4 gap-2">
                      {['7','8','9','÷','4','5','6','×','1','2','3','-','C','0','=','+'].map(b=>(<button key={b} onClick={()=>calcPress(b)} className={`btn-glass h-14 text-lg font-bold ${['÷','×','-','+'].includes(b)?'bg-indigo-600/30 border-indigo-500/30 text-indigo-300':''} ${b==='='?'btn-glass-success':''} ${b==='C'?'btn-glass-danger':''}`}>{b}</button>))}
                    </div>
                  </div>
                )}
                {toolsTab==='checklist'&&(
                  <div className="space-y-3 slide-up">
                    <div className="flex gap-2"><input className="glass-input flex-1" placeholder="کار جدید..." value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTask()}/><button onClick={addTask} className="btn-glass btn-glass-success btn-sm"><Icon d={Icons.plus} size={16}/></button></div>
                    {checklist.length===0&&<p className="text-center text-white/30 py-8">لیست خالی است</p>}
                    {checklist.map(t=>(<div key={t.id} className="glass p-3 flex items-center gap-3"><button onClick={()=>toggleTask(t.id,t.is_done)} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 transition-all ${t.is_done?'bg-emerald-500 border-emerald-500':'border-white/20'}`}>{t.is_done&&<Icon d={Icons.check} size={12}/>}</button><span className={`flex-1 text-sm ${t.is_done?'line-through text-white/30':''}`}>{t.title}</span><button onClick={()=>deleteTask(t.id)} className="text-red-400/60 hover:text-red-400"><Icon d={Icons.trash} size={16}/></button></div>))}
                  </div>
                )}
                {toolsTab==='planner'&&(
                  <div className="space-y-3 slide-up">
                    <div className="glass p-4 space-y-3">
                      <select className="glass-input" value={newPlan.day} onChange={e=>setNewPlan({...newPlan,day:e.target.value})}>{['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'].map(d=><option key={d}>{d}</option>)}</select>
                      <input className="glass-input" placeholder="درس (مثال: ریاضی)" value={newPlan.subject} onChange={e=>setNewPlan({...newPlan,subject:e.target.value})}/>
                      <input className="glass-input" placeholder="ساعت (مثال: 16-18)" value={newPlan.time} onChange={e=>setNewPlan({...newPlan,time:e.target.value})}/>
                      <button onClick={addPlan} className="btn-glass btn-glass-success text-sm">افزودن به برنامه</button>
                    </div>
                    {studyPlans.length===0&&<p className="text-center text-white/30 py-4">برنامه‌ای نیست</p>}
                    {studyPlans.map(p=>(<div key={p.id} className="glass p-3 flex items-center justify-between"><div><span className="badge badge-new mb-1">{p.day_of_week}</span><p className="font-bold text-sm">{p.subject}</p><p className="text-[11px] text-white/40">{p.time_range}</p></div><button onClick={()=>deletePlan(p.id)} className="text-red-400/60"><Icon d={Icons.trash} size={16}/></button></div>))}
                  </div>
                )}
                {toolsTab==='games'&&(
                  <div className="slide-up">
                    <h3 className="font-bold mb-3 text-white/70 text-sm">بازی‌های موجود</h3>
                    <div className="grid grid-cols-1 gap-3">
                      <div className="game-card" onClick={()=>setActiveGame('snakes')}><div className="game-card-icon bg-gradient-to-br from-emerald-500 to-teal-500">🐍</div><h4 className="font-bold text-sm">مار و پله</h4><p className="text-[10px] text-white/40 mt-1">۲ یا ۳ نفره با دوستان</p></div>
                    </div>
                  </div>
                )}
              </>
            ):(
              <div className="slide-up">
                <div className="flex justify-between items-center mb-4">
                  <button onClick={()=>setActiveGame(null)} className="btn-glass btn-sm flex items-center gap-2"><Icon d={Icons.arrowLeft} size={16}/>بازگشت</button>
                  <h3 className="font-bold gradient-text text-lg">🐍 مار و پله</h3>
                  <div className="w-20"></div>
                </div>
                <SnakesLaddersHub user={user} onBack={()=>setActiveGame(null)}/>
              </div>
            )}
          </>
        )}
      </div>
      <div className="nav-bar">
        <div className={`nav-item ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==='grades'?'active':''}`} onClick={()=>setTab('grades')}><Icon d={Icons.grade}/><span>نمرات</span></div>
        <div className={`nav-item ${tab==='chart'?'active':''}`} onClick={()=>setTab('chart')}><Icon d={Icons.chart}/><span>کارنامه</span></div>
        <div className={`nav-item ${tab==='tools'?'active':''}`} onClick={()=>{setTab('tools');setToolsTab('calc');setActiveGame(null);}}><Icon d={Icons.list}/><span>ابزارها</span></div>
      </div>
      {tab==='home'&&<button onClick={()=>setShowChat(true)} className="chat-fab"><Icon d={Icons.message} size={24}/></button>}
      {showChat&&<ChatModal user={user} onClose={()=>setShowChat(false)}/>}
      {showPasswordModal&&<PasswordModal user={user} onClose={()=>setShowPasswordModal(false)}/>}
      {showObjection&&(
        <div className="modal-overlay" onClick={()=>setShowObjection(null)}>
          <div className="glass-strong w-full max-w-md p-6 slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4"><h3 className="font-bold gradient-text">ثبت اعتراض</h3><button onClick={()=>setShowObjection(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button></div>
            <div className="bg-amber-500/10 border border-amber-500/20 rounded-xl p-3 mb-4 text-xs text-amber-300">⚠️ دانش‌آموز گرامی، فقط یکبار می‌توانید به نمره خود اعتراض بزنید و نتیجه شما ممکن است بدون تغییر یا افزایش و یا کاهش باشد.</div>
            <div className="mb-4">
              <label className="text-xs text-white/60 mb-2 block font-semibold">نوع اعتراض</label>
              <div className="grid grid-cols-2 gap-2">
                <button onClick={()=>setObjectionType('score')} className={`btn-glass btn-sm ${objectionType==='score'?'btn-glass-warning':''}`}> اعتراض به نمره</button>
                <button onClick={()=>setObjectionType('question')} className={`btn-glass btn-sm ${objectionType==='question'?'btn-glass-warning':''}`}> اعتراض به سوالات</button>
              </div>
            </div>
            <textarea className="glass-input mb-4" placeholder="دلیل اعتراض..." value={objectionText} onChange={e=>setObjectionText(e.target.value)} rows="4"/>
            <button onClick={submitObjection} className="btn-glass btn-glass-warning flex items-center justify-center gap-2"><Icon d={Icons.send} size={16}/>ارسال به مدیر</button>
          </div>
        </div>
      )}
      {showExamResults&&(
        <div className="modal-overlay" onClick={()=>setShowExamResults(null)}>
          <div className="glass-strong w-full max-w-lg p-6 max-h-[85vh] overflow-y-auto slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4"><h3 className="font-bold gradient-text">📊 نتایج آزمون</h3><button onClick={()=>setShowExamResults(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button></div>
            {(()=>{
              const exam=exams.find(e=>e.id===showExamResults);
              if(!exam)return null;
              const score=getExamScore(exam.id);
              const examAnswers=answers.filter(a=>a.exam_id===exam.id);
              return(
                <>
                  <div className="glass p-4 mb-4 text-center bg-gradient-to-br from-indigo-500/10 to-pink-500/10"><h4 className="font-bold mb-2">{exam.title}</h4><StarRating score={parseFloat(score.percentage)}/><p className="text-4xl font-black gradient-text mt-2">{score.percentage}/20</p><p className="text-xs text-white/40 mt-1">{score.totalScore} از {score.maxScore}</p></div>
                  <h4 className="font-bold text-sm mb-3 text-white/70">جزئیات سوالات:</h4>
                  {examAnswers.map((a,idx)=>{
                    const q=exam.questions.find(qq=>qq.id===a.question_id);
                    if(!q)return null;
                    const isCorrect=q.q_type==='test'&&q.correct_opt&&a.student_answer===q.correct_opt;
                    const isWrong=q.q_type==='test'&&q.correct_opt&&a.student_answer&&a.student_answer!==q.correct_opt;
                    return(
                      <div key={a.id} className={`glass p-3 mb-2 ${isWrong?'border-red-500/30':isCorrect?'border-emerald-500/30':''}`}>
                        <div className="flex justify-between items-start mb-2"><span className="text-xs text-white/40">سوال {idx+1}</span><span className={`badge ${a.status==='graded'?'badge-approved':'badge-pending'}`}>{a.status==='graded'?'✓ تصحیح شده':'⏳ در انتظار تصحیح مدیر'}</span></div>
                        <p className="text-sm mb-2">{q.q_text}</p>
                        {q.q_type==='test'&&q.correct_opt?(<div className="space-y-1 text-xs">{isWrong&&(<><div className="bg-red-500/10 border border-red-500/20 rounded-lg p-2"><span className="text-red-300">❌ پاسخ شما: {a.student_answer}</span></div><div className="bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-2"><span className="text-emerald-300">✓ پاسخ صحیح: {q.correct_opt}</span></div></>)}{isCorrect&&<div className="bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-2"><span className="text-emerald-300">✓ پاسخ صحیح: {a.student_answer}</span></div>}</div>):(<div className="text-xs"><p className="text-white/40 mb-1">پاسخ شما:</p><p className="bg-white/5 p-2 rounded">{a.student_answer||'بدون پاسخ'}</p></div>)}
                        <div className="flex justify-between items-center mt-2 pt-2 border-t border-white/5"><span className="text-xs text-white/40">نمره سوال: {q.score||1}</span><span className="text-sm font-bold gradient-text">کسب شده: {a.score||0}</span></div>
                      </div>
                    );
                  })}
                </>
              );
            })()}
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [user,setUser]=useState(null);
  const [view,setView]=useState('login');
  const [tab,setTab]=useState('home');
  useEffect(()=>{const s=sessionStorage.getItem('edu_user');if(s){const u=JSON.parse(s);setUser(u);setView(u.role);}},[]);
  const login=async(un,pw)=>{const {data}=await SB.from('users').select('*').eq('username',un.toUpperCase()).eq('password',pw).single();if(data){setUser(data);sessionStorage.setItem('edu_user',JSON.stringify(data));setView(data.role);return true;}return false;};
  const logout=()=>{setUser(null);setView('login');setTab('home');sessionStorage.removeItem('edu_user');};
  if(view==='login') return <Login onLogin={login}/>;
  if(view==='admin') return <Admin user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
  return <Student user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
}

function AppWrapper(){return(<ToastProvider><App/></ToastProvider>);}
ReactDOM.createRoot(document.getElementById('root')).render(<AppWrapper/>);
</script>
</body>
</html>
