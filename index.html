<script>


// اطلاعات اولیه سیستم

let exams =
JSON.parse(localStorage.getItem("exams")) || [];

let messages =
JSON.parse(localStorage.getItem("messages")) || [];

let grades =
JSON.parse(localStorage.getItem("grades")) || [];

let objections =
JSON.parse(localStorage.getItem("objections")) || [];





// کاربران

const users = {


"ARMIN":{
password:"1010",
role:"مدیر"
},


"ATRIN":{
password:"0000",
role:"دانش‌آموز"
},


"AVA":{
password:"1111",
role:"دانش‌آموز"
}


};






// ورود


function login(){


let username =
document
.getElementById("username")
.value
.trim()
.toUpperCase();



let password =
document
.getElementById("password")
.value
.trim();



let error =
document.getElementById("error");



if(
users[username] &&
users[username].password===password
){



document
.getElementById("loginPage")
.style.display="none";



document
.getElementById("app")
.style.display="block";



document
.getElementById("name")
.innerHTML=username;



document
.getElementById("role")
.innerHTML=
users[username].role;



localStorage.setItem(
"currentUser",
username
);




if(users[username].role==="مدیر"){


document
.getElementById("managerPanel")
.style.display="block";


}


else{


document
.getElementById("studentPanel")
.style.display="block";


}



updateDashboard();



}

else{


error.style.display="block";


error.innerHTML=
"نام کاربری یا رمز عبور اشتباه است";


}



}









// خروج


function logout(){


localStorage.removeItem(
"currentUser"
);


location.reload();


}








// ساخت آزمون مدیر


function createExam(){



let title =
prompt(
"نام آزمون را وارد کنید"
);



if(!title)return;



let type =
prompt(
"نوع آزمون: تستی یا تشریحی"
);



let exam={

id:Date.now(),

title:title,

type:type,

date:new Date()
.toLocaleDateString("fa")

};



exams.push(exam);



localStorage.setItem(
"exams",
JSON.stringify(exams)
);



alert(
"آزمون ساخته شد"
);



updateDashboard();


}









// نمایش آزمون‌ها برای دانش‌آموز


function startExam(){


if(exams.length===0){


alert(
"فعلاً آزمونی وجود ندارد"
);


return;


}



let text="آزمون‌ها:\n\n";


exams.forEach((e,i)=>{


text +=
(i+1)+
" - "+
e.title+
" ("+
e.type+
")\n";


});



alert(text);



}









// ثبت نمره مدیر


function gradeStudents(){


let student =
prompt(
"نام دانش‌آموز"
);



let score =
prompt(
"نمره را وارد کنید"
);



if(!student || !score)return;



grades.push({

student:student,

score:score,

date:
new Date()
.toLocaleDateString("fa")

});



localStorage.setItem(

"grades",

JSON.stringify(grades)

);



alert(
"نمره ثبت شد"
);



}









// ارسال پیام مدیر


function sendMessage(){


let to =
prompt(
"نام دانش‌آموز"
);



let text =
prompt(
"متن پیام"
);



if(!to || !text)return;



messages.push({

from:"ARMIN",

to:to,

text:text,

date:
new Date()
.toLocaleDateString("fa")

});



localStorage.setItem(

"messages",

JSON.stringify(messages)

);



alert(
"پیام ارسال شد"
);


}









// پیام دانش‌آموز به مدیر


function sendToManager(){


let text =
prompt(
"پیام شما به مدیر"
);



if(!text)return;



let user =
localStorage.getItem(
"currentUser"
);



messages.push({

from:user,

to:"ARMIN",

text:text,

date:
new Date()
.toLocaleDateString("fa")

});



localStorage.setItem(
"messages",
JSON.stringify(messages)
);



alert(
"پیام ارسال شد"
);



}









// اعتراض نمره

let user =
localStorage.getItem(
"currentUser"
);



let check =
objections.find(
x=>x.student===user
);



if(check){


alert(
"شما قبلاً اعتراض ثبت کرده‌اید"
);


return;


}



let text =
prompt(
"دلیل اعتراض"
);



if(!text)return;



objections.push({

student:user,

text:text,

sta
-Ꮧ: tus:"در انتظار بررسی"

});



localStorage.setItem(

"objections",

JSON.stringify(objections)

);



alert(
"اعتراض ثبت شد"
);



}








// نمودار ساده


function showChart(){



document.getElementById("activity")
.innerHTML=`

📈 نمودار پیشرفت

<br><br>

ریاضی:
████████░░ 80%

<br>

علوم:
███████░░░ 70%

<br>

ادبیات:
█████████░ 90%

`;



}

function showStudents(){



alert(
"لیست دانش‌آموزان:\n\nATRIN\nAVA"
);


}








// نمایش نمرات


function updateDashboard(){



document
.getElementById("examCount")
.innerHTML=
exams.length;



document
.getElementById("messageCount")
.innerHTML=
messages.length;



}





function closeModal(){


document
.getElementById("modal")
.style.display="none";


}



</script>

<script>


// ورود خودکار

window.addEventListener(
"load",
()=>{


let user =
localStorage.getItem(
"currentUser"
);



if(user && users[user]){


document
.getElementById("loginPage")
.style.display="none";


document
.getElementById("app")
.style.display="block";



document
.getElementById("name")
.innerHTML=user;



document
.getElementById("role")
.innerHTML=
users[user].role;



if(users[user].role==="مدیر"){


document
.getElementById("managerPanel")
.style.display="block";


}

else{


document
.getElementById("studentPanel")
.style.display="block";


}



updateDashboard();



}


}

);






// نمایش پیام ها


function showMessages(){


let user =
localStorage.getItem(
"currentUser"
);



let result =
messages.filter(
m =>
m.to===user ||
m.from===user
);



if(result.length===0){

document
.getElementById("activity")
.innerHTML=
"پیامی وجود ندارد";

return;

}



let html="";


result.forEach(m=>{


html+=`

<div class="card">

<b>
${m.from}
</b>

<br>

${m.text}

<br>

<small>
${m.date}
</small>


</div>

<br>

`;



});


document
.getElementById("activity")
.innerHTML=html;



}







// نمایش نمرات دانش آموز


function showGrades(){


let user =
localStorage.getItem(
"currentUser"
);



let data =
grades.filter(
g=>g.student===user
);



if(data.length===0){

document
.getElementById("activity")
.innerHTML=
"هنوز نمره‌ای ثبت نشده";

return;

}



let html="";


data.forEach(g=>{


html+=`

<div class="card">


📊 نمره:
<b>
${g.score}
</b>


<br>

تاریخ:
${g.date}


</div>


<br>


`;



});



document
.getElementById("activity")
.innerHTML=html;


}






// ساخت سوال ساده توسط مدیر


function createQuestionExam(){



let title =
prompt(
"نام آزمون"
);



let question =
prompt(
"سوال را وارد کنید"
);



let answer =
prompt(
"پاسخ صحیح"
);



if(!title || !question)return;



exams.push({

id:Date.now(),

title:title,

type:"تستی",

questions:[{

q:question,

answer:answer

}]


});



localStorage.setItem(
"exams",
JSON.stringify(exams)
);



alert(
"آزمون تستی ساخته شد"
);



}




</script>
