<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e1b4b">
<title>سامانه دانش‌آموزی</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Vazirmatn',sans-serif;margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 30%,#4c1d95 60%,#1e1b4b 100%);min-height:100vh;overflow-x:hidden;color:#fff}
.glass{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.glass-light{background:rgba(255,255,255,0.12);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.18);border-radius:16px}
.glass-input{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:14px;color:#fff;padding:14px 18px;width:100%;font-size:15px;outline:none;transition:all .3s}
.glass-input:focus{border-color:rgba(139,92,246,0.6);box-shadow:0 0 20px rgba(139,92,246,0.2)}
.glass-input::placeholder{color:rgba(255,255,255,0.35)}
.btn-primary{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;width:100%;transition:all .3s;box-shadow:0 4px 15px rgba(124,58,237,0.4)}
.btn-primary:active{transform:scale(0.97)}
.btn-sm{padding:10px 16px;font-size:13px;border-radius:12px;width:auto;display:inline-flex;align-items:center;gap:6px}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626)}
.btn-success{background:linear-gradient(135deg,#10b981,#059669)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,12,50,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.08);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:50;display:flex;justify-content:space-around}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 16px;border-radius:12px;color:rgba(255,255,255,0.4);font-size:10px;cursor:pointer;transition:all .3s}
.nav-item.active{color:#a78bfa;background:rgba(139,92,246,0.15)}
.nav-item svg{width:22px;height:22px}
.fade-in{animation:fadeIn .4s ease-out}
.slide-up{animation:slideUp .4s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
textarea.glass-input{resize:vertical;min-height:80px}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-pending{background:rgba(245,158,11,0.2);color:#fbbf24;border:1px solid rgba(245,158,11,0.3)}
.badge-approved{background:rgba(16,185,129,0.2);color:#34d399;border:1px solid rgba(16,185,129,0.3)}
.header{position:sticky;top:0;z-index:40;background:rgba(30,27,75,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.08);padding:16px 20px}
.header-content{max-width:600px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.scroll-container{padding:20px;padding-bottom:100px;max-width:600px;margin:0 auto}
.empty-state{text-align:center;padding:40px 20px;color:rgba(255,255,255,0.4)}
.empty-state svg{width:64px;height:64px;margin-bottom:16px;opacity:0.3}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const SB=supabase.createClient("https://rzcbwczpjytcfeewjumk.supabase.co","sb_publishable_tuQ6vkwm9E3-E7BsFCaiIQ_2xA7Cm86");

const Icon=({d,size=22,color="currentColor"})=>(
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>
);

const Icons={
  home:"M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10",
  users:"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M23 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75",
  exam:"M9 11l3 3L22 4 M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11",
  grade:"M22 12h-4l-3 9L9 3l-3 9H2",
  msg:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",
  alert:"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01",
  plus:"M12 5v14 M5 12h14",
  logout:"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9",
  back:"M19 12H5 M12 19l-7-7 7-7",
  check:"M20 6L9 17l-5-5",
  x:"M18 6L6 18 M6 6l12 12",
  book:"M4 19.5A2.5 2.5 0 0 1 6.5 17H20 M4 19.5V5a2 2 0 0 1 2-2h14v14H6.5A2.5 2.5 0 0 0 4 19.5z",
  send:"M22 2L11 13 M22 2l-7 20-4-9-9-4 20-7z"
};

const GlassCard=({children,className="",onClick})=>(
  <div className={`glass p-4 ${className}`} onClick={onClick} style={{cursor:onClick?"pointer":"default"}}>{children}</div>
);

const Modal=({title,onClose,children})=>(
  <div className="modal-overlay fade-in" onClick={onClose}>
    <div className="glass w-full max-w-md p-5 slide-up" onClick={e=>e.stopPropagation()} style={{maxHeight:"85vh",overflowY:"auto"}}>
      <div className="flex justify-between items-center mb-4">
        <h3 className="text-white text-lg font-bold">{title}</h3>
        <button onClick={onClose} className="text-white/50 hover:text-white"><Icon d={Icons.x} size={20}/></button>
      </div>
      {children}
    </div>
  </div>
);

function App(){
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState("home");
  const [page,setPage]=useState("login");

  useEffect(()=>{
    const s=sessionStorage.getItem("schoolUser");
    if(s){const u=JSON.parse(s);setUser(u);setPage(u.role);}
  },[]);

  const login=async(un,pw)=>{
    const {data,error}=await SB.from("users").select("*").eq("username",un.toUpperCase()).eq("password",pw).single();
    if(error||!data) return false;
    setUser(data);setPage(data.role);sessionStorage.setItem("schoolUser",JSON.stringify(data));return true;
  };

  const logout=()=>{setUser(null);setPage("login");setTab("home");sessionStorage.removeItem("schoolUser");};

  if(page==="login") return <LoginPage onLogin={login}/>;
  if(page==="admin") return <AdminPanel user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
  return <StudentPanel user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
}

function LoginPage({onLogin}){
  const [un,setUn]=useState("");const [pw,setPw]=useState("");const [err,setErr]=useState("");const [ld,setLd]=useState(false);
  const submit=async(e)=>{
    e.preventDefault();setLd(true);setErr("");
    const ok=await onLogin(un,pw);
    if(!ok) setErr("نام کاربری یا رمز عبور اشتباه است!");
    setLd(false);
  };
  return(
    <div className="flex flex-col items-center justify-center min-h-screen p-6 fade-in">
      <div className="text-center mb-8 slide-up">
        <div className="w-20 h-20 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-violet-500 to-purple-700 flex items-center justify-center shadow-lg shadow-purple-500/30">
          <Icon d={Icons.book} size={36}/>
        </div>
        <h1 className="text-3xl font-black text-white mb-2">سامانه دانش‌آموزی</h1>
        <p className="text-white/40 text-sm">برای ورود اطلاعات خود را وارد کنید</p>
      </div>
      <GlassCard className="w-full max-w-sm slide-up">
        <form onSubmit={submit} className="space-y-4">
          {err&&<div className="bg-red-500/20 border border-red-500/30 rounded-xl p-3 text-red-300 text-sm text-center">{err}</div>}
          <input className="glass-input" placeholder="نام کاربری (مثلاً: ARMIN)" value={un} onChange={e=>setUn(e.target.value)} required/>
          <input className="glass-input" type="password" placeholder="رمز عبور (مثلاً: 1010)" value={pw} onChange={e=>setPw(e.target.value)} required/>
          <button type="submit" className="btn-primary" disabled={ld}>{ld?"در حال ورود...":"ورود به سامانه"}</button>
        </form>
        <div className="mt-4 p-3 bg-white/5 rounded-xl text-xs text-white/30 text-center">
          <div>مدیر: ARMIN / 1010</div>
          <div>دانش‌آموز: AVA / 1111 یا ATRIN / 0000</div>
        </div>
      </GlassCard>
    </div>
  );
}

function AdminPanel({user,tab,setTab,onLogout}){
  const [exams,setExams]=useState([]);
  const [students,setStudents]=useState([]);
  const [grades,setGrades]=useState([]);
  const [modal,setModal]=useState(null);
  const [formData,setFormData]=useState({});

  useEffect(()=>{loadData();},[]);

  const loadData=async()=>{
    const {data:e}=await SB.from("exams").select("*").order("created_at",{ascending:false});
    const {data:s}=await SB.from("users").select("*").eq("role","student");
    const {data:g}=await SB.from("grades").select("*,users(username,full_name),exams(title)");
    if(e) setExams(e);
    if(s) setStudents(s);
    if(g) setGrades(g);
  };

  const createExam=async()=>{
    if(!formData.title) return;
    await SB.from("exams").insert({title:formData.title,description:formData.desc||""});
    setModal(null);setFormData({});loadData();
  };

  const addGrade=async()=>{
    if(!formData.student_id||!formData.exam_id||!formData.score) return;
    await SB.from("grades").insert({student_id:formData.student_id,exam_id:formData.exam_id,score:formData.score,status:"pending"});
    setModal(null);setFormData({});loadData();
  };

  const updateGrade=async(id,newScore)=>{
    await SB.from("grades").update({score:newScore,status:"approved"}).eq("id",id);
    loadData();
  };

  return(
    <div className="min-h-screen pb-20">
      <div className="header">
        <div className="header-content">
          <div>
            <h1 className="text-xl font-bold text-white">پنل مدیریت</h1>
            <p className="text-xs text-white/40">خوش آمدید، {user?.full_name}</p>
          </div>
          <button onClick={onLogout} className="p-2 rounded-xl bg-white/5 hover:bg-white/10"><Icon d={Icons.logout} size={20}/></button>
        </div>
      </div>

      <div className="scroll-container">
        {tab==="home"&&<><div className="mb-6"><button onClick={()=>{setModal("exam");setFormData({});}} className="btn-primary flex items-center justify-center gap-2"><Icon d={Icons.plus} size={20}/>ساخت آزمون جدید</button></div>
        <h2 className="text-lg font-bold mb-4">آزمون‌ها</h2>
        {exams.length===0?<div className="empty-state"><Icon d={Icons.exam} size={64}/><p>هنوز آزمونی ثبت نشده</p></div>:
        exams.map(ex=>(<GlassCard key={ex.id} className="mb-3"><div className="flex justify-between items-start"><div><h3 className="font-bold text-white">{ex.title}</h3><p className="text-sm text-white/40 mt-1">{ex.description||"بدون توضیحات"}</p></div><span className="text-xs text-white/30">{new Date(ex.created_at).toLocaleDateString("fa-IR")}</span></div></GlassCard>)))}
        <h2 className="text-lg font-bold mb-4 mt-6">ثبت نمره جدید</h2>
        <button onClick={()=>{setModal("grade");setFormData({});}} className="btn-primary flex items-center justify-center gap-2"><Icon d={Icons.grade} size={20}/>ثبت نمره</button></>}

        {tab==="students"&&<><h2 className="text-lg font-bold mb-4">دانش‌آموزان</h2>
        {students.map(s=>(<GlassCard key={s.id} className="mb-3"><div className="flex items-center gap-3"><div className="w-12 h-12 rounded-full bg-gradient-to-br from-violet-500 to-purple-700 flex items-center justify-center font-bold">{s.full_name[0]}</div><div><h3 className="font-bold">{s.full_name}</h3><p className="text-sm text-white/40">{s.username}</p></div></div></GlassCard>)))}</>}

        {tab==="grades"&&<><h2 className="text-lg font-bold mb-4">نمرات و اعتراض‌ها</h2>
        {grades.length===0?<div className="empty-state"><Icon d={Icons.grade} size={64}/><p>هنوز نمره‌ای ثبت نشده</p></div>:
        grades.map(g=>(<GlassCard key={g.id} className="mb-3"><div className="flex justify-between items-start mb-2"><div><h3 className="font-bold">{g.users?.full_name||"دانش‌آموز"}</h3><p className="text-sm text-white/40">{g.exams?.title||"آزمون"}</p></div><div className="text-left"><span className={`badge ${g.status==="approved"?"badge-approved":"badge-pending"}`}>{g.status==="approved"?"تایید شده":"در انتظار"}</span><p className="text-2xl font-bold mt-2">{g.score||"-"}</p></div></div>{g.objection&&<div className="mt-3 p-3 bg-white/5 rounded-xl text-sm"><p className="text-white/60 mb-1">اعتراض:</p><p>{g.objection}</p>{g.status!=="approved"&&<button onClick={()=>{const ns=prompt("نمره جدید:",g.score);if(ns)updateGrade(g.id,ns);}} className="btn-success btn-sm mt-2">بروزرسانی نمره</button>}</div>}</div></GlassCard>)))}</>}

        {tab==="messages"&&<div className="text-center py-10"><Icon d={Icons.msg} size={64} className="mx-auto mb-4 opacity-30"/><p className="text-white/40">سیستم پیام‌رسانی</p></div>}
      </div>

      <div className="bottom-nav">
        <div className={`nav-item ${tab==="home"?"active":""}`} onClick={()=>setTab("home")}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==="students"?"active":""}`} onClick={()=>setTab("students")}><Icon d={Icons.users}/><span>دانش‌آموزان</span></div>
        <div className={`nav-item ${tab==="grades"?"active":""}`} onClick={()=>setTab("grades")}><Icon d={Icons.grade}/><span>نمرات</span></div>
        <div className={`nav-item ${tab==="messages"?"active":""}`} onClick={()=>setTab("messages")}><Icon d={Icons.msg}/><span>پیام‌ها</span></div>
      </div>

      {modal==="exam"&&<Modal title="ساخت آزمون جدید" onClose={()=>setModal(null)}><div className="space-y-4"><input className="glass-input" placeholder="عنوان آزمون" value={formData.title||""} onChange={e=>setFormData({...formData,title:e.target.value})}/><textarea className="glass-input" placeholder="توضیحات (اختیاری)" value={formData.desc||""} onChange={e=>setFormData({...formData,desc:e.target.value})}/><button onClick={createExam} className="btn-primary">ساخت آزمون</button></div></Modal>}

      {modal==="grade"&&<Modal title="ثبت نمره" onClose={()=>setModal(null)}><div className="space-y-4"><select className="glass-input" value={formData.student_id||""} onChange={e=>setFormData({...formData,student_id:e.target.value})}><option value="">انتخاب دانش‌آموز</option>{students.map(s=><option key={s.id} value={s.id}>{s.full_name}</option>)}</select><select className="glass-input" value={formData.exam_id||""} onChange={e=>setFormData({...formData,exam_id:e.target.value})}><option value="">انتخاب آزمون</option>{exams.map(e=><option key={e.id} value={e.id}>{e.title}</option>)}</select><input className="glass-input" type="number" placeholder="نمره" value={formData.score||""} onChange={e=>setFormData({...formData,score:e.target.value})}/><button onClick={addGrade} className="btn-primary">ثبت نمره</button></div></Modal>}
    </div>
  );
}

function StudentPanel({user,tab,setTab,onLogout}){
  const [exams,setExams]=useState([]);
  const [grades,setGrades]=useState([]);
  const [modal,setModal]=useState(null);
  const [objectionText,setObjectionText]=useState("");

  useEffect(()=>{loadData();},[]);

  const loadData=async()=>{
    const {data:e}=await SB.from("exams").select("*").order("created_at",{ascending:false});
    const {data:g}=await SB.from("grades").select("*,exams(title)").eq("student_id",user.id);
    if(e) setExams(e);
    if(g) setGrades(g);
  };

  const submitObjection=async(gradeId)=>{
    if(!objectionText) return;
    await SB.from("grades").update({objection:objectionText,status:"pending"}).eq("id",gradeId);
    setModal(null);setObjectionText("");loadData();
  };

  return(
    <div className="min-h-screen pb-20">
      <div className="header">
        <div className="header-content">
          <div>
            <h1 className="text-xl font-bold text-white">پنل دانش‌آموز</h1>
            <p className="text-xs text-white/40">{user?.full_name}</p>
          </div>
          <button onClick={onLogout} className="p-2 rounded-xl bg-white/5 hover:bg-white/10"><Icon d={Icons.logout} size={20}/></button>
        </div>
      </div>

      <div className="scroll-container">
        {tab==="home"&&<><div className="glass-light p-5 mb-6 rounded-2xl"><h2 className="text-lg font-bold mb-2">خوش آمدی! 👋</h2><p className="text-white/60 text-sm">می‌توانی آزمون‌ها را مشاهده کنی و نمرات خود را بررسی کنی.</p></div>
        <h2 className="text-lg font-bold mb-4">آزمون‌های موجود</h2>
        {exams.length===0?<div className="empty-state"><Icon d={Icons.exam} size={64}/><p>هنوز آزمونی ثبت نشده</p></div>:
        exams.map(ex=>(<GlassCard key={ex.id} className="mb-3"><h3 className="font-bold text-white">{ex.title}</h3><p className="text-sm text-white/40 mt-1">{ex.description||"بدون توضیحات"}</p><div className="mt-3 flex gap-2"><button className="btn-primary btn-sm">شرکت در آزمون</button></div></GlassCard>)))}</>}

        {tab==="grades"&&<><h2 className="text-lg font-bold mb-4">نمرات من</h2>
        {grades.length===0?<div className="empty-state"><Icon d={Icons.grade} size={64}/><p>هنوز نمره‌ای ثبت نشده</p></div>:
        grades.map(g=>(<GlassCard key={g.id} className="mb-3"><div className="flex justify-between items-start"><div><h3 className="font-bold">{g.exams?.title||"آزمون"}</h3><p className="text-sm text-white/40 mt-1">وضعیت: {g.status==="approved"?"تایید شده":"در انتظار بررسی"}</p></div><div className="text-left"><span className="text-3xl font-black">{g.score||"-"}</span></div></div>{g.objection&&g.status!=="approved"&&<div className="mt-3 p-3 bg-yellow-500/10 border border-yellow-500/20 rounded-xl text-sm"><p className="text-yellow-300">اعتراض شما ثبت شده و در حال بررسی است</p></div>}
        {g.status==="approved"&&!g.objection&&<button onClick={()=>setModal(g.id)} className="btn-warning btn-sm mt-3 w-full">درخواست بررسی مجدد</button>}</div></GlassCard>)))}</>}

        {tab==="messages"&&<div className="space-y-3"><h2 className="text-lg font-bold mb-4">پیام‌ها</h2><GlassCard><div className="flex items-start gap-3"><div className="w-10 h-10 rounded-full bg-gradient-to-br from-violet-500 to-purple-700 flex items-center justify-center font-bold">م</div><div><h3 className="font-bold text-sm">مدیریت مدرسه</h3><p className="text-sm text-white/60 mt-1">به سامانه خوش آمدید</p><span className="text-xs text-white/30 mt-2 block">امروز</span></div></div></GlassCard></div>}
      </div>

      <div className="bottom-nav">
        <div className={`nav-item ${tab==="home"?"active":""}`} onClick={()=>setTab("home")}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==="grades"?"active":""}`} onClick={()=>setTab("grades")}><Icon d={Icons.grade}/><span>نمرات</span></div>
        <div className={`nav-item ${tab==="messages"?"active":""}`} onClick={()=>setTab("messages")}><Icon d={Icons.msg}/><span>پیام‌ها</span></div>
      </div>

      {modal&&<Modal title="درخواست بررسی مجدد" onClose={()=>setModal(null)}><div className="space-y-4"><p className="text-sm text-white/60">دلیل درخواست خود را برای بررسی مجدد نمره بنویسید:</p><textarea className="glass-input" placeholder="متن اعتراض..." value={objectionText} onChange={e=>setObjectionText(e.target.value)}/><button onClick={()=>submitObjection(modal)} className="btn-primary flex items-center justify-center gap-2"><Icon d={Icons.send} size={18}/>ارسال درخواست</button></div></Modal>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
