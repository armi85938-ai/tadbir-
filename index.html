function App(){
  const [user,setUser]=useState(null);
  const [view,setView]=useState('login');
  const [tab,setTab]=useState('home');
  useEffect(()=>{
    const s=sessionStorage.getItem('edu_user');
    if(s){const u=JSON.parse(s);setUser(u);setView(u.role);}
  },[]);
  const login=async(un,pw)=>{
    const {data}=await SB.from('users').select('*').eq('username',un.toUpperCase()).eq('password',pw).single();
    if(data){setUser(data);sessionStorage.setItem('edu_user',JSON.stringify(data));setView(data.role);return true;}
    return false;
  };
  const logout=()=>{setUser(null);setView('login');setTab('home');sessionStorage.removeItem('edu_user');};
  if(view==='login') return <Login onLogin={login}/>;
  if(view==='admin') return <Admin user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
  return <Student user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
}

function Login({onLogin}){
  const [un,setUn]=useState('');const [pw,setPw]=useState('');const [err,setErr]=useState('');const [ld,setLd]=useState(false);
  const submit=async(e)=>{
    e.preventDefault();setLd(true);setErr('');
    const ok=await onLogin(un,pw);
    if(!ok) setErr('نام کاربری یا رمز عبور اشتباه است');

  };
  return(
    <div className="min-h-screen flex items-center justify-center p-6 fade-in relative overflow-hidden">
      <div className="absolute top-0 left-0 w-full h-full pointer-events-none">
        <div className="absolute top-20 left-10 w-40 h-40 bg-purple-500 rounded-full blur-3xl opacity-30 animate-pulse"></div>
        <div className="absolute bottom-20 right-10 w-48 h-48 bg-pink-500 rounded-full blur-3xl opacity-30 animate-pulse" style={{animationDelay:'1s'}}></div>
        <div className="absolute top-1/2 left-1/2 w-32 h-32 bg-blue-500 rounded-full blur-3xl opacity-20 animate-pulse" style={{animationDelay:'2s'}}></div>
      </div>
      <div className="w-full max-w-sm relative z-10">
        <div className="text-center mb-8 slide-up">
          <div className="w-28 h-28 mx-auto mb-6 rounded-3xl bg-gradient-to-br from-purple-500 via-pink-500 to-blue-500 flex items-center justify-center shadow-2xl shadow-purple-500/50 rotate-3 hover:rotate-0 transition-all duration-500">
            <Icon d={Icons.book} size={50} color="white" className="icon-glow"/>
          </div>
          <h1 className="text-4xl font-black mb-3 gradient-text">سامانه آموزشی</h1>
          <p className="text-white/50 text-sm">ورود به پنل کاربری</p>
        </div>
        <div className="glass-strong p-6 slide-up">
          <form onSubmit={submit} className="space-y-4">
            {err&&<div className="bg-red-500/20 border border-red-500/30 rounded-xl p-3 text-red-300 text-sm text-center fade-in">{err}</div>}
            <input className="glass-input" placeholder="نام کاربری" value={un} onChange={e=>setUn(e.target.value)} required/>
            <input className="glass-input" type="password" placeholder="رمز عبور" value={pw} onChange={e=>setPw(e.target.value)} required/>
            <button type="submit" className="btn-primary" disabled={ld}>
              {ld?<span className="flex items-center justify-center gap-2"><div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>در حال ورود...</span>:'ورود به سامانه'}
            </button>

  );
}

function CircularTimer({timeLeft,totalTime}){
  const radius=50;
  const circumference=2*Math.PI*radius;
  const progress=(timeLeft/totalTime)*circumference;
  const minutes=Math.floor(timeLeft/60);
  const seconds=timeLeft%60;
  const isWarning=timeLeft<300;
  const color=isWarning?'#f5576c':timeLeft<600?'#fee140':'#4facfe';
  return(
    <div className="timer-circle">
      <svg width="120" height="120">
        <circle className="bg" cx="60" cy="60" r={radius}/>
        <circle className="progress" cx="60" cy="60" r={radius} stroke={color} strokeDasharray={circumference} strokeDashoffset={circumference-progress} style={isWarning?{animation:'pulse-glow 1s infinite'}:{}}/>
      </svg>
      <div className="timer-text">
        <div className={`text-2xl font-bold font-mono ${isWarning?'text-red-400 animate-pulse':'text-white'}`}>
          {minutes}:{seconds<10?'0':''}{seconds}
        </div>
        <div className="text-xs text-white/50">باقی‌مانده</div>
      </div>
    </div>
  );
}

function Student({user,tab,setTab,onLogout}){
  const [exams,setExams]=useState([]);
  const [answers,setAnswers]=useState([]);
  const [activeExam,setActiveExam]=useState(null);
  const [currentQ,setCurrentQ]=useState(0);
  const [studentAnswers,setStudentAnswers]=useState({});
  const [timeLeft,setTimeLeft]=useState(0);
  const [totalTime,setTotalTime]=useState(0);
  const [showCalc,setShowCalc]=useState(false);
  const [calcDisplay,setCalcDisplay]=useState('');
  const [showObjection,setShowObjection]=useState(null);
  const [objectionText,setObjectionText]=useState('');
  const chartRef=useRef(null);
  const [chartReady,setChartReady]=useState(false);

  useEffect(()=>{loadAll();},[]);

  const loadAll=async()=>{
    const {data:e}=await SB.from('exams').select('*,questions(*)').order('created_at',{ascending:false});
    const {data:a}=await SB.from('answers').select('*,exams(title),questions(q_text,q_type,correct_opt)').eq('student_id',user.id);
    if(e) setExams(e.filter(ex=>ex.assigned_to==='all'||ex.assigned_to===user.id));
    if(a) setAnswers(a);
  };

  const hasTakenExam=(examId)=>{
    return answers.some(a=>a.exam_id===examId);
  };

  const startExam=(exam)=>{
    if(hasTakenExam(exam.id)){alert('شما قبلاً در این آزمون شرکت کرده‌اید!');return;}
    const total=exam.duration_minutes*60;
    setActiveExam(exam);setCurrentQ(0);setStudentAnswers({});setTimeLeft(total);setTotalTime(total);
  };

  useEffect(()=>{
    if(activeExam&&timeLeft>0){
      const t=setInterval(()=>setTimeLeft(tl=>tl-1),1000);
      return ()=>clearInterval(t);
    }else if(activeExam&&timeLeft===0){
      submitExam();
    }
  },[activeExam,timeLeft]);

  const submitExam=async()=>{
    if(!activeExam) return;
    for(const q of activeExam.questions){
      const ans=studentAnswers[q.id]||'';
      let score=0;
      if(q.q_type==='test'&&q.correct_opt&&ans===q.correct_opt) score=1;
      await SB.from('answers').insert({
        exam_id:activeExam.id,student_id:user.id,question_id:q.id,
        student_answer:ans,score:score,max_score:1,status:q.q_type==='test'?'graded':'pending'
      });
    }
    alert('پاسخ‌ها ثبت شد!');
    setActiveExam(null);loadAll();
  };

  const formatTime=(s)=>{const m=Math.floor(s/60);const sec=s%60;return `${m}:${sec<10?'0':''}${sec}`;};

  const calcPress=(v)=>{
    if(v==='C') setCalcDisplay('');
    else if(v==='='){try{setCalcDisplay(eval(calcDisplay).toString());}catch{setCalcDisplay('Error');}}
    else setCalcDisplay(calcDisplay+v);
  };

  const submitObjection=async()=>{
    if(!objectionText.trim()||!showObjection) return;
    await SB.from('answers').update({objection:objectionText,objection_count:1}).eq('id',showObjection.id);
    alert('اعتراض شما ثبت شد و به مدیر ارسال می‌شود');setShowObjection(null);setObjectionText('');loadAll();
  };

  const getAverage=()=>{
    const graded=answers.filter(a=>a.status==='graded');
    if(graded.length===0) return 0;
    const total=graded.reduce((s,a)=>s+parseFloat(a.score||0),0);
    return (total/graded.length).toFixed(2);
  };

  useEffect(()=>{
    if(tab==='chart'&&chartReady&&answers.length>0){
      const ctx=document.getElementById('gradeChart');
      if(ctx){
        if(window.myChart) window.myChart.destroy();
        const graded=answers.filter(a=>a.status==='graded');
        window.myChart=new Chart(ctx,{
          type:'line',
          data:{
            labels:graded.map((a,i)=>a.exams?.title||`آزمون ${i+1}`),
            datasets:[{
              label:'نمره',
              data:graded.map(a=>parseFloat(a.score||0)),
              borderColor:'#667eea',
              backgroundColor:'rgba(102,126,234,0.2)',
              tension:0.4,
              fill:true,
              pointBackgroundColor:'#667eea',
              pointBorderColor:'#fff',
              pointBorderWidth:2,
              pointRadius:6
            }]
          },
          options:{
            responsive:true,
            plugins:{legend:{labels:{color:'white',font:{family:'Vazirmatn'}}}},
            scales:{
              y:{ticks:{color:'white',font:{family:'Vazirmatn'}},grid:{color:'rgba(255,255,255,0.1)'},beginAtZero:true,max:1},
              x:{ticks:{color:'white',font:{family:'Vazirmatn'},maxRotation:45},grid:{color:'rgba(255,255,255,0.1)'}}
            }
          }
        });
      }
    }
  },[tab,chartReady,answers]);

  if(activeExam){
    const q=activeExam.questions[currentQ];
    const progress=((currentQ+1)/activeExam.questions.length)*100;
    return(
      <div className="min-h-screen bg-slate-900">
        <div className="header">
          <div className="flex justify-between items-center mb-4">
            <div>
              <h2 className="font-bold text-lg">{activeExam.title}</h2>
              <p className="text-xs text-white/40 mt-1">سوال {currentQ+1} از {activeExam.questions.length}</p>
            </div>
            <CircularTimer timeLeft={timeLeft} totalTime={totalTime}/>
          </div>
          <div className="w-full bg-white/10 rounded-full h-2">
            <div className="bg-gradient-to-r from-purple-500 to-pink-500 h-2 rounded-full transition-all duration-300" style={{width:`${progress}%`}}></div>
          </div>
        </div>
        {timeLeft<300&&timeLeft>0&&<div className="bg-red-500/20 border-2 border-red-500/50 text-red-300 p-4 text-center text-sm font-bold animate-pulse">️ عجله کن! کمتر از ۵ دقیقه زمان داری!</div>}
        <div className="content">
          <div className="card">
            <div className="flex items-center gap-2 mb-4">
              <span className={`badge ${q?.q_type==='test'?'badge-new':'badge-approved'}`}>{q?.q_type==='test'?' سوال تستی':'✍️ سوال تشریحی'}</span>
            </div>
            <p className="mb-6 font-bold text-lg leading-relaxed">{q?.q_text}</p>
            {q?.q_type==='test'?(
              <div className="space-y-3">
                {['A','B','C','D'].map(opt=>(
                  <div key={opt} className={`p-4 rounded-xl cursor-pointer border-2 transition-all ${studentAnswers[q.id]===opt?'bg-purple-600/30 border-purple-500 shadow-lg shadow-purple-500/20':'bg-white/5 border-white/10 hover:border-purple-500/50'}`} onClick={()=>setStudentAnswers({...studentAnswers,[q.id]:opt})}>
                    <div className="flex items-center gap-3">
                      <div className={`w-10 h-10 rounded-full border-2 flex items-center justify-center font-bold transition-all ${studentAnswers[q.id]===opt?'bg-purple-600 border-purple-600 scale-110':'border-white/30'}`}>{opt}</div>
                      <span className="flex-1">{q[`opt_${opt.toLowerCase()}`]}</span>
                      {studentAnswers[q.id]===opt&&<Icon d={Icons.check} size={20} className="text-purple-400"/>}
                    </div>
                  </div>
                ))}
              </div>
            ):(
              <textarea className="glass-input" placeholder="پاسخ خود را بنویسید..." value={studentAnswers[q.id]||''} onChange={e=>setStudentAnswers({...studentAnswers,[q.id]:e.target.value})} rows="6"/>
            )}
          </div>
          <div className="flex gap-2 mt-4">
            {currentQ>0&&<button onClick={()=>setCurrentQ(currentQ-1)} className="btn-primary bg-white/10 flex-1">قبلی</button>}
            {currentQ<activeExam.questions.length-1?<button onClick={()=>setCurrentQ(currentQ+1)} className="btn-primary flex-1">بعدی</button>:
            <button onClick={()=>{if(confirm('ثبت نهایی آزمون؟'))submitExam();}} className="btn-success flex-1">ثبت نهایی</button>}
          </div>
          <button onClick={()=>setShowCalc(true)} className="btn-primary bg-white/10 mt-3 w-full flex items-center justify-center gap-2"><Icon d={Icons.calc} size={18}/>ماشین‌حساب</button>
        </div>
        {showCalc&&(
          <div className="modal-overlay" onClick={()=>setShowCalc(false)}>
            <div className="glass-strong p-4 w-72 slide-up" onClick={e=>e.stopPropagation()}>
              <div className="flex justify-between items-center mb-3">
                <h3 className="font-bold">ماشین‌حساب</h3>
                <button onClick={()=>setShowCalc(false)} className="p-2 bg-white/10 rounded-xl"><Icon d={Icons.x} size={18}/></button>
              </div>
              <div className="bg-black/40 p-4 rounded-xl text-2xl text-left mb-4 font-mono h-16 flex items-center justify-end overflow-x-auto border border-white/10">{calcDisplay||'0'}</div>
              <div className="grid grid-cols-4 gap-2">
                {['7','8','9','/','4','5','6','*','1','2','3','-','C','0','=','+'].map(b=><button key={b} onClick={()=>calcPress(b)} className={`calc-btn ${['/','*','-','+'].includes(b)?'operator':''} ${b==='='?'equals':''}`}>{b}</button>)}
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  return(
    <div className="min-h-screen pb-24">
      <div className="header">
        <div className="flex justify-between items-center">
          <div><h1 className="text-xl font-bold gradient-text">پنل دانش‌آموز</h1><p className="text-xs text-white/40 mt-1">{user.full_name}</p></div>
          <button onClick={onLogout} className="p-3 bg-white/5 rounded-xl"><Icon d={Icons.logout} size={20}/></button>
        </div>
      </div>

      <div className="content">
        {tab==='home'&&(
          <>
            <div className="stat-card mb-6 slide-up">
              <Icon d={Icons.award} size={40} className="mx-auto mb-2 text-yellow-400 icon-glow"/>
              <p className="text-3xl font-bold gradient-text">{getAverage()}</p>
              <p className="text-xs text-white/50">معدل کل شما</p>
            </div>

            <h3 className="font-bold mb-3">آزمون‌های موجود ({exams.length})</h3>
            {exams.length===0?<div className="card text-center py-12 text-white/40"><Icon d={Icons.exam} size={64} className="mx-auto mb-3 opacity-30"/><p>آزمونی ندارید</p></div>:
            exams.map(ex=>{
              const taken=hasTakenExam(ex.id);
              return(
                <div key={ex.id} className={`card slide-up ${taken?'disabled':''}`}>
                  <h4 className="font-bold text-lg mb-1">{ex.title}</h4>
                  <p className="text-sm text-white/50 mb-3">{ex.description||'بدون توضیحات'}</p>
                  <div className="flex gap-2 flex-wrap mb-3">
                    <span className="badge badge-new"><Icon d={Icons.clock} size={12} className="inline ml-1"/>{ex.duration_minutes} دقیقه</span>
                    <span className="badge badge-approved">{ex.questions?.length||0} سوال</span>
                    {taken&&<span className="badge badge-pending">شرکت کرده‌اید</span>}
                  </div>
                  {taken?(
                    <div className="text-center py-2 text-white/40 text-sm">شما قبلاً در این آزمون شرکت کرده‌اید</div>
                  ):(
                    <button onClick={()=>startExam(ex)} className="btn-primary btn-sm shimmer">شروع آزمون</button>
                  )}
                </div>
              );
            })}
          </>
        )}

        {tab==='grades'&&(
          <>
            <div className="stat-card mb-6 slide-up">
              <Icon d={Icons.chart} size={40} className="mx-auto mb-2 text-blue-400 icon-glow"/>
              <p className="text-3xl font-bold gradient-text">{getAverage()}</p>
              <p className="text-xs text-white/50">معدل کل</p>
            </div>

            <h3 className="font-bold mb-3">نمرات من ({answers.length})</h3>
            {answers.length===0?<div className="card text-center py-12 text-white/40"><p>نمره‌ای ثبت نشده</p></div>:
            answers.map(a=>(
              <div key={a.id} className="card">
                <div className="flex justify-between items-start mb-2">
                  <div className="flex-1">
                    <h4 className="font-bold">{a.exams?.title||'آزمون'}</h4>
                    <p className="text-xs text-white/40 mt-1 line-clamp-2">{a.questions?.q_text}</p>
                  </div>
                  <div className="text-left">
                    <span className={`badge ${a.status==='graded'?'badge-approved':'badge-pending'}`}>{a.status==='graded'?'تصحیح شده':'در انتظار'}</span>
                    <p className="text-3xl font-bold mt-2 gradient-text">{a.score??'-'}</p>
                  </div>
                </div>
                {a.objection&&a.status!=='graded'&&<div className="bg-pink-500/10 border border-pink-500/30 rounded-xl p-3 text-xs text-pink-300 mt-2">اعتراض شما در حال بررسی است</div>}
                {a.status==='graded'&&!a.objection&&(
                  <button onClick={()=>setShowObjection(a)} className="objection-btn btn-glow mt-3 w-full flex items-center justify-center gap-2">
                    <Icon d={Icons.alert} size={18}/>درخواست بررسی مجدد
                  </button>
                )}
              </div>
            ))}
          </>
        )}

        {tab==='chart'&&(
          <>
            <div className="stat-card mb-6 slide-up">
              <Icon d={Icons.chart} size={40} className="mx-auto mb-2 text-purple-400 icon-glow"/>
              <p className="text-3xl font-bold gradient-text">{getAverage()}</p>
              <p className="text-xs text-white/50">معدل کل</p>
            </div>
            <div className="glass-strong p-4 mb-4">
              <h3 className="font-bold mb-4 text-center">نمودار پیشرفت تحصیلی</h3>
              {answers.filter(a=>a.status==='graded').length===0?<p className="text-center text-white/40 py-8">هنوز نمره‌ای ثبت نشده</p>:<canvas id="gradeChart"></canvas>}
            </div>
            {!chartReady&&answers.filter(a=>a.status==='graded').length>0&&<button onClick={()=>setChartReady(true)} className="btn-primary">نمایش نمودار</button>}
            <div className="glass p-4 mt-4">
              <h4 className="font-bold mb-3">آمار کلی</h4>
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-white/5 rounded-xl p-3 text-center">
                  <p className="text-2xl font-bold text-purple-400">{answers.length}</p>
                  <p className="text-xs text-white/50">کل آزمون‌ها</p>
                </div>
                <div className="bg-white/5 rounded-xl p-3 text-center">
                  <p className="text-2xl font-bold text-blue-400">{answers.filter(a=>a.status==='graded').length}</p>
                  <p className="text-xs text-white/50">تصحیح شده</p>
                </div>
              </div>
            </div>
          </>
        )}

        {tab==='tools'&&(
          <>
            <h3 className="font-bold mb-4">ابزارهای کاربردی</h3>
            <button onClick={()=>setShowCalc(true)} className="btn-primary w-full flex items-center justify-center gap-2 mb-3 shimmer">
              <Icon d={Icons.calc} size={20}/>ماشین‌حساب
            </button>
            <div className="glass p-4 text-center">
              <Icon d={Icons.list} size={40} className="mx-auto mb-2 text-blue-400 icon-glow"/>
              <p className="font-bold mb-1">چک‌لیست و یادآور</p>
              <p className="text-xs text-white/50">به زودی اضافه می‌شود</p>
            </div>
          </>
        )}
      </div>

      <div className="nav-bar">
        <div className={`nav-item ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==='grades'?'active':''}`} onClick={()=>setTab('grades')}><Icon d={Icons.grade}/><span>نمرات</span></div>
        <div className={`nav-item ${tab==='chart'?'active':''}`} onClick={()=>setTab('chart')}><Icon d={Icons.chart}/><span>کارنامه</span></div>
        <div className={`nav-item ${tab==='tools'?'active':''}`} onClick={()=>setTab('tools')}><Icon d={Icons.calc}/><span>ابزارها</span></div>
      </div>

      {showCalc&&(
        <div className="modal-overlay" onClick={()=>setShowCalc(false)}>
          <div className="glass-strong p-4 w-72 slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-3">
              <h3 className="font-bold">ماشین‌حساب</h3>
              <button onClick={()=>setShowCalc(false)} className="p-2 bg-white/10 rounded-xl"><Icon d={Icons.x} size={18}/></button>
            </div>
            <div className="bg-black/40 p-4 rounded-xl text-2xl text-left mb-4 font-mono h-16 flex items-center justify-end overflow-x-auto border border-white/10">{calcDisplay||'0'}</div>
            <div className="grid grid-cols-4 gap-2">
              {['7','8','9','/','4','5','6','*','1','2','3','-','C','0','=','+'].map(b=><button key={b} onClick={()=>calcPress(b)} className={`calc-btn ${['/','*','-','+'].includes(b)?'operator':''} ${b==='='?'equals':''}`}>{b}</button>)}
            </div>
          </div>
        </div>
      )}

      {showObjection&&(
        <div className="modal-overlay" onClick={()=>setShowObjection(null)}>
          <div className="glass-strong w-full max-w-md p-6 slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-xl font-bold gradient-text">درخواست بررسی مجدد</h3>
              <button onClick={()=>setShowObjection(null)} className="p-2 bg-white/10 rounded-xl"><Icon d={Icons.x} size={20}/></button>
            </div>
            <div className="bg-pink-500/10 border border-pink-500/30 rounded-xl p-3 mb-4 text-sm text-pink-300">⚠️ فقط یکبار می‌توانید اعتراض بزنید</div>
            <textarea className="glass-input mb-4" placeholder="دلیل اعتراض خود را بنویسید..." value={objectionText} onChange={e=>setObjectionText(e.target.value)} rows="4"/>
            <button onClick={submitObjection} className="objection-btn btn-glow flex items-center justify-center gap-2"><Icon d={Icons.send} size={18}/>ارسال اعتراض به مدیر</button>
          </div>
        </div>
      )}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
