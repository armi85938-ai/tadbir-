*{font-family:'Vazirmatn',sans-serif;margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.btn-glass-success{background:linear-gradient(135deg,rgba(16,185,129,0.25),rgba(5,150,105,0.25));border-color:rgba(52,211,153,0.4)}

.tool-btn{background:rgba(255,255,255,0.03);border:2px solid rgba(255,255,255,0.08);border-radius:24px;padding:24px 16px;text-align:center;cursor:pointer;transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);position:relative;overflow:hidden}
.tool-btn::before{content:'';position:absolute;inset:0;border-radius:24px;opacity:0;transition:opacity 0.5s}
.tool-btn:hover::before,.tool-btn.active::before{opacity:1}
.tool-btn.active{transform:translateY(-8px) scale(1.05);border-color:transparent}
.tool-btn.calc::before{background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(168,85,247,0.15))}
.tool-btn.calc.active{box-shadow:0 12px 40px rgba(99,102,241,0.4),0 0 80px rgba(99,102,241,0.2)}
.tool-btn.check::before{background:linear-gradient(135deg,rgba(16,185,129,0.2),rgba(52,211,153,0.15))}
.tool-btn.check.active{box-shadow:0 12px 40px rgba(16,185,129,0.4),0 0 80px rgba(16,185,129,0.2)}
.tool-btn.plan::before{background:linear-gradient(135deg,rgba(245,158,11,0.2),rgba(251,191,36,0.15))}
.tool-btn.plan.active{box-shadow:0 12px 40px rgba(245,158,11,0.4),0 0 80px rgba(245,158,11,0.2)}

.tool-btn.game.active{box-shadow:0 12px 40px rgba(236,72,153,0.4),0 0 80px rgba(236,72,153,0.2)}
.tool-icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;position:relative;z-index:1;transition:all 0.5s}
.tool-btn:hover .tool-icon,.tool-btn.active .tool-icon{transform:scale(1.15) rotate(5deg)}
.tool-btn.calc .tool-icon{background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 6px 20px rgba(99,102,241,0.5)}
.tool-btn.check .tool-icon{background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 6px 20px rgba(16,185,129,0.5)}
.tool-btn.plan .tool-icon{background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 6px 20px rgba(245,158,11,0.5)}
.tool-btn.game .tool-icon{background:linear-gradient(135deg,#ec4899,#f472b6);box-shadow:0 6px 20px rgba(236,72,153,0.5)}
.tool-label{font-size:14px;font-weight:800;position:relative;z-index:1}

.fade-in{animation:fadeIn 0.4s ease-out}
.slide-up{animation:slideUp 0.5s cubic-bezier(0.16,1,0.3,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:16px;margin-bottom:12px;transition:all 0.3s}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,0.3);border-color:rgba(129,140,248,0.2)}

.header{position:sticky;top:0;z-index:40;background:rgba(10,10,26,0.9);backdrop-filter:blur(30px);border-bottom:1px solid rgba(255,255,255,0.06);padding:16px 20px}
.content{padding:16px;padding-bottom:100px;max-width:600px;margin:0 auto;position:relative;z-index:1}

.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.badge-pending{background:rgba(251,146,60,0.15);color:#fb923c;border:1px solid rgba(251,146,60,0.25)}

.gradient-text{background:linear-gradient(135deg,#818cf8,#c084fc,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.nav-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,26,0.95);backdrop-filter:blur(30px);border-top:1px solid rgba(255,255,255,0.06);padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:50}

/* ===== Chat Styles ===== */
.chat-bubble{padding:10px 14px;border-radius:16px;max-width:85%;margin-bottom:8px;font-size:13px;line-height:1.6;word-break:break-word;position:relative;animation:chatIn 0.3s ease-out}
.chat-bubble.me{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-bottom-left-radius:4px;margin-right:auto}
.chat-bubble.other{background:rgba(255,255,255,0.08);border-bottom-right-radius:4px;margin-left:auto}
.chat-bubble.edited::after{content:' ✏️';font-size:9px;opacity:0.5}
.chat-bubble.deleting{animation:chatOut 0.3s ease-out forwards}
@keyframes chatIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes chatOut{to{opacity:0;transform:scale(0.8)}}

.chat-actions{display:flex;gap:4px;margin-top:4px;opacity:0;transition:opacity 0.2s}
.chat-bubble:hover .chat-actions{opacity:1}
.chat-action-btn{background:rgba(0,0,0,0.3);border:none;color:white;padding:4px 8px;border-radius:8px;font-size:10px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:3px}

.reaction-bar{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.reaction-chip{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:2px 8px;font-size:12px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:4px}
.reaction-chip:hover{background:rgba(129,140,248,0.2);transform:scale(1.05)}

.reaction-picker{position:absolute;bottom:100%;background:rgba(15,15,35,0.98);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:8px;display:flex;gap:4px;margin-bottom:8px;z-index:20;animation:popIn 0.2s ease-out}

.reaction-emoji-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all 0.2s;border:none}
.reaction-emoji-btn:hover{background:rgba(129,140,248,0.2);transform:scale(1.2)}

.emoji-picker{position:absolute;bottom:100%;left:0;background:rgba(15,15,35,0.98);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:12px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px;z-index:10;animation:popIn 0.2s ease-out}
.emoji-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all 0.2s;border:none}
.emoji-btn:hover{background:rgba(129,140,248,0.2);transform:scale(1.15)}

/* ===== XO Game Styles ===== */
.xo-board-container{background:linear-gradient(135deg,rgba(99,102,241,0.1),rgba(236,72,153,0.1));border-radius:24px;padding:20px;position:relative;overflow:hidden}
.xo-board-container::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(129,140,248,0.1),transparent 70%);pointer-events:none}

.xo-cell-new{aspect-ratio:1;background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.1);border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden}
.xo-cell-new::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,0.1),transparent);opacity:0;transition:opacity 0.3s}
.xo-cell-new:hover:not(.filled)::before{opacity:1}

.xo-cell-new.filled{cursor:not-allowed}

.xo-svg{width:70%;height:70%}
.xo-line{stroke-width:8;stroke-linecap:round;fill:none;stroke-dasharray:100;stroke-dashoffset:100}
.x-line{stroke:#818cf8;filter:drop-shadow(0 0 8px rgba(129,140,248,0.6))}
.o-line{stroke:#f472b6;filter:drop-shadow(0 0 8px rgba(244,114,182,0.6))}
.animate-draw{animation:drawLine 0.4s ease-out forwards}
.animate-draw-delay{animation:drawLine 0.4s ease-out 0.15s forwards}

.xo-circle{stroke:#f472b6;stroke-width:8;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(244,114,182,0.6));stroke-dasharray:188;stroke-dashoffset:188;animation:drawCircleAnim 0.5s ease-out forwards}
@keyframes drawCircleAnim{to{stroke-dashoffset:0}}

.xo-status{background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(236,72,153,0.15));border:1px solid rgba(129,140,248,0.2);border-radius:16px;padding:12px;text-align:center;margin-bottom:16px;transition:all 0.3s}
.xo-status.my-turn{border-color:rgba(52,211,153,0.4);box-shadow:0 0 20px rgba(52,211,153,0.1)}

.score-card.active{border-color:rgba(129,140,248,0.4);box-shadow:0 0 20px rgba(129,140,248,0.2)}
.score-card .score-value{font-size:28px;font-weight:900;background:linear-gradient(135deg,#818cf8,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Toast */
.toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:rgba(15,15,35,0.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:16px;padding:14px 20px;min-width:280px;box-shadow:0 10px 40px rgba(0,0,0,0.5);animation:toastIn 0.4s cubic-bezier(0.16,1,0.3,1);display:flex;align-items:center;gap:12px;pointer-events:auto}
.toast.success{border-color:rgba(52,211,153,0.4)}

.toast.warning{border-color:rgba(251,191,36,0.4)}
.toast-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast.success .toast-icon{background:linear-gradient(135deg,#10b981,#34d399)}
.toast.error .toast-icon{background:linear-gradient(135deg,#ef4444,#f87171)}
.toast.warning .toast-icon{background:linear-gradient(135deg,#f59e0b,#fbbf24)}

@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}

/* Calendar */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}

.game-card{background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.08);border-radius:20px;padding:20px;text-align:center;cursor:pointer;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1)}

/* Victory overlay */

.victory-text{font-size:48px;font-weight:900;background:linear-gradient(135deg,#818cf8,#c084fc,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px;animation:victoryBounce 0.6s ease-out}
@keyframes victoryBounce{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}

<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,createContext,useContext}=React;
const SB=window.supabase.createClient("https://ixdsctccqvljdtnjfebt.supabase.co","sb_publishable_KW1w2BRKZ1ig0-b57oVw6A_G2UIAa0h");

const TADBIR_EMOJIS=['🎓','📚','✨','🌟','💡','🏆','🎯','🚀','💪','👏','🔥','💎','🌈','⭐','🎨','📖','✏️','🧠'];
const REACTION_EMOJIS=['❤️','👍','😂','😮','😢','🔥','🎉','💯'];

const ToastContext=createContext();
function ToastProvider({children}){
  const [toasts,setToasts]=useState([]);
  const showToast=(message,type='success')=>{
    const id=Date.now()+Math.random();
    setToasts(t=>[...t,{id,message,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3500);
  };
  return(
    <ToastContext.Provider value={showToast}>
      {children}
      <div className="toast-container">
        {toasts.map(t=>(
          <div key={t.id} className={`toast ${t.type}`}>
            <div className="toast-icon">
              {t.type==='success'&&<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path d="M20 6L9 17l-5-5"/></svg>}
              {t.type==='error'&&<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path d="M18 6L6 18M6 6l12 12"/></svg>}
              {t.type==='warning'&&<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path d="M12 9v4M12 17h.01"/></svg>}
            </div>
            <div className="toast-content">{t.message}</div>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}
const useToast=()=>useContext(ToastContext);

// Jalali Calendar
function toJalali(gy,gm,gd){
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let gy2=(gm>2)?(gy+1):gy;
  let days=355666+(365*gy)+~~((gy2+3)/4)-~~((gy2+99)/100)+~~((gy2+399)/400)+gd+g_d_m[gm-1];
  let jy=-1400+~~((days-1)/1461)*4;
  days%=1461;
  if(days>365){jy+=~~((days-1)/365);days=(days-1)%365;}
  let jm,jd;
  if(days<186){jm=1+~~(days/31);jd=1+(days%31);}
  else{jm=7+~~((days-186)/30);jd=1+((days-186)%30);}
  return{jy,jm,jd};
}
function getJalaliMonthName(m){return['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'][m-1];}
function getJalaliDaysInMonth(jy,jm){if(jm<=6)return 31;if(jm<=11)return 30;const a=[1,5,9,13,17,22,26,30];return a.includes(jy%33)?30:29;}
function getFirstDayOfMonth(jy,jm){
  const today=new Date();
  const jToday=toJalali(today.getFullYear(),today.getMonth()+1,today.getDate());
  const diffDays=(jy-jToday.jy)*365+(jm-jToday.jm)*30;
  const firstG=new Date(today);
  firstG.setDate(firstG.getDate()-jToday.jd+1-diffDays);
  return(firstG.getDay()+1)%7;
}

function PersianCalendar(){
  const today=new Date();
  const jToday=toJalali(today.getFullYear(),today.getMonth()+1,today.getDate());
  const [viewMonth,setViewMonth]=useState(jToday.jm);
  const [viewYear,setViewYear]=useState(jToday.jy);
  const daysInMonth=getJalaliDaysInMonth(viewYear,viewMonth);
  const firstDay=getFirstDayOfMonth(viewYear,viewMonth);
  const days=[];
  for(let i=0;i<firstDay;i++)days.push(null);
  for(let i=1;i<=daysInMonth;i++)days.push(i);
  const prevMonth=()=>{if(viewMonth===1){setViewMonth(12);setViewYear(viewYear-1);}else setViewMonth(viewMonth-1);};
  const nextMonth=()=>{if(viewMonth===12){setViewMonth(1);setViewYear(viewYear+1);}else setViewMonth(viewMonth+1);};
  const goToday=()=>{setViewMonth(jToday.jm);setViewYear(jToday.jy);};

function CircularTimer({timeLeft,totalTime}){
  const r=42,c=2*Math.PI*r,p=(timeLeft/totalTime)*c;

  const col=timeLeft<60?'#ef4444':timeLeft<300?'#f59e0b':'#818cf8';
  return(
    <div className="timer-circle">
      <svg width="100" height="100"><circle className="bg" cx="50" cy="50" r={r}/><circle className="progress" cx="50" cy="50" r={r} stroke={col} strokeDasharray={c} strokeDashoffset={c-p}/></svg>
      <div className="timer-text">
        <div className={`text-2xl font-black font-mono ${timeLeft<60?'text-red-400 animate-pulse':timeLeft<300?'text-amber-400':'text-white'}`}>{m}:{s<10?'0':''}{s}</div>
        <div className="text-[10px] text-white/40 mt-0.5">زمان باقی‌مانده</div>
      </div>
    </div>
  );
}

// ===== XO Game Logic =====
function checkXOWinner(board){
  const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(const [a,b,c] of lines){
    if(board[a]&&board[a]===board[b]&&board[a]===board[c])return{winner:board[a],line:[a,b,c]};
  }
  if(!board.includes('-'))return{winner:'draw',line:null};
  return null;
}

// ربات هوشمند با سطح دشمنی متعادل
function getSmartBotMove(board,botMark){
  const humanMark=botMark==='X'?'O':'X';
  
  // 35% احتمال حرکت تصادفی برای اینکه بازیکن شانس برد داشته باشه
  if(Math.random()<0.35){
    const empty=board.split('').map((c,i)=>c==='-'?i:-1).filter(i=>i>=0);
    // ولی حرکت کاملاً تصادفی هم نه - گاهی مرکز و گوشه رو ترجیح بده
    if(board[4]==='-'&&Math.random()>0.5)return 4;
    return empty[Math.floor(Math.random()*empty.length)];
  }
  
  // Minimax با عمق محدود
  let bestScore=-Infinity;
  let bestMove=-1;
  const empty=[];
  for(let i=0;i<9;i++)if(board[i]==='-')empty.push(i);
  
  for(const i of empty){
    const newBoard=board.substring(0,i)+botMark+board.substring(i+1);
    const score=minimax(newBoard,0,false,botMark,humanMark,5);
    if(score>bestScore){bestScore=score;bestMove=i;}
  }
  return bestMove;
}

function minimax(board,depth,isMaximizing,botMark,humanMark,maxDepth){
  const result=checkXOWinner(board);
  if(result){
    if(result.winner===botMark)return 10-depth;
    if(result.winner===humanMark)return depth-10;
    return 0;
  }
  if(depth>=maxDepth)return 0;
  
  if(isMaximizing){
    let best=-Infinity;
    for(let i=0;i<9;i++){
      if(board[i]==='-'){
        const newBoard=board.substring(0,i)+botMark+board.substring(i+1);
        best=Math.max(best,minimax(newBoard,depth+1,false,botMark,humanMark,maxDepth));
      }
    }
    return best;
  }else{
    let best=Infinity;
    for(let i=0;i<9;i++){
      if(board[i]==='-'){
        const newBoard=board.substring(0,i)+humanMark+board.substring(i+1);
        best=Math.min(best,minimax(newBoard,depth+1,true,botMark,humanMark,maxDepth));
      }
    }
    return best;
  }
}

function XOGameHub({user}){
  const [mode,setMode]=useState(null);
  const [friendsGame,setFriendsGame]=useState(null);
  const [friendsList,setFriendsList]=useState([]);
  const [pendingRequests,setPendingRequests]=useState([]);
  const [myRequests,setMyRequests]=useState([]);
  const toast=useToast();

  useEffect(()=>{
    loadFriends();
    loadPendingRequests();
    loadMyRequests();
    const sub=SB.channel('game-requests-'+user.id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'game_requests',filter:`to_user=eq.${user.id}`},()=>{
        loadPendingRequests();
        toast('🎮 درخواست بازی جدید!','success');
      })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'game_requests',filter:`from_user=eq.${user.id}`},(payload)=>{
        if(payload.new.status==='accepted'){
          setFriendsGame(payload.new.room_id);
          setMode('playing-online');
          toast('✅ درخواست پذیرفته شد! بازی شروع شد','success');
        }else if(payload.new.status==='rejected'){
          toast('❌ درخواست رد شد','warning');
        }
        loadMyRequests();
      })
      .subscribe();
    return()=>{SB.removeChannel(sub);};
  },[]);

  const loadFriends=async()=>{
    const {data}=await SB.from('users').select('id,full_name,username').eq('role','student').neq('id',user.id);
    if(data)setFriendsList(data);
  };
  const loadPendingRequests=async()=>{
    const {data}=await SB.from('game_requests').select('*,from_user_data:users!game_requests_from_user_fkey(full_name,username)').eq('to_user',user.id).eq('status','pending');
    if(data)setPendingRequests(data);
  };
  const loadMyRequests=async()=>{
    const {data}=await SB.from('game_requests').select('*,to_user_data:users!game_requests_to_user_fkey(full_name,username)').eq('from_user',user.id).eq('status','pending');
    if(data)setMyRequests(data);
  };

  const sendRequest=async(toUserId)=>{
    const {data:existingReq}=await SB.from('game_requests').select('id').eq('from_user',user.id).eq('to_user',toUserId).eq('status','pending').maybeSingle();
    if(existingReq){toast('⚠️ قبلاً درخواست فرستادی','warning');return;}
    
    const {data:room,error:rErr}=await SB.from('xo_rooms').insert({player_x:user.id,player_o:null,board:'---------',current_turn:'X',status:'waiting',score_x:0,score_o:0}).select().single();
    if(rErr){toast('خطا در ساخت اتاق: '+rErr.message,'error');return;}
    
    const {error:reqErr}=await SB.from('game_requests').insert({from_user:user.id,to_user:toUserId,room_id:room.id,status:'pending'});
    if(reqErr){
      await SB.from('xo_rooms').delete().eq('id',room.id);
      toast('خطا: '+reqErr.message,'error');return;
    }
    toast('✅ درخواست بازی ارسال شد','success');
    loadMyRequests();
  };

  const acceptRequest=async(request)=>{
    await SB.from('xo_rooms').update({player_o:user.id,status:'playing'}).eq('id',request.room_id);
    await SB.from('game_requests').update({status:'accepted'}).eq('id',request.id);
    setFriendsGame(request.room_id);
    setMode('playing-online');
    toast('🎮 بازی شروع شد!','success');
  };

  const rejectRequest=async(request)=>{
    await SB.from('game_requests').update({status:'rejected'}).eq('id',request.id);
    await SB.from('xo_rooms').delete().eq('id',request.room_id);
    loadPendingRequests();
    toast('درخواست رد شد','warning');
  };

  const cancelRequest=async(request)=>{
    await SB.from('game_requests').update({status:'rejected'}).eq('id',request.id);
    await SB.from('xo_rooms').delete().eq('id',request.room_id);
    loadMyRequests();
  };

  const endOnlineGame=async()=>{
    if(friendsGame){
      await SB.from('xo_rooms').delete().eq('id',friendsGame);
      setFriendsGame(null);
    }
    setMode(null);
  };

  if(mode==='bot')return <XOBotGame user={user} onBack={()=>setMode(null)}/>;
  if(mode==='playing-online')return <XOOnlineGame user={user} roomId={friendsGame} onEnd={endOnlineGame}/>;
  if(mode==='friends')return(
    <div className="slide-up">
      <div className="flex justify-between items-center mb-4">
        <button onClick={()=>setMode(null)} className="btn-glass btn-sm">← بازگشت</button>
        <h3 className="font-bold gradient-text">👥 بازی با دوستان</h3>
        <div className="w-16"></div>
      </div>

      {pendingRequests.length>0&&(
        <div className="glass p-4 mb-4">
          <h4 className="font-bold text-sm mb-3 text-pink-400">🔔 درخواست‌های دریافتی</h4>
          {pendingRequests.map(r=>(
            <div key={r.id} className="bg-white/5 rounded-xl p-3 mb-2 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-gradient-to-br from-pink-500 to-rose-500 flex items-center justify-center font-bold">{r.from_user_data?.full_name?.[0]}</div>
                <div>
                  <p className="font-bold text-sm">{r.from_user_data?.full_name}</p>
                  <p className="text-[11px] text-white/40">دعوتت کرده به بازی 🎮</p>
                </div>
              </div>
              <div className="flex gap-2">
                <button onClick={()=>acceptRequest(r)} className="btn-sm btn-glass btn-glass-success">✓ قبول</button>
                <button onClick={()=>rejectRequest(r)} className="btn-sm btn-glass btn-glass-danger">✗ رد</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {myRequests.length>0&&(
        <div className="glass p-4 mb-4">
          <h4 className="font-bold text-sm mb-3 text-amber-400">⏳ در انتظار پاسخ</h4>
          {myRequests.map(r=>(
            <div key={r.id} className="bg-white/5 rounded-xl p-3 mb-2 flex items-center justify-between">
              <div>
                <p className="font-bold text-sm">{r.to_user_data?.full_name}</p>
                <p className="text-[11px] text-white/40">در انتظار پاسخ...</p>
              </div>
              <button onClick={()=>cancelRequest(r)} className="btn-sm btn-glass btn-glass-danger">لغو</button>
            </div>
          ))}
        </div>
      )}

      <div className="glass p-4">
        <h4 className="font-bold text-sm mb-3 text-indigo-400">👥 ارسال درخواست</h4>
        {friendsList.length===0?<p className="text-center text-white/30 py-4">دانش‌آموز دیگری نیست</p>:
        friendsList.map(f=>(
          <div key={f.id} className="bg-white/5 rounded-xl p-3 mb-2 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center font-bold">{f.full_name[0]}</div>
              <div>
                <p className="font-bold text-sm">{f.full_name}</p>
                <p className="text-[11px] text-white/40">@{f.username}</p>
              </div>
            </div>
            <button onClick={()=>sendRequest(f.id)} className="btn-sm btn-glass">🎮 دعوت</button>
          </div>
        ))}
      </div>
    </div>
  );

  return(
    <div className="slide-up">
      <h3 className="font-black text-2xl gradient-text text-center mb-6">🎮 بازی دوز</h3>
      <p className="text-center text-white/50 text-sm mb-6">یک حالت بازی انتخاب کن</p>

        <button onClick={()=>setMode('bot')} className="btn-glass flex items-center justify-center gap-4 py-5">
          <span className="text-4xl">🤖</span>
          <div className="text-right flex-1">
            <p className="font-black text-lg">بازی با ربات</p>
            <p className="text-xs text-white/50">چالش با هوش مصنوعی تدبیر</p>
          </div>
        </button>
        <button onClick={()=>setMode('friends')} className="btn-glass flex items-center justify-center gap-4 py-5">

          <div className="text-right flex-1">

function XOBotGame({user,onBack}){
  const [board,setBoard]=useState('---------');
  const [playerMark,setPlayerMark]=useState('X');
  const [currentTurn,setCurrentTurn]=useState('X');
  const [winner,setWinner]=useState(null);
  const [winLine,setWinLine]=useState(null);
  const [scores,setScores]=useState({player:0,bot:0,draw:0});
  const [botThinking,setBotThinking]=useState(false);
  const [gameCount,setGameCount]=useState(0);
  const toast=useToast();

  const botMark=playerMark==='X'?'O':'X';

  useEffect(()=>{
    if(currentTurn===botMark&&!winner){
      setBotThinking(true);
      const timer=setTimeout(()=>{
        const move=getSmartBotMove(board,botMark);
        if(move!==undefined&&move!==null&&board[move]==='-'){
          const newBoard=board.substring(0,move)+botMark+board.substring(move+1);
          setBoard(newBoard);
          setBotThinking(false);
          const result=checkXOWinner(newBoard);
          if(result){
            setWinner(result.winner);
            setWinLine(result.line);
            if(result.winner==='draw'){setScores(s=>({...s,draw:s.draw+1}));}
            else if(result.winner===botMark){setScores(s=>({...s,bot:s.bot+1}));}
          }else{
            setCurrentTurn(playerMark);
          }
        }
      },700);
      return()=>clearTimeout(timer);
    }
  },[currentTurn,board,winner,gameCount]);

  const handleCellClick=(i)=>{
    if(board[i]!=='-'||winner||currentTurn!==playerMark||botThinking)return;
    const newBoard=board.substring(0,i)+playerMark+board.substring(i+1);
    setBoard(newBoard);
    const result=checkXOWinner(newBoard);
    if(result){
      setWinner(result.winner);
      setWinLine(result.line);
      if(result.winner==='draw'){setScores(s=>({...s,draw:s.draw+1}));}
      else if(result.winner===playerMark){setScores(s=>({...s,player:s.player+1}));}
    }else{
      setCurrentTurn(botMark);
    }
  };

  const resetGame=()=>{
    setBoard('---------');
    setWinner(null);
    setWinLine(null);
    setGameCount(c=>c+1);
    // نوبت اول رو بین بازیکن و ربات عوض کن
    if(gameCount%2===0)setCurrentTurn(botMark);
    else setCurrentTurn(playerMark);
  };

  const changeSide=()=>{
    setPlayerMark(playerMark==='X'?'O':'X');
    setScores({player:0,bot:0,draw:0});
    setBoard('---------');
    setWinner(null);
    setWinLine(null);
    setCurrentTurn('X');
    setGameCount(0);
  };

  const getStatusText=()=>{
    if(winner){
      if(winner==='draw')return{emoji:'🤝',text:'مساوی شد!',color:'text-amber-400'};
      if(winner===playerMark)return{emoji:'🎉',text:'آفرین! تو بردی!',color:'text-emerald-400'};
      return{emoji:'🤖',text:'ربات این بار برد!',color:'text-pink-400'};
    }
    if(botThinking)return{emoji:'🤔',text:'ربات داره فکر می‌کنه...',color:'text-pink-400'};
    if(currentTurn===playerMark)return{emoji:'🎯',text:'نوبت توئه!',color:'text-indigo-400'};
    return{emoji:'⏳',text:'نوبت ربات',color:'text-white/50'};
  };
  const status=getStatusText();

  return(
    <div className="slide-up">
      <div className="flex justify-between items-center mb-4">
        <button onClick={onBack} className="btn-glass btn-sm">← بازگشت</button>
        <h3 className="font-bold gradient-text">🤖 بازی با ربات</h3>
        <button onClick={changeSide} className="btn-glass btn-sm">🔄 تغییر طرف</button>
      </div>

      <div className="grid grid-cols-3 gap-2 mb-4">
        <div className={`score-card ${!winner&&currentTurn===playerMark?'active':''}`}>
          <p className="text-[11px] text-white/40 mb-1">شما ({playerMark})</p>
          <p className="score-value">{scores.player}</p>
        </div>
        <div className="score-card">
          <p className="text-[11px] text-white/40 mb-1">مساوی</p>
          <p className="score-value">{scores.draw}</p>
        </div>
        <div className={`score-card ${!winner&&currentTurn===botMark?'active':''}`}>
          <p className="text-[11px] text-white/40 mb-1">ربات ({botMark})</p>
          <p className="score-value">{scores.bot}</p>
        </div>
      </div>

      <div className={`xo-status ${!winner&&currentTurn===playerMark?'my-turn':!winner?'waiting':''}`}>
        <p className={`font-bold text-lg ${status.color}`}>
          <span className="text-2xl ml-2">{status.emoji}</span>
          {status.text}
        </p>
      </div>

      <div className="xo-board-container">
        <div className="grid grid-cols-3 gap-2 max-w-[320px] mx-auto">
          {board.split('').map((cell,i)=>(
            <XOCell key={i} value={cell} onClick={()=>handleCellClick(i)} isWinning={winLine&&winLine.includes(i)} isDisabled={!!winner||currentTurn!==playerMark||botThinking}/>
          ))}
        </div>
        {winner&&(
          <div className="victory-overlay">
            <div className="victory-text">{status.emoji}</div>
            <p className="text-xl font-bold mb-4">{status.text}</p>
            <button onClick={resetGame} className="btn-glass btn-glass-success w-auto px-8">🔄 بازی دوباره</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ===== XO Online Game =====
function XOOnlineGame({user,roomId,onEnd}){
  const [room,setRoom]=useState(null);
  const [myMark,setMyMark]=useState(null);
  const [opponentName,setOpponentName]=useState('');
  const [winner,setWinner]=useState(null);
  const [winLine,setWinLine]=useState(null);
  const toast=useToast();

  useEffect(()=>{
    loadRoom();
    const channel=SB.channel('xo-room-'+roomId)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'xo_rooms',filter:`id=eq.${roomId}`},(payload)=>{
        setRoom(payload.new);
        if(payload.new.winner&&!winner){
          setWinner(payload.new.winner);
          const result=checkXOWinner(payload.new.board);
          if(result)setWinLine(result.line);
        }
      })
      .subscribe();
    return()=>{SB.removeChannel(channel);};
  },[roomId]);

  const loadRoom=async()=>{
    const {data}=await SB.from('xo_rooms').select('*,player_x_data:users!xo_rooms_player_x_fkey(full_name),player_o_data:users!xo_rooms_player_o_fkey(full_name)').eq('id',roomId).single();
    if(data){
      setRoom(data);
      if(data.player_x===user.id){setMyMark('X');setOpponentName(data.player_o_data?.full_name||'در انتظار...');}
      else{setMyMark('O');setOpponentName(data.player_x_data?.full_name||'در انتظار...');}
      if(data.winner){
        setWinner(data.winner);
        const result=checkXOWinner(data.board);
        if(result)setWinLine(result.line);
      }
    }
  };

  const handleCellClick=async(i)=>{
    if(!room||room.board[i]!=='-'||room.current_turn!==myMark||winner)return;
    const newBoard=room.board.substring(0,i)+myMark+room.board.substring(i+1);
    const nextTurn=myMark==='X'?'O':'X';
    const updates={board:newBoard,current_turn:nextTurn,updated_at:new Date().toISOString()};
    const result=checkXOWinner(newBoard);
    if(result){
      updates.winner=result.winner;
      updates.status='finished';
      if(result.winner==='X')updates.score_x=(room.score_x||0)+1;
      else if(result.winner==='O')updates.score_o=(room.score_o||0)+1;
    }
    await SB.from('xo_rooms').update(updates).eq('id',roomId);
  };

  const handleEndGame=async()=>{
    await SB.from('xo_rooms').delete().eq('id',roomId);
    onEnd();
    toast('بازی پایان یافت','warning');
  };

  const handleNewRound=async()=>{
    await SB.from('xo_rooms').update({board:'---------',current_turn:'X',winner:null,status:'playing'}).eq('id',roomId);
    setWinner(null);
    setWinLine(null);
  };

  if(!room)return <div className="text-center py-10 text-white/40">در حال بارگذاری...</div>;
  if(room.status==='waiting')return(
    <div className="text-center py-20">
      <div className="text-6xl mb-4 animate-pulse">⏳</div>
      <p className="text-white/60 mb-4">در انتظار پاسخ حریف...</p>
      <button onClick={handleEndGame} className="btn-glass btn-glass-danger btn-sm">لغو</button>
    </div>
  );

  const opponentMark=myMark==='X'?'O':'X';
  const isMyTurn=room.current_turn===myMark;

  const getStatusText=()=>{
    if(winner){
      if(winner==='draw')return{emoji:'🤝',text:'مساوی شد!',color:'text-amber-400'};
      if(winner===myMark)return{emoji:'🎉',text:'تبریک! تو بردی!',color:'text-emerald-400'};
      return{emoji:'😔',text:'حریف این دور رو برد',color:'text-pink-400'};
    }
    if(isMyTurn)return{emoji:'🎯',text:'نوبت توئه!',color:'text-indigo-400'};
    return{emoji:'⏳',text:'نوبت حریف...',color:'text-white/50'};
  };
  const status=getStatusText();

  return(
    <div className="slide-up">
      <div className="flex justify-between items-center mb-4">
        <button onClick={handleEndGame} className="btn-glass btn-glass-danger btn-sm">🏁 پایان</button>
        <h3 className="font-bold gradient-text">🎮 بازی آنلاین</h3>
        <div className="w-16"></div>
      </div>

      <div className="grid grid-cols-3 gap-2 mb-4">
        <div className={`score-card ${!winner&&isMyTurn?'active':''}`}>
          <p className="text-[11px] text-white/40 mb-1">شما ({myMark})</p>
          <p className="score-value">{myMark==='X'?room.score_x:room.score_o}</p>
        </div>
        <div className="score-card">
          <p className="text-[11px] text-white/40 mb-1">دور</p>
          <p className="score-value">{(room.score_x||0)+(room.score_o||0)+1}</p>
        </div>
        <div className={`score-card ${!winner&&!isMyTurn?'active':''}`}>
          <p className="text-[11px] text-white/40 mb-1">حریف ({opponentMark})</p>
          <p className="score-value">{myMark==='X'?room.score_o:room.score_x}</p>
        </div>
      </div>

      <div className="glass p-3 mb-3 text-center">
        <p className="text-xs text-white/40 mb-1">حریف: <span className="font-bold text-white">{opponentName}</span></p>
      </div>

      <div className={`xo-status ${!winner&&isMyTurn?'my-turn':!winner?'waiting':''}`}>
        <p className={`font-bold text-lg ${status.color}`}>
          <span className="text-2xl ml-2">{status.emoji}</span>
          {status.text}
        </p>
      </div>

      <div className="xo-board-container">
        <div className="grid grid-cols-3 gap-2 max-w-[320px] mx-auto">
          {room.board.split('').map((cell,i)=>(
            <XOCell key={i} value={cell} onClick={()=>handleCellClick(i)} isWinning={winLine&&winLine.includes(i)} isDisabled={!!winner||!isMyTurn}/>
          ))}
        </div>
        {winner&&(
          <div className="victory-overlay">
            <div className="victory-text">{status.emoji}</div>
            <p className="text-xl font-bold mb-4">{status.text}</p>
            <button onClick={handleNewRound} className="btn-glass btn-glass-success w-auto px-8">🔄 دور بعدی</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ===== Breakout Game =====
function BreakoutGame({user}){
  const [score,setScore]=useState(0);
  const [level,setLevel]=useState(1);
  const [gameOver,setGameOver]=useState(false);
  const [bestScore,setBestScore]=useState(0);
  const canvasRef=useRef(null);
  const gameRef=useRef(null);
  const toast=useToast();

  useEffect(()=>{loadBest();},[]);
  const loadBest=async()=>{
    const {data}=await SB.from('game_scores').select('score').eq('user_id',user.id).eq('game_name','breakout').order('score',{ascending:false}).limit(1);
    if(data&&data.length>0)setBestScore(data[0].score);
  };

  useEffect(()=>{
    if(gameOver)return;
    const canvas=canvasRef.current;
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const W=380,H=500;
    canvas.width=W;canvas.height=H;
    
    let localScore=0,localLevel=1,running=true;
    let ballX=W/2,ballY=H-50,ballDX=0,ballDY=0,ballR=7;
    let padX=W/2-40,padW=80,padH=12;
    const colors=['#818cf8','#c084fc','#f472b6','#fb923c','#34d399','#fbbf24','#f87171'];
    let bricks=[],particles=[],trail=[];

    const buildBricks=(lvl)=>{
      bricks=[];
      const rows=Math.min(3+lvl,7);
      const cols=7;
      const brickW=Math.floor((W-28-(cols-1)*5)/cols);
      for(let r=0;r<rows;r++){
        bricks[r]=[];
        for(let c=0;c<cols;c++){
          bricks[r][c]={x:c*(brickW+5)+14,y:r*25+45,alive:true,color:colors[r%colors.length]};
        }
      }
      return {rows,cols,brickW};
    };

    let brickInfo=buildBricks(1);

    const resetBall=()=>{
      ballX=W/2;ballY=H-50;
      const speed=5+(localLevel-1)*0.6;
      const angle=Math.random()*0.5+0.4;
      ballDX=Math.cos(angle*Math.PI)*speed*(Math.random()>0.5?1:-1);
      ballDY=-Math.abs(Math.sin(angle*Math.PI)*speed);
    };

    const moveHandler=(e)=>{
      e.preventDefault();
      const rect=canvas.getBoundingClientRect();
      const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
      padX=Math.max(0,Math.min(W-padW,cx*(W/rect.width)-padW/2));
    };
    canvas.addEventListener('mousemove',moveHandler);
    canvas.addEventListener('touchmove',moveHandler,{passive:false});

    const spawnParticles=(x,y,color)=>{
      for(let i=0;i<10;i++){
        const a=Math.random()*Math.PI*2;
        particles.push({x,y,dx:Math.cos(a)*3,dy:Math.sin(a)*3,life:25,color});
      }
    };

    const loop=()=>{
      if(!running)return;
      ctx.clearRect(0,0,W,H);
      const bg=ctx.createLinearGradient(0,0,0,H);
      bg.addColorStop(0,'rgba(15,15,35,0.95)');bg.addColorStop(1,'rgba(10,10,26,0.98)');
      ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

      for(let r=0;r<brickInfo.rows;r++)for(let c=0;c<brickInfo.cols;c++){
        const b=bricks[r][c];if(!b.alive)continue;
        ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=10;
        ctx.beginPath();ctx.roundRect(b.x,b.y,brickInfo.brickW,20,4);ctx.fill();
        ctx.shadowBlur=0;
      }

      const padGrad=ctx.createLinearGradient(padX,0,padX+padW,0);
      padGrad.addColorStop(0,'#818cf8');padGrad.addColorStop(1,'#c084fc');
      ctx.fillStyle=padGrad;ctx.shadowColor='#818cf8';ctx.shadowBlur=15;
      ctx.beginPath();ctx.roundRect(padX,H-25,padW,padH,6);ctx.fill();
      ctx.shadowBlur=0;

      trail.push({x:ballX,y:ballY,life:12});
      trail=trail.filter(t=>{
        t.life--;
        ctx.globalAlpha=t.life/12*0.4;
        ctx.fillStyle='#818cf8';
        ctx.beginPath();ctx.arc(t.x,t.y,ballR*(t.life/12),0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
        return t.life>0;
      });

      ctx.beginPath();ctx.arc(ballX,ballY,ballR,0,Math.PI*2);
      ctx.fillStyle='#fff';ctx.shadowColor='#818cf8';ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;

      particles=particles.filter(p=>{
        p.x+=p.dx;p.y+=p.dy;p.life--;
        ctx.globalAlpha=p.life/25;ctx.fillStyle=p.color;
        ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1;
        return p.life>0;
      });

      if(ballX+ballDX>W-ballR||ballX+ballDX<ballR)ballDX=-ballDX;
      if(ballY+ballDY<ballR)ballDY=-ballDY;
      if(ballY+ballDY>H-30&&ballX>padX&&ballX<padX+padW){
        ballDY=-Math.abs(ballDY);
        ballDX+=((ballX-padX)/padW-0.5)*8;
        spawnParticles(ballX,ballY,'#818cf8');
      }

      if(ballY>H+ballR){
        running=false;setGameOver(true);
        const finalScore=localScore;
        if(finalScore>bestScore){
          setBestScore(finalScore);
          SB.from('game_scores').insert({user_id:user.id,game_name:'breakout',score:finalScore}).catch(()=>{});
        }
        toast(`بازی تمام شد! امتیاز: ${finalScore}`,'warning');
        return;
      }

      let allDestroyed=true;
      for(let r=0;r<brickInfo.rows;r++)for(let c=0;c<brickInfo.cols;c++){
        const b=bricks[r][c];if(!b.alive)continue;
        allDestroyed=false;
        if(ballX+ballR>b.x&&ballX-ballR<b.x+brickInfo.brickW&&ballY+ballR>b.y&&ballY-ballR<b.y+20){
          b.alive=false;localScore++;setScore(localScore);
          const ox=Math.min(ballX+ballR-b.x,b.x+brickInfo.brickW-(ballX-ballR));
          const oy=Math.min(ballY+ballR-b.y,b.y+20-(ballY-ballR));
          if(ox<oy)ballDX=-ballDX;else ballDY=-ballDY;
          spawnParticles(b.x+brickInfo.brickW/2,b.y+10,b.color);
          break;
        }
      }

      if(allDestroyed){
        localLevel++;setLevel(localLevel);localScore+=50;setScore(localScore);
        padW=Math.max(45,80-localLevel*4);
        brickInfo=buildBricks(localLevel);
        resetBall();
        toast(`🎉 مرحله ${localLevel}!`,'success');
      }

      ballX+=ballDX;ballY+=ballDY;
      ctx.fillStyle='white';ctx.font='bold 16px Vazirmatn';
      ctx.textAlign='right';ctx.fillText(`امتیاز: ${localScore}`,W-15,25);
      ctx.textAlign='left';ctx.fillText(`مرحله: ${localLevel}`,15,25);

      gameRef.current=requestAnimationFrame(loop);
    };

    resetBall();loop();

    return()=>{
      canvas.removeEventListener('mousemove',moveHandler);
      canvas.removeEventListener('touchmove',moveHandler);
      if(gameRef.current)cancelAnimationFrame(gameRef.current);
    };
  },[gameOver]);

  const restart=()=>{setScore(0);setLevel(1);setGameOver(false);};

  return(
    <div className="text-center slide-up">
      <div className="flex justify-around mb-4">
        <div className="glass p-3 min-w-[100px]"><p className="text-[11px] text-white/40">امتیاز</p><p className="text-2xl font-black text-indigo-400">{score}</p></div>
        <div className="glass p-3 min-w-[100px]"><p className="text-[11px] text-white/40">رکورد</p><p className="text-2xl font-black text-pink-400">{bestScore}</p></div>
      </div>
      {gameOver&&<div className="glass p-3 mb-3"><p className="font-bold text-red-400">💥 بازی تمام شد!</p><button onClick={restart} className="btn-glass btn-sm mt-2">🔄 شروع مجدد</button></div>}
      <p className="text-xs text-white/40 mb-2">حرکت راکت: ماوس یا انگشت</p>
      <canvas ref={canvasRef} className="game-canvas"></canvas>
    </div>
  );
}

// ===== Chat Modal =====
function ChatModal({user,onClose}){
  const [messages,setMessages]=useState([]);
  const [chatText,setChatText]=useState('');
  const [showEmoji,setShowEmoji]=useState(false);
  const [editingId,setEditingId]=useState(null);
  const [editText,setEditText]=useState('');
  const [reactionPickerFor,setReactionPickerFor]=useState(null);
  const [deletingId,setDeletingId]=useState(null);
  const toast=useToast();
  const messagesEndRef=useRef(null);

  useEffect(()=>{
    loadMessages();
    const sub=SB.channel('chat-'+user.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'messages'},()=>{loadMessages();})
      .subscribe();
    return()=>{SB.removeChannel(sub);};
  },[]);

  useEffect(()=>{
    messagesEndRef.current?.scrollIntoView({behavior:'smooth'});
  },[messages]);

  const loadMessages=async()=>{
    const {data:admins}=await SB.from('users').select('id').eq('role','admin').limit(1);
    if(!admins||!admins.length)return;
    const aid=admins[0].id;
    const {data}=await SB.from('messages').select('*').or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`).order('created_at',{ascending:true});
    if(data)setMessages(data.filter(m=>m.sender_id===aid||m.receiver_id===aid));
  };

  const sendMessage=async()=>{
    if(!chatText.trim())return;
    const {data:admins}=await SB.from('users').select('id').eq('role','admin').limit(1);
    if(!admins||!admins.length)return;
    await SB.from('messages').insert({sender_id:user.id,receiver_id:admins[0].id,content:chatText.trim(),reactions:{}});
    setChatText('');setShowEmoji(false);
  };

  const addEmoji=(emoji)=>{setChatText(chatText+emoji);setShowEmoji(false);};

  const startEdit=(msg)=>{setEditingId(msg.id);setEditText(msg.content);};
  const saveEdit=async()=>{
    if(!editText.trim())return;
    await SB.from('messages').update({content:editText.trim(),edited:true,edited_at:new Date().toISOString()}).eq('id',editingId);
    setEditingId(null);setEditText('');
    loadMessages();
    toast('✅ پیام ویرایش شد','success');
  };

  const deleteMessage=async(msgId)=>{
    setDeletingId(msgId);
    setTimeout(async()=>{
      await SB.from('messages').delete().eq('id',msgId);
      setDeletingId(null);
      loadMessages();
      toast('🗑️ پیام حذف شد','warning');
    },300);
  };

  const toggleReaction=async(msgId,emoji)=>{
    const msg=messages.find(m=>m.id===msgId);
    if(!msg)return;
    const reactions={...(msg.reactions||{})};
    if(!reactions[emoji])reactions[emoji]=[];
    const idx=reactions[emoji].indexOf(user.id);
    if(idx>=0)reactions[emoji]=reactions[emoji].filter(id=>id!==user.id);
    else reactions[emoji]=[...reactions[emoji],user.id];
    if(reactions[emoji].length===0)delete reactions[emoji];
    await SB.from('messages').update({reactions}).eq('id',msgId);
    loadMessages();
    setReactionPickerFor(null);
  };

  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="glass-strong w-full max-w-md h-[75vh] flex flex-col p-4 slide-up" onClick={e=>e.stopPropagation()}>
        <div className="flex justify-between items-center mb-3 pb-2 border-b border-white/5">
          <h3 className="font-bold gradient-text">💬 گفتگو با مدیر</h3>
          <button onClick={onClose} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button>
        </div>
        <div className="flex-1 overflow-y-auto mb-3 space-y-2">
          {messages.length===0&&<p className="text-center text-white/30 mt-10">هنوز پیامی نداده‌اید 💬</p>}
          {messages.map(m=>{
            const isMe=m.sender_id===user.id;
            const reactions=m.reactions||{};
            const isDeleting=deletingId===m.id;
            return(
              <div key={m.id} className={`relative ${isMe?'flex flex-col items-end':'flex flex-col items-start'}`}>
                {editingId===m.id?(
                  <div className="flex gap-2 w-full mb-2">
                    <input className="glass-input flex-1 text-sm" value={editText} onChange={e=>setEditText(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')saveEdit();if(e.key==='Escape')setEditingId(null);}} autoFocus/>
                    <button onClick={saveEdit} className="btn-glass btn-glass-success btn-sm">✓</button>
                    <button onClick={()=>setEditingId(null)} className="btn-glass btn-sm bg-white/10">✗</button>
                  </div>
                ):(
                  <>
                    <div className={`chat-bubble ${isMe?'me':'other'} ${m.edited?'edited':''} ${isDeleting?'deleting':''}`}>
                      <div>{m.content}</div>
                      <div className="chat-actions" style={{justifyContent:isMe?'flex-end':'flex-start'}}>
                        {isMe&&(
                          <>
                            <button onClick={()=>startEdit(m)} className="chat-action-btn">✏️ ویرایش</button>
                            <button onClick={()=>deleteMessage(m.id)} className="chat-action-btn">🗑️ حذف</button>
                          </>
                        )}
                        {!isMe&&(
                          <button onClick={()=>setReactionPickerFor(reactionPickerFor===m.id?null:m.id)} className="chat-action-btn">😊 واکنش</button>
                        )}
                      </div>
                    </div>
                    {reactionPickerFor===m.id&&(
                      <div className="reaction-picker" style={{[isMe?'right':'left']:'0'}}>
                        {REACTION_EMOJIS.map(e=>(
                          <button key={e} className="reaction-emoji-btn" onClick={()=>toggleReaction(m.id,e)}>{e}</button>
                        ))}
                      </div>
                    )}
                    {Object.keys(reactions).length>0&&(
                      <div className="reaction-bar">
                        {Object.entries(reactions).map(([emoji,users])=>(
                          <div key={emoji} className={`reaction-chip ${users.includes(user.id)?'active':''}`} onClick={()=>toggleReaction(m.id,emoji)}>
                            <span>{emoji}</span><span className="text-[10px]">{users.length}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </>
                )}
              </div>
            );
          })}
          <div ref={messagesEndRef}></div>
        </div>
        <div className="relative">
          {showEmoji&&(
            <div className="emoji-picker">
              {TADBIR_EMOJIS.map(e=>(
                <button key={e} className="emoji-btn" onClick={()=>addEmoji(e)}>{e}</button>
              ))}
            </div>
          )}
          <div className="flex gap-2">
            <button onClick={()=>setShowEmoji(!showEmoji)} className="btn-glass btn-sm bg-white/5"><Icon d={Icons.smile} size={18}/></button>
            <input className="glass-input flex-1 text-sm" placeholder="پیام خود را بنویسید..." value={chatText} onChange={e=>setChatText(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')sendMessage();}}/>
            <button onClick={sendMessage} className="btn-glass btn-glass-success btn-sm"><Icon d={Icons.send} size={16}/></button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ===== Password Modal =====
function PasswordModal({onClose,user}){
  const [newPw,setNewPw]=useState('');
  const [confirmPw,setConfirmPw]=useState('');
  const [loading,setLoading]=useState(false);
  const toast=useToast();

  const handleSubmit=async()=>{
    if(newPw.length<4){toast('رمز باید حداقل ۴ کاراکتر باشد','error');return;}
    if(newPw!==confirmPw){toast('رمز و تکرارش یکسان نیستند','error');return;}
    setLoading(true);
    const {error}=await SB.from('users').update({password:newPw}).eq('id',user.id);
    setLoading(false);
    if(error){toast('خطا: '+error.message,'error');return;}
    const u={...user,password:newPw};
    sessionStorage.setItem('edu_user',JSON.stringify(u));
    toast('✅ رمز عبور تغییر کرد','success');
    onClose();
  };

  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="glass-strong w-full max-w-md p-6 slide-up" onClick={e=>e.stopPropagation()}>
        <div className="flex justify-between items-center mb-4">
          <h3 className="font-bold gradient-text">🔐 تغییر رمز عبور</h3>
          <button onClick={onClose} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button>
        </div>
        <div className="bg-indigo-500/10 border border-indigo-500/20 rounded-xl p-3 mb-4 text-xs text-indigo-300">
          ℹ️ پس از تغییر، مدیر نیز می‌تواند رمز جدید را ببیند
        </div>
        <div className="space-y-3">
          <div>
            <label className="text-xs text-white/60 mb-2 block font-semibold">رمز جدید</label>
            <input className="glass-input" type="password" placeholder="حداقل ۴ کاراکتر" value={newPw} onChange={e=>setNewPw(e.target.value)}/>
          </div>
          <div>
            <label className="text-xs text-white/60 mb-2 block font-semibold">تکرار رمز</label>
            <input className="glass-input" type="password" placeholder="تکرار رمز جدید" value={confirmPw} onChange={e=>setConfirmPw(e.target.value)}/>
          </div>
          <button onClick={handleSubmit} className="btn-glass btn-glass-success" disabled={loading}>
            {loading?'در حال تغییر...':'✓ تغییر رمز'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ===== Admin Panel =====
function Admin({user,tab,setTab,onLogout}){
  const [exams,setExams]=useState([]);const [students,setStudents]=useState([]);const [answers,setAnswers]=useState([]);
  const [modal,setModal]=useState(null);const [step,setStep]=useState(1);const [formData,setFormData]=useState({hours:'',minutes:''});
  const [questions,setQuestions]=useState([]);const [loading,setLoading]=useState(false);
  const [subTab,setSubTab]=useState('list');const [messages,setMessages]=useState([]);
  const [replyText,setReplyText]=useState('');const [selectedChat,setSelectedChat]=useState(null);
  const toast=useToast();

  useEffect(()=>{loadAll();},[]);

  const loadAll=async()=>{
    const {data:e}=await SB.from('exams').select('*,questions(*)').order('created_at',{ascending:false});
    const {data:s}=await SB.from('users').select('*').eq('role','student');
    const {data:a}=await SB.from('answers').select('*,users(full_name,username),exams(title),questions(q_text,q_type,correct_opt,score)');
    if(e)setExams(e);if(s)setStudents(s);if(a)setAnswers(a);
    const {data:m}=await SB.from('messages').select('*,sender:sender_id(full_name,username),receiver:receiver_id(full_name,username)').order('created_at',{ascending:false});
    if(m)setMessages(m);
  };

  const createExam=async()=>{
    if(!formData.title){toast('عنوان آزمون را وارد کنید','error');return;}
    if(questions.length===0){toast('حداقل یک سوال اضافه کنید','error');return;}
    const hours=parseInt(formData.hours)||0;const minutes=parseInt(formData.minutes)||0;
    if(hours===0&&minutes===0){toast('مدت زمان را مشخص کنید','error');return;}
    setLoading(true);
    const duration=hours*60+minutes;
    const {data:exam,error}=await SB.from('exams').insert({title:formData.title,description:formData.desc||'',duration_minutes:duration,assigned_to:formData.assigned||'all',created_by:user.id}).select().single();
    if(error){toast('خطا: '+error.message,'error');setLoading(false);return;}
    for(const q of questions){
      await SB.from('questions').insert({exam_id:exam.id,q_text:q.q_text,opt_a:q.opt_a||null,opt_b:q.opt_b||null,opt_c:q.opt_c||null,opt_d:q.opt_d||null,correct_opt:q.correct_opt||null,q_type:q.q_type||'test',image_url:q.image_url||null,score:parseFloat(q.score)||1,order_num:questions.indexOf(q)});
    }
    setLoading(false);setModal(null);setFormData({hours:'',minutes:''});setQuestions([]);setStep(1);loadAll();
    toast('✅ آزمون ساخته شد!','success');
  };

  const handleImageUpload=async(file,i)=>{
    if(!file)return;
    const ext=file.name.split('.').pop();
    const path=`${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
    const {error}=await SB.storage.from('exam-images').upload(path,file);
    if(error){toast('خطا در آپلود: '+error.message,'error');return;}
    const {data:{publicUrl}}=SB.storage.from('exam-images').getPublicUrl(path);
    const nq=[...questions];nq[i].image_url=publicUrl;setQuestions(nq);
    toast('✅ عکس آپلود شد','success');
  };

  const addQuestion=()=>setQuestions([...questions,{q_text:'',opt_a:'',opt_b:'',opt_c:'',opt_d:'',correct_opt:'',q_type:'test',image_url:'',score:1}]);
  const updateQuestion=(i,f,v)=>{const n=[...questions];n[i][f]=v;setQuestions(n);};
  const removeQuestion=(i)=>setQuestions(questions.filter((_,x)=>x!==i));
  const deleteExam=async(id)=>{if(confirm('حذف آزمون؟')){await SB.from('exams').delete().eq('id',id);loadAll();toast('آزمون حذف شد','success');}};
  const changePassword=async(sid)=>{const p=prompt("رمز جدید:");if(p){await SB.from('users').update({password:p}).eq('id',sid);loadAll();toast('رمز تغییر کرد','success');}};
  const gradeAnswer=async(id,score)=>{await SB.from('answers').update({score:parseFloat(score),status:'graded'}).eq('id',id);loadAll();toast('✅ نمره ثبت شد','success');};
  const sendMessage=async()=>{if(!replyText.trim()||!selectedChat)return;await SB.from('messages').insert({sender_id:user.id,receiver_id:selectedChat.sender_id,content:replyText,reactions:{}});setReplyText('');loadAll();};
  
  const clearChat=async(studentId)=>{
    if(!confirm('تمام پیام‌های این دانش‌آموز حذف شود؟'))return;
    const {error:e1}=await SB.from('messages').delete().eq('sender_id',user.id).eq('receiver_id',studentId);
    const {error:e2}=await SB.from('messages').delete().eq('sender_id',studentId).eq('receiver_id',user.id);
    if(e1||e2){toast('خطا در حذف','error');return;}
    setSelectedChat(null);
    loadAll();
    toast('✅ تاریخچه چت پاک شد','success');
  };

  const objections=answers.filter(a=>a.objection&&a.objection.trim()!==''&&a.status!=='graded');

  return(
    <div className="min-h-screen pb-24">
      <div className="header flex justify-between items-center">
        <div><h1 className="text-lg font-black gradient-text">پنل مدیریت</h1><p className="text-xs text-white/30 mt-1">{user.full_name}</p></div>
        <button onClick={onLogout} className="p-2.5 bg-white/5 rounded-xl hover:bg-white/10 transition"><Icon d={Icons.logout} size={18}/></button>
      </div>
      <div className="content">
        {tab==='home'&&(
          <>
            <div className="grid grid-cols-2 gap-3 mb-6">
              {[{icon:Icons.exam,color:'text-indigo-400',n:exams.length,l:'آزمون'},{icon:Icons.users,color:'text-sky-400',n:students.length,l:'دانش‌آموز'},{icon:Icons.grade,color:'text-emerald-400',n:answers.filter(a=>a.status==='pending').length,l:'در انتظار'},{icon:Icons.alert,color:'text-amber-400',n:objections.length,l:'اعتراض'}].map((s,i)=>(
                <div key={i} className="glass p-4 text-center slide-up" style={{animationDelay:i*0.08+'s'}}>
                  <Icon d={s.icon} size={24} className={`mx-auto mb-2 ${s.color}`}/>
                  <p className="text-2xl font-black">{s.n}</p><p className="text-[11px] text-white/40">{s.l}</p>
                </div>
              ))}
            </div>
            <button onClick={()=>{setModal('exam');setFormData({hours:'',minutes:''});setQuestions([]);setStep(1);}} className="btn-glass flex items-center justify-center gap-2 mb-6"><Icon d={Icons.plus} size={18}/>ساخت آزمون جدید</button>
            <h3 className="font-bold mb-3 text-white/70 text-sm">آزمون‌ها</h3>
            {exams.length===0&&<div className="card text-center py-10 text-white/30">آزمونی نیست</div>}
            {exams.map(ex=>(
              <div key={ex.id} className="card slide-up">
                <div className="flex justify-between items-start">
                  <div className="flex-1">
                    <h4 className="font-bold">{ex.title}</h4>
                    <p className="text-xs text-white/40 mt-1 mb-2">{ex.description||'بدون توضیحات'}</p>
                    <div className="flex gap-2 flex-wrap"><span className="badge badge-new">{ex.duration_minutes} دقیقه</span><span className="badge badge-approved">{ex.questions?.length||0} سوال</span><span className="badge badge-new">{ex.assigned_to==='all'?'همه':'تخصصی'}</span></div>
                  </div>
                  <button onClick={()=>deleteExam(ex.id)} className="p-2 bg-red-500/15 text-red-400 rounded-xl"><Icon d={Icons.trash} size={16}/></button>
                </div>
              </div>
            ))}
          </>
        )}
        {tab==='students'&&(
          <>
            <div className="flex gap-2 mb-4 overflow-x-auto pb-2">
              {[['list','دانش‌آموزان'],['objections',`اعتراض‌ها (${objections.length})`],['messages','پیام‌ها']].map(([k,l])=>(
                <button key={k} onClick={()=>setSubTab(k)} className={`btn-sm whitespace-nowrap ${subTab===k?'btn-glass':'bg-white/5'}`}>{l}</button>
              ))}
            </div>
            {subTab==='list'&&students.map(s=>(
              <div key={s.id} className="card flex items-center gap-3">
                <div className="w-11 h-11 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-lg shrink-0">{s.full_name[0]}</div>
                <div className="flex-1 min-w-0">
                  <h4 className="font-bold text-sm">{s.full_name}</h4>
                  <p className="text-[11px] text-white/30">@{s.username}</p>
                  <p className="text-[11px] text-emerald-400 mt-0.5">رمز: <span className="font-mono bg-white/5 px-1.5 py-0.5 rounded">{s.password}</span></p>
                </div>
                <button onClick={()=>changePassword(s.id)} className="btn-sm bg-white/5 shrink-0"><Icon d={Icons.key} size={14}/></button>
              </div>
            ))}
            {subTab==='objections'&&(
              objections.length===0?<div className="card text-center py-10 text-white/30">اعتراضی نیست</div>:
              objections.map(a=>(
                <div key={a.id} className="card border-amber-500/20">
                  <div className="flex justify-between items-start mb-2">
                    <div><h4 className="font-bold text-amber-300 text-sm">{a.users?.full_name}</h4><p className="text-[11px] text-white/30">{a.exams?.title}</p></div>
                    <span className="badge badge-pending">اعتراض</span>
                  </div>
                  <div className="bg-white/5 rounded-xl p-3 text-sm my-2">
                    <p className="text-white/50 text-xs mb-1">پاسخ:</p>
                    <p className="text-indigo-300 mb-2">{a.student_answer||'بدون پاسخ'}</p>
                    <p className="text-amber-300 text-xs font-bold mb-1">اعتراض:</p>
                    <p className="text-white text-sm">{a.objection}</p>
                  </div>
                  <div className="flex gap-2">
                    <input type="number" className="glass-input flex-1 text-sm" placeholder="نمره" id={`g-${a.id}`} defaultValue={a.score||0}/>
                    <button onClick={()=>gradeAnswer(a.id,document.getElementById(`g-${a.id}`).value)} className="btn-glass btn-glass-success btn-sm">ثبت</button>
                  </div>
                </div>
              ))
            )}
            {subTab==='messages'&&(
              <div className="glass-strong p-4 h-[60vh] flex flex-col">
                {!selectedChat?(
                  <div className="flex-1 overflow-y-auto space-y-2">
                    {messages.filter(m=>m.sender_id!==user.id).length===0&&<p className="text-center text-white/30 mt-8">پیامی نیست</p>}
                    {Object.values(messages.filter(m=>m.sender_id!==user.id).reduce((acc,m)=>{acc[m.sender_id]=m;return acc;},{})).map(m=>(
                      <div key={m.id} onClick={()=>setSelectedChat(m)} className="card cursor-pointer flex justify-between items-center">
                        <div className="min-w-0 flex-1"><p className="font-bold text-sm">{m.sender?.full_name}</p><p className="text-xs text-white/40 truncate">{m.content}</p></div>
                        <span className="text-[10px] text-white/20 shrink-0 mr-2">{new Date(m.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}</span>
                      </div>
                    ))}
                  </div>
                ):(
                  <>
                    <div className="flex items-center justify-between mb-3 pb-2 border-b border-white/5">
                      <div className="flex items-center gap-2">
                        <button onClick={()=>setSelectedChat(null)} className="p-1.5 bg-white/5 rounded-lg"><Icon d="M15 18l-6-6 6-6" size={16}/></button>
                        <span className="font-bold text-sm">{selectedChat.sender?.full_name}</span>
                      </div>
                      <button onClick={()=>clearChat(selectedChat.sender_id)} className="p-1.5 bg-red-500/15 text-red-400 rounded-lg" title="پاک کردن تاریخچه">
                        <Icon d={Icons.trash} size={16}/>
                      </button>
                    </div>
                    <div className="flex-1 overflow-y-auto mb-3 space-y-1">
                      {messages.filter(m=>(m.sender_id===selectedChat.sender_id&&m.receiver_id===user.id)||(m.sender_id===user.id&&m.receiver_id===selectedChat.sender_id)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(m=>(
                        <div key={m.id} className={`chat-bubble ${m.sender_id===user.id?'me':'other'}`}>{m.content}</div>
                      ))}
                    </div>
                    <div className="flex gap-2">
                      <input className="glass-input flex-1 text-sm" placeholder="پاسخ..." value={replyText} onChange={e=>setReplyText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendMessage()}/>
                      <button onClick={sendMessage} className="btn-glass btn-glass-success btn-sm"><Icon d={Icons.send} size={16}/></button>
                    </div>
                  </>
                )}
              </div>
            )}
          </>
        )}
        {tab==='grading'&&(
          <>
            <h3 className="font-bold mb-3 text-white/70 text-sm">در انتظار تصحیح</h3>
            {answers.filter(a=>a.status==='pending'&&!a.objection).length===0&&<div className="card text-center py-10 text-white/30">همه تصحیح شده</div>}
            {answers.filter(a=>a.status==='pending'&&!a.objection).map(a=>(
              <div key={a.id} className="card">
                <h4 className="font-bold text-sm">{a.users?.full_name} - {a.exams?.title}</h4>
                <p className="text-xs text-white/40 mt-1">{a.questions?.q_text}</p>
                <p className="text-sm text-indigo-300 mt-2 bg-white/5 p-2 rounded">پاسخ: {a.student_answer||'بدون پاسخ'}</p>
                <div className="flex gap-2 mt-3">
                  <input type="number" className="glass-input flex-1 text-sm" placeholder="نمره" id={`s-${a.id}`}/>
                  <button onClick={()=>gradeAnswer(a.id,document.getElementById(`s-${a.id}`).value)} className="btn-glass btn-glass-success btn-sm">ثبت</button>
                </div>
              </div>
            ))}
          </>
        )}
      </div>
      <div className="nav-bar">
        <div className={`nav-item ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==='students'?'active':''}`} onClick={()=>{setTab('students');setSubTab('list');}}><Icon d={Icons.users}/><span>کاربران</span></div>
        <div className={`nav-item ${tab==='grading'?'active':''}`} onClick={()=>setTab('grading')}><Icon d={Icons.grade}/><span>تصحیح</span></div>
      </div>
      {modal==='exam'&&(
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="glass-strong w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-lg font-black gradient-text">ساخت آزمون</h3>
              <button onClick={()=>setModal(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button>
            </div>
            {step===1&&(
              <div className="space-y-4 fade-in">
                <div>
                  <label className="text-xs text-white/50 mb-2 block font-semibold">عنوان آزمون *</label>
                  <input className="glass-input" placeholder="مثال: آزمون ریاضی فصل ۱" value={formData.title||''} onChange={e=>setFormData({...formData,title:e.target.value})}/>
