// ===== Toast System =====
const ToastContext=React.createContext();
function ToastProvider({children}){
  const [toasts,setToasts]=useState([]);
  const showToast=(message,type='success')=>{
    const id=Date.now()+Math.random();
    setToasts(t=>[...t,{id,message,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3500);
  };
  return(
    <ToastContext.Provider value={showToast}>
      {children}
      <div className="toast-container">
        {toasts.map(t=>(
          <div key={t.id} className={`toast ${t.type}`}>
            <div className="toast-icon">
              {t.type==='success'&&<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path d="M20 6L9 17l-5-5"/></svg>}
              {t.type==='error'&&<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path d="M18 6L6 18M6 6l12 12"/></svg>}
              {t.type==='warning'&&<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>}
            </div>
            <div className="toast-content">{t.message}</div>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}
const useToast=()=>React.useContext(ToastContext);

// ===== Jalali Calendar Converter =====
function toJalali(gy,gm,gd){
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let gy2=(gm>2)?(gy+1):gy;
  let days=355666+(365*gy)+~~((gy2+3)/4)-~~((gy2+99)/100)+~~((gy2+399)/400)+gd+g_d_m[gm-1];
  let jy=-1400+~~((days-1)/1461)*4;
  days%=1461;
  if(days>365){
    jy+=~~((days-1)/365);
    days=(days-1)%365;
  }
  let jm,jd;
  if(days<186){jm=1+~~(days/31);jd=1+(days%31);}
  else{jm=7+~~((days-186)/30);jd=1+((days-186)%30);}
  return{jy,jm,jd};
}
function getJalaliMonthName(m){return['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'][m-1];}
function getJalaliDaysInMonth(jy,jm){if(jm<=6)return 31;if(jm<=11)return 30;return isJalaliLeap(jy)?30:29;}
function isJalaliLeap(jy){const a=[1,5,9,13,17,22,26,30];const b=jy%33;return a.includes(b);}
function getFirstDayOfMonth(jy,jm){
  const today=new Date();
  const jToday=toJalali(today.getFullYear(),today.getMonth()+1,today.getDate());
  const diffDays=(jy-jToday.jy)*365+(jm-jToday.jm)*30;
  const firstG=new Date(today);
  firstG.setDate(firstG.getDate()-jToday.jd+1-diffDays);
  return(firstG.getDay()+1)%7;
}

function App(){
  const [user,setUser]=useState(null);
  const [view,setView]=useState('login');
  const [tab,setTab]=useState('home');
  useEffect(()=>{
    const s=sessionStorage.getItem('edu_user');
    if(s){const u=JSON.parse(s);setUser(u);setView(u.role);}
  },[]);
  const login=async(un,pw)=>{
    const {data}=await SB.from('users').select('*').eq('username',un.toUpperCase()).eq('password',pw).single();
    if(data){setUser(data);sessionStorage.setItem('edu_user',JSON.stringify(data));setView(data.role);return true;}
    return false;
  };
  const logout=()=>{setUser(null);setView('login');setTab('home');sessionStorage.removeItem('edu_user');};
  if(view==='login') return <Login onLogin={login}/>;
  if(view==='admin') return <Admin user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
  return <Student user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
}

function Login({onLogin}){
  const [un,setUn]=useState('');const [pw,setPw]=useState('');const [err,setErr]=useState('');const [ld,setLd]=useState(false);

    e.preventDefault();setLd(true);setErr('');
    const ok=await onLogin(un,pw);
    if(!ok){setErr('نام کاربری یا رمز عبور اشتباه است');toast('اطلاعات ورود نادرست است','error');}

    setLd(false);
  };
  return(
    <div className="min-h-screen flex items-center justify-center p-6 fade-in relative overflow-hidden">

function CircularTimer({timeLeft,totalTime}){
  const r=42,c=2*Math.PI*r,p=(timeLeft/totalTime)*c;
  const m=Math.floor(timeLeft/60),s=timeLeft%60;
  const col=timeLeft<60?'#ef4444':timeLeft<300?'#f59e0b':'#818cf8';
  return(
    <div className="timer-circle">
      <svg width="100" height="100">
        <defs>
          <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#818cf8"/>
            <stop offset="100%" stopColor="#f472b6"/>
          </linearGradient>
        </defs>
        <circle className="bg" cx="50" cy="50" r={r}/>
        <circle className="progress" cx="50" cy="50" r={r} stroke={col} strokeDasharray={c} strokeDashoffset={c-p}/>
      </svg>
      <div className="timer-text">
        <div className={`text-2xl font-black font-mono ${timeLeft<60?'text-red-400 animate-pulse':timeLeft<300?'text-amber-400':'text-white'}`}>{m}:{s<10?'0':''}{s}</div>
        <div className="text-[10px] text-white/40 mt-0.5">زمان باقی‌مانده</div>
      </div>
    </div>
  );
}

// ===== Persian Calendar Component =====
function PersianCalendar(){
  const today=new Date();
  const jToday=toJalali(today.getFullYear(),today.getMonth()+1,today.getDate());
  const [viewMonth,setViewMonth]=useState(jToday.jm);
  const [viewYear,setViewYear]=useState(jToday.jy);
  
  const daysInMonth=getJalaliDaysInMonth(viewYear,viewMonth);
  const firstDay=getFirstDayOfMonth(viewYear,viewMonth);
  const days=[];
  for(let i=0;i<firstDay;i++)days.push(null);
  for(let i=1;i<=daysInMonth;i++)days.push(i);
  
  const prevMonth=()=>{
    if(viewMonth===1){setViewMonth(12);setViewYear(viewYear-1);}
    else setViewMonth(viewMonth-1);
  };
  const nextMonth=()=>{
    if(viewMonth===12){setViewMonth(1);setViewYear(viewYear+1);}
    else setViewMonth(viewMonth+1);
  };
  const goToday=()=>{setViewMonth(jToday.jm);setViewYear(jToday.jy);};
  
  const isToday=(d)=>d===jToday.jd&&viewMonth===jToday.jm&&viewYear===jToday.jy;
  
  return(
    <div className="glass-strong p-5 slide-up">
      <div className="flex justify-between items-center mb-4">
        <button onClick={prevMonth} className="p-2 bg-white/5 rounded-xl hover:bg-white/10 transition">
          <Icon d="M9 18l6-6-6-6" size={18}/>
        </button>
        <div className="text-center">
          <h3 className="font-black text-lg gradient-text">{getJalaliMonthName(viewMonth)} {viewYear}</h3>
          {!(viewMonth===jToday.jm&&viewYear===jToday.jy)&&(
            <button onClick={goToday} className="text-[10px] text-indigo-400 mt-1 hover:underline">برو به امروز</button>
          )}
        </div>
        <button onClick={nextMonth} className="p-2 bg-white/5 rounded-xl hover:bg-white/10 transition">
          <Icon d="M15 18l-6-6 6-6" size={18}/>
        </button>
      </div>
      <div className="calendar-header">
        {['ش','ی','د','س','چ','پ','ج'].map(d=><div key={d}>{d}</div>)}
      </div>
      <div className="calendar-grid">
        {days.map((d,i)=>(
          <div key={i} className={`calendar-day ${d===null?'other-month':''} ${isToday(d)?'today':''}`}>
            {d||''}
          </div>
        ))}
      </div>
      <div className="mt-4 pt-4 border-t border-white/5 text-center">
        <p className="text-xs text-white/40">امروز</p>
        <p className="text-lg font-black gradient-text">{jToday.jd} {getJalaliMonthName(jToday.jm)} {jToday.jy}</p>
      </div>
    </div>
  );
}

function Admin({user,tab,setTab,onLogout}){

  useEffect(()=>{loadAll();},[]);

  const loadAll=async()=>{
    const {data:e}=await SB.from('exams').select('*,questions(*)').order('created_at',{ascending:false});
    const {data:s}=await SB.from('users').select('*').eq('role','student');
    const {data:a}=await SB.from('answers').select('*,users(full_name,username),exams(title),questions(q_text,q_type,correct_opt,score)');
    if(e)setExams(e);if(s)setStudents(s);if(a)setAnswers(a);
    const {data:m}=await SB.from('messages').select('*,sender:sender_id(full_name,username),receiver:receiver_id(full_name,username)').order('created_at',{ascending:false});
    if(m)setMessages(m);
  };

  const createExam=async()=>{
    if(!formData.title){toast('عنوان آزمون را وارد کنید','error');return;}
    if(questions.length===0){toast('حداقل یک سوال اضافه کنید','error');return;}
    const hours=parseInt(formData.hours)||0;
    const minutes=parseInt(formData.minutes)||0;
    if(hours===0&&minutes===0){toast('مدت زمان آزمون را مشخص کنید','error');return;}
    setLoading(true);
    const duration=hours*60+minutes;
    const {data:exam,error}=await SB.from('exams').insert({title:formData.title,description:formData.desc||'',duration_minutes:duration,assigned_to:formData.assigned||'all',created_by:user.id}).select().single();
    if(error){toast('خطا: '+error.message,'error');setLoading(false);return;}
    for(const q of questions){
      await SB.from('questions').insert({exam_id:exam.id,q_text:q.q_text,opt_a:q.opt_a||null,opt_b:q.opt_b||null,opt_c:q.opt_c||null,opt_d:q.opt_d||null,correct_opt:q.correct_opt||null,q_type:q.q_type||'test',image_url:q.image_url||null,score:parseFloat(q.score)||1,order_num:questions.indexOf(q)});
    }
    setLoading(false);setModal(null);setFormData({hours:'',minutes:''});setQuestions([]);setStep(1);loadAll();
    toast('آزمون با موفقیت ساخته شد!','success');
  };

  const handleImageUpload=async(file,i)=>{
    if(!file)return;
    const ext=file.name.split('.').pop();
    const path=`${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
    const {error}=await SB.storage.from('exam-images').upload(path,file);
    if(error){toast('خطا در آپلود: '+error.message,'error');return;}
    const {data:{publicUrl}}=SB.storage.from('exam-images').getPublicUrl(path);
    const nq=[...questions];nq[i].image_url=publicUrl;setQuestions(nq);
    toast('عکس آپلود شد','success');
  };

  const addQuestion=()=>setQuestions([...questions,{q_text:'',opt_a:'',opt_b:'',opt_c:'',opt_d:'',correct_opt:'',q_type:'test',image_url:'',score:1}]);
  const updateQuestion=(i,f,v)=>{const n=[...questions];n[i][f]=v;setQuestions(n);};
  const removeQuestion=(i)=>setQuestions(questions.filter((_,x)=>x!==i));
  const duplicateQuestion=(i)=>{const q={...questions[i]};setQuestions([...questions.slice(0,i+1),q,...questions.slice(i+1)]);toast('سوال کپی شد','success');};
  const deleteExam=async(id)=>{if(confirm('حذف آزمون؟')){await SB.from('exams').delete().eq('id',id);loadAll();toast('آزمون حذف شد','success');}};
  const changePassword=async(sid)=>{const p=prompt("رمز جدید:");if(p){await SB.from('users').update({password:p}).eq('id',sid);loadAll();toast('رمز تغییر کرد','success');}};
  const gradeAnswer=async(id,score)=>{await SB.from('answers').update({score:parseFloat(score),status:'graded'}).eq('id',id);loadAll();toast('نمره ثبت شد','success');};
  const sendMessage=async()=>{if(!replyText.trim()||!selectedChat)return;await SB.from('messages').insert({sender_id:user.id,receiver_id:selectedChat.sender_id,content:replyText});setReplyText('');loadAll();};
  const clearChat=async(studentId)=>{

                  <label className="text-xs text-white/50 mb-2 block font-semibold">اختصاص به</label>
                  <select className="glass-input" value={formData.assigned||'all'} onChange={e=>setFormData({...formData,assigned:e.target.value})}>
                    <option value="all">همه دانش‌آموزان</option>
                    {students.map(s=><option key={s.id} value={s.id}>{s.full_name}</option>)}
                  </select>
                </div>
                <button onClick={()=>{
                  const h=parseInt(formData.hours)||0;
                  const m=parseInt(formData.minutes)||0;
                  if(h===0&&m===0){toast('مدت زمان را مشخص کنید','error');return;}
                  setFormData({...formData,duration:h*60+m});
                  setStep(2);
                }} className="btn-glass">مرحله بعد: سوالات</button>
              </div>
            )}
            {step===2&&(
              <div className="fade-in">
                <div className="flex justify-between items-center mb-3">
                  <h4 className="font-bold text-sm">سوالات ({questions.length})</h4>
                  <button onClick={addQuestion} className="btn-sm bg-indigo-600"><Icon d={Icons.plus} size={14}/>افزودن</button>
                </div>
                {questions.length===0&&<div className="text-center py-8 text-white/30"><p>هنوز سوالی اضافه نشده</p><button onClick={addQuestion} className="btn-glass mt-3 text-sm">افزودن اولین سوال</button></div>}
                {questions.map((q,i)=>(
                  <div key={i} className="glass p-4 mb-3 relative">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-bold text-indigo-300">سوال {i+1}</span>
                      <div className="flex gap-1">
                        <button onClick={()=>duplicateQuestion(i)} className="p-1.5 bg-blue-500/15 text-blue-400 rounded-lg" title="کپی"><Icon d="M8 6h13M8 12h13M8 18h13" size={14}/></button>
                        <button onClick={()=>removeQuestion(i)} className="p-1.5 bg-red-500/15 text-red-400 rounded-lg"><Icon d={Icons.x} size={14}/></button>
                      </div>
                    </div>
                    <textarea className="glass-input mb-2 text-sm" placeholder="متن سوال" value={q.q_text} onChange={e=>updateQuestion(i,'q_text',e.target.value)} rows="2"/>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <input className="glass-input text-sm" type="number" step="0.25" placeholder="نمره سوال" value={q.score||1} onChange={e=>updateQuestion(i,'score',e.target.value)}/>
                      <input type="file" accept="image/*" className="glass-input text-xs py-2" onChange={e=>handleImageUpload(e.target.files[0],i)}/>
                    </div>
                    {q.image_url&&<p className="text-[11px] text-emerald-400 mb-2">✓ عکس آپلود شد</p>}
                    <div className="flex gap-2 mb-2">
                      <button className={`flex-1 py-2 rounded-lg text-xs font-bold ${q.q_type==='test'?'bg-indigo-600':'bg-white/5'}`} onClick={()=>updateQuestion(i,'q_type','test')}>تستی</button>
                      <button className={`flex-1 py-2 rounded-lg text-xs font-bold ${q.q_type==='descriptive'?'bg-indigo-600':'bg-white/5'}`} onClick={()=>updateQuestion(i,'q_type','descriptive')}>تشریحی</button>
                    </div>
                    {q.q_type==='test'&&(<div className="space-y-2">{['a','b','c','d'].map(o=>(<input key={o} className="glass-input text-sm" placeholder={`گزینه ${o.toUpperCase()}`} value={q[`opt_${o}`]} onChange={e=>updateQuestion(i,`opt_${o}`,e.target.value)}/>))}<select className="glass-input text-sm" value={q.correct_opt} onChange={e=>updateQuestion(i,'correct_opt',e.target.value)}><option value="">پاسخ صحیح (اختیاری)</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select></div>)}
                  </div>
                ))}
                <div className="flex gap-2 mt-3"><button onClick={()=>setStep(1)} className="btn-glass bg-white/5 flex-1">قبلی</button><button onClick={()=>setStep(3)} className="btn-glass flex-1">بررسی</button></div>
              </div>
            )}
            {step===3&&(
              <div className="fade-in text-center">
                <div className="glass p-4 mb-4 text-right space-y-2 text-sm">
                  <p>عنوان: <b>{formData.title}</b></p>
                  <p>مدت: <b>{formData.duration} دقیقه</b></p>
                  <p>سوالات: <b>{questions.length}</b></p>
                  <p>اختصاص به: <b>{formData.assigned==='all'?'همه':students.find(s=>s.id===formData.assigned)?.full_name}</b></p>
                </div>
                <div className="flex gap-2"><button onClick={()=>setStep(2)} className="btn-glass bg-white/5 flex-1">ویرایش</button><button onClick={createExam} className="btn-glass btn-glass-success flex-1" disabled={loading}>{loading?'ذخیره...':'ذخیره آزمون'}</button></div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
const SB=window.supabase.createClient("https://ixdsctccqvljdtnjfebt.supabase.co","sb_publishable_KW1w2BRKZ1ig0-b57oVw6A_G2UIAa0h");

// ===== Toast System =====
const ToastContext=React.createContext();
function ToastProvider({children}){
  const [toasts,setToasts]=useState([]);
  const showToast=(message,type='success')=>{
    const id=Date.now()+Math.random();
    setToasts(t=>[...t,{id,message,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3500);
  };
  return(
    <ToastContext.Provider value={showToast}>
      {children}
      <div className="toast-container">
        {toasts.map(t=>(
          <div key={t.id} className={`toast ${t.type}`}>
            <div className="toast-icon">
              {t.type==='success'&&<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path d="M20 6L9 17l-5-5"/></svg>}
              {t.type==='error'&&<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path d="M18 6L6 18M6 6l12 12"/></svg>}
              {t.type==='warning'&&<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>}
            </div>
            <div className="toast-content">{t.message}</div>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}
const useToast=()=>React.useContext(ToastContext);

// ===== Jalali Calendar Converter =====
function toJalali(gy,gm,gd){
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let gy2=(gm>2)?(gy+1):gy;
  let days=355666+(365*gy)+~~((gy2+3)/4)-~~((gy2+99)/100)+~~((gy2+399)/400)+gd+g_d_m[gm-1];
  let jy=-1400+~~((days-1)/1461)*4;
  days%=1461;
  if(days>365){
    jy+=~~((days-1)/365);
    days=(days-1)%365;
  }
  let jm,jd;
  if(days<186){jm=1+~~(days/31);jd=1+(days%31);}
  else{jm=7+~~((days-186)/30);jd=1+((days-186)%30);}
  return{jy,jm,jd};
}
function getJalaliMonthName(m){return['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'][m-1];}
function getJalaliDaysInMonth(jy,jm){if(jm<=6)return 31;if(jm<=11)return 30;return isJalaliLeap(jy)?30:29;}
function isJalaliLeap(jy){const a=[1,5,9,13,17,22,26,30];const b=jy%33;return a.includes(b);}
function getFirstDayOfMonth(jy,jm){
  const today=new Date();
  const jToday=toJalali(today.getFullYear(),today.getMonth()+1,today.getDate());
  const diffDays=(jy-jToday.jy)*365+(jm-jToday.jm)*30;
  const firstG=new Date(today);
  firstG.setDate(firstG.getDate()-jToday.jd+1-diffDays);
  return(firstG.getDay()+1)%7;
}

const Icon=({d,size=22,className=""})=><svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d={d}/></svg>;

function App(){
  const [user,setUser]=useState(null);
  const [view,setView]=useState('login');
  const [tab,setTab]=useState('home');
  useEffect(()=>{
    const s=sessionStorage.getItem('edu_user');
    if(s){const u=JSON.parse(s);setUser(u);setView(u.role);}
  },[]);
  const login=async(un,pw)=>{
    const {data}=await SB.from('users').select('*').eq('username',un.toUpperCase()).eq('password',pw).single();
    if(data){setUser(data);sessionStorage.setItem('edu_user',JSON.stringify(data));setView(data.role);return true;}
    return false;
  };
  const logout=()=>{setUser(null);setView('login');setTab('home');sessionStorage.removeItem('edu_user');};
  if(view==='login') return <Login onLogin={login}/>;
  if(view==='admin') return <Admin user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
  return <Student user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
}

function CircularTimer({timeLeft,totalTime}){
  const r=42,c=2*Math.PI*r,p=(timeLeft/totalTime)*c;
  const m=Math.floor(timeLeft/60),s=timeLeft%60;
  const col=timeLeft<60?'#ef4444':timeLeft<300?'#f59e0b':'#818cf8';
  return(
    <div className="timer-circle">
      <svg width="100" height="100">
        <defs>
          <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#818cf8"/>
            <stop offset="100%" stopColor="#f472b6"/>
          </linearGradient>
        </defs>
        <circle className="bg" cx="50" cy="50" r={r}/>
        <circle className="progress" cx="50" cy="50" r={r} stroke={col} strokeDasharray={c} strokeDashoffset={c-p}/>
      </svg>
      <div className="timer-text">
        <div className={`text-2xl font-black font-mono ${timeLeft<60?'text-red-400 animate-pulse':timeLeft<300?'text-amber-400':'text-white'}`}>{m}:{s<10?'0':''}{s}</div>
        <div className="text-[10px] text-white/40 mt-0.5">زمان باقی‌مانده</div>
      </div>
    </div>
  );
}

// ===== Persian Calendar Component =====
function PersianCalendar(){
  const today=new Date();
  const jToday=toJalali(today.getFullYear(),today.getMonth()+1,today.getDate());
  const [viewMonth,setViewMonth]=useState(jToday.jm);
  const [viewYear,setViewYear]=useState(jToday.jy);
  
  const daysInMonth=getJalaliDaysInMonth(viewYear,viewMonth);
  const firstDay=getFirstDayOfMonth(viewYear,viewMonth);
  const days=[];
  for(let i=0;i<firstDay;i++)days.push(null);
  for(let i=1;i<=daysInMonth;i++)days.push(i);
  
  const prevMonth=()=>{
    if(viewMonth===1){setViewMonth(12);setViewYear(viewYear-1);}
    else setViewMonth(viewMonth-1);
  };
  const nextMonth=()=>{
    if(viewMonth===12){setViewMonth(1);setViewYear(viewYear+1);}
    else setViewMonth(viewMonth+1);
  };
  const goToday=()=>{setViewMonth(jToday.jm);setViewYear(jToday.jy);};
  
  const isToday=(d)=>d===jToday.jd&&viewMonth===jToday.jm&&viewYear===jToday.jy;
  
  return(
    <div className="glass-strong p-5 slide-up">
      <div className="flex justify-between items-center mb-4">
        <button onClick={prevMonth} className="p-2 bg-white/5 rounded-xl hover:bg-white/10 transition">
          <Icon d="M9 18l6-6-6-6" size={18}/>
        </button>
        <div className="text-center">
          <h3 className="font-black text-lg gradient-text">{getJalaliMonthName(viewMonth)} {viewYear}</h3>
          {!(viewMonth===jToday.jm&&viewYear===jToday.jy)&&(
            <button onClick={goToday} className="text-[10px] text-indigo-400 mt-1 hover:underline">برو به امروز</button>
          )}
        </div>
        <button onClick={nextMonth} className="p-2 bg-white/5 rounded-xl hover:bg-white/10 transition">
          <Icon d="M15 18l-6-6 6-6" size={18}/>
        </button>
      </div>
      <div className="calendar-header">
        {['ش','ی','د','س','چ','پ','ج'].map(d=><div key={d}>{d}</div>)}
      </div>
      <div className="calendar-grid">
        {days.map((d,i)=>(
          <div key={i} className={`calendar-day ${d===null?'other-month':''} ${isToday(d)?'today':''}`}>
            {d||''}
          </div>
        ))}
      </div>
      <div className="mt-4 pt-4 border-t border-white/5 text-center">
        <p className="text-xs text-white/40">امروز</p>
        <p className="text-lg font-black gradient-text">{jToday.jd} {getJalaliMonthName(jToday.jm)} {jToday.jy}</p>
      </div>
    </div>
  );
}

function Admin({user,tab,setTab,onLogout}){
  const [exams,setExams]=useState([]);const [students,setStudents]=useState([]);const [answers,setAnswers]=useState([]);
  const [modal,setModal]=useState(null);const [step,setStep]=useState(1);const [formData,setFormData]=useState({hours:'',minutes:''});
  const [questions,setQuestions]=useState([]);const [loading,setLoading]=useState(false);
  const [subTab,setSubTab]=useState('list');const [messages,setMessages]=useState([]);
  const [replyText,setReplyText]=useState('');const [selectedChat,setSelectedChat]=useState(null);
  const toast=useToast();

  useEffect(()=>{loadAll();},[]);

  const loadAll=async()=>{
    const {data:e}=await SB.from('exams').select('*,questions(*)').order('created_at',{ascending:false});
    const {data:s}=await SB.from('users').select('*').eq('role','student');
    const {data:a}=await SB.from('answers').select('*,users(full_name,username),exams(title),questions(q_text,q_type,correct_opt,score)');
    if(e)setExams(e);if(s)setStudents(s);if(a)setAnswers(a);
    const {data:m}=await SB.from('messages').select('*,sender:sender_id(full_name,username),receiver:receiver_id(full_name,username)').order('created_at',{ascending:false});
    if(m)setMessages(m);
  };

  const createExam=async()=>{
    if(!formData.title){toast('عنوان آزمون را وارد کنید','error');return;}
    if(questions.length===0){toast('حداقل یک سوال اضافه کنید','error');return;}
    const hours=parseInt(formData.hours)||0;
    const minutes=parseInt(formData.minutes)||0;
    if(hours===0&&minutes===0){toast('مدت زمان آزمون را مشخص کنید','error');return;}
    setLoading(true);
    const duration=hours*60+minutes;
    const {data:exam,error}=await SB.from('exams').insert({title:formData.title,description:formData.desc||'',duration_minutes:duration,assigned_to:formData.assigned||'all',created_by:user.id}).select().single();
    if(error){toast('خطا: '+error.message,'error');setLoading(false);return;}
    for(const q of questions){
      await SB.from('questions').insert({exam_id:exam.id,q_text:q.q_text,opt_a:q.opt_a||null,opt_b:q.opt_b||null,opt_c:q.opt_c||null,opt_d:q.opt_d||null,correct_opt:q.correct_opt||null,q_type:q.q_type||'test',image_url:q.image_url||null,score:parseFloat(q.score)||1,order_num:questions.indexOf(q)});
    }
    setLoading(false);setModal(null);setFormData({hours:'',minutes:''});setQuestions([]);setStep(1);loadAll();
    toast('آزمون با موفقیت ساخته شد!','success');
  };

  const handleImageUpload=async(file,i)=>{
    if(!file)return;
    const ext=file.name.split('.').pop();
    const path=`${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
    const {error}=await SB.storage.from('exam-images').upload(path,file);
    if(error){toast('خطا در آپلود: '+error.message,'error');return;}
    const {data:{publicUrl}}=SB.storage.from('exam-images').getPublicUrl(path);
    const nq=[...questions];nq[i].image_url=publicUrl;setQuestions(nq);
    toast('عکس آپلود شد','success');
  };

  const addQuestion=()=>setQuestions([...questions,{q_text:'',opt_a:'',opt_b:'',opt_c:'',opt_d:'',correct_opt:'',q_type:'test',image_url:'',score:1}]);
  const updateQuestion=(i,f,v)=>{const n=[...questions];n[i][f]=v;setQuestions(n);};
  const removeQuestion=(i)=>setQuestions(questions.filter((_,x)=>x!==i));
  const duplicateQuestion=(i)=>{const q={...questions[i]};setQuestions([...questions.slice(0,i+1),q,...questions.slice(i+1)]);toast('سوال کپی شد','success');};
  const deleteExam=async(id)=>{if(confirm('حذف آزمون؟')){await SB.from('exams').delete().eq('id',id);loadAll();toast('آزمون حذف شد','success');}};
  const changePassword=async(sid)=>{const p=prompt("رمز جدید:");if(p){await SB.from('users').update({password:p}).eq('id',sid);loadAll();toast('رمز تغییر کرد','success');}};
  const gradeAnswer=async(id,score)=>{await SB.from('answers').update({score:parseFloat(score),status:'graded'}).eq('id',id);loadAll();toast('نمره ثبت شد','success');};
  const sendMessage=async()=>{if(!replyText.trim()||!selectedChat)return;await SB.from('messages').insert({sender_id:user.id,receiver_id:selectedChat.sender_id,content:replyText});setReplyText('');loadAll();};
  const clearChat=async(studentId)=>{
    if(!confirm('تمام پیام‌های این دانش‌آموز حذف شود؟'))return;
    await SB.from('messages').delete().or(`and(sender_id.eq.${user.id},receiver_id.eq.${studentId})`, `and(sender_id.eq.${studentId},receiver_id.eq.${user.id})`);

    setSelectedChat(null);
    toast('تاریخچه چت پاک شد','success');

  const objections=answers.filter(a=>a.objection&&a.objection.trim()!==''&&a.status!=='graded');

  return(

              {[{icon:Icons.exam,color:'text-indigo-400',n:exams.length,l:'آزمون'},{icon:Icons.users,color:'text-sky-400',n:students.length,l:'دانش‌آموز'},{icon:Icons.grade,color:'text-emerald-400',n:answers.filter(a=>a.status==='pending').length,l:'در انتظار'},{icon:Icons.alert,color:'text-amber-400',n:objections.length,l:'اعتراض'}].map((s,i)=>(
                <div key={i} className="glass p-4 text-center slide-up" style={{animationDelay:i*0.08+'s'}}>
                  <Icon d={s.icon} size={24} className={`mx-auto mb-2 ${s.color}`}/>

                      </button>
                    </div>
                    <div className="flex-1 overflow-y-auto mb-3 space-y-1">
                      {messages.filter(m=>(m.sender_id===selectedChat.sender_id&&m.receiver_id===user.id)||(m.sender_id===user.id&&m.receiver_id===selectedChat.sender_id)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(m=>(
                        <div key={m.id} className={`chat-bubble ${m.sender_id===user.id?'me':'other'}`}>{m.content}</div>
                      ))}
                    </div>
                    <div className="flex gap-2">
                      <input className="glass-input flex-1 text-sm" placeholder="پاسخ..." value={replyText} onChange={e=>setReplyText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendMessage()}/>
                      <button onClick={sendMessage} className="btn-glass btn-glass-success btn-sm"><Icon d={Icons.send} size={16}/></button>
                    </div>
                  </>
                )}
              </div>
            )}
          </>
        )}
        {tab==='grading'&&(
          <>
            <h3 className="font-bold mb-3 text-white/70 text-sm">در انتظار تصحیح</h3>
            {answers.filter(a=>a.status==='pending'&&!a.objection).length===0&&<div className="card text-center py-10 text-white/30">همه تصحیح شده</div>}
            {answers.filter(a=>a.status==='pending'&&!a.objection).map(a=>(
              <div key={a.id} className="card">
                <h4 className="font-bold text-sm">{a.users?.full_name} - {a.exams?.title}</h4>
                <p className="text-xs text-white/40 mt-1">{a.questions?.q_text}</p>
                <p className="text-sm text-indigo-300 mt-2 bg-white/5 p-2 rounded">پاسخ: {a.student_answer||'بدون پاسخ'}</p>
                <div className="flex gap-2 mt-3">
                  <input type="number" className="glass-input flex-1 text-sm" placeholder="نمره" id={`s-${a.id}`}/>
                  <button onClick={()=>gradeAnswer(a.id,document.getElementById(`s-${a.id}`).value)} className="btn-glass btn-glass-success btn-sm">ثبت</button>
                </div>
              </div>
            ))}
          </>
        )}
      </div>
      <div className="nav-bar">
        <div className={`nav-item ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==='students'?'active':''}`} onClick={()=>{setTab('students');setSubTab('list');}}><Icon d={Icons.users}/><span>کاربران</span></div>
        <div className={`nav-item ${tab==='grading'?'active':''}`} onClick={()=>setTab('grading')}><Icon d={Icons.grade}/><span>تصحیح</span></div>
      </div>
      {modal==='exam'&&(
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="glass-strong w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-lg font-black gradient-text">ساخت آزمون</h3>
              <button onClick={()=>setModal(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button>
            </div>
            {step===1&&(
              <div className="space-y-4 fade-in">
                <div>
                  <label className="text-xs text-white/50 mb-2 block font-semibold">عنوان آزمون *</label>
                  <input className="glass-input" placeholder="مثال: آزمون ریاضی فصل ۱" value={formData.title||''} onChange={e=>setFormData({...formData,title:e.target.value})}/>
                </div>
                <div>
                  <label className="text-xs text-white/50 mb-2 block font-semibold">توضیحات</label>
                  <textarea className="glass-input" placeholder="توضیحات..." value={formData.desc||''} onChange={e=>setFormData({...formData,desc:e.target.value})} rows="2"/>
                </div>
                <div>
                  <label className="text-xs text-white/50 mb-2 block font-semibold">مدت زمان آزمون *</label>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-[10px] text-white/40 mb-1 block">ساعت</label>
                      <input className="glass-input" type="number" min="0" max="10" placeholder="۰" value={formData.hours||''} onChange={e=>setFormData({...formData,hours:e.target.value})}/>
                    </div>
                    <div>
                      <label className="text-[10px] text-white/40 mb-1 block">دقیقه</label>
                      <input className="glass-input" type="number" min="0" max="59" placeholder="۶۰" value={formData.minutes||''} onChange={e=>setFormData({...formData,minutes:e.target.value})}/>
                    </div>
                  </div>
                </div>
                <div>
                  <label className="text-xs text-white/50 mb-2 block font-semibold">اختصاص به</label>
                  <select className="glass-input" value={formData.assigned||'all'} onChange={e=>setFormData({...formData,assigned:e.target.value})}>
                    <option value="all">همه دانش‌آموزان</option>
                    {students.map(s=><option key={s.id} value={s.id}>{s.full_name}</option>)}
                  </select>
                </div>
                <button onClick={()=>{
                  const h=parseInt(formData.hours)||0;
                  const m=parseInt(formData.minutes)||0;
                  if(h===0&&m===0){toast('مدت زمان را مشخص کنید','error');return;}
                  setFormData({...formData,duration:h*60+m});
                  setStep(2);
                }} className="btn-glass">مرحله بعد: سوالات</button>
              </div>
            )}
            {step===2&&(
              <div className="fade-in">
                <div className="flex justify-between items-center mb-3">
                  <h4 className="font-bold text-sm">سوالات ({questions.length})</h4>
                  <button onClick={addQuestion} className="btn-sm bg-indigo-600"><Icon d={Icons.plus} size={14}/>افزودن</button>
                </div>
                {questions.length===0&&<div className="text-center py-8 text-white/30"><p>هنوز سوالی اضافه نشده</p><button onClick={addQuestion} className="btn-glass mt-3 text-sm">افزودن اولین سوال</button></div>}
                {questions.map((q,i)=>(
                  <div key={i} className="glass p-4 mb-3 relative">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-bold text-indigo-300">سوال {i+1}</span>
                      <div className="flex gap-1">
                        <button onClick={()=>duplicateQuestion(i)} className="p-1.5 bg-blue-500/15 text-blue-400 rounded-lg" title="کپی"><Icon d="M8 6h13M8 12h13M8 18h13" size={14}/></button>
                        <button onClick={()=>removeQuestion(i)} className="p-1.5 bg-red-500/15 text-red-400 rounded-lg"><Icon d={Icons.x} size={14}/></button>
                      </div>
                    </div>
                    <textarea className="glass-input mb-2 text-sm" placeholder="متن سوال" value={q.q_text} onChange={e=>updateQuestion(i,'q_text',e.target.value)} rows="2"/>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <input className="glass-input text-sm" type="number" step="0.25" placeholder="نمره سوال" value={q.score||1} onChange={e=>updateQuestion(i,'score',e.target.value)}/>
                      <input type="file" accept="image/*" className="glass-input text-xs py-2" onChange={e=>handleImageUpload(e.target.files[0],i)}/>
                    </div>
                    {q.image_url&&<p className="text-[11px] text-emerald-400 mb-2">✓ عکس آپلود شد</p>}
                    <div className="flex gap-2 mb-2">
                      <button className={`flex-1 py-2 rounded-lg text-xs font-bold ${q.q_type==='test'?'bg-indigo-600':'bg-white/5'}`} onClick={()=>updateQuestion(i,'q_type','test')}>تستی</button>
                      <button className={`flex-1 py-2 rounded-lg text-xs font-bold ${q.q_type==='descriptive'?'bg-indigo-600':'bg-white/5'}`} onClick={()=>updateQuestion(i,'q_type','descriptive')}>تشریحی</button>
                    </div>
                    {q.q_type==='test'&&(<div className="space-y-2">{['a','b','c','d'].map(o=>(<input key={o} className="glass-input text-sm" placeholder={`گزینه ${o.toUpperCase()}`} value={q[`opt_${o}`]} onChange={e=>updateQuestion(i,`opt_${o}`,e.target.value)}/>))}<select className="glass-input text-sm" value={q.correct_opt} onChange={e=>updateQuestion(i,'correct_opt',e.target.value)}><option value="">پاسخ صحیح (اختیاری)</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select></div>)}
                  </div>
                ))}
                <div className="flex gap-2 mt-3"><button onClick={()=>setStep(1)} className="btn-glass bg-white/5 flex-1">قبلی</button><button onClick={()=>setStep(3)} className="btn-glass flex-1">بررسی</button></div>
              </div>
            )}
            {step===3&&(
              <div className="fade-in text-center">
                <div className="glass p-4 mb-4 text-right space-y-2 text-sm">
                  <p>عنوان: <b>{formData.title}</b></p>
                  <p>مدت: <b>{formData.duration} دقیقه</b></p>
                  <p>سوالات: <b>{questions.length}</b></p>
                  <p>اختصاص به: <b>{formData.assigned==='all'?'همه':students.find(s=>s.id===formData.assigned)?.full_name}</b></p>
                </div>
                <div className="flex gap-2"><button onClick={()=>setStep(2)} className="btn-glass bg-white/5 flex-1">ویرایش</button><button onClick={createExam} className="btn-glass btn-glass-success flex-1" disabled={loading}>{loading?'ذخیره...':'ذخیره آزمون'}</button></div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}
