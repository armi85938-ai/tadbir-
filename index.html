                <div>
                  <label className="text-xs text-white/50 mb-2 block font-semibold">توضیحات</label>
                  <textarea className="glass-input" placeholder="توضیحات..." value={formData.desc||''} onChange={e=>setFormData({...formData,desc:e.target.value})} rows="2"/>
                </div>
                <div>
                  <label className="text-xs text-white/50 mb-2 block font-semibold">مدت زمان آزمون *</label>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-[10px] text-white/40 mb-1 block">ساعت</label>
                      <input className="glass-input" type="number" min="0" max="10" placeholder="۰" value={formData.hours||''} onChange={e=>setFormData({...formData,hours:e.target.value})}/>
                    </div>
                    <div>
                      <label className="text-[10px] text-white/40 mb-1 block">دقیقه</label>
                      <input className="glass-input" type="number" min="0" max="59" placeholder="۶۰" value={formData.minutes||''} onChange={e=>setFormData({...formData,minutes:e.target.value})}/>
                    </div>
                  </div>
                </div>
                <div>
                  <label className="text-xs text-white/50 mb-2 block font-semibold">اختصاص به</label>
                  <select className="glass-input" value={formData.assigned||'all'} onChange={e=>setFormData({...formData,assigned:e.target.value})}>
                    <option value="all">همه دانش‌آموزان</option>
                    {students.map(s=><option key={s.id} value={s.id}>{s.full_name}</option>)}
                  </select>
                </div>
                <button onClick={()=>{
                  const h=parseInt(formData.hours)||0;const m=parseInt(formData.minutes)||0;
                  if(h===0&&m===0){toast('مدت زمان را مشخص کنید','error');return;}
                  setFormData({...formData,duration:h*60+m});setStep(2);
                }} className="btn-glass">مرحله بعد: سوالات</button>
              </div>
            )}
            {step===2&&(
              <div className="fade-in">
                <div className="flex justify-between items-center mb-3">
                  <h4 className="font-bold text-sm">سوالات ({questions.length})</h4>
                  <button onClick={addQuestion} className="btn-sm bg-indigo-600"><Icon d={Icons.plus} size={14}/>افزودن</button>
                </div>
                {questions.length===0&&<div className="text-center py-8 text-white/30"><p>هنوز سوالی اضافه نشده</p><button onClick={addQuestion} className="btn-glass mt-3 text-sm">افزودن اولین سوال</button></div>}
                {questions.map((q,i)=>(
                  <div key={i} className="glass p-4 mb-3 relative">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-bold text-indigo-300">سوال {i+1}</span>
                      <button onClick={()=>removeQuestion(i)} className="p-1.5 bg-red-500/15 text-red-400 rounded-lg"><Icon d={Icons.x} size={14}/></button>
                    </div>
                    <textarea className="glass-input mb-2 text-sm" placeholder="متن سوال" value={q.q_text} onChange={e=>updateQuestion(i,'q_text',e.target.value)} rows="2"/>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <input className="glass-input text-sm" type="number" step="0.25" placeholder="نمره سوال" value={q.score||1} onChange={e=>updateQuestion(i,'score',e.target.value)}/>
                      <input type="file" accept="image/*" className="glass-input text-xs py-2" onChange={e=>handleImageUpload(e.target.files[0],i)}/>
                    </div>
                    {q.image_url&&<p className="text-[11px] text-emerald-400 mb-2">✓ عکس آپلود شد</p>}
                    <div className="flex gap-2 mb-2">
                      <button className={`flex-1 py-2 rounded-lg text-xs font-bold ${q.q_type==='test'?'bg-indigo-600':'bg-white/5'}`} onClick={()=>updateQuestion(i,'q_type','test')}>تستی</button>
                      <button className={`flex-1 py-2 rounded-lg text-xs font-bold ${q.q_type==='descriptive'?'bg-indigo-600':'bg-white/5'}`} onClick={()=>updateQuestion(i,'q_type','descriptive')}>تشریحی</button>
                    </div>
                    {q.q_type==='test'&&(<div className="space-y-2">{['a','b','c','d'].map(o=>(<input key={o} className="glass-input text-sm" placeholder={`گزینه ${o.toUpperCase()}`} value={q[`opt_${o}`]} onChange={e=>updateQuestion(i,`opt_${o}`,e.target.value)}/>))}<select className="glass-input text-sm" value={q.correct_opt} onChange={e=>updateQuestion(i,'correct_opt',e.target.value)}><option value="">پاسخ صحیح (اختیاری)</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select></div>)}
                  </div>
                ))}
                <div className="flex gap-2 mt-3"><button onClick={()=>setStep(1)} className="btn-glass bg-white/5 flex-1">قبلی</button><button onClick={()=>setStep(3)} className="btn-glass flex-1">بررسی</button></div>
              </div>
            )}
            {step===3&&(
              <div className="fade-in text-center">
                <div className="glass p-4 mb-4 text-right space-y-2 text-sm">
                  <p>عنوان: <b>{formData.title}</b></p>
                  <p>مدت: <b>{formData.duration} دقیقه</b></p>
                  <p>سوالات: <b>{questions.length}</b></p>
                  <p>اختصاص به: <b>{formData.assigned==='all'?'همه':students.find(s=>s.id===formData.assigned)?.full_name}</b></p>
                </div>
                <div className="flex gap-2"><button onClick={()=>setStep(2)} className="btn-glass bg-white/5 flex-1">ویرایش</button><button onClick={createExam} className="btn-glass btn-glass-success flex-1" disabled={loading}>{loading?'ذخیره...':'ذخیره آزمون'}</button></div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ===== Student Panel =====
function Student({user,tab,setTab,onLogout}){
  const [exams,setExams]=useState([]);const [answers,setAnswers]=useState([]);
  const [activeExam,setActiveExam]=useState(null);const [currentQ,setCurrentQ]=useState(0);
  const [studentAnswers,setStudentAnswers]=useState({});const [timeLeft,setTimeLeft]=useState(0);const [totalTime,setTotalTime]=useState(0);
  const [calcDisplay,setCalcDisplay]=useState('');
  const [showObjection,setShowObjection]=useState(null);const [objectionText,setObjectionText]=useState('');
  const [selectedExamForObjection,setSelectedExamForObjection]=useState(null);
  const [checklist,setChecklist]=useState([]);const [newTask,setNewTask]=useState('');
  const [studyPlans,setStudyPlans]=useState([]);const [newPlan,setNewPlan]=useState({day:'شنبه',subject:'',time:''});
  const [toolsTab,setToolsTab]=useState('calc');
  const [chartReady,setChartReady]=useState(false);
  const [showExamResults,setShowExamResults]=useState(null);
  const [showChat,setShowChat]=useState(false);
  const [showPasswordModal,setShowPasswordModal]=useState(false);
  const [activeGame,setActiveGame]=useState(null);
  const toast=useToast();

  useEffect(()=>{loadAll();},[]);

  const loadAll=async()=>{
    const {data:e}=await SB.from('exams').select('*,questions(*)').order('created_at',{ascending:false});
    const {data:a}=await SB.from('answers').select('*,exams(title),questions(q_text,q_type,correct_opt,score,opt_a,opt_b,opt_c,opt_d)');
    const {data:c}=await SB.from('checklists').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    const {data:p}=await SB.from('study_plans').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    if(e)setExams(e.filter(ex=>ex.assigned_to==='all'||ex.assigned_to===String(user.id)));
    if(a)setAnswers(a.filter(ans=>ans.student_id===user.id));
    if(c)setChecklist(c);if(p)setStudyPlans(p);
  };

  const hasTakenExam=(examId)=>answers.some(a=>String(a.exam_id)===String(examId));

  const startExam=(exam)=>{
    if(hasTakenExam(exam.id)){toast('⚠️ قبلاً در این آزمون شرکت کرده‌اید','warning');return;}
    setActiveExam(exam);setCurrentQ(0);setStudentAnswers({});setTimeLeft(exam.duration_minutes*60);setTotalTime(exam.duration_minutes*60);
  };

  useEffect(()=>{if(activeExam&&timeLeft>0){const t=setInterval(()=>setTimeLeft(tl=>tl-1),1000);return()=>clearInterval(t);}else if(activeExam&&timeLeft===0)submitExam();},[activeExam,timeLeft]);

  const submitExam=async()=>{
    if(!activeExam)return;
    for(const q of activeExam.questions){
      const ans=studentAnswers[q.id]||'';let score=0;let status='pending';
      if(q.q_type==='test'){
        if(q.correct_opt){
          if(ans===q.correct_opt)score=parseFloat(q.score)||1;
          status='graded';
        }
      }
      await SB.from('answers').insert({exam_id:activeExam.id,student_id:user.id,question_id:q.id,student_answer:ans,score,max_score:parseFloat(q.score)||1,status});
    }
    toast('✅ پاسخ‌ها ثبت شد!','success');
    setActiveExam(null);loadAll();
  };

  const calcPress=(v)=>{
    if(v==='C')setCalcDisplay('');
    else if(v==='='){
      try{
        const expr=calcDisplay.replace(/÷/g,'/').replace(/×/g,'*');
        setCalcDisplay(String(new Function('return '+expr)()));
      }catch{setCalcDisplay('خطا');}
    }
    else setCalcDisplay(calcDisplay+v);
  };

  const submitObjection=async()=>{
    if(!objectionText.trim()||!selectedExamForObjection)return;
    const examAnswers=answers.filter(a=>a.exam_id===selectedExamForObjection);
    for(const a of examAnswers){
      await SB.from('answers').update({objection:objectionText.trim()}).eq('id',a.id);
    }
    toast('✅ اعتراض ثبت شد!','success');
    setShowObjection(null);setSelectedExamForObjection(null);setObjectionText('');loadAll();
  };

  const addTask=async()=>{
    if(!newTask.trim())return;
    const {data,error}=await SB.from('checklists').insert({user_id:user.id,title:newTask.trim()}).select().single();
    if(error){toast('خطا: '+error.message,'error');return;}
    if(data)setChecklist([data,...checklist]);setNewTask('');
    toast('✅ کار اضافه شد','success');
  };
  const toggleTask=async(id,done)=>{await SB.from('checklists').update({is_done:!done}).eq('id',id);setChecklist(checklist.map(t=>t.id===id?{...t,is_done:!done}:t));};
  const deleteTask=async(id)=>{await SB.from('checklists').delete().eq('id',id);setChecklist(checklist.filter(t=>t.id!==id));};

  const addPlan=async()=>{
    if(!newPlan.subject.trim()||!newPlan.time.trim()){toast('همه فیلدها را پر کنید','error');return;}
    const {data,error}=await SB.from('study_plans').insert({user_id:user.id,day_of_week:newPlan.day,subject:newPlan.subject.trim(),time_range:newPlan.time.trim()}).select().single();
    if(error){toast('خطا: '+error.message,'error');return;}
    if(data)setStudyPlans([data,...studyPlans]);setNewPlan({day:'شنبه',subject:'',time:''});
    toast('✅ برنامه اضافه شد','success');
  };
  const deletePlan=async(id)=>{await SB.from('study_plans').delete().eq('id',id);setStudyPlans(studyPlans.filter(p=>p.id!==id));};

  const getExamScore=(examId)=>{
    const examAnswers=answers.filter(a=>String(a.exam_id)===String(examId));
    if(examAnswers.length===0)return null;
    const totalScore=examAnswers.reduce((s,a)=>s+parseFloat(a.score||0),0);
    const maxScore=examAnswers.reduce((s,a)=>s+parseFloat(a.max_score||0),0);
    const percentage=(totalScore/maxScore)*20;
    return {totalScore,maxScore,percentage:percentage.toFixed(2)};
  };

  const getAverage=()=>{
    const examScores=exams.map(ex=>getExamScore(ex.id)).filter(s=>s!==null);
    if(examScores.length===0)return 0;
    const avg=examScores.reduce((s,e)=>s+parseFloat(e.percentage),0)/examScores.length;
    return avg.toFixed(2);
  };

  useEffect(()=>{
    if(tab==='chart'&&chartReady){
      const ctx=document.getElementById('gradeChart');if(!ctx)return;
      if(window.myChart)window.myChart.destroy();
      const examData=exams.map(ex=>{const s=getExamScore(ex.id);return s?{title:ex.title.substring(0,15),score:parseFloat(s.percentage)}:null;}).filter(d=>d!==null);
      if(examData.length===0)return;
      const gradient=ctx.getContext('2d').createLinearGradient(0,0,0,300);
      gradient.addColorStop(0,'rgba(129,140,248,0.4)');gradient.addColorStop(1,'rgba(129,140,248,0)');
      window.myChart=new Chart(ctx,{type:'line',data:{labels:examData.map(d=>d.title),datasets:[{label:'نمره از 20',data:examData.map(d=>d.score),borderColor:'#818cf8',backgroundColor:gradient,borderWidth:3,tension:0.4,fill:true,pointBackgroundColor:'#f472b6',pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:6,pointHoverRadius:9}]},options:{responsive:true,plugins:{legend:{labels:{color:'white',font:{family:'Vazirmatn'}}}},scales:{y:{ticks:{color:'rgba(255,255,255,0.5)'},grid:{color:'rgba(255,255,255,0.05)'},beginAtZero:true,max:20},x:{ticks:{color:'rgba(255,255,255,0.5)'},grid:{color:'rgba(255,255,255,0.03)'}}}}});
    }
  },[tab,chartReady,answers,exams]);

  if(activeExam){
    const q=activeExam.questions[currentQ];const progress=((currentQ+1)/activeExam.questions.length)*100;
    return(
      <div className="min-h-screen">
        <div className="header">
          <div className="flex justify-between items-center mb-3">
            <div>
              <h2 className="font-black text-lg gradient-text">{activeExam.title}</h2>
              <p className="text-[11px] text-white/40 mt-1">سوال {currentQ+1} از {activeExam.questions.length}</p>
            </div>
            <CircularTimer timeLeft={timeLeft} totalTime={totalTime}/>
          </div>
          <div className="w-full bg-white/5 rounded-full h-2 overflow-hidden">
            <div className="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 h-2 rounded-full transition-all duration-500" style={{width:`${progress}%`}}></div>
          </div>
        </div>
        {timeLeft<300&&timeLeft>0&&<div className="bg-red-500/15 text-red-300 p-3 text-center text-sm font-bold animate-pulse border-b border-red-500/20">⚠️ کمتر از ۵ دقیقه!</div>}
        <div className="content">
          <div className="glass p-5 fade-in">
            <div className="flex justify-between items-center mb-3">
              <span className={`badge ${q?.q_type==='test'?'badge-new':'badge-approved'}`}>{q?.q_type==='test'?'📝 تستی':'✍️ تشریحی'}</span>
              <span className="badge badge-new">⭐ {q?.score||1} نمره</span>
            </div>
            {q?.image_url&&<img src={q.image_url} alt="" className="w-full rounded-xl mb-4 max-h-48 object-contain bg-black/20 border border-white/5"/>}
            <p className="mb-5 font-bold leading-relaxed text-lg">{q?.q_text}</p>
            {q?.q_type==='test'?(
              <div className="space-y-2">
                {['A','B','C','D'].map(opt=>(
                  <div key={opt} className={`glass p-3 cursor-pointer transition-all ${studentAnswers[q.id]===opt?'border-indigo-500 bg-indigo-500/15 scale-[1.02]':'hover:bg-white/5'}`} onClick={()=>setStudentAnswers({...studentAnswers,[q.id]:opt})}>
                    <div className="flex items-center gap-3">
                      <div className={`w-10 h-10 rounded-full border-2 flex items-center justify-center font-bold text-sm transition-all ${studentAnswers[q.id]===opt?'bg-gradient-to-br from-indigo-500 to-purple-500 border-transparent text-white scale-110':'border-white/20'}`}>{opt}</div>
                      <span className="flex-1 text-sm">{q[`opt_${opt.toLowerCase()}`]}</span>
                      {studentAnswers[q.id]===opt&&<Icon d={Icons.check} size={20} className="text-indigo-400"/>}
                    </div>
                  </div>
                ))}
              </div>
            ):(<textarea className="glass-input" placeholder="پاسخ خود را بنویسید..." value={studentAnswers[q.id]||''} onChange={e=>setStudentAnswers({...studentAnswers,[q.id]:e.target.value})} rows="5"/>)}
          </div>
          <div className="flex gap-2 mt-4">
            {currentQ>0&&<button onClick={()=>setCurrentQ(currentQ-1)} className="btn-glass bg-white/5 flex-1">← قبلی</button>}
            {currentQ<activeExam.questions.length-1?<button onClick={()=>setCurrentQ(currentQ+1)} className="btn-glass flex-1">بعدی →</button>:<button onClick={()=>{if(confirm('ثبت نهایی آزمون؟'))submitExam();}} className="btn-glass btn-glass-success flex-1">✓ ثبت نهایی</button>}
          </div>
        </div>
      </div>
    );
  }

  return(
    <div className="min-h-screen pb-24">
      <div className="header flex justify-between items-center">
        <div>
          <h1 className="text-lg font-black gradient-text">پنل دانش‌آموز</h1>
          <p className="text-xs text-white/40 mt-1">سلام {user.full_name} 👋</p>
        </div>
        <div className="flex gap-2">
          <button onClick={()=>setShowPasswordModal(true)} className="p-2.5 bg-white/5 rounded-xl hover:bg-white/10 transition" title="تغییر رمز">
            <Icon d={Icons.key} size={18}/>
          </button>
          <button onClick={onLogout} className="p-2.5 bg-white/5 rounded-xl hover:bg-white/10 transition">
            <Icon d={Icons.logout} size={18}/>
          </button>
        </div>
      </div>
      <div className="content">
        {tab==='home'&&(
          <>
            <div className="grid grid-cols-2 gap-3 mb-4">
              <div className="glass p-5 text-center slide-up">
                <Icon d={Icons.award} size={28} className="mx-auto mb-2 text-amber-400"/>
                <p className="text-3xl font-black gradient-text">{getAverage()}</p>
                <p className="text-[11px] text-white/40">معدل از 20</p>
              </div>
              <div className="glass p-5 text-center slide-up" style={{animationDelay:'0.1s'}}>
                <Icon d={Icons.exam} size={28} className="mx-auto mb-2 text-indigo-400"/>
                <p className="text-3xl font-black">{exams.filter(e=>hasTakenExam(e.id)).length}/{exams.length}</p>
                <p className="text-[11px] text-white/40">آزمون‌ها</p>
              </div>
            </div>

            <PersianCalendar/>

            <h3 className="font-bold mt-6 mb-3 text-white/70 text-sm">آزمون‌های موجود</h3>
            {exams.length===0&&<div className="card text-center py-10 text-white/30">آزمونی نیست</div>}
            {exams.map(ex=>{
              const taken=hasTakenExam(ex.id);
              const score=getExamScore(ex.id);
              return(
                <div key={ex.id} className={`card slide-up ${taken?'disabled':''}`}>
                  <h4 className="font-bold">{ex.title}</h4>
                  <p className="text-xs text-white/40 mt-1 mb-2">{ex.description||'بدون توضیحات'}</p>
                  <div className="flex gap-2 mb-3 flex-wrap">
                    <span className="badge badge-new">⏱️ {ex.duration_minutes} دقیقه</span>
                    <span className="badge badge-approved">📝 {ex.questions?.length||0} سوال</span>
                    {score&&<span className="badge badge-approved">⭐ {score.percentage}/20</span>}
                    {taken&&<span className="badge badge-taken">✓ شرکت شده</span>}
                  </div>
                  {taken?(
                    <div className="space-y-2">
                      <div className="text-center py-2 text-gray-400 text-xs font-bold bg-gray-500/10 rounded-xl border border-gray-500/20">
                        ⚠️ قبلاً شرکت کرده‌اید
                      </div>
                      <button onClick={()=>setShowExamResults(ex.id)} className="btn-glass text-sm">📊 مشاهده نتایج</button>
                    </div>
                  ):(
                    <button onClick={()=>startExam(ex)} className="btn-glass text-sm">شروع آزمون 🚀</button>
                  )}
                </div>
              );
            })}
          </>
        )}
        {tab==='grades'&&(
          <>
            <h3 className="font-bold mb-3 text-white/70 text-sm">نمرات من</h3>
            {exams.filter(ex=>getExamScore(ex.id)).length===0&&<div className="card text-center py-10 text-white/30">نمره‌ای نیست</div>}
            {exams.map(ex=>{
              const score=getExamScore(ex.id);if(!score)return null;
              const hasObjection=answers.some(a=>a.exam_id===ex.id&&a.objection);
              return(
                <div key={ex.id} className="card">
                  <div className="flex justify-between items-start mb-2">
                    <div className="flex-1 min-w-0"><h4 className="font-bold text-sm">{ex.title}</h4><p className="text-[11px] text-white/30 mt-1">{ex.questions?.length||0} سوال</p></div>
                    <div className="text-left shrink-0 mr-3"><p className="text-2xl font-black gradient-text">{score.percentage}/20</p><p className="text-[11px] text-white/40">{score.totalScore}/{score.maxScore}</p></div>
                  </div>
                  {hasObjection&&<div className="bg-amber-500/10 border border-amber-500/20 rounded-xl p-2.5 text-xs text-amber-300 mt-2">⏳ اعتراض در حال بررسی</div>}
                  {!hasObjection&&(<button onClick={()=>{setSelectedExamForObjection(ex.id);setShowObjection(true);}} className="btn-glass btn-glass-danger mt-3 text-sm flex items-center justify-center gap-2"><Icon d={Icons.alert} size={16}/>اعتراض</button>)}
                </div>
              );
            })}
          </>
        )}
        {tab==='chart'&&(
          <>
            <div className="glass p-6 text-center mb-6 slide-up">
              <Icon d={Icons.chart} size={32} className="mx-auto mb-2 text-indigo-400"/>
              <p className="text-4xl font-black gradient-text">{getAverage()}</p>
              <p className="text-xs text-white/40">معدل کل از 20</p>
            </div>
            <div className="glass-strong p-4 mb-4">
              <h3 className="font-bold mb-3 text-center text-sm">نمودار پیشرفت</h3>
              {exams.filter(ex=>getExamScore(ex.id)).length===0?<p className="text-center text-white/30 py-8">نمره‌ای نیست</p>:<canvas id="gradeChart"></canvas>}
            </div>
            {!chartReady&&exams.filter(ex=>getExamScore(ex.id)).length>0&&<button onClick={()=>setChartReady(true)} className="btn-glass">نمایش نمودار</button>}
          </>
        )}
        {tab==='tools'&&(
          <>
            {!activeGame?(
              <>
                <div className="grid grid-cols-2 gap-3 mb-4">
                  <div className={`tool-btn calc ${toolsTab==='calc'?'active':''}`} onClick={()=>setToolsTab('calc')}>
                    <div className="tool-icon"><Icon d={Icons.calc} size={28}/></div>
                    <div className="tool-label">ماشین‌حساب</div>
                  </div>
                  <div className={`tool-btn check ${toolsTab==='checklist'?'active':''}`} onClick={()=>setToolsTab('checklist')}>
                    <div className="tool-icon"><Icon d={Icons.check} size={28}/></div>
                    <div className="tool-label">چک‌لیست</div>
                  </div>
                  <div className={`tool-btn plan ${toolsTab==='planner'?'active':''}`} onClick={()=>setToolsTab('planner')}>
                    <div className="tool-icon"><Icon d={Icons.calendar} size={28}/></div>
                    <div className="tool-label">برنامه‌ریزی</div>
                  </div>
                  <div className={`tool-btn game ${toolsTab==='games'?'active':''}`} onClick={()=>setToolsTab('games')}>
                    <div className="tool-icon"><Icon d={Icons.game} size={28}/></div>
                    <div className="tool-label">بازی‌ها</div>
                  </div>
                </div>

                {toolsTab==='calc'&&(
                  <div className="glass-strong p-5 max-w-xs mx-auto slide-up">
                    <div className="bg-gradient-to-br from-indigo-900/40 to-purple-900/40 p-4 rounded-2xl text-3xl text-left mb-4 font-mono h-20 flex items-center justify-end border border-white/10 overflow-x-auto shadow-inner">{calcDisplay||'0'}</div>
                    <div className="grid grid-cols-4 gap-2">
                      {['7','8','9','÷','4','5','6','×','1','2','3','-','C','0','=','+'].map(b=>(
                        <button key={b} onClick={()=>calcPress(b)} className={`btn-glass h-14 text-lg font-bold ${['÷','×','-','+'].includes(b)?'bg-indigo-600/30 border-indigo-500/30 text-indigo-300':''} ${b==='='?'btn-glass-success':''} ${b==='C'?'btn-glass-danger':''}`}>{b}</button>
                      ))}
                    </div>
                  </div>
                )}

                {toolsTab==='checklist'&&(
                  <div className="space-y-3 slide-up">
                    <div className="flex gap-2">
                      <input className="glass-input flex-1" placeholder="کار جدید..." value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTask()}/>
                      <button onClick={addTask} className="btn-glass btn-glass-success btn-sm"><Icon d={Icons.plus} size={16}/></button>
                    </div>
                    {checklist.length===0&&<p className="text-center text-white/30 py-8">لیست خالی است</p>}
                    {checklist.map(t=>(
                      <div key={t.id} className="glass p-3 flex items-center gap-3">
                        <button onClick={()=>toggleTask(t.id,t.is_done)} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 transition-all ${t.is_done?'bg-emerald-500 border-emerald-500':'border-white/20'}`}>{t.is_done&&<Icon d={Icons.check} size={12}/>}</button>
                        <span className={`flex-1 text-sm ${t.is_done?'line-through text-white/30':''}`}>{t.title}</span>
                        <button onClick={()=>deleteTask(t.id)} className="text-red-400/60 hover:text-red-400"><Icon d={Icons.trash} size={16}/></button>
                      </div>
                    ))}
                  </div>
                )}

                {toolsTab==='planner'&&(
                  <div className="space-y-3 slide-up">
                    <div className="glass p-4 space-y-3">
                      <select className="glass-input" value={newPlan.day} onChange={e=>setNewPlan({...newPlan,day:e.target.value})}>{['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'].map(d=><option key={d}>{d}</option>)}</select>
                      <input className="glass-input" placeholder="درس (مثال: ریاضی)" value={newPlan.subject} onChange={e=>setNewPlan({...newPlan,subject:e.target.value})}/>
                      <input className="glass-input" placeholder="ساعت (مثال: 16-18)" value={newPlan.time} onChange={e=>setNewPlan({...newPlan,time:e.target.value})}/>
                      <button onClick={addPlan} className="btn-glass btn-glass-success text-sm">افزودن به برنامه</button>
                    </div>
                    {studyPlans.length===0&&<p className="text-center text-white/30 py-4">برنامه‌ای نیست</p>}
                    {studyPlans.map(p=>(
                      <div key={p.id} className="glass p-3 flex items-center justify-between">
                        <div><span className="badge badge-new mb-1">{p.day_of_week}</span><p className="font-bold text-sm">{p.subject}</p><p className="text-[11px] text-white/40">{p.time_range}</p></div>
                        <button onClick={()=>deletePlan(p.id)} className="text-red-400/60"><Icon d={Icons.trash} size={16}/></button>
                      </div>
                    ))}
                  </div>
                )}

                {toolsTab==='games'&&(
                  <div className="slide-up">
                    <h3 className="font-bold mb-3 text-white/70 text-sm">بازی‌های موجود</h3>
                    <div className="grid grid-cols-1 gap-3">
                      <div className="game-card" onClick={()=>setActiveGame('xo')}>
                        <div className="game-card-icon bg-gradient-to-br from-indigo-500 to-purple-500">⭕</div>
                        <h4 className="font-bold text-sm">بازی دوز (XO)</h4>
                        <p className="text-[10px] text-white/40 mt-1">با ربات یا دوستان آنلاین</p>
                      </div>
                      <div className="game-card" onClick={()=>setActiveGame('breakout')}>
                        <div className="game-card-icon bg-gradient-to-br from-emerald-500 to-teal-500">🎯</div>
                        <h4 className="font-bold text-sm">توپ و راکت</h4>
                        <p className="text-[10px] text-white/40 mt-1">آجرها را بشکن و امتیاز بگیر</p>
                      </div>
                    </div>
                  </div>
                )}
              </>
            ):(
              <div className="slide-up">
                <div className="flex justify-between items-center mb-4">
                  <button onClick={()=>setActiveGame(null)} className="btn-glass btn-sm">← بازگشت</button>
                  <h3 className="font-bold gradient-text">
                    {activeGame==='xo'&&'بازی دوز'}
                    {activeGame==='breakout'&&'توپ و راکت'}
                  </h3>
                  <div className="w-16"></div>
                </div>
                {activeGame==='xo'&&<XOGameHub user={user}/>}
                {activeGame==='breakout'&&<BreakoutGame user={user}/>}
              </div>
            )}
          </>
        )}
      </div>
      <div className="nav-bar">
        <div className={`nav-item ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==='grades'?'active':''}`} onClick={()=>setTab('grades')}><Icon d={Icons.grade}/><span>نمرات</span></div>
        <div className={`nav-item ${tab==='chart'?'active':''}`} onClick={()=>setTab('chart')}><Icon d={Icons.chart}/><span>کارنامه</span></div>
        <div className={`nav-item ${tab==='tools'?'active':''}`} onClick={()=>{setTab('tools');setToolsTab('calc');setActiveGame(null);}}><Icon d={Icons.list}/><span>ابزارها</span></div>
      </div>

      <button onClick={()=>setShowChat(true)} className="fixed bottom-24 left-4 w-14 h-14 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/40 z-40 hover:scale-110 transition">
        <Icon d={Icons.message} size={24}/>
      </button>

      {showChat&&<ChatModal user={user} onClose={()=>setShowChat(false)}/>}
      {showPasswordModal&&<PasswordModal user={user} onClose={()=>setShowPasswordModal(false)}/>}

      {showObjection&&(
        <div className="modal-overlay" onClick={()=>setShowObjection(null)}>
          <div className="glass-strong w-full max-w-md p-6 slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4"><h3 className="font-bold gradient-text">اعتراض به آزمون</h3><button onClick={()=>setShowObjection(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button></div>
            <div className="bg-amber-500/10 border border-amber-500/20 rounded-xl p-3 mb-4 text-xs text-amber-300">⚠️ فقط یکبار می‌توانید اعتراض بزنید</div>
            <textarea className="glass-input mb-4" placeholder="دلیل اعتراض..." value={objectionText} onChange={e=>setObjectionText(e.target.value)} rows="4"/>
            <button onClick={submitObjection} className="btn-glass btn-glass-danger flex items-center justify-center gap-2"><Icon d={Icons.send} size={16}/>ارسال به مدیر</button>
          </div>
        </div>
      )}

      {showExamResults&&(
        <div className="modal-overlay" onClick={()=>setShowExamResults(null)}>
          <div className="glass-strong w-full max-w-lg p-6 max-h-[85vh] overflow-y-auto slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="font-bold gradient-text">📊 نتایج آزمون</h3>
              <button onClick={()=>setShowExamResults(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button>
            </div>
            {(()=>{
              const exam=exams.find(e=>e.id===showExamResults);
              if(!exam)return null;
              const score=getExamScore(exam.id);
              const examAnswers=answers.filter(a=>a.exam_id===exam.id);
              return(
                <>
                  <div className="glass p-4 mb-4 text-center bg-gradient-to-br from-indigo-500/10 to-pink-500/10">
                    <h4 className="font-bold mb-2">{exam.title}</h4>
                    <p className="text-4xl font-black gradient-text">{score.percentage}/20</p>
                    <p className="text-xs text-white/40 mt-1">{score.totalScore} از {score.maxScore}</p>
                  </div>
                  <h4 className="font-bold text-sm mb-3 text-white/70">جزئیات سوالات:</h4>
                  {examAnswers.map((a,idx)=>{
                    const q=exam.questions.find(qq=>qq.id===a.question_id);
                    if(!q)return null;
                    const isCorrect=q.q_type==='test'&&q.correct_opt&&a.student_answer===q.correct_opt;
                    const isWrong=q.q_type==='test'&&q.correct_opt&&a.student_answer&&a.student_answer!==q.correct_opt;
                    return(
                      <div key={a.id} className={`glass p-3 mb-2 ${isWrong?'border-red-500/30':isCorrect?'border-emerald-500/30':''}`}>
                        <div className="flex justify-between items-start mb-2">
                          <span className="text-xs text-white/40">سوال {idx+1}</span>
                          <span className={`badge ${a.status==='graded'?'badge-approved':'badge-pending'}`}>{a.status==='graded'?'✓ تصحیح شده':'⏳ در انتظار تصحیح مدیر'}</span>
                        </div>
                        <p className="text-sm mb-2">{q.q_text}</p>
                        {q.q_type==='test'&&q.correct_opt?(
                          <div className="space-y-1 text-xs">
                            {isWrong&&(
                              <>
                                <div className="bg-red-500/10 border border-red-500/20 rounded-lg p-2"><span className="text-red-300">❌ پاسخ شما: {a.student_answer}</span></div>
                                <div className="bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-2"><span className="text-emerald-300">✓ پاسخ صحیح: {q.correct_opt}</span></div>
                              </>
                            )}
                            {isCorrect&&<div className="bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-2"><span className="text-emerald-300">✓ پاسخ صحیح: {a.student_answer}</span></div>}
                          </div>
                        ):(
                          <div className="text-xs">
                            <p className="text-white/40 mb-1">پاسخ شما:</p>
                            <p className="bg-white/5 p-2 rounded">{a.student_answer||'بدون پاسخ'}</p>
                          </div>
                        )}
                        <div className="flex justify-between items-center mt-2 pt-2 border-t border-white/5">
                          <span className="text-xs text-white/40">نمره سوال: {q.score||1}</span>
                          <span className="text-sm font-bold gradient-text">کسب شده: {a.score||0}</span>
                        </div>
                      </div>
                    );
                  })}
                </>
              );
            })()}
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [user,setUser]=useState(null);
  const [view,setView]=useState('login');
  const [tab,setTab]=useState('home');
  useEffect(()=>{
    const s=sessionStorage.getItem('edu_user');
    if(s){const u=JSON.parse(s);setUser(u);setView(u.role);}
  },[]);
  const login=async(un,pw)=>{
    const {data}=await SB.from('users').select('*').eq('username',un.toUpperCase()).eq('password',pw).single();
    if(data){setUser(data);sessionStorage.setItem('edu_user',JSON.stringify(data));setView(data.role);return true;}
    return false;
  };
  const logout=()=>{setUser(null);setView('login');setTab('home');sessionStorage.removeItem('edu_user');};
  if(view==='login') return <Login onLogin={login}/>;
  if(view==='admin') return <Admin user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
  return <Student user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
}

function AppWrapper(){
  return(<ToastProvider><App/></ToastProvider>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppWrapper/>);
</script>
</body>
</html>
