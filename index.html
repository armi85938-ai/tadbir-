function ProfileView({person,onClose,viewerId,onBlockChange}){
  const [profile,setProfile]=useState(null); const [followers,setFollowers]=useState(0); const [following,setFollowing]=useState(0); const [followingMe,setFollowingMe]=useState(false); const [blocked,setBlocked]=useState(false); const [followMode,setFollowMode]=useState(null); const [ownedTrophies,setOwnedTrophies]=useState([]); const [profileCoins,setProfileCoins]=useState(0); const toast=useToast();
  useEffect(()=>{load();},[person?.id]);
  const load=async()=>{if(!person)return;let {data:p}=await SB.from('profiles').select('*').eq('user_id',person.id).maybeSingle();setProfile(p||{display_name:person.full_name||person.username,bio:'',avatar_url:'🐱'});const [{count:fc},{count:fg},{data:f},{data:b},{data:w},{data:pt}]=await Promise.all([SB.from('follows').select('*',{count:'exact',head:true}).eq('following_id',person.id),SB.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',person.id),SB.from('follows').select('id').eq('follower_id',viewerId).eq('following_id',person.id).maybeSingle(),SB.from('blocks').select('id').eq('blocker_id',viewerId).eq('blocked_id',person.id).maybeSingle(),SB.from('tadbir_wallets').select('balance').eq('user_id',String(person.id)).maybeSingle(),SB.from('tadbir_trophy_purchases').select('trophy_id').eq('user_id',String(person.id)).order('trophy_id')]);setFollowers(fc||0);setFollowing(fg||0);setFollowingMe(!!f);setBlocked(!!b);setProfileCoins(Number(w?.balance||0));setOwnedTrophies(person.role==='admin'?[TADBIR_TROPHIES.length]:(pt||[]).map(x=>Number(x.trophy_id)).filter(Boolean));};
  const follow=async()=>{if(viewerId===person.id)return; if(followingMe){setFollowingMe(false);setFollowers(x=>Math.max(0,x-1));const {error}=await SB.from('follows').delete().eq('follower_id',viewerId).eq('following_id',person.id);if(error){setFollowingMe(true);setFollowers(x=>x+1);toast('امکان لغو دنبال کردن نیست','error');return;}toast('دنبال کردن لغو شد','warning');}else{setFollowingMe(true);setFollowers(x=>x+1);const {error}=await SB.from('follows').insert({follower_id:viewerId,following_id:person.id});if(error){setFollowingMe(false);setFollowers(x=>Math.max(0,x-1));toast('امکان دنبال کردن نیست','error');return;}toast('دنبال شد','success');}};
  const block=async()=>{if(blocked){await SB.from('blocks').delete().eq('blocker_id',viewerId).eq('blocked_id',person.id);setBlocked(false);onBlockChange?.(false);toast('مسدودسازی لغو شد','success');}else{await SB.from('blocks').insert({blocker_id:viewerId,blocked_id:person.id});setBlocked(true);onBlockChange?.(true);toast('کاربر مسدود شد','warning');}};

function TadbirVoiceMessage({src,isMine=false}){
  const audioRef=useRef(null);
  const [playing,setPlaying]=useState(false),[progress,setProgress]=useState(0),[duration,setDuration]=useState(0),[current,setCurrent]=useState(0);
  const bars=[32,48,27,58,39,67,43,74,51,30,62,44,69,37,55,42,71,49,34,60,46,68,38,52,31,64,45,57,36,50];
  useEffect(()=>{const a=audioRef.current;if(!a)return;const time=()=>{setCurrent(a.currentTime||0);setProgress(a.duration?(a.currentTime/a.duration)*100:0)},loaded=()=>setDuration(a.duration||0),ended=()=>{setPlaying(false);setProgress(0);setCurrent(0)};a.addEventListener('timeupdate',time);a.addEventListener('loadedmetadata',loaded);a.addEventListener('ended',ended);return()=>{a.removeEventListener('timeupdate',time);a.removeEventListener('loadedmetadata',loaded);a.removeEventListener('ended',ended)}},[]);
  const toggle=async()=>{const a=audioRef.current;if(!a)return;if(a.paused){try{await a.play();setPlaying(true)}catch{setPlaying(false)}}else{a.pause();setPlaying(false)}};
  const seek=e=>{const a=audioRef.current;if(!a||!a.duration)return;const r=e.currentTarget.getBoundingClientRect(),p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));a.currentTime=p*a.duration;setProgress(p*100)};
  const fmt=n=>{n=Math.max(0,Math.floor(n||0));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};
  return <div className={`tadbir-voice-card ${isMine?'mine':''}`}>
    <audio ref={audioRef} src={src} preload="metadata" className="tadbir-hidden-audio"/>
    <button type="button" className="tadbir-voice-play" onClick={toggle} aria-label={playing?'توقف ویس':'پخش ویس'}>{playing?<span className="tadbir-pause-icon"><i></i><i></i></span>:<span className="tadbir-play-icon"></span>}</button>
    <div className="tadbir-voice-main"><div className="tadbir-voice-wave" onClick={seek} role="slider" aria-label="موقعیت ویس">{bars.map((h,i)=><i key={i} className={i<(progress/100)*bars.length?'played':''} style={{height:`${h}%`}}></i>)}</div><div className="tadbir-voice-bottom"><span>{playing?fmt(current):fmt(duration)}</span><span className="tadbir-voice-live">{playing?'در حال پخش':'پیام صوتی'}</span></div></div>
    <span className="tadbir-voice-mic" aria-hidden="true"><Icon d={Icons.mic} size={15}/></span>
  </div>;
}

function TadbirPollMessage({message,user,onUpdate}){
  const prefix='__TADBIR_POLL__';
  let poll=null;try{poll=JSON.parse((message.content||'').slice(prefix.length))}catch{return null}
  if(!poll||!Array.isArray(poll.options))return null;
  const votes=poll.votes||{};const myVote=votes[String(user.id)];
  const counts=poll.options.map((_,i)=>Object.values(votes).filter(v=>Number(v)===i).length);
  const total=Object.keys(votes).length;
  const vote=async(i)=>{
    const nextVotes={...votes,[String(user.id)]:i};
    const next={...poll,votes:nextVotes};
    const {error}=await SB.from('messages').update({content:prefix+JSON.stringify(next)}).eq('id',message.id);
    if(error)return;
    onUpdate?.({...message,content:prefix+JSON.stringify(next)});
  };
  return <div className="tadbir-poll-card">
    <div className="tadbir-poll-head"><span className="tadbir-poll-icon">⌁</span><div><b>{poll.mode==='quiz'?'آزمون':'نظرسنجی'}</b><small>{poll.mode==='quiz'?'یک گزینه را انتخاب کنید':'نظر خود را انتخاب کنید'}</small></div></div>
    <h4>{poll.question}</h4>
    <div className="tadbir-poll-options">{poll.options.map((op,i)=>{
      const pct=total?Math.round(counts[i]*100/total):0;
      const chosen=Number(myVote)===i;
      const correct=poll.mode==='quiz'&&poll.correctIndex===i&&myVote!==undefined;
      return <button type="button" key={i} className={`tadbir-poll-option ${chosen?'chosen':''} ${correct?'correct':''}`} onClick={()=>vote(i)}>
        <span className="tadbir-poll-progress" style={{width:`${pct}%`}}></span><span className="tadbir-poll-option-content"><i>{chosen?'✓':String.fromCharCode(65+i)}</i><b>{op}</b><em>{pct}%</em></span>
      </button>
    })}</div>
    <div className="tadbir-poll-footer"><span>{total} پاسخ</span>{myVote!==undefined&&poll.mode==='quiz'&&<span>{Number(myVote)===Number(poll.correctIndex)?'✓ پاسخ صحیح':'پاسخ ثبت شد'}</span>}</div>
  </div>;
}

const tadbirBlossomHash=(value)=>{
  let h=2166136261;
  const s=String(value??'');
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
};
const getTadbirTehranScene=(userId,stamp=Date.now())=>{
  const d=new Date(stamp);
  const parts=new Intl.DateTimeFormat('en-CA',{
    timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'
  }).formatToParts(d).reduce((a,p)=>{if(p.type!=='literal')a[p.type]=p.value;return a;},{});
  const hour=Number(parts.hour||0);
  const minute=Number(parts.minute||0);
  const second=Number(parts.second||0);
  const day=hour>=3&&hour<18;
  const block=Math.floor(hour/2);
  const seed=tadbirBlossomHash(`${userId}-${parts.year}-${parts.month}-${parts.day}-${block}`);
  const weatherRoll=seed%100;
  const weather=weatherRoll<15?'rain':weatherRoll<24?'snow':'clear';
  const showBird=(second<12);
  const showBirdGroup=(minute%2===0&&second<16);
  const showPlane=(minute%6===0&&second<14);
  const showHelicopter=(minute%8===0&&second<14);
  return{
    day,hour,minute,second,weather,
    birds:showBird,plane:showPlane,
    showBird,showBirdGroup,showPlane,showHelicopter,
    dateKey:`${parts.year}-${parts.month}-${parts.day}`
  };
};

function TadbirWateringCan({active=false,onWatering}){
  const [pos,setPos]=useState({x:79,y:67});
  const [dragging,setDragging]=useState(false);
  const [near,setNear]=useState(false);
  const lastWater=useRef(0);
  const parentRef=useRef(null);
  const move=(e)=>{
    const el=parentRef.current;
    if(!el)return;
    const r=el.getBoundingClientRect();
    const x=Math.max(9,Math.min(91,((e.clientX-r.left)/r.width)*100));
    const y=Math.max(13,Math.min(87,((e.clientY-r.top)/r.height)*100));
    setPos({x,y});
    const isNear=x>34&&x<66&&y>45&&y<80;
    setNear(isNear);
    if(isNear && Date.now()-lastWater.current>1400){
      lastWater.current=Date.now();
      onWatering?.();
    }
  };
  const down=(e)=>{
    if(!active)return;
    e.preventDefault();
    e.currentTarget.setPointerCapture?.(e.pointerId);
    parentRef.current=e.currentTarget.parentElement;
    setDragging(true);
    move(e);
  };
  const up=(e)=>{
    try{e.currentTarget.releasePointerCapture?.(e.pointerId);}catch{}
    setDragging(false);
    setNear(false);
  };
  if(!active)return null;
  return <div className={`blossom-water-tool ${dragging?'dragging':''} ${near?'near-pot':''}`}
    style={{left:`${pos.x}%`,top:`${pos.y}%`}} onPointerDown={down} onPointerMove={dragging?move:undefined}
    onPointerUp={up} onPointerCancel={up} aria-label="آبپاش شناور">
    <svg className="can-svg" viewBox="0 0 90 90" aria-hidden="true">
      <defs>
        <linearGradient id="wateringCanGradientV25" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#e0f2fe"/><stop offset=".45" stopColor="#67e8f9"/><stop offset="1" stopColor="#0ea5e9"/></linearGradient>
        <linearGradient id="wateringSpoutGradientV25" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stopColor="#38bdf8"/><stop offset="1" stopColor="#0284c7"/></linearGradient>
      </defs>
      <path className="can-handle" d="M25 32C18 8 57 5 60 30"/>
      <path className="can-body" d="M22 31c0-6 5-10 11-10h22c8 0 14 6 14 14v21c0 7-5 12-12 12H33c-7 0-11-5-11-12V31Z"/>
      <path className="can-spout" d="M66 40L84 28l3 6-17 15Z"/>
      <circle cx="33" cy="32" r="3" fill="#fff" opacity=".65"/>
      <path d="M29 57c9 5 22 5 32 0" fill="none" stroke="#fff" strokeOpacity=".28" strokeWidth="2" strokeLinecap="round"/>
    </svg>
    <div className="blossom-water-drops">{[1,2,3,4,5].map(i=><i key={i}></i>)}</div>

  const getWord=(a,key)=>String(a?.[`${key}_answer`]??'').trim();
  const getCategoryScore=(a,key)=>Number(a?.[`${key}_score`]??0);
  const finalAnswerRows=finalResults.map(p=>{
    const rows=roundAnswers.filter(a=>String(a.user_id)===String(p.user_id));
    return {...p,answerRows:rows};
  });
  const currentRoundStartKey=room?`${room.id}:${room.current_round}`:'';
  const currentRoundStartedAt=currentRoundStartKey&&roundStartedAtRef.current.key===currentRoundStartKey?Number(roundStartedAtRef.current.at||0):0;
  const roomStartedTooSoon=room?.status==='playing'&&currentRoundStartedAt>0&&(Date.now()-currentRoundStartedAt<10000);

  return <div className="nf-overlay" dir="rtl">
    <div className="nf-shell">
      <div className="nf-stars" aria-hidden="true">{Array.from({length:22}).map((_,i)=><i key={i} style={{'--i':i}}/>)}</div>
      <header className="nf-head">
        <div className="nf-brand"><span className="nf-brand-orb">✦</span><div><b>اسم فامیل</b><small>TADBIR ARENA • آنلاین</small></div></div>
        <button className="nf-close" onClick={onClose}>×</button>
      </header>
      {notice&&<div className="nf-toast">{notice}</div>}
      {error&&<div className="nf-error">{error}<button onClick={()=>setError('')}>×</button></div>}

      {screen==='lobby'&&<div className="nf-lobby">
        <div className="nf-hero"><div className="nf-hero-copy"><span className="nf-kicker">WORD BATTLE</span><h1>حرف را انتخاب کن؛ <em>قهرمان شو!</em></h1><p>اسم فامیل را آنلاین بازی کنید</p></div><div className="nf-hero-art"><div className="nf-letter-orbit nf-calligraphy">الف</div><div className="nf-mini-card c1">آنلاین</div><div className="nf-mini-card c2">۳ دقیقه</div><div className="nf-mini-card c3">۵ موضوع</div></div></div>
        {incoming.length>0&&<section className="nf-panel nf-incoming"><div className="nf-panel-title"><span>🔔</span><div><b>درخواست‌های بازی</b><small>یکی از دوستان یا مدیر می‌خواهد وارد میدان شود</small></div><strong>{incoming.length}</strong></div>{incoming.map(r=><div className="nf-request" key={r.id}><div className="nf-user-orb">{(r.from_user_data?.full_name||r.from_user_data?.username||'؟')[0]}</div><div className="nf-request-copy"><b>{r.from_user_data?.full_name||r.from_user_data?.username}</b><small>@{r.from_user_data?.username||''} • دعوت به اسم فامیل</small></div><div className="nf-request-actions"><button className="nf-accept" onClick={()=>acceptRequest(r)} disabled={busy}>قبول ✓</button><button className="nf-reject" onClick={()=>rejectRequest(r)}>رد</button></div></div>)}</section>}
        {acceptedOutgoing.length>0&&<section className="nf-panel nf-accepted-panel"><div className="nf-panel-title"><span>✅</span><div><b>بازیکن‌های پذیرفته‌شده</b><small>هر وقت آماده بودی، از همین‌جا وارد اتاق شو و بازی را شروع کن</small></div><strong>{acceptedOutgoing.length}</strong></div>{acceptedOutgoing.map(r=><div className="nf-accepted-room" key={r.id}><div className="nf-user-orb">{(r.to_user_data?.full_name||r.to_user_data?.username||'؟')[0]}</div><div className="nf-request-copy"><b>{r.to_user_data?.full_name||r.to_user_data?.username||'بازیکن'}</b><small>درخواست را قبول کرده ✓</small></div><button className="nf-accept" onClick={()=>openRoom(r.room_id)} disabled={busy}>ورود به اتاق</button></div>)}</section>}
        <section className="nf-panel nf-invite-panel"><div className="nf-panel-title"><span>👥</span><div><b>تیم خودت را بساز</b><small>بازیکن‌ها را انتخاب کن و درخواست بازی بفرست</small></div><button type="button" className="nf-refresh-users" onClick={()=>loadLobby({refreshUsers:true})} title="تازه‌سازی کاربران">↻</button></div><div className="nf-selected-row">{selectedIds.length===0?<span>هنوز بازیکنی انتخاب نشده</span>:selectedIds.map(id=>{const u=users.find(x=>String(x.id)===String(id));return <div className="nf-chip" key={id}>{u?.full_name||u?.username}<button onClick={()=>setSelectedIds(v=>v.filter(x=>String(x)!==String(id)))}>×</button></div>})}<span className="nf-count">{selectedIds.length+1}/3</span></div>{usersLoading?<div className="nf-users-empty">در حال دریافت فهرست کاربران بازی...</div>:users.length===0?<div className="nf-users-empty"><b>کاربری برای انتخاب پیدا نشد.</b><small>دکمه ↻ را بزن تا فهرست دوباره دریافت شود.</small></div>:<div className="nf-user-grid">{users.map(u=>{const selected=selectedIds.some(id=>String(id)===String(u.id));const full=selectedIds.length>=2&&!selected;const isAdmin=String(u.role||'').toLowerCase().includes('admin')||String(u.role||'').includes('مدیر')||String(u.role||'').toLowerCase().includes('manager');return <button type="button" key={u.id} disabled={full} onClick={()=>setSelectedIds(v=>selected?v.filter(x=>String(x)!==String(u.id)):[...v,String(u.id)])} className={`nf-user-card ${selected?'selected':''}`}><div className="nf-avatar">{(u.full_name||u.username||'؟')[0]}</div><div><b>{u.full_name||u.username}</b><small>@{u.username} • {isAdmin?'مدیر':'بازیکن'}</small></div><i>{selected?'✓':'+'}</i></button>})}</div>}<button className="nf-start-invite" onClick={sendInvite} disabled={busy||selectedIds.length<1}>{busy?'در حال ارسال...':'📩 ارسال درخواست'}</button></section>
        {isAdmin&&<section className="nf-panel nf-admin-words-panel" style={{marginTop:12}}><div className="nf-panel-title"><span>📚</span><div><b>مدیریت اسم فامیل و دامنه لغات</b><small>همه کلمات، پیشنهادهای دانش‌آموزان، افزودن و حذف</small></div><button type="button" className="nf-refresh-users" onClick={()=>{loadNfDictionary();loadNfPendingSuggestions()}} title="تازه‌سازی فرهنگ و پیشنهادها">↻</button></div>
          <div className="nf-admin-pending"><div className="nf-admin-subtitle"><b>درخواست‌های دانش‌آموزان</b><span>{nfPendingSuggestions.length} مورد در انتظار</span></div>{nfPendingLoading?<div className="nf-users-empty">در حال دریافت پیشنهادها...</div>:nfPendingSuggestions.length===0?<div className="nf-users-empty">درخواستی برای بررسی وجود ندارد.</div>:nfPendingSuggestions.map(x=><div className="nf-admin-suggestion-row" key={x.id}><div><b>{x.word}</b><small>{x.category_label||x.category} • {x.student_name||'دانش‌آموز'} {x.student_username?'• @'+x.student_username:''}</small></div><div className="nf-admin-suggestion-actions"><button onClick={()=>reviewNfPendingSuggestion(x.id,'approve')} disabled={nfDictionaryBusy}>✓ افزودن</button><button onClick={()=>reviewNfPendingSuggestion(x.id,'reject')} disabled={nfDictionaryBusy}>رد</button><button onClick={()=>deleteNfPendingSuggestion(x.id)} disabled={nfDictionaryBusy}>🗑</button></div></div>)}</div>
          <div className="nf-admin-word-add"><select className="nf-suggestion-input" value={nfDictionaryCategory} onChange={e=>setNfDictionaryCategory(e.target.value)}>{FIELDS.map(([key,label,icon])=><option key={key} value={key}>{icon} {label}</option>)}</select><input className="nf-suggestion-input" value={nfDictionaryWord} onChange={e=>setNfDictionaryWord(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addNfDictionaryWord()}} placeholder="کلمه جدید را وارد کن"/><button className="nf-suggestion-submit" onClick={addNfDictionaryWord} disabled={nfDictionaryBusy}>{nfDictionaryBusy?'در حال ذخیره...':'➕ افزودن به دامنه لغات'}</button></div>
          <input className="nf-suggestion-input nf-admin-word-search" value={nfDictionarySearch} onChange={e=>setNfDictionarySearch(e.target.value)} placeholder="جست‌وجو در همه کلمات..."/>
          {nfDictionaryLoading?<div className="nf-users-empty">در حال دریافت دامنه لغات...</div>:<div className="nf-admin-word-list">{(()=>{const q=nfDictionarySearch.trim();const rows=(nfDictionary||[]).filter(x=>!q||String(x.word||'').includes(q)||String(x.category_label||'').includes(q));return rows.length?rows.map(x=><div className="nf-admin-word-row" key={x.id}><div><b>{x.word}</b><small>{x.category_label||x.category}</small></div><button type="button" onClick={()=>deleteNfDictionaryWord(x.id)} disabled={nfDictionaryBusy} title="حذف کلمه">🗑</button></div>):<div className="nf-users-empty">کلمه‌ای مطابق جست‌وجو پیدا نشد.</div>})()}</div>}
        </section>}
        {!isAdmin&&suggestionOpen&&<section className="nf-panel nf-suggestion-panel open" style={{marginTop:12}}>
          <button type="button" className="nf-suggestion-toggle" onClick={()=>setSuggestionOpen(false)} aria-expanded="true">
            <span className="nf-suggestion-toggle-icon">💡</span>
            <span className="nf-suggestion-toggle-copy"><b>پیشنهاد کلمه</b><small>کلمه‌ای داری که در فرهنگ بازی نیست؟ برای مدیر بفرست.</small></span>
            <span className="nf-suggestion-chevron">⌃</span>
          </button>
          <div className="nf-suggestion-body">
            <div className="nf-suggestion-form-grid">
              <select className="nf-suggestion-input" value={suggestionCategory} onChange={e=>setSuggestionCategory(e.target.value)}>
                {FIELDS.map(([key,label,icon])=><option key={key} value={key}>{icon} {label}</option>)}
              </select>
              <input className="nf-suggestion-input" value={suggestionWord} onChange={e=>setSuggestionWord(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')submitWordSuggestion()}} placeholder="مثلاً: ژاله" />
            </div>
            <button type="button" className="nf-suggestion-submit" onClick={submitWordSuggestion} disabled={suggestionBusy}>
              {suggestionBusy?'در حال ارسال...':'✨ ارسال پیشنهاد برای مدیر'}
            </button>
            {mySuggestions.length>0&&<div className="nf-my-suggestions">
              <small className="nf-my-suggestions-title">پیشنهادهای اخیر من</small>
              {mySuggestions.slice(0,5).map(x=><div className="nf-my-suggestion-row" key={x.id}>
                <span>{x.word} <small>• {FIELDS.find(f=>f[0]===x.category)?.[1]||x.category}</small></span>
                <span className={`nf-suggestion-status ${x.status}`}>{x.status==='approved'?'✓ افزوده شد':x.status==='rejected'?'رد شد':'⏳ در انتظار'}</span>
              </div>)}
            </div>}
          </div>
        </section>}
        {!isAdmin&&!suggestionOpen&&<section className="nf-panel nf-suggestion-panel" style={{marginTop:12}}>
          <button type="button" className="nf-suggestion-toggle" onClick={()=>setSuggestionOpen(true)} aria-expanded="false">
            <span className="nf-suggestion-toggle-icon">💡</span>
            <span className="nf-suggestion-toggle-copy"><b>پیشنهاد کلمه</b><small>کلمه‌ای داری که در فرهنگ بازی نیست؟ برای مدیر بفرست.</small></span>
            <span className="nf-suggestion-chevron">⌄</span>
          </button>
        </section>}
        {outgoing.length>0&&<section className="nf-panel"><div className="nf-panel-title"><span>⏳</span><div><b>در انتظار پاسخ</b><small>دعوت‌های ارسال‌شده</small></div></div>{outgoing.map(r=><div className="nf-pending" key={r.id}><div><b>{r.to_user_data?.full_name||r.to_user_data?.username}</b><small>منتظر پاسخ است...</small></div><button onClick={()=>cancelInvite(r)}>لغو</button></div>)}</section>}
        {busy&&<div className="nf-loading">در حال هماهنگ‌سازی میدان بازی...</div>}
      </div>}

      {screen==='room'&&room&&<div className="nf-room">
        <div className="nf-room-top"><button className="nf-back" onClick={leaveRoom}>← لابی</button><div className="nf-round-pill">راند {Math.min(Number(room.current_round),Number(room.total_rounds))} از {room.total_rounds}</div><div className="nf-live-dot"><i/> LIVE</div></div>
        <div className="nf-player-strip">{players.map((p,i)=><div className={`nf-player ${Number(p.user_id)===Number(user.id)||String(p.user_id)===String(user.id)?'me':''} ${Number(p.seat)===Number(room.current_turn_index)?'turn':''}`} key={p.user_id}><div className="nf-avatar">{(p.user?.full_name||p.user?.username||'؟')[0]}</div><div><b>{p.user?.full_name||p.user?.username||'بازیکن'}</b><small>{p.score||0} امتیاز {Number(p.seat)===Number(room.current_turn_index)?'• نوبت':''}</small></div></div>)}</div>
        {room.status==='lobby'&&<div className="nf-waiting"><div className="nf-wait-scene"><div className="nf-wait-stars">{[1,2,3,4,5,6].map(i=><i key={i}></i>)}</div><div className="nf-wait-orb">✦</div><div className="nf-wait-ring ring-a"></div><div className="nf-wait-ring ring-b"></div><div className="nf-wait-paper"><span>✎</span><b>میدان واژه‌ها</b><small>آماده‌ایم برای یک بازی تازه...</small></div></div><span className="nf-kicker">THE WORD ARENA</span><h2>تا رسیدن آخرین بازیکن...</h2><p>میدان بازی آماده است؛ دوستانت که برسند، قصه‌ی واژه‌ها آغاز می‌شود.</p><div className="nf-wait-progress"><span style={{width:`${Math.min(100,Math.round((players.length/Math.max(1,room.max_players))*100))}%`}}></span></div><div className="nf-wait-count"><b>{players.length}</b><span>از</span><b>{room.max_players}</b><small>بازیکن حاضرند</small></div><div className="nf-seat-row">{Array.from({length:room.max_players}).map((_,i)=><div key={i} className={`nf-seat ${players[i]?'filled':''}`}>{players[i]?(players[i].user?.full_name||'بازیکن').slice(0,9):'جای شما اینجاست'}</div>)}</div>{String(room.host_id)===String(user.id)&&<button className="nf-start-game" disabled={players.length<2||busy} onClick={startRoom}><span>{players.length<2?'⌛':'🚀'}</span>{players.length<2?'در انتظار حداقل ۲ بازیکن':'آغاز بازی'}</button>}<div className="nf-wait-note">✦ وقتی همه آماده باشند، حرف اول روی میدان می‌نشیند.</div></div>}
        {room.status==='choosing'&&<div className="nf-choose"><div className="nf-turn-banner">{String(turnPlayer?.user_id)===String(user.id)?'نوبت توست؛ یک حرف انتخاب کن!':`نوبت ${turnPlayer?.user?.full_name||'بازیکن'} است؛ صبر کن...`}</div><div className="nf-timer-big choosing">{seconds}</div><div className="nf-letter-grid">{LETTERS.map(l=><button key={l} disabled={String(turnPlayer?.user_id)!==String(user.id)||busy} onClick={()=>chooseLetter(l)}>{l}</button>)}</div><small className="nf-hint">اگر ۱۰ ثانیه تمام شود، سیستم خودش یک حرف را انتخاب می‌کند.</small></div>}
        {room.status==='playing'&&<div className="nf-playing"><div className="nf-playing-head"><div><span className="nf-kicker">LETTER OF THIS ROUND</span><div className="nf-current-letter">{room.current_letter}</div></div><div className={`nf-timer-big ${seconds<=20?'danger':''}`}>{fmt(seconds)}</div></div><div className="nf-category-grid">{FIELDS.map(([key,label,icon])=><label className="nf-field" key={key}><span><i>{icon}</i>{label}</span><input value={answers[key]||''} onChange={e=>changeAnswer(key,e.target.value)} placeholder={`با «${room.current_letter}» بنویس...`} disabled={String(me?.user_id)!==String(user.id)}/></label>)}</div><div className="nf-stop-zone"><div className="nf-stop-caption">{saving?'در حال ذخیره پاسخ...':'همه جواب‌ها را نوشتی؟'}</div><button className={`nf-stop-button ${roomStartedTooSoon?'nf-stop-locked':''} ${stopBurst?'nf-stop-burst':''}`} onClick={triggerStopRound} disabled={busy||String(me?.user_id)!==String(user.id)}><span>⏹</span><b>استپ!</b><small>{roomStartedTooSoon?'۱۰ ثانیه اول غیرفعال است':'پایان راند برای همه'}</small></button></div></div>}
        {room.status==='results'&&<div className="nf-results nf-round-transition"><div className="nf-round-paper"><div className="nf-paper-tape"></div><div className="nf-round-pencil">✎</div><div className="nf-round-stamp">✓</div><span className="nf-round-kicker">یادداشت بازی • راند {room.current_round}</span><div className="nf-round-title-line"><span className="nf-round-star">✦</span><h2>راند {room.current_round} تمام شد</h2><span className="nf-round-star">✦</span></div><p>جواب‌ها بررسی شدند و امتیازها روی برگه ثبت شد.</p><div className="nf-round-divider"></div><div className="nf-round-score-list">{roundAnswers.map(a=>{const p=playerById[String(a.user_id)];return <div className="nf-round-score nf-round-note-row" key={a.user_id}><b>{p?.user?.full_name||'بازیکن'}</b><span>{scoreFor(a)} امتیاز</span></div>})}</div><div className="nf-next-round-note"><span>⏳</span> راند بعدی تا چند لحظه دیگر شروع می‌شود...</div></div></div>}
        {room.status==='finished'&&<div className="nf-finished"><div className="nf-trophy">🏆</div><span className="nf-kicker">FINAL SCOREBOARD</span><h2>کارنامه نهایی</h2><p>بازی تمام شد؛ نتیجه برای همه نمایش داده شده است.</p><div className="nf-podium">{finalSorted.map((p,i)=><div className={`nf-podium-row rank-${i+1}`} key={p.user_id}><span className="nf-rank">{i===0?'🥇':i===1?'🥈':'🥉'}</span><div className="nf-avatar">{(p.user?.full_name||p.user?.username||'؟')[0]}</div><div className="nf-podium-name"><b>{p.user?.full_name||p.user?.username}</b><small>{i===0?'نفر اول':i===1?'نفر دوم':'نفر سوم'}</small></div><strong>{p.score||0}</strong></div>)}</div><div className="nf-final-answers"><div className="nf-final-answers-title"><b>📝 کلمات درست و غلط بازیکن‌ها</b><small>پاسخ‌های ثبت‌شده هر بازیکن در همه راندها</small></div>{finalAnswerRows.map(p=><div className="nf-player-answers" key={'answers-'+p.user_id}><div className="nf-player-answers-head"><b>{p.user?.full_name||p.user?.username||'بازیکن'}</b><span>{p.score||0} امتیاز</span></div>{p.answerRows.length===0?<div className="nf-no-answer">پاسخی برای این بازیکن ثبت نشده است.</div>:p.answerRows.map((a,ri)=><div className="nf-answer-round" key={(a.id||p.user_id+'-'+ri)}><span className="nf-answer-round-title">راند {a.round_no}</span><div className="nf-answer-chips">{nfCategories.map(([key,label])=>{const word=getWord(a,key);if(!word)return null;const cs=getCategoryScore(a,key);const total=Number(a?.total_score||0);const isGood=cs>0;return <div className={`nf-answer-chip ${isGood?'good':'bad'}`} key={key}><b>{label}:</b><span>{word}</span><small>{isGood?'✓ درست':'✗ غلط'}</small></div>})}</div></div>)}</div>)}</div><div className="nf-final-note">اطلاعات این اتاق بعد از نمایش نتیجه، به‌صورت خودکار پاک می‌شود.</div></div>}
      </div>}
    </div>
  </div>;
}


function Student({user,tab,setTab,onLogout}){
  const [exams,setExams]=useState([]);
  const [answers,setAnswers]=useState([]);
  const [activeExam,setActiveExam]=useState(null);
  const [currentQ,setCurrentQ]=useState(0);
  const [studentAnswers,setStudentAnswers]=useState({});
  const [timeLeft,setTimeLeft]=useState(0);
  const [totalTime,setTotalTime]=useState(0);
  const [calcDisplay,setCalcDisplay]=useState('');
  const [showObjection,setShowObjection]=useState(null);
  const [objectionTick,setObjectionTick]=useState(Date.now());
  const [showAdminProfile,setShowAdminProfile]=useState(false);
  const [openObjection,setOpenObjection]=useState(null);
  const [objectionText,setObjectionText]=useState('');
  const [selectedExamForObjection,setSelectedExamForObjection]=useState(null);
  const [checklist,setChecklist]=useState([]);
  const [newTask,setNewTask]=useState('');
  const [studyPlans,setStudyPlans]=useState([]);
  const [newPlan,setNewPlan]=useState({day:'شنبه',subject:'',time:''});
  const [toolsTab,setToolsTab]=useState(null);
  const [settingsView,setSettingsView]=useState('menu');
  const [blockedUsers,setBlockedUsers]=useState([]);
  const [blockedLoading,setBlockedLoading]=useState(false);
  const loadBlockedUsers=async()=>{
    setBlockedLoading(true);
    try{
      const {data,error}=await SB.from('blocks').select('blocked_id').eq('blocker_id',user.id);
      if(error)throw error;
      const ids=(data||[]).map(x=>x.blocked_id).filter(Boolean);
      if(!ids.length){setBlockedUsers([]);return}
      const {data:us,error:ue}=await SB.from('users').select('id,full_name,username,role').in('id',ids);
      if(ue)throw ue;setBlockedUsers(us||[]);
    }catch(e){console.warn('blocked users:',e);toast('دریافت کاربران مسدود انجام نشد','error')}
    finally{setBlockedLoading(false)}
  };
  const unblockUser=async(id)=>{
    const {error}=await SB.from('blocks').delete().eq('blocker_id',user.id).eq('blocked_id',id);
    if(error){toast('رفع مسدودی انجام نشد','error');return}
    setBlockedUsers(x=>x.filter(u=>String(u.id)!==String(id)));toast('کاربر از مسدودی خارج شد','success');
  };

  const toggleToolsTab=(key)=>setToolsTab(prev=>prev===key?'':key);
  const [themeMode,setThemeMode]=useState('dark');
  const [siteTheme,setSiteTheme]=useState(()=>{const k=`tadbir_theme_${user.id}`;let t=localStorage.getItem(k)||'dark-purple';if(t==='dark-yellow')t='dark-white';if(t==='light-yellow')t='light-black';localStorage.setItem(k,t);return t;});
  const [chartReady,setChartReady]=useState(false);
  const [showExamResults,setShowExamResults]=useState(null);
  const [showChat,setShowChat]=useState(false);

  const persistPlantCare=useCallback(async(next, pickedOverride=null, spentOverride=null)=>{
    const picked=Array.isArray(pickedOverride)?pickedOverride:(Array.isArray(pickedBlossoms)?pickedBlossoms:[]);
    const spent=spentOverride===null?Number(blossomSpent)||0:Number(spentOverride)||0;
    const normalized={
      user_id:String(user.id),
      thirst:Math.max(0,Math.min(100,Number(next.thirst)||0)),
      last_watered_at:new Date(next.lastWateredAt||Date.now()).toISOString(),
      zero_since:next.zeroSince?new Date(next.zeroSince).toISOString():null,
      last_penalty_at:next.lastPenaltyAt?new Date(next.lastPenaltyAt).toISOString():null,
      dead_leaves:Math.max(0,Number(next.deadLeaves)||0),
      plant_stage:Math.max(1,Math.min(5,Number(next.stage)||1)),
      watering_count:Math.max(0,Number(next.wateringCount)||0),
      blossom_count:picked.length,
      blossom_spent:Math.max(0,spent),
      picked_blossoms:picked.map(Number).filter(Number.isFinite),
      updated_at:new Date().toISOString()
    };
    try{
      /* Use update first, then insert. This avoids relying on PostgREST upsert
         conflict handling when the project has a custom schema/policy setup. */
      const {data:updated,error:updateError}=await SB.from('tadbir_plant_states')
        .update(normalized)
        .eq('user_id',String(user.id))
        .select('user_id')
        .maybeSingle();
      if(updateError)throw updateError;
      if(!updated){
        const {error:insertError}=await SB.from('tadbir_plant_states').insert(normalized);
        if(insertError){
          /* A concurrent insert can happen; retry as update. */
          const {error:retryError}=await SB.from('tadbir_plant_states')
            .update(normalized).eq('user_id',String(user.id));
          if(retryError)throw insertError;
        }
      }
      return true;
    }catch(err){
      console.warn('plant care save:',err);
      return false;
    }
  },[user.id,pickedBlossoms,blossomSpent]);

  const currentThirst=(()=>{
    const c=plantCareRef.current||plantCare;
    const elapsed=Math.max(0,Date.now()-Number(c.lastWateredAt||Date.now()));
    return Math.max(0,Math.min(100,100-(elapsed/172800000)*100));
  })();

  const processPlantCare=useCallback(async(now=Date.now())=>{
    const c={...(plantCareRef.current||plantCare)};
    const elapsed=Math.max(0,now-Number(c.lastWateredAt||now));
    const zeroAt=elapsed>=172800000?(Number(c.lastWateredAt||now)+172800000):null;
    const thirst=Math.max(0,Math.min(100,100-(elapsed/172800000)*100));
    if(!zeroAt){
      const next={...c,thirst,zeroSince:null,lastPenaltyAt:null};
      plantCareRef.current=next;setPlantCare(next);return;
    }
    let zeroSince=Number(c.zeroSince||zeroAt);
    let lastPenaltyAt=Number(c.lastPenaltyAt||0)||null;
    let deadLeaves=Math.max(0,Number(c.deadLeaves)||0);
    let stage=Math.max(1,Number(c.stage)||5);
    let changed=false;
    if(!c.zeroSince){zeroSince=zeroAt;changed=true;}
    if(now-zeroSince>=86400000 && (!lastPenaltyAt || now-lastPenaltyAt>=86400000)){
      const before=Math.max(0,Math.min(24,4));
      const available=Math.max(0,24-deadLeaves);
      const removed=Math.min(before,available);
      if(removed>0){
        const leafStart=deadLeaves;
        setYellowingLeaves(Array.from({length:removed},(_,i)=>leafStart+i));
        setTimeout(()=>setYellowingLeaves([]),1800);
        deadLeaves+=removed;
        stage=Math.max(1,stage-1);
        toast(`🌿 گیاه به‌خاطر تشنگی یک مرحله عقب رفت و ${removed} برگش زرد و حذف شد.`,'warning');
      }
      lastPenaltyAt=now;changed=true;
    }
    const next={...c,thirst,zeroSince,lastPenaltyAt,deadLeaves,stage};
    plantCareRef.current=next;
    const thirstChanged=Math.floor(thirst)!==Math.floor(Number(c.thirst)||0);
    if(changed){setPlantCare(next);await persistPlantCare(next);}
    else if(thirstChanged){setPlantCare(next);}
  },[persistPlantCare,toast]);

  useEffect(()=>{
    if(!showBlossomRoom)return;
    processPlantCare(Date.now());

    const dbTimer=setInterval(()=>{

  const waterPlant=useCallback(async()=>{

  const saveBlossomCount=useCallback(async(nextPicked,nextSpent=blossomSpent)=>{
    const picked=Array.isArray(nextPicked)?nextPicked.map(Number).filter(Number.isFinite):[];
    const spent=Math.max(0,Number(nextSpent)||0);

  useEffect(()=>{

  useEffect(()=>{

  const availableBlossoms=Math.max(0,pickedBlossoms.length-blossomSpent);

  const pickBlossom=(index)=>{

  const executeBlossomExchange=async()=>{
    if(exchangeBusy)return;
    const amount=Math.max(1,Math.floor(Number(exchangeAmount)||1));
    setExchangeBusy(true);
    try{
      if(exchangeMode==='blossom_to_coin'){
        if(availableBlossoms<amount){
          toast('موجودی شما کافی نمیباشد','warning');
          return;
        }
        const addedCoins=amount*2;
        const current=Number(coinBalance||0);
        const nextBalance=current+addedCoins;
        const {data,error}=await SB.from('tadbir_wallets')
          .update({balance:nextBalance})
          .eq('user_id',String(user.id))
          .select('balance')
          .maybeSingle();
        if(error)throw error;
        if(!data)throw new Error('wallet_update_not_allowed');
        const savedBalance=Number(data.balance);
        if(!Number.isFinite(savedBalance)||savedBalance!==nextBalance)throw new Error('wallet_balance_mismatch');
        setCoinBalance(savedBalance);
        setBlossomSpent(v=>{const nv=v+amount;saveBlossomCount(pickedBlossoms,nv);return nv;});
        toast(`${amount} شکوفه به ${addedCoins} سکه تبدیل شد`,'success');
      }else if(exchangeMode==='coin_to_star'){
        const requestedCoins=Math.max(2,Math.floor(Number(amount)||2));
        const cost=requestedCoins%2===0?requestedCoins:requestedCoins-1;
        const starsToAdd=Math.floor(cost/2);
        if(Number(coinBalance||0)<cost){
          toast('موجودی شما کافی نمیباشد','warning');
          return;
        }
        /* Existing protected RPC performs the wallet debit server-side. */
        const {data,error}=await SB.rpc('tadbir_spend_hint_coins_v3',{
          p_user_id:String(user.id),
          p_cost:cost
        });
        if(error)throw error;
        const result=Array.isArray(data)?data[0]:data;
        if(!result?.ok)throw new Error(result?.message||'coin_debit_failed');
        const savedBalance=Number(result.balance);
        if(!Number.isFinite(savedBalance))throw new Error('invalid_wallet_balance');
        setCoinBalance(savedBalance);
        setConvertedStars(v=>v+starsToAdd);
        toast(`${cost} سکه به ${starsToAdd} ستاره تبدیل شد`,'success');
      }
    }catch(err){
      console.error('blossom exchange error:',err);
      const msg=String(err?.message||err);
      if(msg.includes('permission')||msg.includes('row-level')||msg.includes('RLS'))
        toast('دسترسی کیف پول در دیتابیس اجازه این تبدیل را نمی‌دهد','error');
      else
        toast('تبدیل انجام نشد؛ موجودی شما تغییر نکرد','error');
    }finally{
      setExchangeBusy(false);
    }
  };

      if(error) throw error;
      const rows=(data||[]).map(x=>({
        ...x,
        body:x.body ?? x.message ?? '',
        interaction:x.interaction||null
      }));

      if(!notificationInitialized.current){
        rows.forEach(x=>notificationKnownIds.current.add(String(x.id)));
        notificationInitialized.current=true;
      }else{
        rows.forEach(x=>{
          const id=String(x.id);
          if(!notificationKnownIds.current.has(id)){
            notificationKnownIds.current.add(id);
            showTadbirBrowserNotification(x.title,x.body);
          }
        });
      }

      setStudentNotifications(rows);
      setNotificationUnread(rows.filter(x=>!x.interaction?.read_at).length);
    }catch(err){
      console.warn('student notifications:',err);
      // اعلان نباید مانع بالا آمدن پنل دانش‌آموز شود.
    }
  };

  const loadStudentCompetitions=async()=>{try{const {data,error}=await SB.rpc('tadbir_student_competitions',{p_user_id:String(user.id)});if(error)throw error;const rows=data||[];setCompetitions(rows);const map={};rows.forEach(x=>{if(x.submission_image_url)map[x.id]={image_url:x.submission_image_url,submission_id:x.submission_id,submission_created_at:x.submission_created_at,review_text:x.review_text||'',reviewed_at:x.reviewed_at||null};});setCompetitionSubmission(map);}catch(err){console.warn('student competitions:',err);}};
  useEffect(()=>{loadStudentCompetitions();const t=setInterval(loadStudentCompetitions,60000);const h=()=>loadStudentCompetitions();window.addEventListener('tadbir:refresh-competitions',h);return()=>{clearInterval(t);window.removeEventListener('tadbir:refresh-competitions',h);};},[user.id]);
  const submitCompetition=async(c,file)=>{if(!file)return;setCompetitionBusy(c.id);try{const image=await readTadbirCompetitionImage(file,1600,.78);const {data,error}=await SB.rpc('tadbir_submit_competition',{p_user_id:String(user.id),p_competition_id:String(c.id),p_image_url:image});if(error)throw error;if(data?.ok===false)throw new Error(data.message||'ارسال اثر ناموفق بود');setCompetitionSubmission(v=>({...v,[c.id]:image}));toast('🎨 اثر شما با موفقیت ارسال شد','success');await loadStudentCompetitions();}catch(err){toast('خطا در ارسال اثر: '+(err?.message||err),'error');}finally{setCompetitionBusy(null);}};
  const deleteCompetitionSubmission=async(c)=>{setCompetitionActionBusy(c.id);try{const {data,error}=await SB.rpc('tadbir_delete_competition_submission',{p_user_id:String(user.id),p_submission_id:String(c.submission_id||'')});if(error)throw error;if(data?.ok===false)throw new Error(data.message||'حذف اثر ناموفق بود');setCompetitionSubmission(v=>{const n={...v};delete n[c.id];return n;});toast('🗑️ اثر شما حذف شد','success');await loadStudentCompetitions();}catch(err){toast('خطا در حذف اثر: '+(err?.message||err),'error');}finally{setCompetitionActionBusy(null);}};
  const changeCompetitionSubmission=async(c,file)=>{if(!file)return;setCompetitionActionBusy(c.id);try{const image=await readTadbirCompetitionImage(file,1600,.78);const {data,error}=await SB.rpc('tadbir_submit_competition',{p_user_id:String(user.id),p_competition_id:String(c.id),p_image_url:image});if(error)throw error;if(data?.ok===false)throw new Error(data.message||'تغییر اثر ناموفق بود');setCompetitionSubmission(v=>({...v,[c.id]:image}));toast('🔄 تصویر اثر با موفقیت تغییر کرد','success');await loadStudentCompetitions();}catch(err){toast('خطا در تغییر اثر: '+(err?.message||err),'error');}finally{setCompetitionActionBusy(null);}};

  const starsForExam=(exam,ansRows)=>{
    const rows=(ansRows||[]).filter(x=>String(x.exam_id)===String(exam.id));
    if(!rows.length)return 0;
    const total=rows.reduce((v,x)=>v+Number(x.score||0),0); const max=rows.reduce((v,x)=>v+Number(x.max_score||0),0);
    if(max<=0)return 0; const score=(total/max)*20;
    if(score>=20)return 5;if(score>=18)return 4;if(score>=16)return 3;if(score>=14)return 2;if(score>=10)return 1;return 0;
  };
  const syncAchievementWallet=async(examRows,answerRows)=>{
    try{
      const totalStars=(examRows||[]).reduce((n,ex)=>n+starsForExam(ex,answerRows),0);
      const {data:w,error}=await SB.from('tadbir_wallets').select('*').eq('user_id',String(user.id)).maybeSingle();
      if(error)throw error;
      if(!w){const {data:nw,error:ie}=await SB.from('tadbir_wallets').insert({user_id:String(user.id),balance:totalStars,earned_stars:totalStars}).select('*').single();if(ie)throw ie;setCoinBalance(Number(nw.balance||0));setEarnedStars(Number(nw.earned_stars||0));}
      else{let balance=Number(w.balance||0),earned=Number(w.earned_stars||0);if(totalStars>earned){balance+=totalStars-earned;earned=totalStars;await SB.from('tadbir_wallets').update({balance,earned_stars:earned,updated_at:new Date().toISOString()}).eq('user_id',String(user.id));}setCoinBalance(balance);setEarnedStars(earned);}
      const {data:pt}=await SB.from('tadbir_trophy_purchases').select('trophy_id').eq('user_id',String(user.id)).order('trophy_id');setOwnedTrophyIds((pt||[]).map(x=>Number(x.trophy_id)));
    }catch(err){console.warn('achievement wallet:',err);}
  };
  const celebrateTrophy=(t)=>{setCelebration(t);};
  const purchaseTrophy=async(t)=>{
    if(achievementBusy)return;
    const owned=new Set(ownedTrophyIds);
    if(owned.has(t.id)){toast('این جام را قبلاً خریده‌اید','warning');return;}
    const next=(Math.max(0,...ownedTrophyIds,0)+1);
    if(t.id!==next){toast(`اول باید جام شماره ${next} را خریداری کنید`,'warning');return;}
    if(coinBalance<t.price){toast('سکه کافی برای این جام ندارید','warning');return;}
    setAchievementBusy(true);
    try{
      const {data,error}=await SB.rpc('tadbir_purchase_trophy',{p_user_id:String(user.id),p_trophy_id:Number(t.id),p_price:Number(t.price)});
      if(error)throw error;
      const result=Array.isArray(data)?data[0]:data;
      if(result?.ok===false)throw new Error(result.message||'خرید جام انجام نشد');
      const nextBalance=Number(result?.balance ?? (coinBalance-t.price));
      setCoinBalance(nextBalance);
      setOwnedTrophyIds(v=>v.includes(t.id)?v:[...v,t.id].sort((a,b)=>a-b));
      celebrateTrophy(t);
      toast(`🏆 ${t.name} با موفقیت کسب شد`,'success');
    }catch(err){toast('خطا در خرید جام: '+(err?.message||err),'error');}
    finally{setAchievementBusy(false);}
  };
  const redeemRewardCode=async()=>{
    const code=rewardCode.trim().toUpperCase();if(!code)return;setAchievementBusy(true);
    try{
      const {data,error}=await SB.rpc('tadbir_redeem_reward',{p_code:code,p_user_id:String(user.id)});
      if(error)throw error;
      const result=Array.isArray(data)?data[0]:data;
      if(result?.ok===false)throw new Error(result.message||'ثبت کد انجام نشد');
      const added=Number(result?.coins||0);
      const balance=Number(result?.balance ?? (coinBalance+added));
      setCoinBalance(balance);setRewardCode('');
      toast(`🪙 ${added} سکه به حساب شما اضافه شد`,'success');
    }catch(err){
      const msg=String(err?.message||err);
      if(msg.includes('already')||msg.includes('duplicate')||msg.includes('قبلاً'))toast('این کد را قبلاً استفاده کرده‌اید','warning');
      else if(msg.includes('invalid')||msg.includes('not found')||msg.includes('نامعتبر'))toast('کد جایزه معتبر نیست','error');
      else toast('خطا در ثبت کد جایزه: '+msg,'error');
    }finally{setAchievementBusy(false);}
  };

  const hasTakenExam=(examId)=>answers.some(a=>String(a.exam_id)===String(examId));

    setExamHintTarget(null);
    setShowExamHintConfirm(false);

  useEffect(()=>{
    if(activeExam&&timeLeft>0){
      const t=setInterval(()=>setTimeLeft(tl=>tl-1),1000);
      return()=>clearInterval(t);

  const getExamHintCost=()=>Math.pow(2,examHintUsed)*0.5;
  const requestExamHint=()=>{
    const q=activeExam?.questions?.[currentQ];
    if(!q||q.q_type!=='test'||!q.correct_opt)return;
    setShowExamHintConfirm(true);
  };
  const confirmExamHint=async()=>{
    const q=activeExam?.questions?.[currentQ];
    if(!q||q.q_type!=='test'||!q.correct_opt){
      setShowExamHintConfirm(false);
      return;
    }

    const cost=Number(getExamHintCost());

    try{
      const {data,error}=await SB.rpc('tadbir_spend_hint_coins_v3',{
        p_user_id:String(user.id),
        p_cost:cost
      });

      if(error)throw error;

      const result=Array.isArray(data)?data[0]:data;

      if(!result?.ok){
        const msg=String(result?.message||'امکان کسر سکه وجود ندارد');
        if(msg.includes('کافی')){
          toast(`🪙 برای این راهنما ${cost} سکه لازم است و موجودی شما کافی نیست.`,'warning');
        }else{
          toast(msg,'error');
        }
        setShowExamHintConfirm(false);
        return;
      }

      if(typeof setCoinBalance==='function'){
        setCoinBalance(Number(result.balance ?? 0));
      }

      setExamHintUsed(n=>n+1);
      setExamHintTarget(String(q.correct_opt).toUpperCase());
      setShowExamHintConfirm(false);
      toast(`💡 راهنما فعال شد؛ ${cost} سکه کسر شد.`,'success');

    }catch(err){
      console.error('exam hint rpc error:',err);
      toast('خطا در فعال‌سازی راهنما؛ سکه‌ای کسر نشد.','error');
      setShowExamHintConfirm(false);
    }
  };

  const submitQuestionObjection=async()=>{
    const q=activeExam?.questions?.[currentQ];
    const text=String(objectionText||'').trim();

    if(!text){toast('لطفاً دلیل اعتراض را بنویسید.','warning');return;}
    try{
      const {data,error}=await SB.rpc('tadbir_submit_question_objection_v2',{
        p_exam_id:String(activeExam.id),
        p_question_id:String(q.id),
        p_student_id:String(user.id),
        p_objection:text
      });
      if(error)throw error;
      const result=Array.isArray(data)?data[0]:data;
      if(result && result.ok===false)throw new Error(result.message||'ثبت اعتراض انجام نشد');
      setOpenObjection(null);
      setObjectionText('');
      toast('⚠️ اعتراض شما برای مدیر ارسال شد.','success');
    }catch(err){
      console.error('question objection:',err);
      toast('خطا در ثبت اعتراض؛ لطفاً دوباره تلاش کنید.','error');
    }
  };

  const submitExam=async()=>{
    if(!activeExam||hasSubmitted)return;
    setHasSubmitted(true);
    for(const q of activeExam.questions){
      const ans=studentAnswers[q.id]||'';
      let score=0;
      let status='pending';
      if(q.q_type==='test'){
        if(q.correct_opt){
          if(ans===q.correct_opt)score=parseFloat(q.score)||1;
          status='graded';
        }
      }
      await SB.from('answers').insert({exam_id:activeExam.id,student_id:user.id,question_id:q.id,student_answer:ans,score,max_score:parseFloat(q.score)||1,status,graded_at:status==='graded'?new Date().toISOString():null});
    }
    toast('✅ پاسخ‌ها ثبت شد!','success');
    setActiveExam(null);
    setShowExamCalc(false);
    loadAll();

  const calcPress=(v)=>{
    if(v==='C')setCalcDisplay('');

      try{
        const expr=calcDisplay.replace(/÷/g,'/').replace(/×/g,'*');
        setCalcDisplay(String(new Function('return '+expr)()));
      }catch{setCalcDisplay('خطا');}
    }
    else setCalcDisplay(calcDisplay+v);
  };

  const submitObjection=async()=>{
    if(!objectionText.trim()||!selectedExamForObjection)return;
    const examAnswers=answers.filter(a=>a.exam_id===selectedExamForObjection);
    for(const a of examAnswers){
      await SB.from('answers').update({objection:objectionText.trim()}).eq('id',a.id);
    }
    toast('✅ اعتراض ثبت شد!','success');
    setShowObjection(null);
    setSelectedExamForObjection(null);
    setObjectionText('');
    loadAll();
  };

  const addTask=async()=>{
    if(!newTask.trim())return;
    const {data,error}=await SB.from('checklists').insert({user_id:user.id,title:newTask.trim()}).select().single();
    if(error){toast('خطا: '+error.message,'error');return;}
    if(data)setChecklist([data,...checklist]);
    setNewTask('');
    toast('✅ کار اضافه شد','success');
  };

  const toggleTask=async(id,done)=>{
    await SB.from('checklists').update({is_done:!done}).eq('id',id);
    setChecklist(checklist.map(t=>t.id===id?{...t,is_done:!done}:t));
  };

  const deleteTask=async(id)=>{
    await SB.from('checklists').delete().eq('id',id);
    setChecklist(checklist.filter(t=>t.id!==id));
  };

  const addPlan=async()=>{
    if(!newPlan.subject.trim()||!newPlan.time.trim()){toast('همه فیلدها را پر کنید','error');return;}
    const {data,error}=await SB.from('study_plans').insert({user_id:user.id,day_of_week:newPlan.day,subject:newPlan.subject.trim(),time_range:newPlan.time.trim()}).select().single();
    if(error){toast('خطا: '+error.message,'error');return;}
    if(data)setStudyPlans([data,...studyPlans]);
    setNewPlan({day:'شنبه',subject:'',time:''});
    toast('✅ برنامه اضافه شد','success');
  };

  const deletePlan=async(id)=>{
    await SB.from('study_plans').delete().eq('id',id);
    setStudyPlans(studyPlans.filter(p=>p.id!==id));
  };

  const getExamScore=(examId,studentId=user.id)=>{
    const examAnswers=answers.filter(a=>String(a.exam_id)===String(examId)&&String(a.student_id)===String(studentId));
    if(examAnswers.length===0)return null;
    const totalScore=examAnswers.reduce((s,a)=>s+parseFloat(a.score||0),0);
    const maxScore=examAnswers.reduce((s,a)=>s+parseFloat(a.max_score||0),0);
    const percentage=(totalScore/maxScore)*20;
    return {totalScore,maxScore,percentage:percentage.toFixed(2)};
  };

  const getAverage=()=>{
    const examScores=exams.map(ex=>getExamScore(ex.id)).filter(s=>s!==null);
    if(examScores.length===0)return 0;
    const avg=examScores.reduce((s,e)=>s+parseFloat(e.percentage),0)/examScores.length;
    return avg.toFixed(2);
  };

  const getObjectionStart=(examId)=>{
    const rows=answers.filter(a=>String(a.exam_id)===String(examId)&&a.status==='graded');
    if(!rows.length)return null;
    const dates=rows.map(a=>a.graded_at||a.updated_at||a.created_at).filter(Boolean).map(x=>new Date(x).getTime()).filter(Number.isFinite);
    return dates.length?Math.max(...dates):null;
  };
  const getObjectionState=(examId)=>{
    const start=getObjectionStart(examId);
    if(!start)return {state:'waiting',remaining:0};
    const remaining=Math.max(0,48*60*60*1000-(Date.now()-start));
    return {state:remaining>0?'active':'expired',remaining};
  };
  const canObject=(examId)=>getObjectionState(examId).state==='active';




  if(activeExam){
    const q=activeExam.questions[currentQ];
    const progress=((currentQ+1)/activeExam.questions.length)*100;
    return(
      <div className="min-h-screen">
        <div className="header">

              <h2 className="font-black text-lg gradient-text">{activeExam.title}</h2>

          </div>

        {timeLeft<300&&timeLeft>0&&<div className="bg-red-500/15 text-red-300 p-3 text-center text-sm font-bold animate-pulse border-b border-red-500/20">⚠️ کمتر از ۵ دقیقه!</div>}
        <div className="content">

              <span className="badge badge-new">⭐ {q?.score||1} نمره</span>

                        <path d="M9.7 20h4.6M10 17.2h4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
                        <path d="M12 2V.9M4.8 4.8l-.8-.8M19.2 4.8l.8-.8M3 11H1.9M22.1 11H21" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" opacity=".7"/>
                      </svg>
                    </span>

                      <div className="flex items-center gap-3 relative">

                        {examHintTarget===opt&&<span className="exam-hint-finger-old" aria-label="گزینه راهنمایی‌شده"></span>}
                      </div>
                    </div>
                  ))}
                </div>
              </>
            ):(
              <>
                <div className="exam-guide-row">
                  <div className="exam-guide-icon-button disabled" aria-label="راهنما غیرفعال"><span className="exam-guide-lamp exam-guide-lamp-svg" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M8.7 15.4c-1.55-1.06-2.7-2.86-2.7-4.9a6 6 0 1 1 12 0c0 2.04-1.15 3.84-2.7 4.9-.74.5-1.18 1.04-1.3 1.6h-4c-.12-.56-.56-1.1-1.3-1.6Z" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/><path d="M9.7 20h4.6M10 17.2h4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg></span></div>
                </div>
                <textarea className="glass-input" placeholder="پاسخ خود را بنویسید..." value={studentAnswers[q.id]||''} onChange={e=>setStudentAnswers({...studentAnswers,[q.id]:e.target.value})} rows="5"/>
              </>
            )}
          </div>
          <div className="flex gap-2 mt-4">
            {currentQ>0&&<button onClick={()=>setCurrentQ(currentQ-1)} className="btn-glass bg-white/5 flex-1">← قبلی</button>}
            {currentQ<activeExam.questions.length-1?<button onClick={()=>setCurrentQ(currentQ+1)} className="btn-glass flex-1">بعدی →</button>:<button onClick={()=>{if(confirm('ثبت نهایی آزمون؟'))submitExam();}} className="btn-glass btn-glass-success flex-1">✓ ثبت نهایی</button>}
          </div>
        </div>
        {openObjection&&<div className="exam-hint-overlay" onClick={()=>setOpenObjection(null)}>
          <div className="exam-hint-modal" onClick={e=>e.stopPropagation()}>
            <div className="exam-objection-modal-icon">
              <svg viewBox="0 0 24 24" width="30" height="30" fill="none">
                <path d="M12 3.2 21 19H3L12 3.2Z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/>
                <path d="M12 8v5M12 16.2v.2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>

function App(){
  const [user,setUser]=useState(null);
  const [view,setView]=useState('login');
  const [tab,setTab]=useState('home');
  useEffect(()=>{if(view==='login')delete document.documentElement.dataset.tadbirTheme;},[view]);
  useEffect(()=>{
    const s=sessionStorage.getItem('edu_user');
    if(s){try{const u=JSON.parse(s);setUser(u);const role=String(u.role||'').trim().toLowerCase();setView((role==='admin'||role==='manager'||role==='administrator'||role==='مدیر'||role==='مدیر سیستم')?'admin':'student');SB.from('users').update({last_seen_at:new Date().toISOString()}).eq('id',u.id).then(()=>{}).catch(()=>{});}catch(e){sessionStorage.removeItem('edu_user');}}
  },[]);
  useEffect(()=>{
    if(!user?.id){
      delete document.documentElement.dataset.tadbirTheme;
      return;
    }
    const saved=localStorage.getItem(`tadbir_theme_${user.id}`)||'dark-purple';
    document.documentElement.dataset.tadbirTheme=saved;
  },[user?.id]);
  useEffect(()=>{
    if(!user?.id)return;
    const touch=()=>SB.from('users').update({last_seen_at:new Date().toISOString()}).eq('id',user.id).then(()=>{}).catch(()=>{});
    touch();
    const timer=setInterval(touch,60000);
    return()=>clearInterval(timer);
  },[user?.id]);
  const login=async(un,pw)=>{
    try{
      const username=String(un||'').trim().toUpperCase();
      const password=String(pw??'');
      if(!username||!password)return false;

      const {data,error}=await SB
        .from('users')
        .select('*')
        .eq('username',username)
        .eq('password',password)
        .limit(1);

      if(error){
        console.error('Tadbir login error:',error);
        return false;
      }

      const account=Array.isArray(data)?data[0]:data;
      if(!account)return false;

      const seen=new Date().toISOString();
      // ثبت آخرین بازدید نباید مانع ورود شود.
      SB.from('users').update({last_seen_at:seen}).eq('id',account.id).then(()=>{}).catch(()=>{});
      account.last_seen_at=seen;

      setUser(account);
      sessionStorage.setItem('edu_user',JSON.stringify(account));
      const role=String(account.role||'').trim().toLowerCase();
      setView(
        (role==='admin'||role==='manager'||role==='administrator'||role==='مدیر'||role==='مدیر سیستم')
          ? 'admin'
          : 'student'
      );
      return true;
    }catch(error){
      console.error('Tadbir login exception:',error);
      return false;
    }
  };
  const logout=()=>{setUser(null);setView('login');setTab('home');sessionStorage.removeItem('edu_user');};
  if(view==='login') return <Login onLogin={login}/>;
  if(view==='admin') return <Admin user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
  return <Student user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
}

function AppWrapper(){
  return(<ToastProvider><App/></ToastProvider>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppWrapper/>);
</script>

<script id="tadbir-v28-nav-waterdrop-only-js">
(function(){
  'use strict';

  /* Detect messenger list vs private conversation from EXISTING DOM only.
     No React state or Login logic is modified. */
  function syncMessengerNavState(){
    var overlay = document.querySelector('.social-fullscreen-overlay');
    var pv = !!document.querySelector('.social-fullscreen-overlay .conversation-header');
    var list = !!overlay && !pv;

    document.body.classList.toggle('tadbir-pv-open', pv);
    document.body.classList.toggle('tadbir-chat-list-open', list);
  }

  var stateObserver = new MutationObserver(syncMessengerNavState);
  stateObserver.observe(document.body,{childList:true,subtree:true});
  document.addEventListener('click',function(){setTimeout(syncMessengerNavState,0)},true);
  window.addEventListener('popstate',syncMessengerNavState);
  syncMessengerNavState();

  function centerOf(el){
    var r=el.getBoundingClientRect();
    return {x:r.left+r.width/2,y:r.top+r.height/2};
  }

  function splashAt(p,target){
    var splash=document.createElement('span');
    splash.className='tadbir-water-splash';
    splash.style.left=p.x+'px';
    splash.style.top=p.y+'px';
    document.body.appendChild(splash);

    if(target){
      target.classList.remove('tadbir-water-hit');
      void target.offsetWidth;
      target.classList.add('tadbir-water-hit');
      setTimeout(function(){target.classList.remove('tadbir-water-hit')},760);
    }
    setTimeout(function(){splash.remove()},760);
  }

  function animateWaterDrop(fromEl,toEl){
    if(!fromEl||!toEl||fromEl===toEl)return;
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;

    var a=centerOf(fromEl), b=centerOf(toEl);
    var dx=b.x-a.x;
    var distance=Math.abs(dx);
    var lift=Math.max(68,Math.min(132,74+distance*.22));

    var drop=document.createElement('span');
    drop.className='tadbir-water-drop';
    drop.style.left=a.x+'px';
    drop.style.top=a.y+'px';
    document.body.appendChild(drop);

    var anim=drop.animate([
      {transform:'translate3d(0,0,0) scale(.35) rotate(0deg)',opacity:0,offset:0},
      {transform:'translate3d(0,-10px,0) scale(.82) rotate(-8deg)',opacity:1,offset:.12},
      {transform:'translate3d('+(dx*.48)+'px,-'+lift+'px,0) scale(1.03) rotate('+(dx>=0?16:-16)+'deg)',opacity:1,offset:.48},
      {transform:'translate3d('+(dx*.82)+'px,-'+(lift*.45)+'px,0) scale(.92) rotate('+(dx>=0?7:-7)+'deg)',opacity:1,offset:.72},
      {transform:'translate3d('+dx+'px,0,0) scale(.72) rotate(0deg)',opacity:1,offset:.93},
      {transform:'translate3d('+dx+'px,0,0) scale(.25)',opacity:0,offset:1}
    ],{
      duration:760,
      easing:'cubic-bezier(.18,.82,.2,1)',
      fill:'forwards'
    });

    anim.onfinish=function(){
      splashAt(b,toEl);
      drop.remove();
    };
    anim.oncancel=function(){drop.remove()};
  }

  /* Capture click BEFORE React switches tabs, so source+destination positions
     are both known. Existing onClick handlers continue normally. */
  document.addEventListener('pointerdown',function(e){
    var target=e.target.closest&&e.target.closest('.nav-bar .nav-item');
    if(!target)return;
    var nav=target.closest('.nav-bar');
    if(!nav)return;
    var source=nav.querySelector('.nav-item.active')||target;
    if(source!==target)animateWaterDrop(source,target);
  },true);
})();
</script>

<style id="tadbir-blossom-mobile-cinematic-final">
/* =========================================================
   TADBIR — BLOSSOM ROOM MOBILE CINEMATIC LAYER
   Additive + fully scoped to .blossom-* only.
   Login / authentication UI is intentionally untouched.
   ========================================================= */
.blossom-safe-room-overlay,
.blossom-safe-room{
  -webkit-user-select:none;
  user-select:none;
  touch-action:none;
}
.blossom-room-world{
  width:100%;
  height:100%;
  min-height:100%;
  contain:layout paint;
  isolation:isolate;
}
/* A subtle living atmosphere: haze + drifting light. */
.blossom-room-world:after{
  content:"";
  position:absolute;
  inset:-8%;
  z-index:10;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 28%,rgba(255,255,255,.16) 0 1px,transparent 2px),
    radial-gradient(circle at 72% 33%,rgba(255,247,191,.22) 0 1.5px,transparent 3px),
    radial-gradient(circle at 43% 18%,rgba(255,255,255,.13) 0 1px,transparent 2px),
    radial-gradient(ellipse at 50% 48%,transparent 0 35%,rgba(255,255,255,.045) 58%,rgba(0,0,0,.22) 100%);
  background-size:auto,auto,auto,100% 100%;
  mix-blend-mode:screen;
  opacity:.72;
  animation:blossomAtmosphere 9s ease-in-out infinite alternate;
}
@keyframes blossomAtmosphere{
  0%{transform:translate3d(-1%,0,0) scale(1);opacity:.58}
  50%{opacity:.78}
  100%{transform:translate3d(1%,1%,0) scale(1.025);opacity:.68}

/* Mobile depth: distant light bands move independently. */
.blossom-mountains{transform-origin:50% 100%;will-change:transform}
.blossom-lake{will-change:transform}
.blossom-garden{transform-origin:50% 100%;will-change:transform}
.blossom-garden:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse at 12% 22%,rgba(255,255,214,.24),transparent 13%),
    radial-gradient(ellipse at 82% 15%,rgba(255,255,255,.12),transparent 16%);
  opacity:.7;
  animation:blossomGardenLight 7s ease-in-out infinite alternate;
  pointer-events:none;
}
.blossom-garden:after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:0;height:42%;
  background:
    radial-gradient(circle at 8% 65%,rgba(246,194,93,.55) 0 2px,transparent 3px),
    radial-gradient(circle at 24% 34%,rgba(255,224,130,.48) 0 1.5px,transparent 3px),
    radial-gradient(circle at 41% 74%,rgba(255,238,160,.42) 0 2px,transparent 3px),
    radial-gradient(circle at 63% 42%,rgba(255,224,130,.5) 0 1.5px,transparent 3px),
    radial-gradient(circle at 79% 68%,rgba(255,239,170,.44) 0 2px,transparent 3px),
    radial-gradient(circle at 94% 30%,rgba(255,220,120,.48) 0 1.5px,transparent 3px);
  filter:blur(.15px);
  animation:blossomFireflies 4.8s ease-in-out infinite alternate;
  pointer-events:none;
}
@keyframes blossomGardenLight{from{transform:translateX(-1.5%);opacity:.45}to{transform:translateX(1.5%);opacity:.85}}
