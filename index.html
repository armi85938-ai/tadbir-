*{font-family:'Vazirmatn',sans-serif;margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0a1a;min-height:100vh;color:#fff;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(99,102,241,0.15),transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(236,72,153,0.1),transparent 60%),radial-gradient(ellipse at 50% 50%,rgba(14,165,233,0.08),transparent 60%);pointer-events:none;z-index:0}

.glass{background:rgba(255,255,255,0.04);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.08);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.glass-strong{background:rgba(15,15,35,0.85);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,0.12);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.glass-input{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;color:#fff;font-size:14px;width:100%;outline:none;transition:all 0.3s}
.glass-input:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,0.15)}

.btn-glass{background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(168,85,247,0.2));backdrop-filter:blur(12px);border:1px solid rgba(129,140,248,0.3);color:#fff;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:all 0.3s;position:relative;overflow:hidden}
.btn-glass:hover{border-color:rgba(129,140,248,0.6);box-shadow:0 0 20px rgba(99,102,241,0.2)}
.btn-glass:active{transform:scale(0.97)}
.btn-glass:disabled{opacity:0.5;cursor:not-allowed;pointer-events:none}
.btn-glass-success{background:linear-gradient(135deg,rgba(16,185,129,0.25),rgba(5,150,105,0.25));border-color:rgba(52,211,153,0.4)}
.btn-glass-danger{background:linear-gradient(135deg,rgba(239,68,68,0.25),rgba(220,38,38,0.25));border-color:rgba(248,113,113,0.4)}
.btn-sm{padding:10px 16px;font-size:13px;width:auto;border-radius:12px}

.tool-btn{background:rgba(255,255,255,0.03);border:2px solid rgba(255,255,255,0.08);border-radius:24px;padding:24px 16px;text-align:center;cursor:pointer;transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);position:relative;overflow:hidden}
.tool-btn::before{content:'';position:absolute;inset:0;border-radius:24px;opacity:0;transition:opacity 0.5s}
.tool-btn::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 70%);opacity:0;transition:opacity 0.5s}
.tool-btn:hover::before,.tool-btn.active::before{opacity:1}
.tool-btn:hover::after,.tool-btn.active::after{opacity:1}
.tool-btn.active{transform:translateY(-8px) scale(1.05);border-color:transparent}
.tool-btn.calc::before{background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(168,85,247,0.15))}
.tool-btn.calc.active{box-shadow:0 12px 40px rgba(99,102,241,0.4),0 0 80px rgba(99,102,241,0.2),inset 0 0 40px rgba(99,102,241,0.1)}
.tool-btn.check::before{background:linear-gradient(135deg,rgba(16,185,129,0.2),rgba(52,211,153,0.15))}
.tool-btn.check.active{box-shadow:0 12px 40px rgba(16,185,129,0.4),0 0 80px rgba(16,185,129,0.2),inset 0 0 40px rgba(16,185,129,0.1)}
.tool-btn.plan::before{background:linear-gradient(135deg,rgba(245,158,11,0.2),rgba(251,191,36,0.15))}
.tool-btn.plan.active{box-shadow:0 12px 40px rgba(245,158,11,0.4),0 0 80px rgba(245,158,11,0.2),inset 0 0 40px rgba(245,158,11,0.1)}
.tool-btn.game::before{background:linear-gradient(135deg,rgba(236,72,153,0.2),rgba(244,114,182,0.15))}
.tool-btn.game.active{box-shadow:0 12px 40px rgba(236,72,153,0.4),0 0 80px rgba(236,72,153,0.2),inset 0 0 40px rgba(236,72,153,0.1)}
.tool-icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;position:relative;z-index:1;transition:all 0.5s}
.tool-btn:hover .tool-icon,.tool-btn.active .tool-icon{transform:scale(1.15) rotate(5deg)}
.tool-btn.calc .tool-icon{background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 6px 20px rgba(99,102,241,0.5)}
.tool-btn.check .tool-icon{background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 6px 20px rgba(16,185,129,0.5)}
.tool-btn.plan .tool-icon{background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 6px 20px rgba(245,158,11,0.5)}
.tool-btn.game .tool-icon{background:linear-gradient(135deg,#ec4899,#f472b6);box-shadow:0 6px 20px rgba(236,72,153,0.5)}
.tool-label{font-size:14px;font-weight:800;position:relative;z-index:1;transition:all 0.3s}
.tool-btn.active .tool-label{transform:scale(1.1)}

.fade-in{animation:fadeIn 0.4s ease-out}
.slide-up{animation:slideUp 0.5s cubic-bezier(0.16,1,0.3,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:16px;margin-bottom:12px;transition:all 0.3s}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,0.3);border-color:rgba(129,140,248,0.2)}
.card.disabled{opacity:0.6;pointer-events:none;background:rgba(255,255,255,0.02)}

.header{position:sticky;top:0;z-index:40;background:rgba(10,10,26,0.9);backdrop-filter:blur(30px);border-bottom:1px solid rgba(255,255,255,0.06);padding:16px 20px}
.content{padding:16px;padding-bottom:100px;max-width:600px;margin:0 auto;position:relative;z-index:1}

.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.badge-pending{background:rgba(251,146,60,0.15);color:#fb923c;border:1px solid rgba(251,146,60,0.25)}
.badge-approved{background:rgba(52,211,153,0.15);color:#34d399;border:1px solid rgba(52,211,153,0.25)}
.badge-new{background:rgba(129,140,248,0.15);color:#818cf8;border:1px solid rgba(129,140,248,0.25)}
.badge-taken{background:rgba(107,114,128,0.2);color:#9ca3af;border:1px solid rgba(107,114,128,0.3)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.gradient-text{background:linear-gradient(135deg,#818cf8,#c084fc,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.timer-circle{position:relative;width:90px;height:90px}
.timer-circle svg{transform:rotate(-90deg)}
.timer-circle circle{fill:none;stroke-width:6}
.timer-circle .bg{stroke:rgba(255,255,255,0.08)}
.timer-circle .progress{stroke-linecap:round;transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 6px currentColor)}
.timer-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}

#gameCanvas{border-radius:20px;border:2px solid rgba(129,140,248,0.2);width:100%;max-width:380px;margin:0 auto;display:block;touch-action:none;background:linear-gradient(180deg,rgba(15,15,35,0.95),rgba(10,10,26,0.98));box-shadow:0 8px 40px rgba(99,102,241,0.2)}

.nav-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,26,0.95);backdrop-filter:blur(30px);border-top:1px solid rgba(255,255,255,0.06);padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:50}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;border-radius:14px;color:rgba(255,255,255,0.35);font-size:10px;cursor:pointer;transition:all 0.3s}
.nav-item.active{color:#818cf8;background:rgba(129,140,248,0.1)}
.nav-item.active svg{filter:drop-shadow(0 0 8px rgba(129,140,248,0.6))}
.nav-item svg{width:22px;height:22px}

.chat-bubble{padding:10px 14px;border-radius:16px;max-width:80%;margin-bottom:8px;font-size:13px;line-height:1.6;word-break:break-word}
.chat-bubble.me{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-bottom-left-radius:4px;margin-right:auto}
.chat-bubble.other{background:rgba(255,255,255,0.08);border-bottom-right-radius:4px;margin-left:auto}

/* ================= PROFESSIONAL SCHOOL UI ================= */
html{scroll-behavior:smooth}
body{
 background:
 radial-gradient(circle at 10% 5%,rgba(124,58,237,.24),transparent 28%),
 radial-gradient(circle at 90% 8%,rgba(14,165,233,.18),transparent 27%),
 radial-gradient(circle at 50% 100%,rgba(236,72,153,.12),transparent 34%),
 #070817!important;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.35;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:30px 30px}
.glass,.glass-strong,.card{
 border-color:rgba(255,255,255,.10)!important;
 box-shadow:0 18px 65px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.05)!important;
 backdrop-filter:blur(22px)!important;-webkit-backdrop-filter:blur(22px)!important;
}
.card{transition:.25s ease}.card:hover{transform:translateY(-4px);border-color:rgba(129,140,248,.3)!important}
button,.btn-glass{transition:.2s ease}button:hover,.btn-glass:hover{transform:translateY(-2px);filter:brightness(1.07)}
/* Login */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.login-bg:before,.login-bg:after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;pointer-events:none}
.login-bg:before{width:300px;height:300px;background:#7c3aed;top:-120px;right:-90px}
.login-bg:after{width:260px;height:260px;background:#0ea5e9;bottom:-110px;left:-90px}
.login-card{width:min(430px,100%);padding:32px;border-radius:34px!important;background:rgba(12,16,39,.80)!important;border:1px solid rgba(255,255,255,.12)!important;box-shadow:0 35px 110px rgba(0,0,0,.48)!important;backdrop-filter:blur(28px)!important}
.login-logo{width:84px;height:84px;border-radius:27px;margin:0 auto 18px;display:grid;place-items:center;font-size:39px;background:linear-gradient(135deg,#7c3aed,#2563eb);box-shadow:0 18px 55px rgba(99,102,241,.35);animation:schoolFloat 4s ease-in-out infinite}
@keyframes schoolFloat{50%{transform:translateY(-7px)}}
/* Calendar */
.pcal{position:relative;overflow:hidden;border-radius:30px;padding:22px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.10);box-shadow:0 25px 75px rgba(0,0,0,.28)}
.pcal:before{content:"";position:absolute;width:190px;height:190px;left:-95px;top:-95px;border-radius:50%;background:rgba(236,72,153,.17);filter:blur(35px)}
.pcal-head{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.pcal-title{font-size:1.35rem;font-weight:950}.pcal-sub{font-size:.72rem;color:rgba(255,255,255,.43);margin-top:4px}
.pcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:18px;position:relative;z-index:1}
.pcal-week{text-align:center;color:rgba(255,255,255,.35);font-size:.65rem;font-weight:900;padding:5px}
.pcal-day{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:15px;color:rgba(255,255,255,.82);font-size:.82rem}
.pcal-day.empty{visibility:hidden}.pcal-day.today{font-weight:950}
.pcal-day.today:before{content:"";position:absolute;width:80%;height:70%;border:3px solid #ef4444;border-radius:49% 54% 47% 52%;transform:rotate(-7deg);filter:drop-shadow(0 2px 1px rgba(0,0,0,.35));animation:pencilDraw .65s ease-out}
.pcal-day.today:after{content:"";position:absolute;width:71%;height:64%;border:1px solid rgba(239,68,68,.55);border-radius:55% 45% 52% 48%;transform:rotate(8deg)}
@keyframes pencilDraw{from{transform:scale(.35) rotate(-7deg);opacity:0}to{transform:scale(1) rotate(-7deg);opacity:1}}
/* Tools */
.pro-tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.pro-tool{min-height:142px;padding:19px;border-radius:25px!important;position:relative;overflow:hidden;text-align:right}
.pro-tool .tool-icon-pro{width:59px;height:59px;border-radius:19px;display:grid;place-items:center;background:rgba(255,255,255,.09);font-size:28px;margin-bottom:12px}
.pro-tool b{font-size:.96rem}.pro-tool small{display:block;color:rgba(255,255,255,.38);font-size:.66rem;margin-top:4px}
/* Games */
.game-modal{position:fixed;inset:0;z-index:99990;background:rgba(2,4,15,.86);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;padding:15px}
.game-window{width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:32px;padding:20px;background:linear-gradient(145deg,#121936,#090c20);border:1px solid rgba(255,255,255,.12);box-shadow:0 40px 120px rgba(0,0,0,.58)}
.game-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.game-card{padding:18px;border-radius:23px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);cursor:pointer;text-align:right;transition:.25s}
.game-card:hover{transform:translateY(-4px);background:rgba(99,102,241,.14);border-color:rgba(129,140,248,.34)}
.game-card .emoji{font-size:36px}.game-card b{display:block;margin-top:8px}.game-card small{display:block;color:rgba(255,255,255,.38);font-size:.65rem;margin-top:3px}
.game-board{width:min(420px,100%);margin:20px auto;display:grid;gap:8px}
.xo-cell{aspect-ratio:1;border-radius:20px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);font-size:44px;font-weight:950}
.mini-game{height:330px;border-radius:25px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px}
.stack{display:flex;flex-direction:column-reverse;align-items:center;gap:4px}.stack-piece{height:22px;border-radius:7px;background:linear-gradient(90deg,#7c3aed,#2563eb);box-shadow:0 5px 14px rgba(99,102,241,.2)}
.bridge-pieces{display:flex;align-items:center;gap:3px}.bridge-piece{width:45px;height:16px;border-radius:4px;background:#a78bfa;transform:rotate(-2deg)}
.space-field{position:relative;width:94%;height:270px;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(124,58,237,.16),rgba(0,0,0,.4))}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.75}
.paddle-field{position:relative;width:94%;height:270px;border-radius:22px;background:linear-gradient(180deg,rgba(14,165,233,.08),rgba(124,58,237,.09));overflow:hidden}
.paddle{position:absolute;bottom:18px;width:105px;height:14px;border-radius:99px;background:linear-gradient(90deg,#7c3aed,#ec4899);left:calc(50% - 52px)}
.paddle-ball{position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 25px rgba(255,255,255,.45)}
/* Exams/Admin */
.exam-pro{border-radius:31px!important}.question-progress{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}.question-progress>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#7c3aed,#2563eb);transition:.35s}
.option-pro{display:flex;align-items:center;gap:12px;padding:15px;border-radius:19px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);cursor:pointer;transition:.2s}.option-pro:hover{background:rgba(99,102,241,.12);transform:translateX(-2px)}.option-pro.selected{border-color:rgba(129,140,248,.5);background:rgba(99,102,241,.16)}
.timer-pro{border-radius:20px;padding:10px 15px;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.20);font-weight:950}
.builder-card{border-radius:26px!important}.builder-actions{display:flex;gap:8px}.builder-actions>*{flex:1}
@media(max-width:520px){.pro-tool-grid,.game-picker{grid-template-columns:1fr 1fr}.pcal-grid{gap:4px}.pcal-day{font-size:.72rem}.login-card{padding:24px}}
#schoolToast{position:fixed;top:18px;right:18px;z-index:100000;max-width:min(380px,calc(100vw - 36px));padding:15px 18px;border-radius:19px;background:rgba(13,18,42,.96);border:1px solid rgba(129,140,248,.32);box-shadow:0 22px 65px rgba(0,0,0,.42);backdrop-filter:blur(18px);color:#fff;transform:translateY(-18px);opacity:0;transition:.3s;pointer-events:none;font-size:.82rem}#schoolToast.show{transform:translateY(0);opacity:1}</style>

  const login=async(un,pw)=>{
    const {data}=await SB.from('users').select('*').eq('username',un.toUpperCase()).eq('password',pw).single();
    if(data){setUser(data);sessionStorage.setItem('edu_user',JSON.stringify(data));setView(data.role);return true;}
    return false;
  };
  const logout=()=>{setUser(null);setView('login');setTab('home');sessionStorage.removeItem('edu_user');};
  if(view==='login') return <Login onLogin={login}/>;
  if(view==='admin') return <Admin user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
  return <Student user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
}

  return(
    <div className="min-h-screen flex items-center justify-center p-6 fade-in relative overflow-hidden">

        <div className="text-center mb-8 slide-up">
          <div className="w-24 h-24 mx-auto mb-5 rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-2xl shadow-purple-500/30 rotate-6 hover:rotate-0 transition-all duration-500">
            <Icon d={Icons.book} size={44}/>
          </div>
          <h1 className="text-4xl font-black mb-2 gradient-text">سامانه آموزشی</h1>

            <div>

              <input className="glass-input" placeholder="مثال: ARMIN" value={un} onChange={e=>setUn(e.target.value.toUpperCase())} required/>
            </div>
            <div>
              <label className="text-xs text-white/50 mb-2 block">رمز عبور</label>
              <input className="glass-input" type="password" placeholder="••••" value={pw} onChange={e=>setPw(e.target.value)} required/>

          </form>
        </div>
      </div>
    </div>
  );
}

function CircularTimer({timeLeft,totalTime}){
  const r=38,c=2*Math.PI*r,p=(timeLeft/totalTime)*c;
  const m=Math.floor(timeLeft/60),s=timeLeft%60;
  const col=timeLeft<60?'#ef4444':timeLeft<300?'#f59e0b':'#818cf8';
  return(
    <div className="timer-circle">
      <svg width="90" height="90"><circle className="bg" cx="45" cy="45" r={r}/><circle className="progress" cx="45" cy="45" r={r} stroke={col} strokeDasharray={c} strokeDashoffset={c-p}/></svg>
      <div className="timer-text"><div className={`text-xl font-black font-mono ${timeLeft<60?'text-red-400 animate-pulse':timeLeft<300?'text-amber-400':'text-white'}`}>{m}:{s<10?'0':''}{s}</div></div>
    </div>
  );
}

                  </div>
                ))}
                <div className="flex gap-2 mt-3"><button onClick={()=>setStep(1)} className="btn-glass bg-white/5 flex-1">قبلی</button><button onClick={()=>setStep(3)} className="btn-glass flex-1">بررسی</button></div>
              </div>
            )}
            {step===3&&(
              <div className="fade-in text-center">
                <div className="glass p-4 mb-4 text-right space-y-2 text-sm"><p>عنوان: <b>{formData.title}</b></p><p>مدت: <b>{formData.duration} دقیقه</b></p><p>سوالات: <b>{questions.length}</b></p><p>اختصاص به: <b>{formData.assigned==='all'?'همه':'دانش‌آموز خاص'}</b></p></div>
                <div className="flex gap-2"><button onClick={()=>setStep(2)} className="btn-glass bg-white/5 flex-1">ویرایش</button><button onClick={createExam} className="btn-glass btn-glass-success flex-1" disabled={loading}>{loading?'ذخیره...':'ذخیره آزمون'}</button></div>

            )}

        </div>

    </div>
  );
}


function notifySchool(message,title='سامانه آموزشی'){
 let el=document.getElementById('schoolToast');
 if(!el){el=document.createElement('div');el.id='schoolToast';document.body.appendChild(el)}
 el.innerHTML='<div style="font-weight:900;margin-bottom:4px">'+title+'</div><div>'+message+'</div>';

function PersianCalendarPro(){

 const f=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(now);

 const days=pm<=6?31:pm<=11?30:30;
 // Persian calendar week begins Saturday. JS Sunday=0, so convert to Saturday-first index.
 const offset=(now.getDay()+1)%7;
 const cells=[];
 for(let i=0;i<offset;i++)cells.push(<div className="pcal-day empty" key={'e'+i}/>);

   <div className="pcal-grid">{['ش','ی','د','س','چ','پ','ج'].map(x=><div className="pcal-week" key={x}>{x}</div>)}{cells}</div>
 </div>
}

 const winner=win(0,1,2)||win(3,4,5)||win(6,7,8)||win(0,3,6)||win(1,4,7)||win(2,5,8)||win(0,4,8)||win(2,4,6);

function Student({user,tab,setTab,onLogout}){
  const [exams,setExams]=useState([]);const [answers,setAnswers]=useState([]);
  const [activeExam,setActiveExam]=useState(null);const [currentQ,setCurrentQ]=useState(0);
  const [studentAnswers,setStudentAnswers]=useState({});const [timeLeft,setTimeLeft]=useState(0);const [totalTime,setTotalTime]=useState(0);
  const [calcDisplay,setCalcDisplay]=useState('');
  const [showObjection,setShowObjection]=useState(null);const [objectionText,setObjectionText]=useState('');
  const [selectedExamForObjection,setSelectedExamForObjection]=useState(null);
  const [checklist,setChecklist]=useState([]);const [newTask,setNewTask]=useState('');
  const [studyPlans,setStudyPlans]=useState([]);const [newPlan,setNewPlan]=useState({day:'شنبه',subject:'',time:''});
  const [messages,setMessages]=useState([]);const [chatText,setChatText]=useState('');
  const [bestScore,setBestScore]=useState(0);
  const [toolsTab,setToolsTab]=useState('calc');
  const [chartReady,setChartReady]=useState(false);
  const [showExamResults,setShowExamResults]=useState(null);
  const [showChat,setShowChat]=useState(false);
  const canvasRef=useRef(null);
  const gameRef=useRef(null);

  useEffect(()=>{loadAll();},[]);

  const loadAll=async()=>{
    const {data:e}=await SB.from('exams').select('*,questions(*)').order('created_at',{ascending:false});
    const {data:a}=await SB.from('answers').select('*,exams(title),questions(q_text,q_type,correct_opt,score,opt_a,opt_b,opt_c,opt_d)');
    const {data:c}=await SB.from('checklists').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    const {data:p}=await SB.from('study_plans').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    const {data:g}=await SB.from('game_scores').select('score').eq('user_id',user.id).order('score',{ascending:false}).limit(1);
    if(e)setExams(e.filter(ex=>ex.assigned_to==='all'||ex.assigned_to===String(user.id)));
    if(a)setAnswers(a.filter(ans=>ans.student_id===user.id));
    if(c)setChecklist(c);if(p)setStudyPlans(p);
    if(g&&g.length>0)setBestScore(g[0].score);
    loadMessages();
  };

  const loadMessages=async()=>{
    const {data:admins}=await SB.from('users').select('id').eq('role','admin').limit(1);
    if(!admins||!admins.length)return;
    const aid=admins[0].id;
    const {data}=await SB.from('messages').select('*').or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`).order('created_at',{ascending:true});
    if(data)setMessages(data.filter(m=>m.sender_id===aid||m.receiver_id===aid));
  };

  // ✅ بررسی دقیق شرکت در آزمون
  const hasTakenExam=(examId)=>{
    return answers.some(a=>String(a.exam_id)===String(examId)&&String(a.student_id)===String(user.id));
  };

  const startExam=(exam)=>{
    if(hasTakenExam(exam.id)){
      notifySchool('⚠️ شما قبلاً در این آزمون شرکت کرده‌اید و امکان شرکت مجدد وجود ندارد!');
      return;
    }
    setActiveExam(exam);setCurrentQ(0);setStudentAnswers({});setTimeLeft(exam.duration_minutes*60);setTotalTime(exam.duration_minutes*60);
  };

  useEffect(()=>{if(activeExam&&timeLeft>0){const t=setInterval(()=>setTimeLeft(tl=>tl-1),1000);return()=>clearInterval(t);}else if(activeExam&&timeLeft===0)submitExam();},[activeExam,timeLeft]);

  const submitExam=async()=>{
    if(!activeExam)return;
    for(const q of activeExam.questions){
      const ans=studentAnswers[q.id]||'';let score=0;
      if(q.q_type==='test'&&q.correct_opt&&ans===q.correct_opt)score=parseFloat(q.score)||1;
      await SB.from('answers').insert({exam_id:activeExam.id,student_id:user.id,question_id:q.id,student_answer:ans,score,max_score:parseFloat(q.score)||1,status:(q.q_type==='test'&&q.correct_opt)?'graded':'pending'});
    }
    notifySchool('پاسخ‌ها ثبت شد!');setActiveExam(null);loadAll();
  };

  const calcPress=(v)=>{if(v==='C')setCalcDisplay('');else if(v==='='){try{setCalcDisplay(String(new Function('return '+calcDisplay)()));}catch{setCalcDisplay('Error');}}else setCalcDisplay(calcDisplay+v);};

  const submitObjection=async()=>{
    if(!objectionText.trim()||!selectedExamForObjection)return;
    const examAnswers=answers.filter(a=>a.exam_id===selectedExamForObjection);
    for(const a of examAnswers){
      await SB.from('answers').update({objection:objectionText.trim()}).eq('id',a.id);
    }
    notifySchool('اعتراض شما ثبت و برای مدیر ارسال شد!');setShowObjection(null);setSelectedExamForObjection(null);setObjectionText('');loadAll();
  };

  const changeMyPassword=async()=>{const p=prompt("رمز جدید (حداقل ۴ کاراکتر):");if(p&&p.length>=4){await SB.from('users').update({password:p}).eq('id',user.id);const u={...user,password:p};setUser(u);sessionStorage.setItem('edu_user',JSON.stringify(u));notifySchool("رمز تغییر کرد");}else if(p)notifySchool("حداقل ۴ کاراکتر");};

  const addTask=async()=>{if(!newTask.trim())return;const {data,error}=await SB.from('checklists').insert({user_id:user.id,title:newTask.trim()}).select().single();if(error){console.error(error);return;}if(data)setChecklist([data,...checklist]);setNewTask('');};
  const toggleTask=async(id,done)=>{await SB.from('checklists').update({is_done:!done}).eq('id',id);setChecklist(checklist.map(t=>t.id===id?{...t,is_done:!done}:t));};
  const deleteTask=async(id)=>{await SB.from('checklists').delete().eq('id',id);setChecklist(checklist.filter(t=>t.id!==id));};

  const addPlan=async()=>{if(!newPlan.subject.trim()||!newPlan.time.trim())return;const {data,error}=await SB.from('study_plans').insert({user_id:user.id,day_of_week:newPlan.day,subject:newPlan.subject.trim(),time_range:newPlan.time.trim()}).select().single();if(error){console.error(error);return;}if(data)setStudyPlans([data,...studyPlans]);setNewPlan({day:'شنبه',subject:'',time:''});};
  const deletePlan=async(id)=>{await SB.from('study_plans').delete().eq('id',id);setStudyPlans(studyPlans.filter(p=>p.id!==id));};

  const sendChat=async()=>{if(!chatText.trim())return;const {data:admins}=await SB.from('users').select('id').eq('role','admin').limit(1);if(!admins||!admins.length)return;await SB.from('messages').insert({sender_id:user.id,receiver_id:admins[0].id,content:chatText.trim()});setChatText('');loadMessages();};

  // ✅ بازی استاندارد و متعادل
  const startGame=useCallback(()=>{
    const canvas=canvasRef.current;
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const W=380,H=500;
    canvas.width=W;canvas.height=H;
    
    let score=0,level=1,lives=3,running=true;
    let playerX=W/2,playerW=50,playerH=50;
    let bullets=[];
    let enemies=[];
    let particles=[];
    let lastShot=0;
    let enemySpawnTime=0;
    let invincibleUntil=0; // زمان مصونیت بعد از برخورد
    const SHOOT_COOLDOWN=300;
    const INVINCIBLE_DURATION=2000; // 2 ثانیه مصونیت
    const MAX_PARTICLES=50;

    const moveHandler=(e)=>{
      e.preventDefault();
      const rect=canvas.getBoundingClientRect();
      const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
      const scaleX=W/rect.width;
      playerX=Math.max(playerW/2,Math.min(W-playerW/2,cx*scaleX));
    };

    const shoot=()=>{
      const now=Date.now();
      if(now-lastShot<SHOOT_COOLDOWN)return;
      lastShot=now;
      bullets.push({x:playerX,y:H-70,speed:7});
    };

    canvas.addEventListener('mousemove',moveHandler);
    canvas.addEventListener('touchmove',moveHandler,{passive:false});
    canvas.addEventListener('click',shoot);
    canvas.addEventListener('touchstart',shoot);

    const spawnEnemy=()=>{
      const size=25+Math.random()*15;
      enemies.push({
        x:Math.random()*(W-size),
        y:-size,
        w:size,
        h:size,
        speed:0.8+level*0.15+Math.random()*0.5, // سرعت کمتر
        color:`hsl(${Math.random()*360},70%,60%)`
      });
    };

    const spawnParticles=(x,y,color,count=8)=>{
      for(let i=0;i<count&&particles.length<MAX_PARTICLES;i++){
        const angle=Math.random()*Math.PI*2;
        const speed=Math.random()*3+1;
        particles.push({x,y,dx:Math.cos(angle)*speed,dy:Math.sin(angle)*speed,life:20,color});
      }
    };

    const saveScore=async(s)=>{
      setBestScore(prev=>Math.max(prev,s));
      try{await SB.from('game_scores').insert({user_id:user.id,score:s});}catch(e){}
    };

    const gameOver=()=>{
      running=false;
      saveScore(score);
      notifySchool(`💥 بازی تمام شد!\n\nامتیاز: ${score}\nمرحله: ${level}\nبهترین رکورد: ${Math.max(bestScore,score)}`);
      score=0;level=1;lives=3;enemies=[];bullets=[];particles=[];
      running=true;
      loop();
    };

    const takeDamage=()=>{
      const now=Date.now();
      if(now<invincibleUntil)return; // هنوز مصون است
      lives--;
      invincibleUntil=now+INVINCIBLE_DURATION; // 2 ثانیه مصونیت
      spawnParticles(playerX,H-45,'#ef4444',15);
      if(lives<=0){
        gameOver();
      }
    };

    const loop=()=>{
      if(!running)return;
      ctx.clearRect(0,0,W,H);

      const bgGrad=ctx.createLinearGradient(0,0,0,H);
      bgGrad.addColorStop(0,'rgba(15,15,35,0.95)');
      bgGrad.addColorStop(1,'rgba(10,10,26,0.98)');
      ctx.fillStyle=bgGrad;
      ctx.fillRect(0,0,W,H);

      // Stars
      ctx.fillStyle='rgba(255,255,255,0.3)';
      for(let i=0;i<20;i++){
        const x=(i*37+Date.now()*0.02)%W;
        const y=(i*53+Date.now()*0.05)%H;
        ctx.fillRect(x,y,2,2);
      }

      // Player (با افکت چشمک‌زن هنگام مصونیت)
      const now=Date.now();
      const isInvincible=now<invincibleUntil;
      if(!isInvincible||Math.floor(now/100)%2===0){
        ctx.fillStyle='#818cf8';
        ctx.shadowColor='#818cf8';
        ctx.shadowBlur=20;
        ctx.beginPath();
        ctx.moveTo(playerX,H-45);
        ctx.lineTo(playerX-playerW/2,H-20);
        ctx.lineTo(playerX+playerW/2,H-20);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur=0;
      }

      // Bullets
      bullets=bullets.filter(b=>{
        b.y-=b.speed;
        if(b.y<0)return false;
        ctx.fillStyle='#fbbf24';
        ctx.shadowColor='#fbbf24';
        ctx.shadowBlur=10;
        ctx.fillRect(b.x-2,b.y,4,10);
        ctx.shadowBlur=0;
        return true;
      });

      // Spawn enemies (با فاصله بیشتر)
      enemySpawnTime++;
      const spawnRate=Math.max(80,120-level*8); // حداقل 80 فریم بین هر دشمن
      if(enemySpawnTime>spawnRate){
        spawnEnemy();
        enemySpawnTime=0;
      }

      // Enemies
      enemies=enemies.filter(e=>{
        e.y+=e.speed;
        
        // اگر دشمن از صفحه رد شد، یک جان کم می‌شود
        if(e.y>H){
          takeDamage();
          return false;
        }

        ctx.fillStyle=e.color;
        ctx.shadowColor=e.color;
        ctx.shadowBlur=15;
        ctx.fillRect(e.x,e.y,e.w,e.h);
        ctx.shadowBlur=0;

        // Collision with bullets
        for(let i=bullets.length-1;i>=0;i--){
          const b=bullets[i];
          if(b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){
            bullets.splice(i,1);
            score+=10;
            spawnParticles(e.x+e.w/2,e.y+e.h/2,e.color);
            if(score>level*100){level++;}
            return false;
          }
        }

        // Collision with player
        if(!isInvincible&&e.x<playerX+playerW/2&&e.x+e.w>playerX-playerW/2&&e.y+e.h>H-50&&e.y<H-20){
          takeDamage();
          spawnParticles(e.x+e.w/2,e.y+e.h/2,e.color,12);
          return false;
        }

        return true;
      });

      // Particles
      particles=particles.filter(p=>{
        p.x+=p.dx;
        p.y+=p.dy;
        p.life--;
        ctx.globalAlpha=p.life/20;
        ctx.fillStyle=p.color;
        ctx.fillRect(p.x,p.y,3,3);
        ctx.globalAlpha=1;
        return p.life>0;
      });

      // Score, Level & Lives
      ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.font='bold 16px Vazirmatn';
      ctx.textAlign='right';
      ctx.fillText(`امتیاز: ${score}`,W-15,25);
      ctx.textAlign='left';
      ctx.fillText(`مرحله: ${level}`,15,25);
      
      // Lives (hearts)
      ctx.textAlign='center';
      ctx.font='20px Arial';
      ctx.fillText('❤️'.repeat(lives),W/2,25);

      gameRef.current=requestAnimationFrame(loop);
    };

    loop();
    return()=>{
      canvas.removeEventListener('mousemove',moveHandler);
      canvas.removeEventListener('touchmove',moveHandler);
      canvas.removeEventListener('click',shoot);
      canvas.removeEventListener('touchstart',shoot);
    };
  },[bestScore,user.id]);

  useEffect(()=>{
    if(tab==='tools'&&toolsTab==='game'){
      const cleanup=startGame();
      return()=>{if(cleanup)cleanup();if(gameRef.current)cancelAnimationFrame(gameRef.current);};
    }
  },[tab,toolsTab,startGame]);

  const getExamScore=(examId)=>{
    const examAnswers=answers.filter(a=>String(a.exam_id)===String(examId));
    if(examAnswers.length===0)return null;
    const totalScore=examAnswers.reduce((s,a)=>s+parseFloat(a.score||0),0);
    const maxScore=examAnswers.reduce((s,a)=>s+parseFloat(a.max_score||0),0);
    const percentage=(totalScore/maxScore)*20;
    return {totalScore,maxScore,percentage:percentage.toFixed(2)};
  };

  const getAverage=()=>{
    const examScores=exams.map(ex=>getExamScore(ex.id)).filter(s=>s!==null);
    if(examScores.length===0)return 0;
    const avg=examScores.reduce((s,e)=>s+parseFloat(e.percentage),0)/examScores.length;
    return avg.toFixed(2);
  };

  useEffect(()=>{
    if(tab==='chart'&&chartReady){
      const ctx=document.getElementById('gradeChart');if(!ctx)return;
      if(window.myChart)window.myChart.destroy();
      const examData=exams.map(ex=>{
        const score=getExamScore(ex.id);
        return score?{title:ex.title.substring(0,15),score:parseFloat(score.percentage)}:null;
      }).filter(d=>d!==null);
      if(examData.length===0)return;
      const gradient=ctx.getContext('2d').createLinearGradient(0,0,0,300);
      gradient.addColorStop(0,'rgba(129,140,248,0.4)');gradient.addColorStop(1,'rgba(129,140,248,0)');
      window.myChart=new Chart(ctx,{type:'line',data:{labels:examData.map(d=>d.title),datasets:[{label:'نمره از 20',data:examData.map(d=>d.score),borderColor:'#818cf8',backgroundColor:gradient,borderWidth:3,tension:0.4,fill:true,pointBackgroundColor:'#f472b6',pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:6,pointHoverRadius:9}]},options:{responsive:true,plugins:{legend:{labels:{color:'white',font:{family:'Vazirmatn'}}}},scales:{y:{ticks:{color:'rgba(255,255,255,0.5)',font:{family:'Vazirmatn'}},grid:{color:'rgba(255,255,255,0.05)'},beginAtZero:true,max:20},x:{ticks:{color:'rgba(255,255,255,0.5)',font:{family:'Vazirmatn'}},grid:{color:'rgba(255,255,255,0.03)'}}}}});
    }
  },[tab,chartReady,answers,exams]);

  if(activeExam){
    const q=activeExam.questions[currentQ];const progress=((currentQ+1)/activeExam.questions.length)*100;
    return(
      <div className="min-h-screen">
        <div className="header">
          <div className="flex justify-between items-center mb-3">
            <div><h2 className="font-bold">{activeExam.title}</h2><p className="text-[11px] text-white/30 mt-1">سوال {currentQ+1} از {activeExam.questions.length}</p></div>
            <CircularTimer timeLeft={timeLeft} totalTime={totalTime}/>
          </div>
          <div className="w-full bg-white/5 rounded-full h-1.5"><div className="bg-gradient-to-r from-indigo-500 to-pink-500 h-1.5 rounded-full transition-all duration-500" style={{width:`${progress}%`}}></div></div>
        </div>
        {timeLeft<300&&timeLeft>0&&<div className="bg-red-500/15 text-red-300 p-3 text-center text-sm font-bold animate-pulse border-b border-red-500/20">⚠️ کمتر از ۵ دقیقه!</div>}
        <div className="content">
          <div className="glass p-5 fade-in">
            <div className="flex justify-between items-center mb-3">
              <span className={`badge ${q?.q_type==='test'?'badge-new':'badge-approved'}`}>{q?.q_type==='test'?'تستی':'تشریحی'}</span>
              <span className="badge badge-new">نمره: {q?.score||1}</span>
            </div>
            {q?.image_url&&<img src={q.image_url} alt="" className="w-full rounded-xl mb-4 max-h-48 object-contain bg-black/20 border border-white/5"/>}
            <p className="mb-5 font-bold leading-relaxed">{q?.q_text}</p>
            {q?.q_type==='test'?(
              <div className="space-y-2">
                {['A','B','C','D'].map(opt=>(
                  <div key={opt} className={`glass p-3 cursor-pointer transition-all ${studentAnswers[q.id]===opt?'border-indigo-500 bg-indigo-500/15':''}`} onClick={()=>setStudentAnswers({...studentAnswers,[q.id]:opt})}>
                    <div className="flex items-center gap-3">
                      <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center font-bold text-sm ${studentAnswers[q.id]===opt?'bg-indigo-600 border-indigo-600':'border-white/20'}`}>{opt}</div>
                      <span className="flex-1 text-sm">{q[`opt_${opt.toLowerCase()}`]}</span>
                      {studentAnswers[q.id]===opt&&<Icon d={Icons.check} size={18} className="text-indigo-400"/>}
                    </div>
                  </div>
                ))}
              </div>
            ):(<textarea className="glass-input" placeholder="پاسخ..." value={studentAnswers[q.id]||''} onChange={e=>setStudentAnswers({...studentAnswers,[q.id]:e.target.value})} rows="5"/>)}
          </div>
          <div className="flex gap-2 mt-4">
            {currentQ>0&&<button onClick={()=>setCurrentQ(currentQ-1)} className="btn-glass bg-white/5 flex-1">قبلی</button>}
            {currentQ<activeExam.questions.length-1?<button onClick={()=>setCurrentQ(currentQ+1)} className="btn-glass flex-1">بعدی</button>:<button onClick={()=>{if(confirm('ثبت نهایی؟'))submitExam();}} className="btn-glass btn-glass-success flex-1">ثبت نهایی</button>}
          </div>
        </div>
      </div>
    );
  }

  return(
    <div className="min-h-screen pb-24">
      <div className="header flex justify-between items-center">
        <div><h1 className="text-lg font-bold gradient-text">پنل دانش‌آموز</h1><p className="text-xs text-white/30 mt-1">{user.full_name}</p></div>
        <button onClick={onLogout} className="p-2.5 bg-white/5 rounded-xl"><Icon d={Icons.logout} size={18}/></button>
      </div>
      <div className="content">
        {tab==='home'&&(
          <>
            <div className="glass p-6 text-center mb-6 slide-up">
              <Icon d={Icons.award} size={32} className="mx-auto mb-2 text-amber-400"/>
              <p className="text-4xl font-black gradient-text">{getAverage()}</p>
              <p className="text-xs text-white/40">معدل کل از 20</p>
            </div>
            <h3 className="font-bold mb-3 text-white/60 text-sm">آزمون‌ها ({exams.length})</h3>
            {exams.length===0&&<div className="card text-center py-10 text-white/30">آزمونی نیست</div>}
            {exams.map(ex=>{
              const taken=hasTakenExam(ex.id);
              const score=getExamScore(ex.id);
              return(
                <div key={ex.id} className={`card slide-up ${taken?'disabled':''}`}>
                  <h4 className="font-bold">{ex.title}</h4>
                  <p className="text-xs text-white/40 mt-1 mb-2">{ex.description||'بدون توضیحات'}</p>
                  <div className="flex gap-2 mb-3 flex-wrap">
                    <span className="badge badge-new">{ex.duration_minutes} دقیقه</span>
                    <span className="badge badge-approved">{ex.questions?.length||0} سوال</span>
                    {score&&<span className="badge badge-approved">نمره: {score.percentage}/20</span>}
                    {taken&&<span className="badge badge-taken">✓ شرکت کرده‌اید</span>}
                  </div>
                  {taken?(
                    <div className="space-y-2">
                      <div className="text-center py-2 text-gray-400 text-xs font-bold bg-gray-500/10 rounded-xl border border-gray-500/20">
                        ⚠️ شما قبلاً در این آزمون شرکت کرده‌اید
                      </div>
                      <button onClick={()=>setShowExamResults(ex.id)} className="btn-glass text-sm">مشاهده نتایج</button>
                    </div>
                  ):(
                    <button onClick={()=>startExam(ex)} className="btn-glass text-sm">شروع آزمون</button>
                  )}
                </div>
              );
            })}
          </>
        )}
        {tab==='grades'&&(
          <>
            <h3 className="font-bold mb-3 text-white/60 text-sm">نمرات</h3>
            {exams.length===0&&<div className="card text-center py-10 text-white/30">آزمونی نیست</div>}
            {exams.map(ex=>{
              const score=getExamScore(ex.id);
              if(!score)return null;
              const hasObjection=answers.some(a=>a.exam_id===ex.id&&a.objection);
              return(
                <div key={ex.id} className="card">
                  <div className="flex justify-between items-start mb-2">
                    <div className="flex-1 min-w-0"><h4 className="font-bold text-sm">{ex.title}</h4><p className="text-[11px] text-white/30 mt-1">{ex.questions?.length||0} سوال</p></div>
                    <div className="text-left shrink-0 mr-3"><p className="text-2xl font-black gradient-text">{score.percentage}/20</p><p className="text-[11px] text-white/40">{score.totalScore}/{score.maxScore}</p></div>
                  </div>
                  {hasObjection&&<div className="bg-amber-500/10 border border-amber-500/20 rounded-xl p-2.5 text-xs text-amber-300 mt-2">اعتراض در حال بررسی</div>}
                  {!hasObjection&&(<button onClick={()=>{setSelectedExamForObjection(ex.id);setShowObjection(true);}} className="btn-glass btn-glass-danger mt-3 text-sm flex items-center justify-center gap-2"><Icon d={Icons.alert} size={16}/>اعتراض به این آزمون</button>)}
                </div>
              );
            })}
          </>
        )}
        {tab==='chart'&&(
          <>
            <div className="glass p-6 text-center mb-6 slide-up"><Icon d={Icons.chart} size={32} className="mx-auto mb-2 text-indigo-400"/><p className="text-4xl font-black gradient-text">{getAverage()}</p><p className="text-xs text-white/40">معدل کل از 20</p></div>
            <div className="glass-strong p-4 mb-4">
              <h3 className="font-bold mb-3 text-center text-sm">نمودار پیشرفت</h3>
              {exams.filter(ex=>getExamScore(ex.id)).length===0?<p className="text-center text-white/30 py-8">نمره‌ای نیست</p>:<canvas id="gradeChart"></canvas>}
            </div>
            {!chartReady&&exams.filter(ex=>getExamScore(ex.id)).length>0&&<button onClick={()=>setChartReady(true)} className="btn-glass">نمایش نمودار</button>}
          </>
        )}
        {tab==='tools'&&(
          <>
            <div className="grid grid-cols-2 gap-4 mb-6">
              <div className={`tool-btn calc ${toolsTab==='calc'?'active':''}`} onClick={()=>setToolsTab('calc')}>
                <div className="tool-icon"><Icon d={Icons.calc} size={28}/></div>
                <div className="tool-label">ماشین‌حساب</div>
              </div>
              <div className={`tool-btn check ${toolsTab==='checklist'?'active':''}`} onClick={()=>setToolsTab('checklist')}>
                <div className="tool-icon"><Icon d={Icons.check} size={28}/></div>
                <div className="tool-label">چک‌لیست</div>
              </div>
              <div className={`tool-btn plan ${toolsTab==='planner'?'active':''}`} onClick={()=>setToolsTab('planner')}>
                <div className="tool-icon"><Icon d={Icons.calendar} size={28}/></div>
                <div className="tool-label">برنامه‌ریزی</div>
              </div>
              <div className={`tool-btn game ${toolsTab==='game'?'active':''}`} onClick={()=>setToolsTab('game')}>
                <div className="tool-icon"><Icon d={Icons.game} size={28}/></div>
                <div className="tool-label">بازی</div>
              </div>
            </div>

            {toolsTab==='calc'&&(
              <div className="glass-strong p-5 max-w-xs mx-auto slide-up">
                <div className="bg-black/40 p-4 rounded-xl text-3xl text-left mb-4 font-mono h-20 flex items-center justify-end border border-white/5 overflow-x-auto">{calcDisplay||'0'}</div>
                <div className="grid grid-cols-4 gap-2">
                  {['7','8','9','÷','4','5','6','×','1','2','3','−','C','0','=','+'].map(b=>(
                    <button key={b} onClick={()=>calcPress(b)} className={`btn-glass h-14 text-lg font-bold ${['/','*','-','+'].includes(b)?'bg-indigo-600/30 border-indigo-500/30':''} ${b==='='?'btn-glass-success':''} ${b==='C'?'btn-glass-danger':''}`}>{b}</button>
                  ))}
                </div>
              </div>
            )}

            {toolsTab==='checklist'&&(
              <div className="space-y-3 slide-up">
                <div className="flex gap-2">
                  <input className="glass-input flex-1" placeholder="کار جدید..." value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTask()}/>
                  <button onClick={addTask} className="btn-glass btn-glass-success btn-sm"><Icon d={Icons.plus} size={16}/></button>
                </div>
                {checklist.length===0&&<p className="text-center text-white/30 py-8">خالی است</p>}
                {checklist.map(t=>(
                  <div key={t.id} className="glass p-3 flex items-center gap-3">
                    <button onClick={()=>toggleTask(t.id,t.is_done)} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 transition-all ${t.is_done?'bg-emerald-500 border-emerald-500':'border-white/20'}`}>{t.is_done&&<Icon d={Icons.check} size={12}/>}</button>
                    <span className={`flex-1 text-sm ${t.is_done?'line-through text-white/30':''}`}>{t.title}</span>
                    <button onClick={()=>deleteTask(t.id)} className="text-red-400/60 hover:text-red-400"><Icon d={Icons.trash} size={16}/></button>
                  </div>
                ))}
              </div>
            )}

            {toolsTab==='planner'&&(
              <div className="space-y-3 slide-up">
                <div className="glass p-4 space-y-3">
                  <select className="glass-input" value={newPlan.day} onChange={e=>setNewPlan({...newPlan,day:e.target.value})}>{['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'].map(d=><option key={d}>{d}</option>)}</select>
                  <input className="glass-input" placeholder="درس (مثال: ریاضی)" value={newPlan.subject} onChange={e=>setNewPlan({...newPlan,subject:e.target.value})}/>
                  <input className="glass-input" placeholder="ساعت (مثال: 16-18)" value={newPlan.time} onChange={e=>setNewPlan({...newPlan,time:e.target.value})}/>
                  <button onClick={addPlan} className="btn-glass btn-glass-success text-sm">افزودن</button>
                </div>
                {studyPlans.length===0&&<p className="text-center text-white/30 py-4">برنامه‌ای نیست</p>}
                {studyPlans.map(p=>(
                  <div key={p.id} className="glass p-3 flex items-center justify-between">
                    <div><span className="badge badge-new mb-1">{p.day_of_week}</span><p className="font-bold text-sm">{p.subject}</p><p className="text-[11px] text-white/40">{p.time_range}</p></div>
                    <button onClick={()=>deletePlan(p.id)} className="text-red-400/60"><Icon d={Icons.trash} size={16}/></button>
                  </div>
                ))}
              </div>
            )}

            {toolsTab==='game'&&(
 <div className="slide-up">
   <div className="glass p-5 text-center mb-4"><div className="text-5xl mb-2">🎮</div><h3 className="text-xl font-black">باشگاه بازی</h3><p className="text-xs text-white/40 mt-1">بازی را انتخاب کن؛ بدون پایین رفتن صفحه.</p></div>
   <button className="btn-glass w-full py-4 mb-4" onClick={()=>setShowGameCenter(true)}>🎮 انتخاب و شروع بازی</button>
   {showGameCenter&&<GameCenterPro onClose={()=>setShowGameCenter(false)}/>}
 </div>
)}

            <div className="mt-6 glass p-4 text-center">
              <button onClick={changeMyPassword} className="btn-glass flex items-center justify-center gap-2 text-sm"><Icon d={Icons.key} size={16}/>تغییر رمز عبور</button>
              <p className="text-[11px] text-white/30 mt-2">مدیر نیز رمز جدید شما را مشاهده می‌کند</p>
            </div>
          </>
        )}
      </div>
      <div className="nav-bar">
        <div className={`nav-item ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==='grades'?'active':''}`} onClick={()=>setTab('grades')}><Icon d={Icons.grade}/><span>نمرات</span></div>
        <div className={`nav-item ${tab==='chart'?'active':''}`} onClick={()=>setTab('chart')}><Icon d={Icons.chart}/><span>کارنامه</span></div>
        <div className={`nav-item ${tab==='tools'?'active':''}`} onClick={()=>{setTab('tools');setToolsTab('calc');}}><Icon d={Icons.list}/><span>ابزارها</span></div>
      </div>

      <button onClick={()=>setShowChat(true)} className="fixed bottom-24 left-4 w-14 h-14 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/40 z-40">
        <Icon d={Icons.message} size={24}/>
      </button>

      {showChat&&(
        <div className="modal-overlay" onClick={()=>setShowChat(false)}>
          <div className="glass-strong w-full max-w-md h-[70vh] flex flex-col p-4 slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-3 pb-2 border-b border-white/5">
              <h3 className="font-bold gradient-text">پیام به مدیر</h3>
              <button onClick={()=>setShowChat(false)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button>
            </div>
            <div className="flex-1 overflow-y-auto mb-3 space-y-1">
              {messages.length===0&&<p className="text-center text-white/30 mt-10">هنوز پیامی نداده‌اید</p>}
              {messages.map(m=>(
                <div key={m.id} className={`chat-bubble ${m.sender_id===user.id?'me':'other'}`}>{m.content}</div>
              ))}
            </div>
            <div className="flex gap-2">
              <input className="glass-input flex-1 text-sm" placeholder="پیام شما..." value={chatText} onChange={e=>setChatText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendChat()}/>
              <button onClick={sendChat} className="btn-glass btn-glass-success btn-sm"><Icon d={Icons.send} size={16}/></button>
            </div>
          </div>
        </div>
      )}

      {showObjection&&(
        <div className="modal-overlay" onClick={()=>setShowObjection(null)}>
          <div className="glass-strong w-full max-w-md p-6 slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4"><h3 className="font-bold gradient-text">اعتراض به آزمون</h3><button onClick={()=>setShowObjection(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button></div>
            <div className="bg-amber-500/10 border border-amber-500/20 rounded-xl p-3 mb-4 text-xs text-amber-300">فقط یکبار می‌توانید اعتراض بزنید</div>
            <textarea className="glass-input mb-4" placeholder="دلیل اعتراض..." value={objectionText} onChange={e=>setObjectionText(e.target.value)} rows="4"/>
            <button onClick={submitObjection} className="btn-glass btn-glass-danger flex items-center justify-center gap-2"><Icon d={Icons.send} size={16}/>ارسال به مدیر</button>
          </div>
        </div>
      )}

      {showExamResults&&(
        <div className="modal-overlay" onClick={()=>setShowExamResults(null)}>
          <div className="glass-strong w-full max-w-lg p-6 max-h-[85vh] overflow-y-auto slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="font-bold gradient-text">نتایج آزمون</h3>
              <button onClick={()=>setShowExamResults(null)} className="p-2 bg-white/5 rounded-xl"><Icon d={Icons.x} size={18}/></button>
            </div>
            {(()=>{
              const exam=exams.find(e=>e.id===showExamResults);
              if(!exam)return null;
              const score=getExamScore(exam.id);
              const examAnswers=answers.filter(a=>a.exam_id===exam.id);
              return(
                <>
                  <div className="glass p-4 mb-4 text-center">
                    <h4 className="font-bold mb-2">{exam.title}</h4>
                    <p className="text-3xl font-black gradient-text">{score.percentage}/20</p>
                    <p className="text-xs text-white/40 mt-1">{score.totalScore} از {score.maxScore}</p>
                  </div>
                  <h4 className="font-bold text-sm mb-3 text-white/70">جزئیات سوالات:</h4>
                  {examAnswers.map((a,idx)=>{
                    const q=exam.questions.find(qq=>qq.id===a.question_id);
                    if(!q)return null;
                    const isCorrect=q.q_type==='test'&&a.student_answer===q.correct_opt;
                    const isWrong=q.q_type==='test'&&a.student_answer&&a.student_answer!==q.correct_opt;
                    return(
                      <div key={a.id} className={`glass p-3 mb-2 ${isWrong?'border-red-500/30':isCorrect?'border-emerald-500/30':''}`}>
                        <div className="flex justify-between items-start mb-2">
                          <span className="text-xs text-white/40">سوال {idx+1}</span>
                          <span className={`badge ${a.status==='graded'?'badge-approved':'badge-pending'}`}>{a.status==='graded'?'تصحیح شده':'در انتظار تصحیح مدیر'}</span>
                        </div>
                        <p className="text-sm mb-2">{q.q_text}</p>
                        {q.q_type==='test'?(
                          <div className="space-y-1 text-xs">
                            {isWrong&&(
                              <>
                                <div className="bg-red-500/10 border border-red-500/20 rounded-lg p-2">
                                  <span className="text-red-300">پاسخ شما: {a.student_answer}</span>
                                </div>
                                <div className="bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-2">
                                  <span className="text-emerald-300">پاسخ صحیح: {q.correct_opt}</span>
                                </div>
                              </>
                            )}
                            {isCorrect&&(
                              <div className="bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-2">
                                <span className="text-emerald-300">✓ پاسخ صحیح: {a.student_answer}</span>
                              </div>
                            )}
                          </div>
                        ):(
                          <div className="text-xs">
                            <p className="text-white/40 mb-1">پاسخ شما:</p>
                            <p className="bg-white/5 p-2 rounded">{a.student_answer||'بدون پاسخ'}</p>
                          </div>
                        )}
                        <div className="flex justify-between items-center mt-2 pt-2 border-t border-white/5">
                          <span className="text-xs text-white/40">نمره: {q.score||1}</span>
                          <span className="text-sm font-bold gradient-text">کسب شده: {a.score||0}</span>
                        </div>
                      </div>
                    );
                  })}
                </>
              );
            })()}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
