<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<title>سامانه هوشمند آموزشی تدبیر</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{font-family:'Vazirmatn',sans-serif;margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0a1a;min-height:100vh;color:#fff;overflow-x:hidden;font-weight:400}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(99,102,241,0.15),transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(236,72,153,0.1),transparent 60%),radial-gradient(ellipse at 50% 50%,rgba(14,165,233,0.08),transparent 60%);pointer-events:none;z-index:0}

.glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.05)}
.glass-strong{background:rgba(15,15,35,0.85);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,0.15);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.08)}
.glass-input{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;color:#fff;font-size:14px;width:100%;outline:none;transition:all 0.3s}
.glass-input:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,0.15)}
.glass-input::placeholder{color:rgba(255,255,255,0.3)}

.btn-glass{background:linear-gradient(135deg,rgba(99,102,241,0.25),rgba(168,85,247,0.25));backdrop-filter:blur(12px);border:1px solid rgba(129,140,248,0.35);color:#fff;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:all 0.3s;position:relative;overflow:hidden}
.btn-glass::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);transition:left 0.5s}
.btn-glass:hover::before{left:100%}
.btn-glass:hover{border-color:rgba(129,140,248,0.6);box-shadow:0 0 25px rgba(99,102,241,0.3)}
.btn-glass:active{transform:scale(0.97)}
.btn-glass:disabled{opacity:0.5;cursor:not-allowed}
.btn-glass-success{background:linear-gradient(135deg,rgba(16,185,129,0.3),rgba(5,150,105,0.3));border-color:rgba(52,211,153,0.4)}
.btn-glass-danger{background:linear-gradient(135deg,rgba(239,68,68,0.3),rgba(220,38,38,0.3));border-color:rgba(248,113,113,0.4)}
.btn-glass-warning{background:linear-gradient(135deg,rgba(245,158,11,0.3),rgba(217,119,6,0.3));border-color:rgba(251,191,36,0.4)}
.btn-sm{padding:10px 16px;font-size:13px;width:auto;border-radius:12px}

.tool-btn{background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.08);border-radius:24px;padding:24px 16px;text-align:center;cursor:pointer;transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);position:relative;overflow:hidden}
.tool-btn::before{content:'';position:absolute;inset:0;border-radius:24px;opacity:0;transition:opacity 0.5s}
.tool-btn:hover::before,.tool-btn.active::before{opacity:1}
.tool-btn.active{transform:translateY(-8px) scale(1.05);border-color:transparent}
.tool-btn.calc::before{background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(168,85,247,0.15))}
.tool-btn.calc.active{box-shadow:0 12px 40px rgba(99,102,241,0.4),0 0 80px rgba(99,102,241,0.2)}
.tool-btn.check::before{background:linear-gradient(135deg,rgba(16,185,129,0.2),rgba(52,211,153,0.15))}
.tool-btn.check.active{box-shadow:0 12px 40px rgba(16,185,129,0.4),0 0 80px rgba(16,185,129,0.2)}
.tool-btn.plan::before{background:linear-gradient(135deg,rgba(245,158,11,0.2),rgba(251,191,36,0.15))}
.tool-btn.plan.active{box-shadow:0 12px 40px rgba(245,158,11,0.4),0 0 80px rgba(245,158,11,0.2)}
.tool-btn.game::before{background:linear-gradient(135deg,rgba(236,72,153,0.2),rgba(244,114,182,0.15))}
.tool-btn.game.active{box-shadow:0 12px 40px rgba(236,72,153,0.4),0 0 80px rgba(236,72,153,0.2)}
.tool-icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;position:relative;z-index:1;transition:all 0.5s}
.tool-btn:hover .tool-icon,.tool-btn.active .tool-icon{transform:scale(1.15) rotate(5deg)}
.tool-btn.calc .tool-icon{background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 6px 20px rgba(99,102,241,0.5)}
.tool-btn.check .tool-icon{background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 6px 20px rgba(16,185,129,0.5)}
.tool-btn.plan .tool-icon{background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 6px 20px rgba(245,158,11,0.5)}
.tool-btn.game .tool-icon{background:linear-gradient(135deg,#ec4899,#f472b6);box-shadow:0 6px 20px rgba(236,72,153,0.5)}
.tool-label{font-size:14px;font-weight:800;position:relative;z-index:1}

.fade-in{animation:fadeIn 0.4s ease-out}
.slide-up{animation:slideUp 0.5s cubic-bezier(0.16,1,0.3,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:16px;margin-bottom:12px;transition:all 0.3s}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,0.3);border-color:rgba(129,140,248,0.2)}
.card.disabled{opacity:0.6;pointer-events:none}

.header{position:sticky;top:0;z-index:40;background:rgba(10,10,26,0.9);backdrop-filter:blur(30px);border-bottom:1px solid rgba(255,255,255,0.06);padding:16px 20px}
.content{padding:16px;padding-bottom:100px;max-width:600px;margin:0 auto;position:relative;z-index:1}

.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.badge-pending{background:rgba(251,146,60,0.15);color:#fb923c;border:1px solid rgba(251,146,60,0.25)}
.badge-approved{background:rgba(52,211,153,0.15);color:#34d399;border:1px solid rgba(52,211,153,0.25)}
.badge-new{background:rgba(129,140,248,0.15);color:#818cf8;border:1px solid rgba(129,140,248,0.25)}
.badge-taken{background:rgba(107,114,128,0.2);color:#9ca3af;border:1px solid rgba(107,114,128,0.3)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.gradient-text{background:linear-gradient(135deg,#818cf8,#c084fc,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Timer Circle with Glow */
.timer-circle-glow{position:relative;width:90px;height:90px}
.timer-circle-glow svg{transform:rotate(-90deg);filter:drop-shadow(0 0 12px rgba(129,140,248,0.6))}
.timer-circle-glow circle{fill:none;stroke-width:7}
.timer-circle-glow .bg{stroke:rgba(255,255,255,0.08)}
.timer-circle-glow .progress{stroke-linecap:round;transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 8px currentColor)}
.timer-text-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}

.game-canvas{border-radius:20px;border:2px solid rgba(129,140,248,0.2);width:100%;max-width:380px;margin:0 auto;display:block;touch-action:none;background:linear-gradient(180deg,rgba(15,15,35,0.95),rgba(10,10,26,0.98));box-shadow:0 8px 40px rgba(99,102,241,0.2)}

.nav-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,26,0.95);backdrop-filter:blur(30px);border-top:1px solid rgba(255,255,255,0.06);padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:50}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;border-radius:14px;color:rgba(255,255,255,0.35);font-size:10px;cursor:pointer;transition:all 0.3s}
.nav-item.active{color:#818cf8;background:rgba(129,140,248,0.1)}
.nav-item.active svg{filter:drop-shadow(0 0 8px rgba(129,140,248,0.6))}
.nav-item svg{width:22px;height:22px}

.chat-bubble{padding:12px 16px;border-radius:18px;max-width:82%;margin-bottom:10px;font-size:13px;line-height:1.7;word-break:break-word;position:relative;animation:chatIn 0.35s cubic-bezier(0.16,1,0.3,1);box-shadow:0 4px 15px rgba(0,0,0,0.2)}
.chat-bubble.me{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-bottom-left-radius:4px;margin-right:auto}
.chat-bubble.other{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.08);border-bottom-right-radius:4px;margin-left:auto}
.chat-bubble.edited::after{content:' ✏️';font-size:9px;opacity:0.5}
.chat-bubble.deleting{animation:chatOut 0.3s ease-out forwards}
@keyframes chatIn{from{opacity:0;transform:translateY(10px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes chatOut{to{opacity:0;transform:scale(0.8)}}

.chat-actions{display:flex;gap:4px;margin-top:6px;opacity:0;transition:opacity 0.2s}
.chat-bubble:hover .chat-actions{opacity:1}
.chat-action-btn{background:rgba(0,0,0,0.3);border:none;color:white;padding:4px 8px;border-radius:8px;font-size:10px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:3px}
.chat-action-btn:hover{background:rgba(0,0,0,0.5);transform:scale(1.05)}

.reaction-bar{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.reaction-chip{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:3px 8px;font-size:12px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:4px}
.reaction-chip:hover{background:rgba(129,140,248,0.2);transform:scale(1.05)}
.reaction-chip.active{background:rgba(129,140,248,0.3);border-color:#818cf8}

.reaction-picker{position:absolute;bottom:100%;background:rgba(15,15,35,0.98);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:8px;display:flex;gap:4px;margin-bottom:8px;z-index:20;animation:popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 8px 30px rgba(0,0,0,0.5)}
@keyframes popIn{from{opacity:0;transform:scale(0.5) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.reaction-emoji-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all 0.2s;border:none}
.reaction-emoji-btn:hover{background:rgba(129,140,248,0.2);transform:scale(1.2)}

.emoji-picker{position:absolute;bottom:100%;left:0;background:rgba(15,15,35,0.98);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:12px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px;z-index:10;animation:popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 8px 30px rgba(0,0,0,0.5)}
.emoji-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all 0.2s;border:none}
.emoji-btn:hover{background:rgba(129,140,248,0.2);transform:scale(1.15)}

/* Star Rating - Enhanced */
.star-rating-container{display:flex;gap:3px;justify-content:center;margin:8px 0}
.star-item{width:32px;height:32px;transition:all 0.3s;filter:grayscale(100%) brightness(0.3)}
.star-item.active{filter:grayscale(0%) brightness(1);animation:starPulse 2s infinite}
.star-item.active svg{filter:drop-shadow(0 0 8px rgba(251,191,36,0.8))}
@keyframes starPulse{0%,100%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.1) rotate(-5deg)}75%{transform:scale(1.1) rotate(5deg)}}

/* Premium grade chart */
.chart-heartbeat{overflow:visible!important;isolation:isolate;animation:chartHeartbeat 2.25s cubic-bezier(.25,.8,.25,1) 1 both}
.chart-heartbeat::after{content:'';position:absolute;inset:8px;border-radius:20px;border:1px solid rgba(192,132,252,.14);box-shadow:0 0 0 rgba(192,132,252,0);animation:chartRing 2.25s ease-out 1 both;pointer-events:none}
@keyframes chartHeartbeat{0%{transform:scale(.985);box-shadow:0 0 0 rgba(168,85,247,0)}18%{transform:scale(1.012);box-shadow:0 0 38px rgba(168,85,247,.18)}34%{transform:scale(.995);box-shadow:0 0 12px rgba(236,72,153,.12)}52%{transform:scale(1.006);box-shadow:0 0 28px rgba(99,102,241,.16)}100%{transform:scale(1);box-shadow:0 20px 60px rgba(0,0,0,.3)}}
@keyframes chartRing{0%{opacity:.9;transform:scale(.94)}45%{opacity:.25;transform:scale(1.015)}100%{opacity:0;transform:scale(1.03)}}
.chart-orbit{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;filter:blur(.2px);opacity:.8;z-index:0}
.chart-orbit-a{top:16%;left:8%;background:#f472b6;box-shadow:0 0 18px rgba(244,114,182,.9);animation:orbitA 4.8s ease-in-out infinite}
.chart-orbit-b{right:10%;bottom:16%;background:#818cf8;box-shadow:0 0 18px rgba(129,140,248,.9);animation:orbitB 5.6s ease-in-out infinite}
@keyframes orbitA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(34px,12px) scale(1.45)}}
@keyframes orbitB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-28px,-15px) scale(1.35)}}
.grade-chart-shell{position:relative;min-height:370px;height:370px;padding:18px 8px 12px;overflow:visible;z-index:1}
.grade-chart-shell canvas{display:block;width:100%!important;height:330px!important;overflow:visible!important}
/* Premium snakes & ladders board */
.snake-pro-shell{background:radial-gradient(circle at 8% 4%,rgba(34,211,238,.16),transparent 28%),radial-gradient(circle at 96% 20%,rgba(244,114,182,.15),transparent 30%),linear-gradient(145deg,rgba(10,15,35,.98),rgba(25,18,48,.98));border:1px solid rgba(255,255,255,.12);border-radius:32px;padding:18px;box-shadow:0 30px 90px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden;position:relative}
.snake-pro-shell:before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 120deg,transparent,rgba(129,140,248,.08),transparent,rgba(236,72,153,.07),transparent);opacity:.7;pointer-events:none}
@keyframes snakeAurora{to{transform:rotate(360deg)}}
.snake-pro-head{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.snake-pro-head h3{font-size:22px;font-weight:1000;background:linear-gradient(90deg,#67e8f9,#a78bfa,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent;margin:2px 0}.snake-pro-head p{font-size:11px;color:rgba(255,255,255,.45);margin:4px 0}.snake-kicker{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.35);font-weight:900}.snake-live-pill{padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:10px;font-weight:900;white-space:nowrap;box-shadow:0 0 20px rgba(129,140,248,.1)}
.snake-status-row{position:relative;z-index:2;display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;gap:10px;margin-bottom:15px}.snake-turn-card{padding:12px 13px;border-radius:18px;background:linear-gradient(135deg,rgba(129,140,248,.14),rgba(236,72,153,.08));border:1px solid rgba(255,255,255,.08);font-size:11px;font-weight:800;text-align:center}.snake-roll-btn{border:0;border-radius:17px;padding:13px 10px;color:white;font-weight:900;background:linear-gradient(135deg,#6366f1,#ec4899);box-shadow:0 12px 30px rgba(99,102,241,.28);cursor:pointer;transition:.25s}.snake-roll-btn:hover:not(:disabled){transform:translateY(-2px) scale(1.02)}.snake-roll-btn:disabled{opacity:.4;cursor:not-allowed}.snake-dice-pro{display:flex;justify-content:center;align-items:center;perspective:1100px;width:92px;height:92px}.dice-cube{width:68px;height:68px;position:relative;transform-style:preserve-3d;transition:transform .25s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 18px 24px rgba(0,0,0,.42))}.dice-face3d{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#ffffff,#dbeafe 55%,#bfdbfe);border:2px solid rgba(255,255,255,.9);box-shadow:inset 5px 5px 12px rgba(255,255,255,.9),inset -7px -8px 15px rgba(59,130,246,.16);backface-visibility:hidden}.dice-face3d.front{transform:translateZ(34px)}.dice-face3d.back{transform:rotateY(180deg) translateZ(34px)}.dice-face3d.right{transform:rotateY(90deg) translateZ(34px)}.dice-face3d.left{transform:rotateY(-90deg) translateZ(34px)}.dice-face3d.top{transform:rotateX(90deg) translateZ(34px)}.dice-face3d.bottom{transform:rotateX(-90deg) translateZ(34px)}.dice-number{font-family:Vazirmatn,sans-serif;font-size:31px;font-weight:1000;color:#111827;text-shadow:0 2px 0 #fff,0 4px 8px rgba(15,23,42,.15)}.dice-rolling .dice-cube{animation:diceMegaRoll 1.35s cubic-bezier(.18,.82,.22,1)}.dice-value-1 .dice-cube{transform:rotateX(0deg) rotateY(0deg)}.dice-value-2 .dice-cube{transform:rotateY(-90deg)}.dice-value-3 .dice-cube{transform:rotateX(-90deg)}.dice-value-4 .dice-cube{transform:rotateY(90deg)}.dice-value-5 .dice-cube{transform:rotateX(90deg)}.dice-value-6 .dice-cube{transform:rotateY(180deg)}@keyframes diceMegaRoll{0%{transform:rotateX(0) rotateY(0) rotateZ(0) scale(.82)}18%{transform:rotateX(210deg) rotateY(155deg) rotateZ(45deg) scale(1.08)}38%{transform:rotateX(430deg) rotateY(310deg) rotateZ(-35deg) scale(.9)}60%{transform:rotateX(690deg) rotateY(520deg) rotateZ(28deg) scale(1.12)}78%{transform:rotateX(900deg) rotateY(700deg) rotateZ(-12deg) scale(.96)}100%{transform:rotateX(1080deg) rotateY(900deg) rotateZ(0) scale(1)}}
.snake-board-pro{position:relative;z-index:2;width:min(100%,650px);margin:0 auto;border-radius:25px;padding:10px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.12);box-shadow:0 25px 70px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1)}.snake-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;direction:ltr;position:relative;z-index:1}.snake-cell-pro{aspect-ratio:1;border-radius:9px;position:relative;display:flex;align-items:flex-start;justify-content:flex-end;padding:4px;background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(249,115,22,.08));border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px rgba(255,255,255,.08);font-size:9px;font-weight:1000;color:rgba(255,255,255,.78);overflow:visible}.snake-cell-pro:nth-child(3n){background:linear-gradient(135deg,rgba(56,189,248,.18),rgba(59,130,246,.08))}.snake-cell-pro:nth-child(4n){background:linear-gradient(135deg,rgba(167,139,250,.18),rgba(236,72,153,.08))}.snake-cell-pro:nth-child(5n){background:linear-gradient(135deg,rgba(52,211,153,.18),rgba(16,185,129,.08))}.snake-cell-pro span{position:relative;z-index:2;text-shadow:0 1px 4px #111}.snake-finish-cup{font-size:clamp(20px,4vw,34px);filter:drop-shadow(0 5px 8px rgba(250,204,21,.4));transform:translateY(3px)}.snake-cell-pro b{position:absolute;left:4px;bottom:4px;font-size:6px;letter-spacing:.5px;color:#fde68a}.start-cell{box-shadow:0 0 0 2px rgba(52,211,153,.4),inset 0 0 18px rgba(52,211,153,.16)}.finish-cell{box-shadow:0 0 0 2px rgba(250,204,21,.4),inset 0 0 18px rgba(250,204,21,.14)}.snake-art{position:absolute;inset:10px;z-index:2;width:calc(100% - 20px);height:calc(100% - 20px);pointer-events:none;overflow:visible}.snake-body{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 3px rgba(0,0,0,.58))}.snake-color-0{stroke:#34d399;fill:#10b981}.snake-color-1{stroke:#fb7185;fill:#e11d48}.snake-color-2{stroke:#a78bfa;fill:#7c3aed}.snake-h function gregorianToJalali(gy,gm,gd){
  var g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  var jy=(gy<=1600)?0:979;
  gy-=(gy<=1600)?621:1600;
  var gy2=(gm>2)?(gy+1):gy;
  var days=(365*gy)+~~((gy2+3)/4)-~~((gy2+99)/100)+~~((gy2+399)/400)-80+gd+g_d_m[gm-1];
  jy+=33*~~(days/12053);
  days%=12053;
  jy+=4*~~(days/1461);
  days%=1461;
  if(days>365){jy+=~~((days-1)/365);days=(days-1)%365;}
  var jm=(days<186)?1+~~(days/31):7+~~((days-186)/30);
  var jd=1+((days<186)?(days%31):((days-186)%30));
  return[jy,jm,jd];
}

function getJalaliMonthName(m){return['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'][m-1];}
function getJalaliDaysInMonth(jy,jm){if(jm<=6)return 31;if(jm<=11)return 30;const a=[1,5,9,13,17,22,26,30];return a.includes(jy%33)?30:29;}
function getFirstDayOfMonth(jy,jm){
  const today=new Date();
  const jToday=gregorianToJalali(today.getFullYear(),today.getMonth()+1,today.getDate());
  const diffDays=(jy-jToday[0])*365+(jm-jToday[1])*30;
  const firstG=new Date(today);
  firstG.setDate(firstG.getDate()-jToday[2]+1-diffDays);
  return(firstG.getDay()+1)%7;
}

  const getStars=()=>{
    if(score>=20)return 5;
    if(score>=18)return 4;

function PersianCalendar(){
  const today=new Date();
  const jToday=gregorianToJalali(today.getFullYear(),today.getMonth()+1,today.getDate());
  const [viewMonth,setViewMonth]=useState(jToday[1]);
  const [viewYear,setViewYear]=useState(jToday[0]);
  const [currentDate,setCurrentDate]=useState(jToday);
  useEffect(()=>{
    const interval=setInterval(()=>{
      const now=new Date();
      const newJToday=gregorianToJalali(now.getFullYear(),now.getMonth()+1,now.getDate());
      setCurrentDate(newJToday);
    },60000);
    return()=>clearInterval(interval);
  },[]);
  const daysInMonth=getJalaliDaysInMonth(viewYear,viewMonth);
  const firstDay=getFirstDayOfMonth(viewYear,viewMonth);
  const days=[];
  for(let i=0;i<firstDay;i++)days.push(null);
  for(let i=1;i<=daysInMonth;i++)days.push(i);
  const prevMonth=()=>{if(viewMonth===1){setViewMonth(12);setViewYear(viewYear-1);}else setViewMonth(viewMonth-1);};
  const nextMonth=()=>{if(viewMonth===12){setViewMonth(1);setViewYear(viewYear+1);}else setViewMonth(viewMonth+1);};
  const goToday=()=>{setViewMonth(currentDate[1]);setViewYear(currentDate[0]);};
  const isToday=(d)=>d===currentDate[2]&&viewMonth===currentDate[1]&&viewYear===currentDate[0];
  return(
    <div className="glass-strong p-5 slide-up">
      <div className="flex justify-between items-center mb-4">
        <button onClick={prevMonth} className="p-2 bg-white/5 rounded-xl hover:bg-white/10 transition"><Icon d="M9 18l6-6-6-6" size={18}/></button>
        <div className="text-center">
          <h3 className="font-black text-lg gradient-text">{getJalaliMonthName(viewMonth)} {viewYear}</h3>
          {!(viewMonth===currentDate[1]&&viewYear===currentDate[0])&&(<button onClick={goToday} className="text-[10px] text-indigo-400 mt-1 hover:underline">برو به امروز</button>)}
        </div>
        <button onClick={nextMonth} className="p-2 bg-white/5 rounded-xl hover:bg-white/10 transition"><Icon d="M15 18l-6-6 6-6" size={18}/></button>
      </div>
      <div className="calendar-header">{['ش','ی','د','س','چ','پ','ج'].map(d=><div key={d}>{d}</div>)}</div>
      <div className="calendar-grid">
        {days.map((d,i)=>(<div key={i} className={`calendar-day ${d===null?'other-month':''} ${isToday(d)?'today':''}`}>{d||''}</div>))}
      </div>
      <div className="mt-4 pt-4 border-t border-white/5 text-center">
        <p className="text-xs text-white/40">امروز</p>
        <p className="text-lg font-black gradient-text">{currentDate[2]} {getJalaliMonthName(currentDate[1])} {currentDate[0]}</p>
      </div>
    </div>
  );
}

function CircularTimerGlow({timeLeft,totalTime}){
  const r=38,c=2*Math.PI*r,p=(timeLeft/totalTime)*c;
  const m=Math.floor(timeLeft/60),s=timeLeft%60;
  const col=timeLeft<60?'#ef4444':timeLeft<300?'#f59e0b':'#818cf8';
  return(
    <div className="timer-circle-glow">
      <svg width="90" height="90">
        <circle className="bg" cx="45" cy="45" r={r}/>
        <circle className="progress" cx="45" cy="45" r={r} stroke={col} strokeDasharray={c} strokeDashoffset={c-p}/>
      </svg>
      <div className="timer-text-glow">
        <div className={`text-2xl font-black font-mono ${timeLeft<60?'text-red-400 animate-pulse':timeLeft<300?'text-amber-400':'text-white'}`}>{m}:{s<10?'0':''}{s}</div>
        <div className="text-[10px] text-white/40 mt-0.5">زمان باقی‌مانده</div>
      </div>
    </div>
  );
}

function checkXOWinner(board){
  const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(const [a,b,c] of lines){
    if(board[a]&&board[a]!=='-'&&board[a]===board[b]&&board[a]===board[c])return{winner:board[a],line:[a,b,c]};
  }
  if(board.every(cell=>cell!==''&&cell!=='-'))return{winner:'draw',line:null};
  return null;
}

function getSmartBotMove(board,botMark){
  const humanMark=botMark==='X'?'O':'X';
  if(Math.random()<0.25){
    const empty=[];
    for(let i=0;i<9;i++)if(board[i]===''||board[i]==='-')empty.push(i);
    if(board[4]===''&&Math.random()>0.5)return 4;
    return empty[Math.floor(Math.random()*empty.length)];
  }
  let bestScore=-Infinity;
  let bestMove=-1;
  const empty=[];
  for(let i=0;i<9;i++)if(board[i]===''||board[i]==='-')empty.push(i);
  for(const i of empty){
    const newBoard=[...board];
    newBoard[i]=botMark;
    const score=minimax(newBoard,0,false,botMark,humanMark,4);
    if(score>bestScore){bestScore=score;bestMove=i;}
  }
  return bestMove;
}

function minimax(board,depth,isMaximizing,botMark,humanMark,maxDepth){
  const result=checkXOWinner(board);
  if(result){
    if(result.winner===botMark)return 10-depth;
    if(result.winner===humanMark)return depth-10;
    return 0;
  }
  if(depth>=maxDepth)return 0;
  if(isMaximizing){
    let best=-Infinity;
    for(let i=0;i<9;i++){
      if(board[i]===''||board[i]==='-'){
        const newBoard=[...board];
        newBoard[i]=botMark;
        best=Math.max(best,minimax(newBoard,depth+1,false,botMark,humanMark,maxDepth));
      }
    }
    return best;
  }else{
    let best=Infinity;
    for(let i=0;i<9;i++){
      if(board[i]===''||board[i]==='-'){
        const newBoard=[...board];
        newBoard[i]=humanMark;
        best=Math.min(best,minimax(newBoard,depth+1,true,botMark,humanMark,maxDepth));
      }
    }
    return best;
  }
}

function XOGameHub({user}){
  const [mode,setMode]=useState(null);
  const [friendsGame,setFriendsGame]=useState(null);
  const [friendsList,setFriendsList]=useState([]);
  const [pendingRequests,setPendingRequests]=useState([]);
  const [myRequests,setMyRequests]=useState([]);
  const [showNotification,setShowNotification]=useState(null);
  const [requestTimers,setRequestTimers]=useState({});
  const [blockedUsers,setBlockedUsers]=useState({});
  const [lastRequestTime,setLastRequestTime]=useState({});
  const toast=useToast();

  useEffect(()=>{
    loadFriends();
    loadPendingRequests();
    loadMyRequests();
    const sub=SB.channel('game-requests-'+user.id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'game_requests',filter:`to_user=eq.${user.id}`},(payload)=>{
        loadPendingRequests();
        const newReq=payload.new;
        startRequestCountdown(newReq.id,60);
        setShowNotification({id:newReq.id,fromUserId:newReq.from_user,roomId:newReq.room_id,createdAt:new Date(newReq.created_at).getTime()});
        toast('🎮 درخواست بازی جدید!','success');
      })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'game_requests',filter:`from_user=eq.${user.id}`},(payload)=>{
        if(payload.new.status==='accepted'){
          setFriendsGame(payload.new.room_id);
          setMode('playing-online');
          toast('✅ درخواست پذیرفته شد! بازی شروع شد','success');
        }else if(payload.new.status==='rejected'||payload.new.status==='expired'){
          if(payload.new.status==='rejected'){
            const req=pendingRequests.find(r=>r.id===payload.new.id);
            if(req)blockUser(req.from_user,120);
          }
          toast(payload.new.status==='expired'?'⏰ زمان درخواست تمام شد':'❌ درخواست رد شد','warning');
        }
        loadMyRequests();
      })
      .subscribe();
    return()=>{SB.removeChannel(sub);};
  },[]);

  const startRequestCountdown=(requestId,duration)=>{
    const interval=setInterval(async()=>{
      const {data:req}=await SB.from('game_requests').select('*').eq('id',requestId).single();
      if(!req||req.status!=='pending'){clearInterval(interval);return;}
      const elapsed=Math.floor((Date.now()-new Date(req.created_at).getTime())/1000);
      const remaining=duration-elapsed;
      if(remaining<=0){
        await SB.from('game_requests').update({status:'expired'}).eq('id',requestId);
        clearInterval(interval);
        setRequestTimers(t=>{const n={...t};delete n[requestId];return n;});
        toast('⏰ زمان درخواست تمام شد','warning');
      }else{
        setRequestTimers(t=>({...t,[requestId]:remaining}));
      }
    },1000);
  };

  const blockUser=(userId,duration)=>{
    setBlockedUsers(b=>({...b,[userId]:Date.now()+duration*1000}));
    setTimeout(()=>{setBlockedUsers(b=>{const n={...b};delete n[userId];return n;});},duration*1000);
  };

  const loadFriends=async()=>{
    const {data}=await SB.from('users').select('id,full_name,username').eq('role','student').neq('id',user.id);
    if(data)setFriendsList(data);
  };
  const loadPendingRequests=async()=>{
    const {data}=await SB.from('game_requests').select('*,from_user_data:users!game_requests_from_user_fkey(full_name,username)').eq('to_user',user.id).eq('status','pending');
    if(data){
      setPendingRequests(data);
      data.forEach(req=>{
        const elapsed=Math.floor((Date.now()-new Date(req.created_at).getTime())/1000);
        const remaining=Math.max(0,60-elapsed);
        if(remaining>0)setRequestTimers(t=>({...t,[req.id]:remaining}));
      });
    }
  };
  const loadMyRequests=async()=>{
    const {data}=await SB.from('game_requests').select('*,to_user_data:users!game_requests_to_user_fkey(full_name,username)').eq('from_user',user.id).eq('status','pending');
    if(data)setMyRequests(data);
  };

  const sendRequest=async(toUserId)=>{
    const now=Date.now();
    const lastTime=lastRequestTime[toUserId]||0;
    if(now-lastTime<10000){
      const remaining=Math.ceil((10000-(now-lastTime))/1000);
      toast(`⏳ ${remaining} ثانیه دیگر می‌توانی درخواست بفرستی`,'warning');
      return;
    }
    if(blockedUsers[toUserId]&&blockedUsers[toUserId]>Date.now()){
      const remaining=Math.ceil((blockedUsers[toUserId]-Date.now())/1000);
      toast(`⏳ این کاربر تا ${remaining} ثانیه دیگر نمی‌تواند درخواست بفرستد`,'warning');
      return;
    }
    const {data:existingReq}=await SB.from('game_requests').select('id').eq('from_user',user.id).eq('to_user',toUserId).eq('status','pending').maybeSingle();
    if(existingReq){toast('⚠️ قبلاً درخواست فرستادی','warning');return;}
    const {data:room,error:rErr}=await SB.from('xo_rooms').insert({player_x:user.id,player_o:null,board:'---------',current_turn:'X',status:'waiting',score_x:0,score_o:0}).select().single();
    if(rErr){toast('خطا در ساخت اتاق: '+rErr.message,'error');return;}
    const {error:reqErr}=await SB.from('game_requests').insert({from_user:user.id,to_user:toUserId,room_id:room.id,status:'pending'});
    if(reqErr){await SB.from('xo_rooms').delete().eq('id',room.id);toast('خطا: '+reqErr.message,'error');return;}
    setLastRequestTime(t=>({...t,[toUserId]:now}));
    toast('✅ درخواست بازی ارسال شد','success');
    loadMyRequests();
  };

  const acceptRequest=async(request)=>{
    await SB.from('xo_rooms').update({player_o:user.id,status:'playing'}).eq('id',request.room_id);
    await SB.from('game_requests').update({status:'accepted'}).eq('id',request.id);
    setFriendsGame(request.room_id);
    setMode('playing-online');
    setShowNotification(null);
    setRequestTimers(t=>{const n={...t};delete n[request.id];return n;});
    toast('🎮 بازی شروع شد!','success');
  };

  const rejectRequest=async(request)=>{
    await SB.from('game_requests').update({status:'rejected'}).eq('id',request.id);
    await SB.from('xo_rooms').delete().eq('id',request.room_id);
    loadPendingRequests();
    setShowNotification(null);
    setRequestTimers(t=>{const n={...t};delete n[request.id];return n;});
    blockUser(request.from_user,120);
    toast('درخواست رد شد','warning');
  };

  const cancelRequest=async(request)=>{
    await SB.from('game_requests').update({status:'rejected'}).eq('id',request.id);
    await SB.from('xo_rooms').delete().eq('id',request.room_id);
    loadMyRequests();
    toast('درخواست لغو شد','warning');
  };

  const endOnlineGame=async()=>{
    if(friendsGame){await SB.from('xo_rooms').delete().eq('id',friendsGame);setFriendsGame(null);}
    setMode(null);
  };

  if(mode==='bot')return <XOBotGame user={user} onBack={()=>setMode(null)}/>;
  if(mode==='playing-online')return <XOOnlineGame user={user} roomId={friendsGame} onEnd={endOnlineGame}/>;
  
  if(mode==='friends')return(
    <div className="slide-up">
      <div className="xo-mode-selection mb-4">
        <div className="flex justify-between items-center mb-4">
          <button onClick={()=>setMode(null)} className="btn-glass btn-sm flex items-center gap-2"><Icon d={Icons.arrowLeft} size={16}/>بازگشت</button>
          <h3 className="font-bold gradient-text text-lg">👥 بازی با دوستان</h3>
          <div className="w-20"></div>
        </div>
        {pendingRequests.length>0&&(
          <div className="glass p-4 mb-4">
            <h4 className="font-bold text-sm mb-3 text-pink-400">🔔 درخواست‌های دریافتی</h4>
            {pendingRequests.map(r=>(
              <div key={r.id} className="bg-white/5 rounded-xl p-3 mb-2">
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-full bg-gradient-to-br from-pink-500 to-rose-500 flex items-center justify-center font-bold">{r.from_user_data?.full_name?.[0]}</div>
                    <div><p className="font-bold text-sm">{r.from_user_data?.full_name}</p><p className="text-[11px] text-white/40">دعوتت کرده به بازی 🎮</p></div>
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={()=>acceptRequest(r)} className="btn-glass btn-glass-success btn-sm flex-1">✓ قبول</button>
                  <button onClick={()=>rejectRequest(r)} className="btn-glass btn-glass-danger btn-sm flex-1">✗ رد</button>
                </div>
              </div>
            ))}
          </div>
        )}
        {myRequests.length>0&&(
          <div className="glass p-4 mb-4">
            <h4 className="font-bold text-sm mb-3 text-amber-400">⏳ در انتظار پاسخ</h4>
            {myRequests.map(r=>(
              <div key={r.id} className="bg-white/5 rounded-xl p-3 mb-2 flex items-center justify-between">
                <div><p className="font-bold text-sm">{r.to_user_data?.full_name}</p><p className="text-[11px] text-white/40">در انتظار پاسخ...</p></div>
                <button onClick={()=>cancelRequest(r)} className="btn-glass btn-glass-danger btn-sm">لغو</button>
              </div>
            ))}
          </div>
        )}
        <div className="glass p-4">
          <h4 className="font-bold text-sm mb-3 text-indigo-400">👥 ارسال درخواست</h4>
          {friendsList.length===0?<p className="text-center text-white/30 py-4">دانش‌آموز دیگری نیست</p>:
          friendsList.map(f=>{
            const isBlocked=blockedUsers[f.id]&&blockedUsers[f.id]>Date.now();
            const blockTime=isBlocked?Math.ceil((blockedUsers[f.id]-Date.now())/1000):0;
            const now=Date.now();
            const lastTime=lastRequestTime[f.id]||0;
            const cooldown=isBlocked?blockTime:Math.max(0,Math.ceil((10000-(now-lastTime))/1000));
            const isOnCooldown=cooldown>0;
            return(
              <div key={f.id} className="bg-white/5 rounded-xl p-3 mb-2 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center font-bold">{f.full_name[0]}</div>
                  <div><p className="font-bold text-sm">{f.full_name}</p><p className="text-[11px] text-white/40">@{f.username}</p></div>
                </div>
                <button onClick={()=>sendRequest(f.id)} disabled={isOnCooldown} className={`send-request-btn ${isOnCooldown?'cooldown':''}`}>{isOnCooldown?`⏳ ${cooldown}s`:'📩 ارسال درخواست'}</button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );

  return(
    <div className="slide-up">
      <div className="xo-mode-selection">
        <h3 className="xo-mode-title">🎮 بازی دوز</h3>
        <p className="xo-mode-subtitle">یک حالت بازی انتخاب کن</p>
