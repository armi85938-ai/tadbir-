<style>
*{font-family:'Vazirmatn',sans-serif;margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0a1a;min-height:100vh;color:#fff;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(99,102,241,0.15),transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(236,72,153,0.1),transparent 60%),radial-gradient(ellipse at 50% 50%,rgba(14,165,233,0.08),transparent 60%);pointer-events:none;z-index:0}

.glass{background:rgba(255,255,255,0.04);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.08);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.glass-strong{background:rgba(15,15,35,0.85);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,0.12);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.glass-input{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;color:#fff;font-size:14px;width:100%;outline:none;transition:all 0.3s}
.glass-input:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,0.15)}
.glass-input::placeholder{color:rgba(255,255,255,0.3)}

.btn-glass{background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(168,85,247,0.2));backdrop-filter:blur(12px);border:1px solid rgba(129,140,248,0.3);color:#fff;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:all 0.3s;position:relative;overflow:hidden}
.btn-glass:hover{border-color:rgba(129,140,248,0.6);box-shadow:0 0 20px rgba(99,102,241,0.2)}
.btn-glass:active{transform:scale(0.97)}
.btn-glass:disabled{opacity:0.5;cursor:not-allowed;pointer-events:none}
.btn-glass-success{background:linear-gradient(135deg,rgba(16,185,129,0.25),rgba(5,150,105,0.25));border-color:rgba(52,211,153,0.4)}
.btn-glass-danger{background:linear-gradient(135deg,rgba(239,68,68,0.25),rgba(220,38,38,0.25));border-color:rgba(248,113,113,0.4)}
.btn-sm{padding:10px 16px;font-size:13px;width:auto;border-radius:12px}

.tool-btn{background:rgba(255,255,255,0.03);border:2px solid rgba(255,255,255,0.08);border-radius:24px;padding:24px 16px;text-align:center;cursor:pointer;transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);position:relative;overflow:hidden}
.tool-btn::before{content:'';position:absolute;inset:0;border-radius:24px;opacity:0;transition:opacity 0.5s}
.tool-btn::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 70%);opacity:0;transition:opacity 0.5s}
.tool-btn:hover::before,.tool-btn.active::before{opacity:1}
.tool-btn:hover::after,.tool-btn.active::after{opacity:1}
.tool-btn.active{transform:translateY(-8px) scale(1.05);border-color:transparent}
.tool-btn.calc::before{background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(168,85,247,0.15))}
.tool-btn.calc.active{box-shadow:0 12px 40px rgba(99,102,241,0.4),0 0 80px rgba(99,102,241,0.2),inset 0 0 40px rgba(99,102,241,0.1)}
.tool-btn.check::before{background:linear-gradient(135deg,rgba(16,185,129,0.2),rgba(52,211,153,0.15))}
.tool-btn.check.active{box-shadow:0 12px 40px rgba(16,185,129,0.4),0 0 80px rgba(16,185,129,0.2),inset 0 0 40px rgba(16,185,129,0.1)}
.tool-btn.plan::before{background:linear-gradient(135deg,rgba(245,158,11,0.2),rgba(251,191,36,0.15))}
.tool-btn.plan.active{box-shadow:0 12px 40px rgba(245,158,11,0.4),0 0 80px rgba(245,158,11,0.2),inset 0 0 40px rgba(245,158,11,0.1)}
.tool-btn.game::before{background:linear-gradient(135deg,rgba(236,72,153,0.2),rgba(244,114,182,0.15))}
.tool-btn.game.active{box-shadow:0 12px 40px rgba(236,72,153,0.4),0 0 80px rgba(236,72,153,0.2),inset 0 0 40px rgba(236,72,153,0.1)}
.tool-icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;position:relative;z-index:1;transition:all 0.5s}
.tool-btn:hover .tool-icon,.tool-btn.active .tool-icon{transform:scale(1.15) rotate(5deg)}
.tool-btn.calc .tool-icon{background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 6px 20px rgba(99,102,241,0.5)}
.tool-btn.check .tool-icon{background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 6px 20px rgba(16,185,129,0.5)}
.tool-btn.plan .tool-icon{background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 6px 20px rgba(245,158,11,0.5)}
.tool-btn.game .tool-icon{background:linear-gradient(135deg,#ec4899,#f472b6);box-shadow:0 6px 20px rgba(236,72,153,0.5)}
.tool-label{font-size:14px;font-weight:800;position:relative;z-index:1;transition:all 0.3s}
.tool-btn.active .tool-label{transform:scale(1.1)}

.fade-in{animation:fadeIn 0.4s ease-out}
.slide-up{animation:slideUp 0.5s cubic-bezier(0.16,1,0.3,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:16px;margin-bottom:12px;transition:all 0.3s}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,0.3);border-color:rgba(129,140,248,0.2)}
.card.disabled{opacity:0.6;pointer-events:none;background:rgba(255,255,255,0.02)}

.header{position:sticky;top:0;z-index:40;background:rgba(10,10,26,0.9);backdrop-filter:blur(30px);border-bottom:1px solid rgba(255,255,255,0.06);padding:16px 20px}
.content{padding:16px;padding-bottom:100px;max-width:600px;margin:0 auto;position:relative;z-index:1}

.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.badge-pending{background:rgba(251,146,60,0.15);color:#fb923c;border:1px solid rgba(251,146,60,0.25)}
.badge-approved{background:rgba(52,211,153,0.15);color:#34d399;border:1px solid rgba(52,211,153,0.25)}
.badge-new{background:rgba(129,140,248,0.15);color:#818cf8;border:1px solid rgba(129,140,248,0.25)}
.badge-taken{background:rgba(107,114,128,0.2);color:#9ca3af;border:1px solid rgba(107,114,128,0.3)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.gradient-text{background:linear-gradient(135deg,#818cf8,#c084fc,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.timer-circle{position:relative;width:90px;height:90px}
.timer-circle svg{transform:rotate(-90deg)}
.timer-circle circle{fill:none;stroke-width:6}
.timer-circle .bg{stroke:rgba(255,255,255,0.08)}
.timer-circle .progress{stroke-linecap:round;transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 6px currentColor)}
.timer-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}

#gameCanvas{border-radius:20px;border:2px solid rgba(129,140,248,0.2);width:100%;max-width:380px;margin:0 auto;display:block;touch-action:none;background:linear-gradient(180deg,rgba(15,15,35,0.95),rgba(10,10,26,0.98));box-shadow:0 8px 40px rgba(99,102,241,0.2)}

.nav-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,26,0.95);backdrop-filter:blur(30px);border-top:1px solid rgba(255,255,255,0.06);padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:50}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;border-radius:14px;color:rgba(255,255,255,0.35);font-size:10px;cursor:pointer;transition:all 0.3s}
.nav-item.active{color:#818cf8;background:rgba(129,140,248,0.1)}
.nav-item.active svg{filter:drop-shadow(0 0 8px rgba(129,140,248,0.6))}
.nav-item svg{width:22px;height:22px}

.chat-bubble{padding:10px 14px;border-radius:16px;max-width:80%;margin-bottom:8px;font-size:13px;line-height:1.6;word-break:break-word}
.chat-bubble.me{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-bottom-left-radius:4px;margin-right:auto}
.chat-bubble.other{background:rgba(255,255,255,0.08);border-bottom-right-radius:4px;margin-left:auto}

/* =========================================================
   SCHOOL UI V2 — visual layer only
   ========================================================= */
:root{
 --bg0:#070817;--bg1:#0c1027;--card:rgba(17,24,55,.62);
 --line:rgba(255,255,255,.10);--muted:rgba(255,255,255,.45);
 --purple:#8b5cf6;--blue:#38bdf8;--pink:#f472b6;--green:#34d399;
}
html{scroll-behavior:smooth}
body{
 min-height:100vh!important;
 background:
 radial-gradient(circle at 8% 4%,rgba(139,92,246,.22),transparent 25%),
 radial-gradient(circle at 92% 8%,rgba(56,189,248,.14),transparent 23%),
 radial-gradient(circle at 55% 96%,rgba(244,114,182,.10),transparent 30%),
 linear-gradient(145deg,var(--bg0),var(--bg1))!important;
}
body:after{
 content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.30;
 background-image:radial-gradient(rgba(255,255,255,.075) 1px,transparent 1px);
 background-size:28px 28px;
}
.glass,.glass-strong,.card{
 background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.028))!important;
 border:1px solid var(--line)!important;
 box-shadow:0 20px 70px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.045)!important;
 backdrop-filter:blur(24px)!important;
 -webkit-backdrop-filter:blur(24px)!important;
}
.card{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-4px);border-color:rgba(139,92,246,.30)!important}
button,.btn-glass,.tool-btn,.nav-btn{transition:transform .18s ease,filter .18s ease,background .18s ease}
button:hover,.btn-glass:hover{filter:brightness(1.07);transform:translateY(-2px)}
input,textarea,select{outline:none!important}
.glass-input:focus{border-color:rgba(139,92,246,.55)!important;box-shadow:0 0 0 4px rgba(139,92,246,.10)!important}
.header{
 background:rgba(7,8,23,.72)!important;
 border-bottom:1px solid rgba(255,255,255,.07)!important;
 backdrop-filter:blur(22px)!important;
}
.bottom-nav{
 background:rgba(7,8,23,.78)!important;
 border-top:1px solid rgba(255,255,255,.08)!important;
 backdrop-filter:blur(22px)!important;
}
/* Login */
.login-v2{position:relative;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:22px}
.login-v2 .orb{position:absolute;border-radius:50%;filter:blur(65px);pointer-events:none;opacity:.35}
.login-v2 .orb.a{width:330px;height:330px;background:#7c3aed;top:-150px;right:-110px}
.login-v2 .orb.b{width:300px;height:300px;background:#0ea5e9;bottom:-140px;left:-110px}
.login-v2 .login-shell{width:min(430px,100%);position:relative;z-index:2}
.login-v2 .brand-mark{
 width:88px;height:88px;border-radius:29px;margin:0 auto 18px;
 display:grid;place-items:center;font-size:40px;
 background:linear-gradient(135deg,#7c3aed,#2563eb 58%,#ec4899);
 box-shadow:0 25px 65px rgba(124,58,237,.30);
 transform:rotate(-4deg);
}
.login-v2 .brand-mark:hover{transform:rotate(0) translateY(-3px)}
.login-v2 .login-panel{
 padding:30px;border-radius:32px;
 background:rgba(10,14,35,.78)!important;
 border:1px solid rgba(255,255,255,.12)!important;
 box-shadow:0 35px 100px rgba(0,0,0,.46)!important;
}
.login-v2 .login-input{
 width:100%;padding:14px 15px;border-radius:17px;
 background:rgba(255,255,255,.055);color:#fff;
 border:1px solid rgba(255,255,255,.08);
}
.login-v2 .login-submit{
 width:100%;padding:15px;border:0;border-radius:18px;color:#fff;font-weight:900;
 background:linear-gradient(135deg,#7c3aed,#2563eb);
 box-shadow:0 16px 35px rgba(79,70,229,.22);
}
/* Persian calendar */
.calendar-v2{
 position:relative;overflow:hidden;padding:22px;border-radius:30px;
 background:linear-gradient(145deg,rgba(255,255,255,.095),rgba(255,255,255,.032));
 border:1px solid rgba(255,255,255,.10);
 box-shadow:0 25px 80px rgba(0,0,0,.27);
}
.calendar-v2:before{
 content:"";position:absolute;width:210px;height:210px;left:-110px;top:-120px;
 border-radius:50%;background:rgba(236,72,153,.15);filter:blur(40px);
}
.cal-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-month{font-size:1.35rem;font-weight:950}
.cal-date{font-size:.70rem;color:rgba(255,255,255,.42);margin-top:5px}
.cal-nav{display:flex;gap:7px}
.cal-nav button{
 width:37px;height:37px;border-radius:13px;border:1px solid rgba(255,255,255,.08);
 background:rgba(255,255,255,.055);color:#fff;
}
.cal-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:18px}
.cal-week{text-align:center;color:rgba(255,255,255,.32);font-size:.64rem;font-weight:900;padding:5px 0}
.cal-cell{
 position:relative;min-height:43px;border-radius:15px;display:grid;place-items:center;
 font-size:.77rem;color:rgba(255,255,255,.80);
}
.cal-cell:hover{background:rgba(255,255,255,.06)}
.cal-cell.today{font-weight:950;color:#fff}
.cal-cell.today:before{
 content:"";position:absolute;width:79%;height:71%;
 border:3px solid #ef4444;
 border-radius:49% 54% 47% 52%;
 transform:rotate(-7deg);
 filter:drop-shadow(0 2px 1px rgba(0,0,0,.38));
 animation:pencilCircle .65s ease-out;
}
.cal-cell.today:after{
 content:"";position:absolute;width:69%;height:63%;
 border:1px solid rgba(239,68,68,.55);
 border-radius:55% 45% 52% 48%;
 transform:rotate(8deg);
}
@keyframes pencilCircle{from{transform:scale(.25) rotate(-7deg);opacity:0}to{transform:scale(1) rotate(-7deg);opacity:1}}
.cal-legend{display:flex;justify-content:space-between;margin-top:13px;color:rgba(255,255,255,.34);font-size:.62rem}
/* Games full-screen modal */
.game-v2-backdrop{
 position:fixed;inset:0;z-index:99999;padding:14px;
 display:flex;align-items:center;justify-content:center;
 background:rgba(2,4,14,.88);backdrop-filter:blur(20px);
}
.game-v2-window{
 width:min(780px,100%);max-height:94vh;overflow:auto;
 border-radius:32px;padding:20px;
 background:linear-gradient(145deg,#131a3b,#080b1d);
 border:1px solid rgba(255,255,255,.12);
 box-shadow:0 40px 120px rgba(0,0,0,.62);
}
.game-v2-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.game-v2-card{
 padding:19px;border-radius:23px;text-align:right;cursor:pointer;
 background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);
}
.game-v2-card:hover{background:rgba(124,58,237,.13);border-color:rgba(139,92,246,.38);transform:translateY(-4px)}
.game-v2-card .gicon{font-size:38px}.game-v2-card b{display:block;margin-top:8px}.game-v2-card span{font-size:.64rem;color:rgba(255,255,255,.35)}
.game-board-v2{width:min(430px,100%);margin:18px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.xo-v2{
 aspect-ratio:1;border:1px solid rgba(255,255,255,.09);border-radius:20px;
 background:rgba(255,255,255,.05);font-size:46px;font-weight:950;color:#fff;
}
.game-field-v2{
 height:310px;border-radius:25px;position:relative;overflow:hidden;
 background:radial-gradient(circle at 50% 35%,rgba(124,58,237,.20),rgba(0,0,0,.36));
 border:1px solid rgba(255,255,255,.08);
}
.star-v2{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.7}
.rocket-v2{position:absolute;font-size:48px;bottom:20px;transition:left .18s}
.tower-v2{height:210px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:4px}
.tower-piece-v2{height:22px;border-radius:7px;background:linear-gradient(90deg,#7c3aed,#2563eb);box-shadow:0 7px 20px rgba(79,70,229,.18)}
.bridge-v2{height:150px;display:flex;align-items:center;justify-content:center;gap:3px}
.bridge-piece-v2{width:42px;height:15px;border-radius:4px;background:#a78bfa;transform:rotate(-2deg)}
.paddle-field-v2{height:280px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,rgba(14,165,233,.08),rgba(124,58,237,.10))}
.paddle-v2{position:absolute;bottom:18px;width:105px;height:14px;border-radius:99px;background:linear-gradient(90deg,#7c3aed,#ec4899)}
.ball-v2{position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 28px rgba(255,255,255,.48)}
/* Exam */
.exam-card-v2{border-radius:30px!important}
.exam-option-v2{
 padding:15px;border-radius:18px;border:1px solid rgba(255,255,255,.08);
 background:rgba(255,255,255,.045);cursor:pointer;
}
.exam-option-v2:hover{background:rgba(99,102,241,.11);transform:translateX(-2px)}
.exam-option-v2.selected{background:rgba(99,102,241,.16);border-color:rgba(129,140,248,.55)}
.timer-v2{border-radius:20px;padding:9px 13px;background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.17)}
/* Toast */
.school-toast-v2{
 position:fixed;top:18px;right:18px;z-index:100000;
 max-width:min(380px,calc(100vw - 36px));padding:14px 17px;
 border-radius:18px;background:rgba(13,18,42,.96);
 border:1px solid rgba(129,140,248,.32);
 box-shadow:0 25px 70px rgba(0,0,0,.45);
 opacity:0;transform:translateY(-16px);pointer-events:none;transition:.28s;
}
.school-toast-v2.show{opacity:1;transform:translateY(0)}
@media(max-width:520px){
 .calendar-v2{padding:17px}.cal-grid{gap:3px}.cal-cell{min-height:39px}
 .game-v2-grid{grid-template-columns:1fr 1fr}.game-v2-window{padding:16px}
 .login-v2 .login-panel{padding:23px}
}
</style>
</head>
