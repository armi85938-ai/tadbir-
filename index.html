function App(){

    const {data}=await SB.from('users').select('*').eq('username',un.toUpperCase()).eq('password',pw).single();

  };

}

function CircularTimer({timeLeft,totalTime}){
  const radius=42;
  const circumference=2*Math.PI*radius;
  const progress=(timeLeft/totalTime)*circumference;
  const minutes=Math.floor(timeLeft/60);
  const seconds=timeLeft%60;
  const isWarning=timeLeft<300;
  const isCritical=timeLeft<60;
  const color=isCritical?'#ef4444':isWarning?'#f59e0b':'#a78bfa';
  return(
    <div className="timer-circle">
      <svg width="100" height="100">
        <circle className="bg" cx="50" cy="50" r={radius}/>
        <circle className="progress" cx="50" cy="50" r={radius} stroke={color} strokeDasharray={circumference} strokeDashoffset={circumference-progress}/>
      </svg>
      <div className="timer-text">
        <div className={`text-2xl font-black font-mono ${isCritical?'text-red-400 animate-pulse':isWarning?'text-amber-400':'text-white'}`}>
          {minutes}:{seconds<10?'0':''}{seconds}
        </div>
      </div>
    </div>
  );
}

                <div key={s.id} className="card flex items-center gap-4">
                  <div className="w-12 h-12 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center font-bold text-lg shadow-lg">{s.full_name[0]}</div>
                  <div className="flex-1">
                    <h4 className="font-bold">{s.full_name}</h4>
                    <p className="text-xs text-white/40">@{s.username}</p>
                    <p className="text-xs text-emerald-300 mt-1">رمز: <span className="font-mono bg-white/10 px-2 py-0.5 rounded">{s.password}</span></p>
                  </div>
                  <button onClick={()=>changePassword(s.id)} className="btn-sm bg-white/10 hover:bg-white/20 transition"><Icon d={Icons.key} size={14}/>تغییر</button>
                </div>
              ))
            )}

            {subTab==='objections'&&(
              answers.filter(a=>a.objection&&a.status!=='graded').length===0?<div className="card text-center py-12 text-white/40">اعتراضی ثبت نشده است</div>:
              answers.filter(a=>a.objection&&a.status!=='graded').map(a=>(
                <div key={a.id} className="card border-amber-500/30">
                  <div className="flex justify-between items-start mb-3">
                    <div><h4 className="font-bold text-amber-300">{a.users?.full_name}</h4><p className="text-xs text-white/40">{a.exams?.title}</p></div>
                    <span className="badge badge-pending">اعتراض</span>
                  </div>
                  <div className="bg-white/5 rounded-xl p-3 my-3 text-sm">
                    <p className="text-white/60 mb-1">پاسخ دانش‌آموز:</p>
                    <p className="text-purple-300 bg-white/5 p-2 rounded mb-3">{a.student_answer||'بدون پاسخ'}</p>
                    <p className="text-amber-300 mb-1 font-bold">متن اعتراض:</p>
                    <p className="text-white">{a.objection}</p>
                  </div>
                  <div className="flex gap-2">
                    <input type="number" className="glass-input flex-1" placeholder="نمره جدید" id={`grade-${a.id}`} defaultValue={a.score||0}/>
                    <button onClick={()=>{const v=document.getElementById(`grade-${a.id}`).value;gradeAnswer(a.id,v);}} className="btn-glass btn-glass-success btn-sm">ثبت نمره</button>
                  </div>
                </div>
              ))
            )}

            {subTab==='messages'&&(
              <div className="glass-strong p-4 h-[60vh] flex flex-col">
                {!selectedChat ? (
                  <div className="flex-1 overflow-y-auto space-y-2">
                    {messages.filter(m=>m.sender_id!==user.id).length===0&&<p className="text-center text-white/40 mt-10">پیامی ندارید</p>}
                    {messages.filter(m=>m.sender_id!==user.id).map(m=>(
                      <div key={m.id} onClick={()=>setSelectedChat(m)} className="card cursor-pointer hover:bg-white/10 transition flex justify-between items-center">
                        <div>
                          <p className="font-bold">{m.sender?.full_name}</p>
                          <p className="text-xs text-white/50 truncate w-48">{m.content}</p>
                        </div>
                        <span className="text-xs text-white/30">{new Date(m.created_at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}</span>
                      </div>
                    ))}
                  </div>
                ) : (
                  <>
                    <div className="flex items-center gap-2 mb-4 pb-2 border-b border-white/10">
                      <button onClick={()=>setSelectedChat(null)} className="p-2 bg-white/10 rounded-full"><Icon d="M15 18l-6-6 6-6" size={18}/></button>
                      <span className="font-bold">{selectedChat.sender?.full_name}</span>
                    </div>
                    <div className="flex-1 overflow-y-auto mb-4 space-y-2">
                      {messages.filter(m=>(m.sender_id===selectedChat.sender_id&&m.receiver_id===user.id)||(m.sender_id===user.id&&m.receiver_id===selectedChat.sender_id)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(m=>(
                        <div key={m.id} className={`chat-bubble ${m.sender_id===user.id?'me':'other'}`}>
                          {m.content}
                        </div>
                      ))}
                    </div>
                    <div className="flex gap-2">
                      <input className="glass-input flex-1" placeholder="پاسخ شما..." value={replyText} onChange={e=>setReplyText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendMessage()}/>
                      <button onClick={sendMessage} className="btn-glass btn-glass-success btn-sm"><Icon d={Icons.send} size={18}/></button>
                    </div>
                  </>
                )}
              </div>
            )}
          </>
        )}

        {tab==='grading'&&(
          <>
            <h3 className="font-bold mb-4 text-white/80">پاسخ‌برگ‌های در انتظار</h3>
            {answers.filter(a=>a.status==='pending'&&!a.objection).length===0?<div className="card text-center py-12 text-white/40">پاسخ‌برگی نیست</div>:
            answers.filter(a=>a.status==='pending'&&!a.objection).map(a=>(
              <div key={a.id} className="card">
                <h4 className="font-bold">{a.users?.full_name} - {a.exams?.title}</h4>
                <p className="text-sm text-white/50 mt-2">{a.questions?.q_text}</p>
                <p className="text-sm text-purple-300 mt-2 bg-white/5 p-2 rounded">پاسخ: {a.student_answer||'بدون پاسخ'}</p>
                <div className="flex gap-2 mt-3">
                  <input type="number" className="glass-input flex-1" placeholder="نمره" id={`score-${a.id}`}/>
                  <button onClick={()=>{const v=document.getElementById(`score-${a.id}`).value;gradeAnswer(a.id,v);}} className="btn-glass btn-glass-success btn-sm">ثبت</button>
                </div>
              </div>
            ))}
          </>
        )}
      </div>

      <div className="nav-bar">
        <div className={`nav-item ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==='students'?'active':''}`} onClick={()=>{setTab('students');setSubTab('list');}}><Icon d={Icons.users}/><span>کاربران</span></div>
        <div className={`nav-item ${tab==='grading'?'active':''}`} onClick={()=>setTab('grading')}><Icon d={Icons.grade}/><span>تصحیح</span></div>
      </div>

      {modal==='exam'&&(
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="glass-strong w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-xl font-bold gradient-text">ساخت آزمون</h3>
              <button onClick={()=>setModal(null)} className="p-2 bg-white/10 rounded-xl"><Icon d={Icons.x} size={20}/></button>
            </div>
            {step===1&&(
              <div className="space-y-4 fade-in">
                <input className="glass-input" placeholder="عنوان آزمون *" value={formData.title||''} onChange={e=>setFormData({...formData,title:e.target.value})}/>
                <textarea className="glass-input" placeholder="توضیحات" value={formData.desc||''} onChange={e=>setFormData({...formData,desc:e.target.value})} rows="2"/>
                <div className="grid grid-cols-2 gap-3">
                  <input className="glass-input" type="number" placeholder="ساعت" value={formData.hours||'0'} onChange={e=>setFormData({...formData,hours:e.target.value})}/>
                  <input className="glass-input" type="number" placeholder="دقیقه" value={formData.minutes||'60'} onChange={e=>setFormData({...formData,minutes:e.target.value})}/>
                </div>
                <button onClick={()=>{const total=(parseInt(formData.hours)||0)*60+(parseInt(formData.minutes)||60);setFormData({...formData,duration:total});setStep(2);}} className="btn-glass">مرحله بعد: سوالات</button>
              </div>
            )}
            {step===2&&(
              <div className="fade-in">
                <div className="flex justify-between items-center mb-4">
                  <h4 className="font-bold">سوالات ({questions.length})</h4>
                  <button onClick={addQuestion} className="btn-sm bg-purple-600"><Icon d={Icons.plus} size={16}/>افزودن</button>
                </div>
                {questions.map((q,i)=>(
                  <div key={i} className="glass p-4 mb-3 relative">
                    <button onClick={()=>removeQuestion(i)} className="absolute top-2 left-2 text-red-400"><Icon d={Icons.x} size={18}/></button>
                    <span className="text-xs font-bold text-purple-300 mb-2 block">سوال {i+1}</span>
                    <textarea className="glass-input mb-2 text-sm" placeholder="متن سوال" value={q.q_text} onChange={e=>updateQuestion(i,'q_text',e.target.value)} rows="2"/>
                    
                    {/* Direct Image Upload */}
                    <div className="mb-2">
                      <label className="text-xs text-white/50 mb-1 block">آپلود عکس سوال (اختیاری)</label>
                      <input type="file" accept="image/*" className="glass-input text-sm py-2" onChange={(e)=>handleImageUpload(e.target.files[0], i)}/>
                      {q.image_url && <p className="text-xs text-emerald-400 mt-1">✓ عکس آپلود شد</p>}
                    </div>

                    <div className="flex gap-2 mb-2">
                      <button className={`flex-1 py-2 rounded-lg text-sm ${q.q_type==='test'?'bg-purple-600':'bg-white/10'}`} onClick={()=>updateQuestion(i,'q_type','test')}>تستی</button>
                      <button className={`flex-1 py-2 rounded-lg text-sm ${q.q_type==='descriptive'?'bg-purple-600':'bg-white/10'}`} onClick={()=>updateQuestion(i,'q_type','descriptive')}>تشریحی</button>
                    </div>
                    {q.q_type==='test'&&(
                      <div className="space-y-2">
                        {['a','b','c','d'].map(opt=>(
                          <input key={opt} className="glass-input text-sm" placeholder={`گزینه ${opt.toUpperCase()}`} value={q[`opt_${opt}`]} onChange={e=>updateQuestion(i,`opt_${opt}`,e.target.value)}/>
                        ))}
                        <select className="glass-input text-sm" value={q.correct_opt} onChange={e=>updateQuestion(i,'correct_opt',e.target.value)}>
                          <option value="">پاسخ صحیح را انتخاب کنید</option>
                          <option value="A">گزینه A</option><option value="B">گزینه B</option><option value="C">گزینه C</option><option value="D">گزینه D</option>
                        </select>
                      </div>
                    )}
                  </div>
                ))}
                <div className="flex gap-2 mt-4">
                  <button onClick={()=>setStep(1)} className="btn-glass bg-white/10 flex-1">قبلی</button>
                  <button onClick={()=>setStep(3)} className="btn-glass flex-1">بررسی نهایی</button>
                </div>
              </div>
            )}
            {step===3&&(
              <div className="fade-in text-center">
                <div className="glass p-4 mb-4 text-right space-y-2 text-sm">
                  <p>عنوان: <span className="font-bold text-white">{formData.title}</span></p>
                  <p>مدت: <span className="font-bold text-white">{formData.duration} دقیقه</span></p>
                  <p>سوالات: <span className="font-bold text-white">{questions.length}</span></p>
                </div>
                <div className="flex gap-2">
                  <button onClick={()=>setStep(2)} className="btn-glass bg-white/10 flex-1">ویرایش</button>
                  <button onClick={createExam} className="btn-glass btn-glass-success flex-1" disabled={loading}>
                    {loading?'در حال ذخیره...':'ذخیره آزمون'}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ==================== STUDENT PANEL ====================
function Student({user,tab,setTab,onLogout}){
  const [exams,setExams]=useState([]);
  const [answers,setAnswers]=useState([]);
  const [activeExam,setActiveExam]=useState(null);
  const [currentQ,setCurrentQ]=useState(0);
  const [studentAnswers,setStudentAnswers]=useState({});
  const [timeLeft,setTimeLeft]=useState(0);
  const [totalTime,setTotalTime]=useState(0);
  const [showCalc,setShowCalc]=useState(false);
  const [calcDisplay,setCalcDisplay]=useState('');
  const [showObjection,setShowObjection]=useState(null);
  const [objectionText,setObjectionText]=useState('');
  const [checklist,setChecklist]=useState([]);
  const [newTask,setNewTask]=useState('');
  const [studyPlans,setStudyPlans]=useState([]);
  const [newPlan,setNewPlan]=useState({day:'شنبه',subject:'',time:''});
  const [messages,setMessages]=useState([]);
  const [chatText,setChatText]=useState('');
  const [gameScore,setGameScore]=useState(0);
  const [isPlaying,setIsPlaying]=useState(false);
  const [toolsTab, setToolsTab] = useState('calc'); // Default to calc
  const canvasRef=useRef(null);
  const chartRef=useRef(null);
  const [chartReady,setChartReady]=useState(false);

  useEffect(()=>{loadAll();},[]);

  const loadAll=async()=>{
    const {data:e}=await SB.from('exams').select('*,questions(*)').order('created_at',{ascending:false});
    const {data:a}=await SB.from('answers').select('*,exams(title),questions(q_text,q_type,correct_opt)').eq('student_id',user.id);
    const {data:c}=await SB.from('checklists').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    const {data:p}=await SB.from('study_plans').select('*').eq('user_id',user.id).order('created_at',{ascending:false});
    if(e) setExams(e.filter(ex=>ex.assigned_to==='all'||ex.assigned_to===user.id));
    if(a) setAnswers(a);
    if(c) setChecklist(c);
    if(p) setStudyPlans(p);
    loadMessages();
  };

  const loadMessages=async()=>{
    const {data:admins}=await SB.from('users').select('id').eq('role','admin').limit(1);
    if(!admins||admins.length===0) return;
    const adminId=admins[0].id;
    const {data}=await SB.from('messages').select('*').or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`).order('created_at',{ascending:true});
    if(data) setMessages(data.filter(m=>m.sender_id===adminId||m.receiver_id===adminId));
  };

  const hasTakenExam=(examId)=>answers.some(a=>a.exam_id===examId);

  const startExam=(exam)=>{
    if(hasTakenExam(exam.id)){alert('شما قبلاً در این آزمون شرکت کرده‌اید!');return;}
    setActiveExam(exam);setCurrentQ(0);setStudentAnswers({});setTimeLeft(exam.duration_minutes*60);setTotalTime(exam.duration_minutes*60);
  };

  useEffect(()=>{
    if(activeExam&&timeLeft>0){
      const t=setInterval(()=>setTimeLeft(tl=>tl-1),1000);
      return ()=>clearInterval(t);
    }else if(activeExam&&timeLeft===0){
      submitExam();
    }
  },[activeExam,timeLeft]);

  const submitExam=async()=>{
    if(!activeExam) return;
    for(const q of activeExam.questions){
      const ans=studentAnswers[q.id]||'';
      let score=0;
      if(q.q_type==='test'&&q.correct_opt&&ans===q.correct_opt) score=1;
      await SB.from('answers').insert({
        exam_id:activeExam.id,student_id:user.id,question_id:q.id,
        student_answer:ans,score:score,max_score:1,status:q.q_type==='test'?'graded':'pending'
      });
    }
    alert('پاسخ‌ها با موفقیت ثبت شد!');
    setActiveExam(null);loadAll();
  };

  const calcPress=(v)=>{
    if(v==='C') setCalcDisplay('');
    else if(v==='='){try{setCalcDisplay(eval(calcDisplay).toString());}catch{setCalcDisplay('Error');}}
    else setCalcDisplay(calcDisplay+v);
  };

  const submitObjection=async()=>{
    if(!objectionText.trim()||!showObjection) return;
    // FIX: Ensure update is successful and visible
    const {error} = await SB.from('answers').update({objection:objectionText, objection_count:1}).eq('id',showObjection.id);
    if(error) {
        alert('خطا در ثبت اعتراض: ' + error.message);
    } else {
        alert('اعتراض شما با موفقیت ثبت و برای مدیر ارسال شد');
        setShowObjection(null);setObjectionText('');loadAll();
    }
  };

  const changeMyPassword=async()=>{
    const newPw=prompt("رمز عبور جدید خود را وارد کنید:");
    if(newPw&&newPw.length>=4){
      await SB.from('users').update({password:newPw}).eq('id',user.id);
      alert("رمز عبور با موفقیت تغییر کرد. مدیر نیز می‌تواند آن را مشاهده کند.");
      const updatedUser={...user,password:newPw};
      setUser(updatedUser);
      sessionStorage.setItem('edu_user',JSON.stringify(updatedUser));
    }else if(newPw){
      alert("رمز عبور باید حداقل ۴ کاراکتر باشد.");
    }
  };

  const addTask=async()=>{
    if(!newTask.trim()) return;
    const {data}=await SB.from('checklists').insert({user_id:user.id,title:newTask}).select().single();
    setChecklist([data,...checklist]);setNewTask('');
  };
  const toggleTask=async(id,is_done)=>{
    await SB.from('checklists').update({is_done:!is_done}).eq('id',id);
    setChecklist(checklist.map(t=>t.id===id?{...t,is_done:!is_done}:t));
  };
  const deleteTask=async(id)=>{
    await SB.from('checklists').delete().eq('id',id);
    setChecklist(checklist.filter(t=>t.id!==id));
  };

  const addPlan=async()=>{
    if(!newPlan.subject.trim()||!newPlan.time.trim()) return;
    const {data}=await SB.from('study_plans').insert({user_id:user.id, day_of_week:newPlan.day, subject:newPlan.subject, time_range:newPlan.time}).select().single();
    setStudyPlans([data,...studyPlans]);
    setNewPlan({day:'شنبه',subject:'',time:''});
  };
  const deletePlan=async(id)=>{
    await SB.from('study_plans').delete().eq('id',id);
    setStudyPlans(studyPlans.filter(p=>p.id!==id));
  };

  const sendChat=async()=>{
    if(!chatText.trim()) return;
    const {data:admins}=await SB.from('users').select('id').eq('role','admin').limit(1);
    if(!admins) return;
    await SB.from('messages').insert({sender_id:user.id,receiver_id:admins[0].id,content:chatText});
    setChatText('');loadMessages();
  };

  // Game Logic
  useEffect(()=>{
    if(tab!=='tools'||toolsTab!=='game'||!isPlaying) return;
    const canvas=canvasRef.current;
    if(!canvas) return;
    const ctx=canvas.getContext('2d');
    let animationId;
    let ballX=canvas.width/2, ballY=canvas.height-30, dx=3, dy=-3;
    let paddleX=(canvas.width-75)/2;
    let score=0;

    const draw=()=>{
      ctx.clearRect(0,0,canvas.width,canvas.height);
      // Ball
      ctx.beginPath();ctx.arc(ballX,ballY,8,0,Math.PI*2);ctx.fillStyle='#a78bfa';ctx.fill();ctx.closePath();
      // Paddle
      ctx.fillStyle='#38bdf8';ctx.fillRect(paddleX,canvas.height-15,75,10);
      
      // Collision
      if(ballX+dx>canvas.width-8||ballX+dx<8) dx=-dx;
      if(ballY+dy<8) dy=-dy;
      else if(ballY+dy>canvas.height-23){
        if(ballX>paddleX&&ballX<paddleX+75){
          dy=-dy;score+=10;setGameScore(score);
        }else{
          setIsPlaying(false);
          SB.from('game_scores').insert({user_id:user.id,score:score});
          alert(`بازی تمام شد! رکورد شما: ${score}`);
          return;
        }
      }
      ballX+=dx;ballY+=dy;
      animationId=requestAnimationFrame(draw);
    };
    
    const mouseMove=(e)=>{
      const rect=canvas.getBoundingClientRect();
      const relativeX=(e.clientX || e.touches[0].clientX)-rect.left;
      if(relativeX>0&&relativeX<canvas.width) paddleX=relativeX-37.5;
    };
    canvas.addEventListener('mousemove',mouseMove);
    canvas.addEventListener('touchmove',mouseMove,{passive:false});
    draw();
    return ()=>{cancelAnimationFrame(animationId);canvas.removeEventListener('mousemove',mouseMove);canvas.removeEventListener('touchmove',mouseMove);};
  },[isPlaying,tab,toolsTab]);

  const getAverage=()=>{
    const graded=answers.filter(a=>a.status==='graded');
    if(graded.length===0) return 0;
    const total=graded.reduce((s,a)=>s+parseFloat(a.score||0),0);
    return (total/graded.length).toFixed(2);
  };

  useEffect(()=>{
    if(tab==='chart'&&chartReady&&answers.length>0){
      const ctx=document.getElementById('gradeChart');
      if(ctx){
        if(window.myChart) window.myChart.destroy();
        const graded=answers.filter(a=>a.status==='graded');
        
        // Create gradient
        const gradient = ctx.getContext('2d').createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(167, 139, 250, 0.5)');
        gradient.addColorStop(1, 'rgba(167, 139, 250, 0.0)');

        window.myChart=new Chart(ctx,{
          type:'line',
          data:{
            labels:graded.map((a,i)=>a.exams?.title?.substring(0,15)||`آزمون ${i+1}`),
            datasets:[{
              label:'نمره',
              data:graded.map(a=>parseFloat(a.score||0)),
              borderColor:'#a78bfa',
              backgroundColor:gradient,
              borderWidth:3,
              tension:0.4,fill:true,
              pointBackgroundColor:'#f472b6',pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:6,
              pointHoverRadius:8
            }]
          },
          options:{
            responsive:true,
            plugins:{
              legend:{labels:{color:'white',font:{family:'Vazirmatn',size:14}}},
              tooltip:{backgroundColor:'rgba(0,0,0,0.8)',titleFont:{family:'Vazirmatn'},bodyFont:{family:'Vazirmatn'}}
            },
            scales:{
              y:{ticks:{color:'white',font:{family:'Vazirmatn'}},grid:{color:'rgba(255,255,255,0.1)'},beginAtZero:true,max:1},
              x:{ticks:{color:'white',font:{family:'Vazirmatn'},maxRotation:45},grid:{color:'rgba(255,255,255,0.05)'}}
            }
          }
        });
      }
    }
  },[tab,chartReady,answers]);

  if(activeExam){
    const q=activeExam.questions[currentQ];
    const progress=((currentQ+1)/activeExam.questions.length)*100;
    return(
      <div className="min-h-screen bg-slate-900">
        <div className="header">
          <div className="flex justify-between items-center mb-4">
            <div>
              <h2 className="font-bold text-lg">{activeExam.title}</h2>
              <p className="text-xs text-white/40 mt-1">سوال {currentQ+1} از {activeExam.questions.length}</p>
            </div>
            <CircularTimer timeLeft={timeLeft} totalTime={totalTime}/>
          </div>
          <div className="w-full bg-white/10 rounded-full h-2">
            <div className="bg-gradient-to-r from-purple-500 to-pink-500 h-2 rounded-full transition-all duration-500" style={{width:`${progress}%`}}></div>
          </div>
        </div>
        {timeLeft<300&&timeLeft>0&&<div className="bg-red-500/20 border-y border-red-500/50 text-red-300 p-3 text-center text-sm font-bold animate-pulse">عجله کن! کمتر از ۵ دقیقه زمان داری!</div>}
        <div className="content">
          <div className="glass p-5 fade-in">
            <div className="flex items-center gap-2 mb-4">
              <span className={`badge ${q?.q_type==='test'?'badge-new':'badge-approved'}`}>{q?.q_type==='test'?'سوال تستی':'سوال تشریحی'}</span>
            </div>
            {q?.image_url&&<img src={q.image_url} alt="سوال" className="w-full rounded-xl mb-4 max-h-60 object-contain bg-black/20 border border-white/10"/>}
            <p className="mb-6 font-bold text-lg leading-relaxed">{q?.q_text}</p>
            {q?.q_type==='test'?(
              <div className="space-y-3">
                {['A','B','C','D'].map(opt=>(
                  <div key={opt} className={`glass p-3 cursor-pointer transition-all ${studentAnswers[q.id]===opt?'border-purple-500 bg-purple-500/20':'hover:bg-white/10'}`} onClick={()=>setStudentAnswers({...studentAnswers,[q.id]:opt})}>
                    <div className="flex items-center gap-3">
                      <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center font-bold transition-all ${studentAnswers[q.id]===opt?'bg-purple-600 border-purple-600':'border-white/30'}`}>{opt}</div>
                      <span className="flex-1">{q[`opt_${opt.toLowerCase()}`]}</span>
                      {studentAnswers[q.id]===opt&&<Icon d={Icons.check} size={20} className="text-purple-400"/>}
                    </div>
                  </div>
                ))}
              </div>
            ):(
              <textarea className="glass-input" placeholder="پاسخ خود را بنویسید..." value={studentAnswers[q.id]||''} onChange={e=>setStudentAnswers({...studentAnswers,[q.id]:e.target.value})} rows="6"/>
            )}
          </div>
          <div className="flex gap-2 mt-4">
            {currentQ>0&&<button onClick={()=>setCurrentQ(currentQ-1)} className="btn-glass bg-white/10 flex-1">قبلی</button>}
            {currentQ<activeExam.questions.length-1?<button onClick={()=>setCurrentQ(currentQ+1)} className="btn-glass flex-1">بعدی</button>:
            <button onClick={()=>{if(confirm('ثبت نهایی آزمون؟'))submitExam();}} className="btn-glass btn-glass-success flex-1">ثبت نهایی</button>}
          </div>
          <button onClick={()=>setShowCalc(true)} className="btn-glass bg-white/10 mt-3 w-full flex items-center justify-center gap-2"><Icon d={Icons.calc} size={18}/>ماشین‌حساب</button>
        </div>
        {showCalc&&(
          <div className="modal-overlay" onClick={()=>setShowCalc(false)}>
            <div className="glass-strong p-4 w-72 slide-up" onClick={e=>e.stopPropagation()}>
              <div className="flex justify-between items-center mb-3">
                <h3 className="font-bold">ماشین‌حساب</h3>
                <button onClick={()=>setShowCalc(false)} className="p-2 bg-white/10 rounded-xl"><Icon d={Icons.x} size={18}/></button>
              </div>
              <div className="bg-black/40 p-4 rounded-xl text-2xl text-left mb-4 font-mono h-16 flex items-center justify-end overflow-x-auto border border-white/10">{calcDisplay||'0'}</div>
              <div className="grid grid-cols-4 gap-2">
                {['7','8','9','/','4','5','6','*','1','2','3','-','C','0','=','+'].map(b=><button key={b} onClick={()=>calcPress(b)} className={`btn-glass ${['/','*','-','+'].includes(b)?'bg-purple-600/40':''} ${b==='='?'btn-glass-success':''}`}>{b}</button>)}
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  return(
    <div className="min-h-screen pb-24">
      <div className="header flex justify-between items-center">
        <div><h1 className="text-xl font-bold gradient-text">پنل دانش‌آموز</h1><p className="text-xs text-white/40 mt-1">{user.full_name}</p></div>
        <button onClick={onLogout} className="p-3 bg-white/5 rounded-xl hover:bg-white/10 transition"><Icon d={Icons.logout} size={20}/></button>
      </div>

      <div className="content">
        {tab==='home'&&(
          <>
            <div className="glass p-6 text-center mb-6 slide-up">
              <Icon d={Icons.award} size={36} className="mx-auto mb-2 text-yellow-400"/>
              <p className="text-4xl font-black gradient-text">{getAverage()}</p>
              <p className="text-xs text-white/50">معدل کل شما</p>
            </div>

            <h3 className="font-bold mb-3 text-white/80">آزمون‌های موجود ({exams.length})</h3>
            {exams.length===0?<div className="card text-center py-12 text-white/40">آزمونی ندارید</div>:
            exams.map(ex=>{
              const taken=hasTakenExam(ex.id);
              return(
                <div key={ex.id} className={`card slide-up ${taken?'disabled':''}`}>
                  <h4 className="font-bold text-lg mb-1">{ex.title}</h4>
                  <p className="text-sm text-white/50 mb-3">{ex.description||'بدون توضیحات'}</p>
                  <div className="flex gap-2 flex-wrap mb-3">
                    <span className="badge badge-new"><Icon d={Icons.clock} size={12}/>{ex.duration_minutes} دقیقه</span>
                    <span className="badge badge-approved">{ex.questions?.length||0} سوال</span>
                  </div>
                  {taken?(
                    <div className="text-center py-2 text-emerald-400 text-sm font-bold bg-emerald-500/10 rounded-xl">شما قبلاً در این آزمون شرکت کرده‌اید</div>
                  ):(
                    <button onClick={()=>startExam(ex)} className="btn-glass shimmer">شروع آزمون</button>
                  )}
                </div>
              );
            })}
          </>
        )}

        {tab==='grades'&&(
          <>
            <h3 className="font-bold mb-4 text-white/80">نمرات و اعتراضات</h3>
            {answers.length===0?<div className="card text-center py-12 text-white/40">نمره‌ای ثبت نشده</div>:
            answers.map(a=>(
              <div key={a.id} className="card">
                <div className="flex justify-between items-start mb-2">
                  <div className="flex-1">
                    <h4 className="font-bold">{a.exams?.title||'آزمون'}</h4>
                    <p className="text-xs text-white/40 mt-1 line-clamp-2">{a.questions?.q_text}</p>
                  </div>
                  <div className="text-left">
                    <span className={`badge ${a.status==='graded'?'badge-approved':'badge-pending'}`}>{a.status==='graded'?'تصحیح شده':'در انتظار'}</span>
                    <p className="text-3xl font-black mt-2 gradient-text">{a.score??'-'}</p>
                  </div>
                </div>
                {a.objection&&a.status!=='graded'&&<div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 text-xs text-amber-300 mt-2">اعتراض شما در حال بررسی توسط مدیر است</div>}
                {a.status==='graded'&&!a.objection&&(
                  <button onClick={()=>setShowObjection(a)} className="btn-glass btn-glass-danger mt-3 w-full flex items-center justify-center gap-2">
                    <Icon d={Icons.alert} size={18}/>درخواست بررسی مجدد (اعتراض)
                  </button>
                )}
              </div>
            ))}
          </>
        )}

        {tab==='chart'&&(
          <>
            <div className="glass p-6 text-center mb-6 slide-up">
              <Icon d={Icons.chart} size={36} className="mx-auto mb-2 text-purple-400"/>
              <p className="text-4xl font-black gradient-text">{getAverage()}</p>
              <p className="text-xs text-white/50">معدل کل</p>
            </div>
            <div className="glass-strong p-4 mb-4">
              <h3 className="font-bold mb-4 text-center">نمودار پیشرفت تحصیلی</h3>
              {answers.filter(a=>a.status==='graded').length===0?<p className="text-center text-white/40 py-8">هنوز نمره‌ای ثبت نشده</p>:<canvas id="gradeChart"></canvas>}
            </div>
            {!chartReady&&answers.filter(a=>a.status==='graded').length>0&&<button onClick={()=>setChartReady(true)} className="btn-glass mb-4">نمایش نمودار</button>}
          </>
        )}

        {tab==='tools'&&(
          <>
            <div className="flex gap-2 mb-4 overflow-x-auto pb-2">
              <button onClick={()=>setToolsTab('calc')} className={`btn-sm ${toolsTab==='calc'?'btn-glass':'bg-white/10'}`}>ماشین‌حساب</button>
              <button onClick={()=>setToolsTab('checklist')} className={`btn-sm ${toolsTab==='checklist'?'btn-glass':'bg-white/10'}`}>چک‌لیست</button>
              <button onClick={()=>setToolsTab('planner')} className={`btn-sm ${toolsTab==='planner'?'btn-glass':'bg-white/10'}`}>برنامه‌ریزی</button>
              <button onClick={()=>setToolsTab('game')} className={`btn-sm ${toolsTab==='game'?'btn-glass':'bg-white/10'}`}>بازی</button>
            </div>

            {toolsTab==='calc'&&(
              <div className="glass-strong p-4 w-full max-w-sm mx-auto slide-up">
                <div className="bg-black/40 p-4 rounded-xl text-3xl text-left mb-4 font-mono h-20 flex items-center justify-end overflow-x-auto border border-white/10">{calcDisplay||'0'}</div>
                <div className="grid grid-cols-4 gap-3">
                  {['7','8','9','/','4','5','6','*','1','2','3','-','C','0','=','+'].map(b=><button key={b} onClick={()=>calcPress(b)} className={`btn-glass h-14 text-xl ${['/','*','-','+'].includes(b)?'bg-purple-600/40':''} ${b==='='?'btn-glass-success':''}`}>{b}</button>)}
                </div>
              </div>
            )}

            {toolsTab==='checklist'&&(
              <div className="space-y-3 slide-up">
                <div className="flex gap-2">
                  <input className="glass-input flex-1" placeholder="کار جدید..." value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTask()}/>
                  <button onClick={addTask} className="btn-glass btn-glass-success btn-sm"><Icon d={Icons.plus} size={18}/></button>
                </div>
                {checklist.length===0&&<p className="text-center text-white/40 py-8">لیست شما خالی است</p>}
                {checklist.map(t=>(
                  <div key={t.id} className="glass p-3 flex items-center gap-3">
                    <button onClick={()=>toggleTask(t.id,t.is_done)} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center ${t.is_done?'bg-emerald-500 border-emerald-500':'border-white/30'}`}>
                      {t.is_done&&<Icon d={Icons.check} size={14} color="white"/>}
                    </button>
                    <span className={`flex-1 ${t.is_done?'line-through text-white/40':''}`}>{t.title}</span>
                    <button onClick={()=>deleteTask(t.id)} className="text-red-400"><Icon d={Icons.trash} size={18}/></button>
                  </div>
                ))}
              </div>
            )}

            {toolsTab==='planner'&&(
              <div className="space-y-3 slide-up">
                <div className="glass p-4 space-y-3">
                  <select className="glass-input" value={newPlan.day} onChange={e=>setNewPlan({...newPlan,day:e.target.value})}>
                    {['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'].map(d=><option key={d} value={d}>{d}</option>)}
                  </select>
                  <input className="glass-input" placeholder="ماده درسی (مثال: ریاضی)" value={newPlan.subject} onChange={e=>setNewPlan({...newPlan,subject:e.target.value})}/>
                  <input className="glass-input" placeholder="ساعت (مثال: 16 تا 18)" value={newPlan.time} onChange={e=>setNewPlan({...newPlan,time:e.target.value})}/>
                  <button onClick={addPlan} className="btn-glass btn-glass-success">افزودن به برنامه</button>
                </div>
                {studyPlans.length===0&&<p className="text-center text-white/40 py-4">برنامه‌ای ثبت نشده</p>}
                {studyPlans.map(p=>(
                  <div key={p.id} className="glass p-3 flex items-center justify-between">
                    <div>
                      <span className="badge badge-new mb-1">{p.day_of_week}</span>
                      <p className="font-bold">{p.subject}</p>
                      <p className="text-xs text-white/50">{p.time_range}</p>
                    </div>
                    <button onClick={()=>deletePlan(p.id)} className="text-red-400 p-2"><Icon d={Icons.trash} size={18}/></button>
                  </div>
                ))}
              </div>
            )}

            {toolsTab==='game'&&(
              <div className="text-center slide-up">
                <div className="glass p-4 mb-4 inline-block min-w-[150px]">
                  <p className="text-sm text-white/60 mb-1">رکورد فعلی</p>
                  <p className="text-3xl font-black text-purple-400">{gameScore}</p>
                </div>
                {!isPlaying?(
                  <button onClick={()=>{setIsPlaying(true);setGameScore(0);}} className="btn-glass btn-glass-success mb-4">شروع بازی توپ و راکت</button>
                ):(
                  <p className="text-sm text-amber-400 mb-2 animate-pulse">ماوس یا انگشت خود را برای حرکت راکت حرکت دهید</p>
                )}
                <canvas ref={canvasRef} width="400" height="300" id="gameCanvas"></canvas>
              </div>
            )}
            
            <div className="mt-6 glass p-4 text-center">
               <button onClick={changeMyPassword} className="btn-glass flex items-center justify-center gap-2"><Icon d={Icons.key} size={18}/>تغییر رمز عبور من</button>
               <p className="text-xs text-white/40 mt-2">با تغییر رمز، مدیر نیز می‌تواند رمز جدید شما را در پنل خود مشاهده کند.</p>
            </div>
          </>
        )}
      </div>

      <div className="nav-bar">
        <div className={`nav-item ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==='grades'?'active':''}`} onClick={()=>setTab('grades')}><Icon d={Icons.grade}/><span>نمرات</span></div>
        <div className={`nav-item ${tab==='chart'?'active':''}`} onClick={()=>setTab('chart')}><Icon d={Icons.chart}/><span>کارنامه</span></div>
        <div className={`nav-item ${tab==='tools'?'active':''}`} onClick={()=>{setTab('tools');setToolsTab('calc');}}><Icon d={Icons.list}/><span>ابزارها</span></div>
      </div>

      {showCalc&&(
        <div className="modal-overlay" onClick={()=>setShowCalc(false)}>
          <div className="glass-strong p-4 w-72 slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-3">
              <h3 className="font-bold">ماشین‌حساب</h3>
              <button onClick={()=>setShowCalc(false)} className="p-2 bg-white/10 rounded-xl"><Icon d={Icons.x} size={18}/></button>
            </div>
            <div className="bg-black/40 p-4 rounded-xl text-2xl text-left mb-4 font-mono h-16 flex items-center justify-end overflow-x-auto border border-white/10">{calcDisplay||'0'}</div>
            <div className="grid grid-cols-4 gap-2">
              {['7','8','9','/','4','5','6','*','1','2','3','-','C','0','=','+'].map(b=><button key={b} onClick={()=>calcPress(b)} className={`btn-glass ${['/','*','-','+'].includes(b)?'bg-purple-600/40':''} ${b==='='?'btn-glass-success':''}`}>{b}</button>)}
            </div>
          </div>
        </div>
      )}

      {showObjection&&(
        <div className="modal-overlay" onClick={()=>setShowObjection(null)}>
          <div className="glass-strong w-full max-w-md p-6 slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-xl font-bold gradient-text">درخواست بررسی مجدد</h3>
              <button onClick={()=>setShowObjection(null)} className="p-2 bg-white/10 rounded-xl"><Icon d={Icons.x} size={20}/></button>
            </div>
            <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 mb-4 text-sm text-amber-300">توجه: فقط یکبار می‌توانید اعتراض ثبت کنید.</div>
            <textarea className="glass-input mb-4" placeholder="دلیل اعتراض خود را به طور کامل بنویسید..." value={objectionText} onChange={e=>setObjectionText(e.target.value)} rows="4"/>
            <button onClick={submitObjection} className="btn-glass btn-glass-danger flex items-center justify-center gap-2"><Icon d={Icons.send} size={18}/>ارسال اعتراض به مدیر</button>
          </div>
        </div>
      )}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
