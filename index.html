<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>سامانه هوشمند آموزشی</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"/>
<style>
*{font-family:'Vazirmatn',sans-serif;margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 30%,#312e81 60%,#4c1d95 100%);min-height:100vh;color:#fff;overflow-x:hidden}
.glass{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.glass-input{background:rgba(0,0,0,0.3);border:2px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;color:#fff;font-size:14px;width:100%;outline:none;transition:all 0.3s}
.glass-input:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,0.15)}
.glass-input::placeholder{color:rgba(255,255,255,0.35)}
.btn-primary{background:linear-gradient(135deg,#8b5cf6 0%,#7c3aed 100%);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:all 0.3s;box-shadow:0 4px 20px rgba(139,92,246,0.4)}
.btn-primary:active{transform:scale(0.97)}
.btn-danger{background:linear-gradient(135deg,#ef4444 0%,#dc2626 100%)}
.btn-success{background:linear-gradient(135deg,#10b981 0%,#059669 100%)}
.btn-warning{background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%)}
.btn-sm{padding:8px 14px;font-size:12px;width:auto;display:inline-flex;align-items:center;gap:6px}
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,42,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.1);padding:10px 0 calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:50}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;border-radius:14px;color:rgba(255,255,255,0.4);font-size:10px;cursor:pointer;transition:all 0.3s}
.nav-item.active{color:#a78bfa;background:rgba(139,92,246,0.15)}
.nav-item svg{width:22px;height:22px}
.fade-in{animation:fadeIn 0.5s ease-out}
.slide-up{animation:slideUp 0.5s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:16px;margin-bottom:12px}
.header{position:sticky;top:0;z-index:40;background:rgba(15,23,42,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.1);padding:16px 20px}
.content{padding:16px;padding-bottom:100px;max-width:600px;margin:0 auto}
.badge{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block}
.badge-pending{background:rgba(245,158,11,0.2);color:#fbbf24}
.badge-approved{background:rgba(16,185,129,0.2);color:#34d399}
.badge-new{background:rgba(59,130,246,0.2);color:#60a5fa}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
textarea.glass-input{resize:vertical;min-height:100px}
select.glass-input{appearance:none}
.gradient-text{background:linear-gradient(135deg,#a78bfa 0%,#60a5fa 50%,#34d399 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.error-box{background:rgba(239,68,68,0.2);border:1px solid rgba(239,68,68,0.4);border-radius:12px;padding:12px;margin:10px 0;font-size:12px;color:#fca5a5}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const SB=window.supabase.createClient("https://ixdsctccqvljdtnjfebt.supabase.co","sb_publishable_KW1w2BRKZ1ig0-b57oVw6A_G2UIAa0h");

const Icon=({d,size=22})=><svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;
const Icons={
  home:"M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10",
  users:"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8",
  exam:"M9 11l3 3L22 4 M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11",
  grade:"M22 12h-4l-3 9L9 3l-3 9H2",
  logout:"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9",
  plus:"M12 5v14 M5 12h14",
  x:"M18 6L6 18 M6 6l12 12",
  clock:"M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z M12 6v6l4 2",
  check:"M20 6L9 17l-5-5",
  trash:"M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2",
  book:"M4 19.5A2.5 2.5 0 0 1 6.5 17H20 M4 19.5V5a2 2 0 0 1 2-2h14v14H6.5A2.5 2.5 0 0 0 4 19.5z",
  key:"M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"
};

function App(){
  const [user,setUser]=useState(null);
  const [view,setView]=useState('login');
  const [tab,setTab]=useState('home');
  useEffect(()=>{
    const s=sessionStorage.getItem('edu_user');
    if(s){const u=JSON.parse(s);setUser(u);setView(u.role);}
  },[]);
  const login=async(un,pw)=>{
    const {data,error}=await SB.from('users').select('*').eq('username',un.toUpperCase()).eq('password',pw).single();
    if(data){setUser(data);sessionStorage.setItem('edu_user',JSON.stringify(data));setView(data.role);return true;}
    return false;
  };
  const logout=()=>{setUser(null);setView('login');setTab('home');sessionStorage.removeItem('edu_user');};
  if(view==='login') return <Login onLogin={login}/>;
  if(view==='admin') return <Admin user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
  return <Student user={user} tab={tab} setTab={setTab} onLogout={logout}/>;
}

function Login({onLogin}){
  const [un,setUn]=useState('');const [pw,setPw]=useState('');const [err,setErr]=useState('');const [ld,setLd]=useState(false);
  const submit=async(e)=>{
    e.preventDefault();setLd(true);setErr('');
    const ok=await onLogin(un,pw);
    if(!ok) setErr('نام کاربری یا رمز عبور اشتباه است');
    setLd(false);
  };
  return(
    <div className="min-h-screen flex items-center justify-center p-6 fade-in">
      <div className="w-full max-w-sm">
        <div className="text-center mb-8 slide-up">
          <div className="w-24 h-24 mx-auto mb-4 rounded-3xl bg-gradient-to-br from-violet-500 to-fuchsia-600 flex items-center justify-center shadow-2xl">
            <Icon d={Icons.book} size={44} color="white"/>
          </div>
          <h1 className="text-3xl font-black mb-2 gradient-text">سامانه آموزشی</h1>
          <p className="text-white/50 text-sm">ورود به پنل کاربری</p>
        </div>
        <div className="glass p-6 slide-up">
          <form onSubmit={submit} className="space-y-4">
            {err&&<div className="bg-red-500/20 border border-red-500/30 rounded-xl p-3 text-red-300 text-sm text-center">{err}</div>}
            <input className="glass-input" placeholder="نام کاربری" value={un} onChange={e=>setUn(e.target.value)} required/>
            <input className="glass-input" type="password" placeholder="رمز عبور" value={pw} onChange={e=>setPw(e.target.value)} required/>
            <button type="submit" className="btn-primary" disabled={ld}>{ld?'در حال ورود...':'ورود به سامانه'}</button>
          </form>
        </div>
      </div>
    </div>
  );
}

function Admin({user,tab,setTab,onLogout}){
  const [exams,setExams]=useState([]);
  const [students,setStudents]=useState([]);
  const [answers,setAnswers]=useState([]);
  const [modal,setModal]=useState(null);
  const [step,setStep]=useState(1);
  const [formData,setFormData]=useState({});
  const [questions,setQuestions]=useState([]);
  const [loading,setLoading]=useState(false);
  const [errorMsg,setErrorMsg]=useState('');

  useEffect(()=>{loadAll();},[]);

  const loadAll=async()=>{
    const {data:e,error:e1}=await SB.from('exams').select('*,questions(*)').order('created_at',{ascending:false});
    const {data:s,error:e2}=await SB.from('users').select('*').eq('role','student');
    const {data:a,error:e3}=await SB.from('answers').select('*,users(full_name,username),exams(title),questions(q_text,q_type,correct_opt)');
    if(e1) console.log('Error exams:',e1);
    if(e2) console.log('Error users:',e2);
    if(e3) console.log('Error answers:',e3);
    if(e) setExams(e); if(s) setStudents(s); if(a) setAnswers(a);
  };

  const createExam=async()=>{
    setErrorMsg('');
    if(!formData.title){setErrorMsg('عنوان آزمون را وارد کنید');return;}
    if(questions.length===0){setErrorMsg('حداقل یک سوال اضافه کنید');return;}
    
    setLoading(true);
    console.log('Creating exam:',formData);
    
    const {data:exam,error}=await SB.from('exams').insert({
      title:formData.title,
      description:formData.desc||'',
      duration_minutes:parseInt(formData.duration)||60,
      assigned_to:formData.assigned||'all',
      created_by:user.id
    }).select().single();
    
    if(error){
      console.error('Exam error:',error);
      setErrorMsg('خطا در ذخیره آزمون: '+error.message);
      setLoading(false);
      return;
    }
    
    console.log('Exam created:',exam);
    
    for(let i=0;i<questions.length;i++){
      const {error:qError}=await SB.from('questions').insert({
        exam_id:exam.id,
        q_text:questions[i].q_text,
        opt_a:questions[i].opt_a||null,
        opt_b:questions[i].opt_b||null,
        opt_c:questions[i].opt_c||null,
        opt_d:questions[i].opt_d||null,
        correct_opt:questions[i].correct_opt||null,
        q_type:questions[i].q_type||'test',
        order_num:i
      });
      if(qError){
        console.error('Question error:',qError);
        setErrorMsg('خطا در ذخیره سوال: '+qError.message);
        setLoading(false);
        return;
      }
    }
    
    setLoading(false);
    setModal(null);
    setFormData({});
    setQuestions([]);
    setStep(1);
    loadAll();
    alert('آزمون با موفقیت ساخته شد!');
  };

  const addQuestion=()=>{
    setQuestions([...questions,{q_text:'',opt_a:'',opt_b:'',opt_c:'',opt_d:'',correct_opt:'',q_type:'test'}]);
  };

  const updateQuestion=(i,field,val)=>{
    const nq=[...questions];nq[i][field]=val;setQuestions(nq);
  };

  const removeQuestion=(i)=>{setQuestions(questions.filter((_,idx)=>idx!==i));};

  const deleteExam=async(id)=>{
    if(confirm('آیا مطمئن هستید؟')){
      await SB.from('exams').delete().eq('id',id);
      loadAll();
    }
  };

  const changePassword=async(studentId)=>{
    const newPw=prompt("رمز عبور جدید:");
    if(newPw&&newPw.trim()){
      await SB.from('users').update({password:newPw}).eq('id',studentId);
      alert("رمز تغییر کرد");loadAll();
    }
  };

  return(
    <div className="min-h-screen pb-24">
      <div className="header">
        <div className="flex justify-between items-center">
          <div>
            <h1 className="text-xl font-bold gradient-text">پنل مدیریت</h1>
            <p className="text-xs text-white/40 mt-1">{user.full_name}</p>
          </div>
          <button onClick={onLogout} className="p-3 bg-white/5 rounded-xl"><Icon d={Icons.logout} size={20}/></button>
        </div>
      </div>

      <div className="content">
        {tab==='home'&&(
          <>
            <div className="grid grid-cols-2 gap-3 mb-6">
              <div className="glass p-4 text-center">
                <Icon d={Icons.exam} size={32} className="mx-auto mb-2 text-violet-400"/>
                <p className="text-2xl font-bold">{exams.length}</p>
                <p className="text-xs text-white/50">آزمون</p>
              </div>
              <div className="glass p-4 text-center">
                <Icon d={Icons.users} size={32} className="mx-auto mb-2 text-blue-400"/>
                <p className="text-2xl font-bold">{students.length}</p>
                <p className="text-xs text-white/50">دانش‌آموز</p>
              </div>
            </div>

            <button onClick={()=>{setModal('exam');setFormData({});setQuestions([]);setStep(1);setErrorMsg('');}} className="btn-primary flex items-center justify-center gap-2 mb-6">
              <Icon d={Icons.plus} size={20}/>ساخت آزمون جدید
            </button>

            <h3 className="font-bold mb-3">آزمون‌های فعال</h3>
            {exams.length===0?<div className="card text-center py-12 text-white/40"><p>هنوز آزمونی نیست</p></div>:
            exams.map(ex=>(
              <div key={ex.id} className="card">
                <div className="flex justify-between items-start">
                  <div className="flex-1">
                    <h4 className="font-bold">{ex.title}</h4>
                    <p className="text-xs text-white/50 mt-1">{ex.description||'بدون توضیحات'}</p>
                    <div className="flex gap-2 mt-2">
                      <span className="badge badge-new">{ex.duration_minutes} دقیقه</span>
                      <span className="badge badge-approved">{ex.questions?.length||0} سوال</span>
                    </div>
                  </div>
                  <button onClick={()=>deleteExam(ex.id)} className="p-2 bg-red-500/20 text-red-400 rounded-xl"><Icon d={Icons.trash} size={18}/></button>
                </div>
              </div>
            ))}
          </>
        )}

        {tab==='students'&&(
          <>
            <h3 className="font-bold mb-4">دانش‌آموزان</h3>
            {students.map(s=>(
              <div key={s.id} className="card">
                <div className="flex items-center gap-4">
                  <div className="w-12 h-12 rounded-full bg-gradient-to-br from-violet-500 to-purple-700 flex items-center justify-center font-bold">{s.full_name[0]}</div>
                  <div className="flex-1">
                    <h4 className="font-bold">{s.full_name}</h4>
                    <p className="text-sm text-white/40">@{s.username}</p>
                    <p className="text-xs text-violet-300 mt-1">رمز: <span className="font-mono bg-white/10 px-2 py-1 rounded">{s.password}</span></p>
                  </div>
                  <button onClick={()=>changePassword(s.id)} className="btn-sm bg-white/10"><Icon d={Icons.key} size={14}/>تغییر</button>
                </div>
              </div>
            ))}
          </>
        )}

        {tab==='grading'&&(
          <>
            <h3 className="font-bold mb-4">پاسخ‌برگ‌ها</h3>
            {answers.filter(a=>a.status==='pending').length===0?<div className="card text-center py-12 text-white/40"><p>پاسخ‌برگی نیست</p></div>:
            answers.filter(a=>a.status==='pending').map(a=>(
              <div key={a.id} className="card">
                <h4 className="font-bold">{a.users?.full_name} - {a.exams?.title}</h4>
                <p className="text-sm text-white/50 mt-2">{a.questions?.q_text}</p>
                <p className="text-sm text-violet-300 mt-2 bg-white/5 p-2 rounded">پاسخ: {a.student_answer||'بدون پاسخ'}</p>
                <div className="flex gap-2 mt-3">
                  <input type="number" className="glass-input flex-1" placeholder="نمره" id={`score-${a.id}`}/>
                  <button onClick={async()=>{
                    const v=document.getElementById(`score-${a.id}`).value;
                    await SB.from('answers').update({score:parseFloat(v),status:'graded'}).eq('id',a.id);
                    loadAll();alert('نمره ثبت شد');
                  }} className="btn-success btn-sm">ثبت</button>
                </div>
              </div>
            ))}
          </>
        )}
      </div>

      <div className="nav-bar">
        <div className={`nav-item ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==='students'?'active':''}`} onClick={()=>setTab('students')}><Icon d={Icons.users}/><span>دانش‌آموزان</span></div>
        <div className={`nav-item ${tab==='grading'?'active':''}`} onClick={()=>setTab('grading')}><Icon d={Icons.grade}/><span>تصحیح</span></div>
      </div>

      {modal==='exam'&&(
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="glass w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto slide-up" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-xl font-bold gradient-text">ساخت آزمون</h3>
              <button onClick={()=>setModal(null)} className="p-2 bg-white/10 rounded-xl"><Icon d={Icons.x} size={20}/></button>
            </div>

            {errorMsg&&<div className="error-box">{errorMsg}</div>}

            {step===1&&(
              <div className="space-y-4 fade-in">
                <input className="glass-input" placeholder="عنوان آزمون *" value={formData.title||''} onChange={e=>setFormData({...formData,title:e.target.value})}/>
                <textarea className="glass-input" placeholder="توضیحات" value={formData.desc||''} onChange={e=>setFormData({...formData,desc:e.target.value})} rows="3"/>
                <input className="glass-input" type="number" placeholder="مدت زمان (دقیقه)" value={formData.duration||'60'} onChange={e=>setFormData({...formData,duration:e.target.value})}/>
                <select className="glass-input" value={formData.assigned||'all'} onChange={e=>setFormData({...formData,assigned:e.target.value})}>
                  <option value="all">همه دانش‌آموزان</option>
                  {students.map(s=><option key={s.id} value={s.id}>{s.full_name}</option>)}
                </select>
                <button onClick={()=>setStep(2)} className="btn-primary">مرحله بعد: سوالات</button>
              </div>
            )}

            {step===2&&(
              <div className="fade-in">
                <div className="flex justify-between items-center mb-4">
                  <h4 className="font-bold">سوالات ({questions.length})</h4>
                  <button onClick={addQuestion} className="btn-sm bg-violet-600"><Icon d={Icons.plus} size={16}/>افزودن</button>
                </div>
                {questions.map((q,i)=>(
                  <div key={i} className="bg-violet-600/10 border border-violet-600/30 rounded-xl p-3 mb-3">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-sm font-bold text-violet-300">سوال {i+1}</span>
                      <button onClick={()=>removeQuestion(i)} className="text-red-400"><Icon d={Icons.x} size={18}/></button>
                    </div>
                    <textarea className="glass-input mb-2 text-sm" placeholder="متن سوال" value={q.q_text} onChange={e=>updateQuestion(i,'q_text',e.target.value)} rows="2"/>
                    <div className="flex gap-2 mb-2">
                      <button onClick={()=>updateQuestion(i,'q_type','test')} className={`flex-1 py-2 rounded-lg text-sm ${q.q_type==='test'?'bg-violet-600':'bg-white/10'}`}>تستی</button>
                      <button onClick={()=>updateQuestion(i,'q_type','descriptive')} className={`flex-1 py-2 rounded-lg text-sm ${q.q_type==='descriptive'?'bg-violet-600':'bg-white/10'}`}>تشریحی</button>
                    </div>
                    {q.q_type==='test'&&(
                      <>
                        <div className="grid grid-cols-2 gap-2 mb-2">
                          <input className="glass-input text-sm" placeholder="گزینه A" value={q.opt_a} onChange={e=>updateQuestion(i,'opt_a',e.target.value)}/>
                          <input className="glass-input text-sm" placeholder="گزینه B" value={q.opt_b} onChange={e=>updateQuestion(i,'opt_b',e.target.value)}/>
                          <input className="glass-input text-sm" placeholder="گزینه C" value={q.opt_c} onChange={e=>updateQuestion(i,'opt_c',e.target.value)}/>
                          <input className="glass-input text-sm" placeholder="گزینه D" value={q.opt_d} onChange={e=>updateQuestion(i,'opt_d',e.target.value)}/>
                        </div>
                        <select className="glass-input text-sm" value={q.correct_opt} onChange={e=>updateQuestion(i,'correct_opt',e.target.value)}>
                          <option value="">پاسخ صحیح...</option>
                          <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option>
                        </select>
                      </>
                    )}
                  </div>
                ))}
                <div className="flex gap-2 mt-4">
                  <button onClick={()=>setStep(1)} className="btn-primary bg-white/10 flex-1">قبلی</button>
                  <button onClick={()=>setStep(3)} className="btn-primary flex-1">بررسی نهایی</button>
                </div>
              </div>
            )}

            {step===3&&(
              <div className="fade-in">
                <div className="bg-white/5 rounded-xl p-4 mb-4">
                  <h4 className="font-bold mb-3">خلاصه</h4>
                  <p className="text-sm mb-2"><strong>عنوان:</strong> {formData.title}</p>
                  <p className="text-sm mb-2"><strong>مدت:</strong> {formData.duration} دقیقه</p>
                  <p className="text-sm mb-2"><strong>سوالات:</strong> {questions.length}</p>
                </div>
                <div className="flex gap-2">
                  <button onClick={()=>setStep(2)} className="btn-primary bg-white/10 flex-1">ویرایش</button>
                  <button onClick={createExam} className="btn-success flex-1" disabled={loading}>
                    {loading?'در حال ذخیره...':'ذخیره آزمون'}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function Student({user,tab,setTab,onLogout}){
  const [exams,setExams]=useState([]);
  const [answers,setAnswers]=useState([]);
  const [activeExam,setActiveExam]=useState(null);
  const [currentQ,setCurrentQ]=useState(0);
  const [studentAnswers,setStudentAnswers]=useState({});
  const [timeLeft,setTimeLeft]=useState(0);

  useEffect(()=>{loadAll();},[]);

  const loadAll=async()=>{
    const {data:e}=await SB.from('exams').select('*,questions(*)').order('created_at',{ascending:false});
    const {data:a}=await SB.from('answers').select('*,exams(title),questions(q_text,q_type)').eq('student_id',user.id);
    if(e) setExams(e.filter(ex=>ex.assigned_to==='all'||ex.assigned_to===user.id));
    if(a) setAnswers(a);
  };

  const startExam=(exam)=>{
    setActiveExam(exam);setCurrentQ(0);setStudentAnswers({});setTimeLeft(exam.duration_minutes*60);
  };

  useEffect(()=>{
    if(activeExam&&timeLeft>0){
      const t=setInterval(()=>setTimeLeft(tl=>tl-1),1000);
      return ()=>clearInterval(t);
    }else if(activeExam&&timeLeft===0){
      submitExam();
    }
  },[activeExam,timeLeft]);

  const submitExam=async()=>{
    if(!activeExam) return;
    for(const q of activeExam.questions){
      const ans=studentAnswers[q.id]||'';
      let score=0;
      if(q.q_type==='test'&&q.correct_opt&&ans===q.correct_opt) score=1;
      await SB.from('answers').insert({
        exam_id:activeExam.id,student_id:user.id,question_id:q.id,
        student_answer:ans,score:score,max_score:1,status:q.q_type==='test'?'graded':'pending'
      });
    }
    alert('پاسخ‌ها ثبت شد!');
    setActiveExam(null);loadAll();
  };

  const formatTime=(s)=>{
    const m=Math.floor(s/60);const sec=s%60;
    return `${m}:${sec<10?'0':''}${sec}`;
  };

  if(activeExam){
    const q=activeExam.questions[currentQ];
    return(
      <div className="min-h-screen bg-slate-900">
        <div className="header flex justify-between items-center">
          <div>
            <h2 className="font-bold">{activeExam.title}</h2>
            <p className="text-xs text-white/40">سوال {currentQ+1} از {activeExam.questions.length}</p>
          </div>
          <div className={`text-2xl font-mono font-bold ${timeLeft<300?'text-red-500 animate-pulse':''}`}>{formatTime(timeLeft)}</div>
        </div>
        <div className="content">
          <div className="card">
            <p className="mb-4 font-bold text-lg">{q?.q_text}</p>
            {q?.q_type==='test'?(
              <div className="space-y-2">
                {['A','B','C','D'].map(opt=>(
                  <div key={opt} className={`p-3 rounded-xl cursor-pointer border-2 transition ${studentAnswers[q.id]===opt?'bg-violet-600/30 border-violet-500':'bg-white/5 border-white/10'}`} onClick={()=>setStudentAnswers({...studentAnswers,[q.id]:opt})}>
                    <strong>{opt}:</strong> {q[`opt_${opt.toLowerCase()}`]}
                  </div>
                ))}
              </div>
            ):(
              <textarea className="glass-input" placeholder="پاسخ..." value={studentAnswers[q.id]||''} onChange={e=>setStudentAnswers({...studentAnswers,[q.id]:e.target.value})} rows="5"/>
            )}
          </div>
          <div className="flex gap-2 mt-4">
            {currentQ>0&&<button onClick={()=>setCurrentQ(currentQ-1)} className="btn-primary bg-white/10 flex-1">قبلی</button>}
            {currentQ<activeExam.questions.length-1?<button onClick={()=>setCurrentQ(currentQ+1)} className="btn-primary flex-1">بعدی</button>:
            <button onClick={()=>{if(confirm('ثبت نهایی؟'))submitExam();}} className="btn-success flex-1">ثبت</button>}
          </div>
        </div>
      </div>
    );
  }

  return(
    <div className="min-h-screen pb-24">
      <div className="header">
        <div className="flex justify-between items-center">
          <div>
            <h1 className="text-xl font-bold gradient-text">پنل دانش‌آموز</h1>
            <p className="text-xs text-white/40 mt-1">{user.full_name}</p>
          </div>
          <button onClick={onLogout} className="p-3 bg-white/5 rounded-xl"><Icon d={Icons.logout} size={20}/></button>
        </div>
      </div>

      <div className="content">
        {tab==='home'&&(
          <>
            <h3 className="font-bold mb-3">آزمون‌ها ({exams.length})</h3>
            {exams.length===0?<div className="card text-center py-12 text-white/40"><p>آزمونی ندارید</p></div>:
            exams.map(ex=>(
              <div key={ex.id} className="card">
                <h4 className="font-bold">{ex.title}</h4>
                <p className="text-sm text-white/50 mt-1">{ex.description||''}</p>
                <div className="flex gap-2 mt-2">
                  <span className="badge badge-new">{ex.duration_minutes} دقیقه</span>
                  <span className="badge badge-approved">{ex.questions?.length||0} سوال</span>
                </div>
                <button onClick={()=>startExam(ex)} className="btn-primary btn-sm mt-3">شروع</button>
              </div>
            ))}
          </>
        )}

        {tab==='grades'&&(
          <>
            <h3 className="font-bold mb-3">نمرات من</h3>
            {answers.length===0?<div className="card text-center py-12 text-white/40"><p>نمره‌ای نیست</p></div>:
            answers.map(a=>(
              <div key={a.id} className="card">
                <div className="flex justify-between">
                  <div>
                    <h4 className="font-bold">{a.exams?.title}</h4>
                    <p className="text-xs text-white/50">{a.questions?.q_text}</p>
                  </div>
                  <div className="text-left">
                    <span className={`badge ${a.status==='graded'?'badge-approved':'badge-pending'}`}>{a.status==='graded'?'تصحیح شده':'در انتظار'}</span>
                    <p className="text-2xl font-bold mt-2">{a.score??'-'}</p>
                  </div>
                </div>
              </div>
            ))}
          </>
        )}
      </div>

      <div className="nav-bar">
        <div className={`nav-item ${tab==='home'?'active':''}`} onClick={()=>setTab('home')}><Icon d={Icons.home}/><span>خانه</span></div>
        <div className={`nav-item ${tab==='grades'?'active':''}`} onClick={()=>setTab('grades')}><Icon d={Icons.grade}/><span>نمرات</span></div>
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
